/* 记录最近一次请求失败的原因。原来 !r.ok 与异常都返回 null，
   调用方无法区分「桥接层不可达」和「确实没有数据」，界面一律显示"暂无热点"。 */
let lastFetchError = null;
async function fetchJSON(url){
  try {
    const r = await fetch(url, { mode: "cors" });
    if(!r.ok){
      lastFetchError = { url: url, status: r.status, msg: "HTTP " + r.status };
      return null;
    }
    lastFetchError = null;
    return await r.json();
  } catch(e){
    lastFetchError = { url: url, status: 0, msg: (e && e.message) || String(e) };
    return null;
  }
}
/* 抓取结果的降级信息：{ degraded, errors[] }，供界面区分「没有内容」与「抓取失败」 */
/* 渲染器（headless Chrome / CDP）不可用只是次要路径失效：正文有直达文章 JSON 兜底，
   实测 30/30 条目仍有完整正文。这类 warn 不算「降级」，避免界面显示误导性提示。 */
function isRenderWarn(e){
  const s = String((e && e.scope) || "");
  return s.indexOf("render.") === 0 && (e && e.severity) === "warn";
}
function digestFetchResult(j, scope){
  if(j && Array.isArray(j.items)){
    const errs = j.errors || [];
    return { items: j.items, degraded: !!(j.degraded || errs.some(e => !isRenderWarn(e))), errors: errs };
  }
  // j 为 null → 请求本身失败（桥接层不可达等），绝不能当作"没有内容"
  const why = (lastFetchError && lastFetchError.msg) || L("桥接层不可达","bridge unreachable");
  return { items: null, degraded: true, errors: [{ severity: "error", scope: scope, msg: why }] };
}
async function fetchRealTrends(theme, sub){
  const q = "theme=" + encodeURIComponent(theme) + (sub ? "&sub=" + encodeURIComponent(sub) : "") + "&limit=" + TRENDS_LIMIT;
  const j = await fetchJSON(AGENT_REACH_API + "/api/trends?" + q);
  const r = digestFetchResult(j, "trends");
  state.trendsDegraded = r.degraded;
  state.trendsErrors = r.errors;
  /* 被主动筛掉的条目（后端按 MIN_USABLE_TEXT 拦下的）+ 视频型热搜 —— 必须带到界面上：
     「热搜榜 50 条、这里只有 26 条」若没有解释，看起来就是抓取坏了，最容易被误读成故障。 */
  state.trendsFiltered = (j && Array.isArray(j.items))
    ? { noText: (j.filtered_no_text || []), video: (j.filtered_video || []), stale: (j.filtered_stale || []) }
    : null;
  return r.items;
}
async function fetchRealScan(){
  const srcs = (state.user && state.user.sources) || [];

  const r = digestFetchResult(j, "scan");
  state.trendsDegraded = r.degraded;
  state.trendsErrors = r.errors;
  /* sources：逐源的发现报告 —— 找到了什么、怎么找到的、为什么没找到。
     只回一个 items 数组时，老师看到内容变少却无从判断原因。 */
  state.scanSources = (j && Array.isArray(j.sources)) ? j.sources : null;
  return r.items;
}

/* 素材是否有可用正文。低于 200 字符基本只剩标题/摘要，事实抽取抽不出有价值的事实卡。

/* 复制原文链接。navigator.clipboard 在非 HTTPS / 无权限时不可用，降级到 execCommand */
function copySourceUrl(){
  const h = state.pendingHot;
  const url = (h && h.url || "").trim();
  if(!url){ toast(L("没有可复制的链接","No link to copy")); return; }
  const done = () => toast(L("链接已复制，去新标签页打开并复制正文","Link copied — open it in a new tab and copy the body"));
  const fail = () => toast(L("复制失败，请手动选中链接复制","Copy failed — please select and copy the link manually"));
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done, fail);
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = url;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
    document.body.removeChild(ta);
    ok ? done() : fail();
  }catch(e){ fail(); }
}

/* 右下「素材预览」面板：挑素材阶段只看不跑。 */
function hotPeekHTML(){
  /* 只在「挑选阶段」显示：热点页 + 尚未开跑 + 已选中。
     确认进入下一步后（running / done / 离开热点页）一律不渲染 ——
     Bryan 2026-09-22：那句「AI 正在排查 / 生成中…」与「素材预览」不该一直挂着。 */
  if(state.route !== "trend") return "";
  if(cur !== 1) return "";                                  /* 离开热点页即消失 */
  if(state.live && state.live.status !== "idle") return ""; /* 开跑 / 跑完即消失 */
  const h = curHot();
  if(!h) return "";
  const topic = h.topic || h.title || "";
  const cn = (h.cn && h.cn !== topic) ? h.cn : "";
  const body = (h.fulltext || h.summary || "").trim();
  const src = h.source || "";
  const url = (h.url || "").trim();
  const heat = (h.heat != null) ? h.heat : null;
  const srcs = (h.srcs != null) ? h.srcs : null;
  return `<div class="hotpeek" id="hotpeek">
    <div class="hp-k"><b> ${L("素材预览","Preview")}</b>
      <span class="tint neutral">${L("未开始 · 仅查看","Not started · view only")}</span>
      <span class="hp-x" onclick="cancelHotSel()" title="${L("取消选中","Deselect")}">✕</span></div>
    <h4>${esc(topic)}</h4>
    ${cn ? `<div class="hp-cn">${esc(cn)}</div>` : ""}
    <div class="hp-meta">
      ${src ? `<span>${L("来源","Source")} <b>${esc(src)}</b></span>` : ""}
      ${heat != null ? `<span>${L("热度","Heat")} <b>${heat}</b></span>` : ""}
      ${srcs != null ? `<span>${L("信源","Sources")} <b>${srcs}</b></span>` : ""}
    </div>
    <div class="hp-body">${esc(body || L("（这条热点没有正文预览）","(no preview text)"))}</div>
    ${url ? `<div class="hp-link"> ${L("原文链接","Source link")}：<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></div>` : ""}
    <div class="hp-bar">
      <button class="btn" onclick="confirmHotRun()"> ${L("开始敏感排查","Start sensitivity screen")} →</button>
    </div>
    <div class="hp-note" style="margin-top:8px">${L("点上方按钮才开始跑流程（先敏感排查，再事实分段）；此前换选不消耗任何调用。",
      "The workflow only starts after you hit the button above (sensitivity screen → fact extraction); switching picks before that costs nothing.")}</div>
  </div>`;
}

/* 取消选中（收起预览、回到「未挑」状态）。 */
function cancelHotSel(){
  state.realHot = null; state.hot = undefined; state.hotTopic = null;
  render();
}

/* 确认开跑：唯一的流程入口。真实卡 / 演示卡 / 自定义卡统一从这里进 startLiveRun。 */
function confirmHotRun(){
  if(state.live && state.live.status === "running"){
    toast(L("AI 正在运行中，请稍候…","AI run in progress, please wait…")); return;
  }
  const h = curHot();
  if(!h){ toast(L("请先选择一条热点","Pick a trend first")); return; }
  /* 无可用正文：此时才引导粘贴（原来是点卡就弹，现在挪到「确认」这一步）。 */
  if(state.realHot && !hasUsableText(h) && !h._skipPaste){ state.pendingHot = h; render(); return; }
  if(state.realHot) state.realHot._skipPaste = false;
  state.extracted = false;   /* 重置事实抽取状态，选中新热点后重新抽取 */
  state.topicSel = null;     /* 重置选题多选，让新热点按自身 tags 智能推荐 */ resetTags();
  GEN = {};
  startLiveRun(h.fulltext || h.summary || h.topic, h.topic || h.title, h.source);
  if(state.user){ cur = 2; refreshRail(); stage.scrollTop = 0; render(); }
}

/* 把右下面板挂到 body（stage 每次 innerHTML 重建，面板得放 body 上才不会被清掉）。
   离开热点页 / 取消选中 / 开始跑之后由 hotPeekHTML() 返回空串 ⇒ 这里同步移除。 */
function mountHotPeek(){
  let el = document.getElementById("hotpeek");
  const html = hotPeekHTML();
  if(!html){ if(el) el.remove(); return; }
  if(el) el.remove();
  const d = document.createElement("div");
  d.innerHTML = html;
  document.body.appendChild(d.firstElementChild);
}

/* 选中演示热点（HOTS）：只选中 + 预览，**不跑流程**（拆分「挑」与「跑」，2026-09-22）。 */
function pickHot(i){
  const h = HOTS[i]; if(!h || !h.summary) return;
  if(state.live && state.live.status === "running"){
    toast(L("AI 正在排查 / 生成中，完成后才能重选素材","AI is running — you can re-pick a material once it finishes"));
    return;
  }
  state.hot = i;
  state.realHot = null;         /* 与真实卡互斥 */
  state.hotTopic = h.topic;
  render();
}
function renderHots(){
  const g = $("#hotgrid"); if(!g) return;
  /* 后端桥接：扫描中 / 真实结果 优先 */
  if(state.realScanning){
    const tf0 = state.hotTheme;
    g.innerHTML = `<div class="srclist-empty"> ${L("Agent-Reach 正在全网扫描「"+(tf0?DIRS[tf0].zh:"")+"」主题热点…","Agent-Reach is scanning the web for theme 「"+(tf0?DIRS[tf0].en:"")+"」…")}
      <div style="margin-top:9px;font-size:12px;font-weight:700;color:var(--pri)">${scanEstimateText()}</div>
      <div style="margin-top:5px;font-size:11.5px;color:var(--muted)">${L("已用时","Elapsed")} <b>${state.scanElapsed}</b> ${L("秒","s · 请稍候，页面会自动刷新")}</div></div>`;
    /* 趋势扫描只该占住「全网热点」这一块，不能顺带把老师自己贴的来源清空：
       scanTimer 每秒调一次本函数，之前每次都把网格重置成占位符，
       自定义条目于是每秒消失一次（state 里还在，界面上没了 —— 最典型的静默失败）。
       清空 innerHTML 必须同时清 stamp，否则幂等闸门会挡住重新追加。 */
    g.dataset.custStamp = "";
    renderCustomHots(g, true);
    return;
  }
  if(state.realHots){
    /* 列表只放「点进去就能直接生成」的条目。fulltext_len < MIN_USABLE_TEXT 的条目点不动：
       pickRealHot() 第一件事就查 hasUsableText，不达标弹「请粘贴原文」并中止 ——
       留在列表里只会制造「有卡片、但一步也走不到生成」的假供给。
       后端已按同一阈值筛过一轮，这里是兜底，同时也覆盖 /api/scan 与将来的检索接口。 */
    const real = state.realHots.filter(hasUsableText);
    if(!real.length){
      /* 注意：realHots = [] 时绝不能落回下面的 HOTS 分支 ——
         那是 2026 年 8 月的内置演示数据，冒充「本次抓取结果」比空列表更误导。 */
      /* 被筛原因必须分类说清。2026-09-20 新增「已过期」一类：
         时效过滤（后端拦掉发布超过 TRENDS_MAX_AGE_DAYS 天的条目）平时是**静默的正常筛选**，
         不该挂横幅；但若整批都被它筛掉（源停更 / 全站旧闻），文案说成「拿不到可用正文」
         就等于把「内容太旧」误报成「抓取失败」—— 两种方向完全不同的原因，不能混说。
         ⚠️ 刻意不写死天数：写了就等于在前端复制一份后端常量，日后必漂移
            （同 MIN_USABLE_TEXT / TRENDS_LIMIT 的教训）。 */
      const f = state.trendsFiltered || { noText: [], video: [], stale: [] };
      const nNoText = f.noText.length + f.video.length;
      const nStale = f.stale.length;
      const why = [];
      if(nNoText) why.push(L(nNoText+" 条拿不到可用正文", nNoText+" lack usable text"));
      if(nStale)  why.push(L(nStale+" 条已过期", nStale+" are outdated"));
      g.innerHTML = `<div class="srclist-empty">${why.length
        ? L("本批热点都不适合作为素材（"+why.join("、")+"），已按规则隐藏。换一个主题或稍后刷新试试。",
            "This batch has no usable topics ("+why.join(", ")+") and was hidden. Try another theme or refresh later.")
        : L("本次没有可用热点。换一个主题，或点上方「刷新」重试。",
            "No usable topics this time. Try another theme or hit Refresh above.")}</div>`;
      g.dataset.custStamp = "";   /* 空态也必须清 stamp，否则自定义卡会被幂等闸门挡住 */
      renderCustomHots(g, true);
      return;
    }
    /* 错峰间隔按条数自适应：固定 90ms 在 120 条时要 10.8 秒才铺完，老师会以为卡死。
       总时长压到 ~1.5 秒内，保留「逐条落位」的观感。 */
    const step = Math.max(6, Math.min(90, Math.round(1500 / Math.max(1, real.length))));
    real.forEach((h, i) => {
      setTimeout(()=>{
        const running = state.live && state.live.status === "running";
        const isSel = state.realHot === h;
        const d = document.createElement("div");
        d.className = "hotcard" + (isSel ? " sel" : "") + (running ? " locked" : "");
        d.onclick = () => pickRealHot(h);
        const themeZh = DIRS[h.theme] ? DIRS[h.theme].zh : (h.theme||"");
        const subLabel = h.sub ? (themeZh + " · " + h.sub) : themeZh;
        d.innerHTML = `<div class="rank">#${i+1}</div>
          <h4>${esc(h.topic)}</h4>
          ${h.cn && h.cn !== h.topic ? `<div class="cn">${esc(h.cn)}</div>` : ""}
          <div class="srctag"><i style="background:#D04418"></i>${L("真实热点","Real")} · ${esc(h.source)}${subLabel ? " · " + esc(subLabel) : ""}</div>
          ${fulltextBadge(h)}
          <div class="heatbar"><i style="width:0" id="rb${i}"></i></div>
          <div class="meta"><span>${L("热度","Heat")} <b>${h.heat}</b></span><span>${L("信源","Sources")} <b>${h.srcs}</b></span></div>`;
        g.appendChild(d);
        requestAnimationFrame(()=>requestAnimationFrame(()=>{ const b=$("#rb"+i); if(b) b.style.width=h.heat+"%"; }));
      }, step*i);
    });
    renderCustomHots(g);
    return;
  }
  const tf = state.hotTheme;
  const items = HOTS.map((h, idx)=>({h, idx})).filter(({h}) => {
    if(!tf) return true;
    const m = matchTopics((h.topic||"")+" "+(h.cn||"")+" "+(h.fulltext||h.summary||""));
    if(!m.some(x => x.theme === tf)) return false;
    return true;
  });
  if(tf && !items.length){
    g.innerHTML = `<div class="srclist-empty">${L("「"+DIRS[tf].zh+"」主题暂无本地缓存热点，Agent-Reach 正在发起全网定制扫描…","No cached topics for theme 「"+DIRS[tf].en+"」 — Agent-Reach is launching a targeted web scan…")}</div>`;
    g.dataset.custStamp = "";
    return;
  }
  items.forEach(({h, idx}, i) => {
    setTimeout(()=>{
      const running = state.live && state.live.status === "running";
      const d = document.createElement("div");
      d.className = "hotcard" + (state.hot === idx ? " sel" : "") + (running ? " locked" : "");
      const selId = "hotSel_"+idx;
      d.innerHTML = `<div style="display:flex;align-items:flex-start;gap:8px">
        <input type="checkbox" id="${selId}" style="margin-top:3px;flex-shrink:0" onchange="updateBatchBtn()">
        <div style="flex:1;min-width:0;cursor:pointer" onclick="pickHot(${idx})">
          <div class="rank">#${h.rank}</div>
          <h4>${h.topic}</h4><div class="cn">${h.cn}</div>
          ${h.source ? `<div class="srctag"><i style="background:#D04418"></i>${L("真实热点","Real")} · ${h.source}</div>` : ""}
          <div class="heatbar"><i style="width:0" id="hb${idx}"></i></div>
          <div class="meta"><span>${L("热度","Heat")} <b>${h.heat}</b></span><span>${L("信源","Sources")} <b>${h.srcs}</b></span></div>
        </div>
      </div>`;
      g.appendChild(d);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ const b=$("#hb"+idx); if(b) b.style.width=h.heat+"%"; }));
    }, 110*i);
  });
  renderCustomHots(g);
}

/* 自定义信源条目：必须和真实热点走同一套选中入口（pickRealHot）。
   原来写的是 state.hot = HOTS.length + i —— 越界下标，curHot() 读 HOTS[state.hot] 得到 null，
   表现为「点进去选不中、进不了生成流程」。没有可用正文时由 pickRealHot 引导粘贴原文，
   弹窗里会给出 h.url，老师才知道去哪找原文。
   同时不再显示「热度 / 信源」两个数：自定义源没有真实热度口径，与其造假指标不如不显示。 */
function renderCustomHots(g, immediate){
  if(!g || state.hotTheme) return;
  /* 与全网热点同一规则：无可用正文的条目不进列表（点进去只会弹「请粘贴原文」）。
     runCustomScan 里已筛过一轮，这里兜住 state 被别处写入的情况。 */
  const cust = (state.customHots || []).filter(hasUsableText);
  if(!cust.length) return;
  /* 幂等保护：renderHots 会被 scanTimer 每秒调用一次，没有这道闸就会一秒追加一批卡片。
     指纹取「条数 + 首条 url」，重扫换了内容才会变。清空 innerHTML 的地方要同步清 stamp。 */
  const stamp = cust.length + "|" + ((cust[0] && cust[0].url) || "");
  if(g.dataset.custStamp === stamp && g.querySelector(".hotcard.custom")) return;
  g.dataset.custStamp = stamp;
  cust.forEach((h, i) => {
    const make = () => {
      const T = SRC_TYPES[h.type] || SRC_TYPES.other;
      const running = state.live && state.live.status === "running";
      const d = document.createElement("div");
      d.className = "hotcard custom" + (state.realHot === h ? " sel" : "") + (running ? " locked" : "");
      d.onclick = () => pickRealHot(h);
      const link = h.url
        ? `<a href="${esc(h.url)}" target="_blank" rel="noopener" style="color:#E65425;text-decoration:underline" onclick="event.stopPropagation()">${L("打开原文","Open source")}</a>`
        : "";
      d.innerHTML = `<div class="rank"></div>
        <div class="srctag"><i style="background:${T.color}"></i>${L("我的来源","My source")} · ${L(h.tag.zh,h.tag.en)} · ${esc(h.name)}</div>
        <h4>${esc(h.topic)}</h4>
        ${h.summary ? `<div class="cn">${esc(h.summary)}</div>` : ""}
        ${fulltextBadge(h)}
        <div class="meta"><span>${esc(h.source||"")}</span><span>${link}</span></div>`;
      g.appendChild(d);
    };
    if(immediate) make(); else setTimeout(make, 110*i);
  });
}
/* 选中演示热点（HOTS）：只选中 + 预览，**不跑流程**（拆分「挑」与「跑」，2026-09-22）。 */

function toggleTopicIdx(theme, si){

function s3(){
  const cats = taxoCats();
  const sel = new Set(state.tagContent);
  const cands = new Set(state.tagFreeCands);
  const hitCats = new Set((state.tagAIContent || []).map(c => c.cat));
  const anyHit = hitCats.size > 0;
  const totalTags = cats.reduce((a, c) => a + (c.tags || []).length, 0);

  /* 第一层：6 类分区。AI 命中的类别展开，其余折叠；AI 还没跑过时全部展开以便人工选 */
  const layer1 = cats.length ? `<div class="tagsection">
    <div class="tagsec-h">${L("第一层 · 内容标签","Layer 1 · Content tags")}
      <span>${cats.length} ${L("类","categories")} · ${totalTags} ${L("个标签","tags")}</span>
    </div>
    ${cats.map((c, ci) => {
      const isOpen = state.tagOpenCats[c.key] !== undefined ? state.tagOpenCats[c.key] : (anyHit ? hitCats.has(c.key) : true);
      const nSel = (c.tags || []).filter(t => sel.has(tagKeyOf(c.key, t.zh))).length;
      if(!isOpen){
        return `<div class="tagcat closed" onclick="toggleCatOpen('${escAttr(c.key)}')" style="animation-delay:${.04 * ci}s">
          <span class="tc-name">${esc(c.zh)}<small>${esc(c.en)}</small></span>
          <span class="tc-count">${(c.tags || []).length} ${L("个","tags")}${nSel ? ` · <b>${nSel} ${L("已选","selected")}</b>` : ""}</span>
          <span class="tc-arrow">▸</span></div>`;
      }
      return `<div class="tagcat" style="animation-delay:${.04 * ci}s">
        <div class="tc-head" onclick="toggleCatOpen('${escAttr(c.key)}')">
          <span class="tc-name">${esc(c.zh)}<small>${esc(c.en)}</small></span>
          <span class="tc-count">${nSel ? `<b>${nSel} ${L("已选","selected")}</b> · ` : ""}${(c.tags || []).length} ${L("个","tags")}</span>
          <span class="tc-arrow">▾</span>
        </div>
        <div class="tc-opts">${(c.tags || []).map(t => {
          const k = tagKeyOf(c.key, t.zh);
          const isSel = sel.has(k);
          const isRec = !isSel && cands.has(t.zh) === false && hitCats.has(c.key) && (state.tagAIContent || []).some(x => x.cat === c.key && x.tag === t.zh);
          return `<span class="chip ${isSel ? "sel" : (isRec ? "rec" : "")}" onclick="toggleContentTag('${escAttr(c.key)}','${escAttr(t.zh)}')">${L(t.zh, t.en)}</span>`;
        }).join("")}</div></div>`;
    }).join("")}
  </div>` : `<div class="degraded"><div class="dgb-h"> ${L("标签词表未加载，无法选择内容标签","Taxonomy not loaded — content tags unavailable")}</div></div>`;

  /* 第二层：自由标签（AI 候选 + 已选 + 手动添加） */
  const freeAll = [];
  (state.tagFreeCands || []).forEach(t => { if(freeAll.indexOf(t) < 0) freeAll.push(t); });
  (state.tagFree || []).forEach(t => { if(freeAll.indexOf(t) < 0) freeAll.push(t); });
  const layer2 = `<div class="tagsection">
    <div class="tagsec-h">${L("第二层 · 自由标签","Layer 2 · Free tags")}</div>
    ${freeAll.length ? `<div class="tc-opts">${freeAll.map(t => {
      const on = state.tagFree.indexOf(t) >= 0;
      return `<span class="chip ${on ? "sel" : ""}" onclick="toggleFreeTag('${escAttr(t)}')">${on ? "✓ " : ""}${esc(t)}</span>`;
    }).join("")}</div>` : `<div class="tc-empty">${L("还没有自由标签。点上方「AI 提取标签」获取候选，或手动添加。","No free tags yet. Click \"AI extract\" above, or add manually.")}</div>`}
    <div class="tagadd">
      <input placeholder="${L("手动添加自由标签，回车确认","Add a free tag, press Enter")}"
             value="${escAttr(state.tagFreeInput || "")}"
             oninput="state.tagFreeInput=this.value"
             onkeydown="if(event.key==='Enter'){addFreeTag();}">
      <button class="btn mini" onclick="addFreeTag()">${L("添加","Add")}</button>
    </div>
  </div>`;

  /* 第三层：认知标签 */
  const layer3 = `<div class="tagsection">
    <div class="tagsec-h">${L("第三层 · 认知标签","Layer 3 · Cognitive tags")}
      <span>${L("AI 判断，可人工修改","AI judges, you can override")}</span></div>
    <div class="tc-opts">${taxoCognitive().map(c => {
      const on = state.tagCognitive === c.zh;
      return `<span class="chip ${on ? "sel" : ""}" onclick="setCognitive('${escAttr(c.zh)}')">${on ? "● " : "○ "}${L(c.zh, c.en)}</span>`;
    }).join("")}</div>
  </div>`;

  /* 已选汇总 */
  const selSummary = [];
  state.tagContent.forEach(k => {
    const p = k.split("|");
    const c = taxoCatOf(p[0]);
    selSummary.push({ cls: "c", txt: (c ? c.zh : p[0]) + " · " + p[1] });
  });
  (state.tagFree || []).forEach(t => selSummary.push({ cls: "f", txt: t }));
  if(state.tagCognitive) selSummary.push({ cls: "g", txt: state.tagCognitive });

  return head("04", L("选题标签","Topic Tagging")) +
  matWorkflowBar() +
  `${materialCardHTML()}
  <div class="tagextract">
    <button class="btn" onclick="extractTagsAI()" ${state.tagExtracting ? "disabled" : ""}>${state.tagExtracting ? " " + L("提取中…","Extracting…") : " " + L("AI 提取标签","AI extract tags")}</button>
  </div>
  ${state.tagWarn ? `<div class="degraded"><div class="dgb-h"> ${esc(state.tagWarn)}</div></div>` : ""}
  ${state.tagTitleOnly ? `<div class="tagdropped">${L("该热点仅有标题、无正文：内容标签与自由标签均基于标题提取，自由标签可能偏少。建议优先使用带正文的素材，或在 05 步补充正文后重新提取。","This topic has only a title (no body): tags were derived from the title, so free tags may be sparse. Prefer sources with body text, or enrich the material at step 05 and re-extract.")}</div>` : ""}
  ${taxoError ? `<div class="degraded"><div class="dgb-h"> ${L("未能拉取标签词表，当前使用上次缓存","Could not fetch the taxonomy — using last cache")}</div><div class="dgb-row"><span class="dgb-msg">${esc(taxoError)}</span></div></div>` : ""}
  ${(state.tagMeta && state.tagMeta.dropped && state.tagMeta.dropped.length)
    ? `<div class="tagdropped">${L("已过滤：","Filtered out: ")}${esc(state.tagMeta.dropped.join("；"))}</div>` : ""}
  ${layer1}${layer2}${layer3}
  <div class="tagselbar"><span class="tsb-label">${L("已选","Selected")}</span>
    ${selSummary.length ? selSummary.map(s => `<span class="tsb-chip ${s.cls}">${esc(s.txt)}</span>`).join("")
                        : `<span class="tsb-empty">${L("尚未选择任何标签","No tags selected")}</span>`}
  </div>
  ${saveMaterialBankBar()}` + wfStrip();
}



/* ---------- Stage 5 ---------- */
function s4(){
  const text = curMaterialText();
  const facts = curFacts();
  const label = curMaterialLabel();
  const url = curMaterialUrl();
  const lf = liveFacts();
  const hasLive = !!(lf && lf.length);
  const running = state.live.status === "running";
  const ready = (hasLive || state.extracted) && !liveExcluded();
  const factCards = facts.map((f, i) => {
    /* C6：原先 QUOTE 与 EVENT 同色、变量名还叫 teal/purple（值却是橙红），后人极易误加绿色。
       现在只保留品牌橙的深浅梯度，类型靠文字徽标区分。 */
    const tcolor = {DATA:"danger",QUOTE:"warn",EVENT:"pri",BACKGROUND:"neutral"}[f.type] || "neutral";
    const conf = (f.conf==null ? 0.9 : f.conf);
    /* 生成后回填：该卡被哪些段落引用；绑定存在却未被引用 → 标黄提示 */
    const cb = hasLive ? factCitedBy(i+1) : "";
    const uncited = hasLive && !!liveFactMap() && !cb;
    return `<div class="fcard${uncited ? " uncited" : ""}">
      <div class="top"><span class="tint ${tcolor}">${f.type}</span><span class="fid" title="${L("事实卡内部编号","internal fact-card id")}">${L("事实卡 ","Fact ")}${i+1}</span>${uncited?`<span class="tint warn">${L("未被引用","UNCITED")}</span>`:""}</div>
      <div class="stmt">${esc(f.stmt)}</div>
      ${f.zh ? `<div class="zh">${esc(f.zh)}</div>` : ""}
      <div class="meta"><span>${L("置信","confidence")}</span><div class="confbar ${conf<0.9?"low":""}"><i style="width:${(conf*100).toFixed(0)}%"></i></div><b>${conf.toFixed(2)}</b>
      <span class="tint ${f.rev==="auto"?"ok":"warn"}">${f.rev==="auto"?"AUTO":L("复核","REVIEW")}</span></div>
      <div class="senref"> ${esc(f.anchor)} · ${L("交叉验证","cross-check")}: ${esc(f.cross)}</div>
      ${cb ? `<div class="citedby"> ${L("被引用","cited in")} ${cb}</div>` : ""}
    </div>`;
  }).join("");
  /* 事实卡池区域按状态渲染：运行中 / 真实抽取 / 占位兜底 / 未运行 */
  let factBody;
  if(running){
    factBody = `<div id="s4live">${s6LiveInner(L("正在抽取事实卡 · 预计 5–10 秒，完成后自动刷新","Extracting fact cards · ~5–10s, auto-refreshes on completion"), "fact", true)}</div>`;
  } else if(hasLive){
    factBody = factCards;
  } else if(state.live.status === "error"){
    factBody = `<div class="note warn-note" style="margin-bottom:10px">${L("AI 抽取失败：","AI extraction failed: ")}${esc(state.live.err || L("未知错误","unknown error"))}</div>
      <div style="margin-bottom:10px"><button class="btn" onclick="extract()">${L("重试抽取","Retry extraction")}</button></div>` + factCards;
  } else if(liveExcluded()){
    /* 被敏感排查排除的素材：不该落进「0 张事实卡」分支，否则误导用户以为抽卡失败。
       排除的出口在 02 敏感排查页（人工放行 / 更换），这里明确告知并给出直达放行按钮。 */
    factBody = `<div class="note warn-note" style="margin-bottom:10px">${L("该素材已被 AI 敏感排查判定为排除（","This material was excluded by the AI sensitivity screen (")}${esc(liveSensLevel()||"")}${L("）· ",") · ")}${esc(liveSensReason()||"")}${L("，因此不产出事实卡。"," — so no fact cards were produced.")}</div>
      <div style="margin-bottom:10px;font-size:12.5px;color:var(--sub)">${L("可在下方人工放行继续，或返回 01 更换素材。","Override below to continue, or go back to step 01 to pick another.")}</div>
      <div style="margin-bottom:10px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="manualOverrideRun()">${L("人工放行继续","Manual override · continue")}</button><button class="btn sec" onclick="go(0)">${L("返回 01 更换素材","Go to step 01")} →</button></div>` + factCards;
  } else if(state.extracted){
    /* 0 张卡有五种成因，按诊断结果给不同说明与出口；旧文案一律说「素材没有正文」会误导排查方向。 */
    const diag = liveFactDiag();
    const noText = !curMaterialText() || curMaterialText().trim().length < 40;
    let rZh = "", rEn = "";
    if(diag.k === "nojson"){
      rZh = "AI 工作流已成功返回，但输出中没有事实卡字段（facts_json 为空）——通常是素材过短或内容无法原子化。";
      rEn = "The workflow succeeded but returned no fact-card field (facts_json empty) — usually the material is too short or cannot be atomised.";
    } else if(diag.k === "parse"){
      rZh = "AI 返回的事实卡不是合法 JSON，前端无法解析。";
      rEn = "The AI returned fact cards that are not valid JSON and cannot be parsed.";
    } else if(diag.k === "empty"){
      rZh = "AI 返回了空的事实卡数组。";
      rEn = "The AI returned an empty fact-card array.";
    } else if(noText){
      rZh = "素材没有可用正文（只有一行标题），无事实可抽。";
      rEn = "The material has no usable body text (headline only) — nothing to extract.";
    } else {
      rZh = "AI 运行完成但未产出事实卡。";
      rEn = "The AI run finished but produced no fact cards.";
    }
    factBody = `<div class="note warn-note" style="margin-bottom:10px">${L("AI 已运行完成，但抽到 0 张事实卡。","The AI run finished but extracted 0 fact cards.")} ${L(rZh, rEn)}</div>
      ${diag.raw ? `<div style="margin-bottom:10px;font-size:11.5px;color:var(--muted);word-break:break-all;background:#F7F8FA;padding:8px 10px;border-radius:8px">${esc(diag.raw)}</div>` : ""}
      <div style="margin-bottom:10px;font-size:12.5px;color:var(--sub)">${noText
        ? L("建议：回到 01 素材选择页换一条「原文已完整」的热点，或手动粘贴素材原文后再运行抽取。","Tip: go back to step 01 and pick a trend marked \"Full text\", or paste the source text manually before extracting.")
        : L("建议：先点「重新抽取」重试一次；仍为空则回到 01 换一条原文完整的素材。","Tip: retry once; if still empty, go back to step 01 and pick a material with full text.")}</div>
      <div style="margin-bottom:10px"><button class="btn" onclick="extract()">${L("重新抽取","Retry extraction")}</button></div>` + factCards;
  } else {
    /* A5：无素材时按钮必须禁用 —— 原先算了 ready 却没用上，点下去报的是「抽取失败」，
       与真实原因（没选素材）不符，用户会以为系统坏了。 */
    const noMat = !text || !text.trim();
    factBody = noMat
      ? `<div class="blockgate">${L("尚未选择素材：请先到「01 素材选择」挑一条原文完整的素材，再回来运行事实分段。","No material selected yet — pick a material in step 01 first, then run fact segmentation.")}</div>`
        + `<div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="btn" disabled>${L("运行事实分段","Run fact segmentation")}</button><button class="btn sec" onclick="go(0)">${L("去 01 选择素材","Go to step 01")} →</button></div>`
      : `<button class="btn" onclick="extract()">${L("运行事实分段","Run fact segmentation")}</button>`;
  }
  return head("06", L("事实分段","Fact Segmentation")) +
    artWorkflowBar() +
  `<div class="workbench">
    <div>
      <div class="pane-h"><span>${L("原文 · SOURCE TEXT","SOURCE TEXT")}</span><span style="font-weight:600;color:var(--muted);letter-spacing:0">${esc(label)}</span></div>
      <div class="article-mini" id="srcmini">${esc(text.slice(0, 2500))}</div>
      ${url ? `<div style="margin-top:8px;font-size:11.5px;color:var(--sub)"> ${L("原文链接","Source link")}：<a href="${esc(url)}" target="_blank" rel="noopener" style="color:var(--pri);font-weight:600;word-break:break-all;text-decoration:none">${esc(url)}</a></div>` : ""}
    </div>
    <div>
      <div class="pane-h" style="justify-content:space-between"><span>${L("事实卡池 · FACT CARDS","FACT CARDS")}</span>${ready?`<span class="tint ok">${facts.length} ${hasLive?L("张 · 由 AI 真实抽取","cards · extracted live by AI"):L("张 · 已抽取","cards · extracted")}</span>`:""}</div>
      <div class="factlist" id="factlist">${factBody}</div>
      ${ready?`<div class="note" style="margin-top:10px">${L("置信度 ≥0.85 自动通过 · 0.6–0.85 人工复核（黄）· 数据卡强制交叉验证；单一信源事实生成时须保留原文限定词（如 nearly / around）。","Confidence ≥0.85 auto-pass · 0.6–0.85 human review · DATA cards cross-checked. Single-source facts keep their qualifiers (e.g. nearly / around).")}</div>`:""}
    </div>
  </div>
  ${ready ? nextBtn("查看分级标准","KB & specs") : waitBtn(running ? L("工作流运行中…","Workflow running…") : L("点击运行抽取","Run extraction"))}` + wfStrip();
}
function extract(){
  if(state.live.status === "running"){ toast(L("工作流运行中，请稍候…","Workflow running, please wait…")); return; }
  const material = state.live.material;
  if(!material || material.length < 40){ toast(L("请先在素材选择页选择一篇素材","Pick a material first")); return; }
  state.extracted = true; render();
  startLiveRun(material, state.live.label || "", state.live.book || "");
}

/* ---------- Stage 6 ---------- */
function s5(){
  const sp = specOf(state.lvl);
  return head("07", L("知识库与分级标准","KB & CEFR Specs")) +
    artWorkflowBar() +
  `${(!curMaterialText() && !curMaterialLabel()) ? `<div class="note pri-note">${L("尚未有素材选取，您可以直接点击","No material selected yet — click ")}<a href="#" onclick="go(0);return false;" style="color:#E65425;font-weight:700;text-decoration:underline;cursor:pointer">${L("素材选择","Material Selection")}</a>${L("，进行内容生成工作流。"," to run the content generation workflow.")}</div>` : ""}
  <div class="kbgrid">
    <div class="kbitem"><div class="n">KB1</div><h5>${L("分级语言标准","Level specs")}</h5><p>${L("词表 / 句长 / 时态","Wordlists · syntax")}</p></div>
    <div class="kbitem"><div class="n">KB3</div><h5>${L("文体结构模板","Genre templates")}</h5><p>${L("倒金字塔 / 故事 / 说明文","News · story · explainer")}</p></div>
    <div class="kbitem"><div class="n">KB4</div><h5>${L("中国文化术语库","CN-term glossary")}</h5><p>≥300 ${L("条标准译法","standard renderings")}</p></div>
    <div class="kbitem"><div class="n">KB5</div><h5>${L("敏感规范库","Sensitivity rules")}</h5><p>S0–S3</p></div>
  </div>
  <div class="lvlpick">${BIG_GROUPS.map(g=>`<div class="lvl ${curBig()===g.big?"sel":""}" onclick="setBig('${g.big}')"><b>${nkDisp(g.big)}</b><span>${L(g.zh,g.en)}</span></div>`).join("")}</div>
    <div class="specgrid">
    <div class="spec"><h6>${L("词汇 VOCABULARY","VOCABULARY")}</h6><div class="row"><span>${L("词表范围","Wordlist")}</span><b>${L(sp.words,sp.en.words)}</b></div><div class="row"><span>${L("生词表词条","Vocabulary items")}</span><b>${L(sp.gloss,sp.en.gloss)}</b></div><div class="row"><span>${L("超纲词上限","Off-list cap")}</span><b>${offCap(state.lvl)}</b></div></div>
    <div class="spec"><h6>${L("句法 SYNTAX","SYNTAX")}</h6><div class="row"><span>${L("平均句长","Avg sentence")}</span><b>${L(sp.avg,sp.en.avg)}</b></div><div class="row"><span>${L("最长句","Max sentence")}</span><b>${L(sp.max,sp.en.max)}</b></div><div class="row"><span>${L("从句限制","Clauses")}</span><b style="font-size:10.5px">${L(sp.clauses,sp.en.clauses)}</b></div></div>
    <div class="spec"><h6>${L("文本 TEXT","TEXT")}</h6><div class="row"><span>${L("时态范围","Tenses")}</span><b style="font-size:10.5px">${L(sp.tense,sp.en.tense)}</b></div><div class="row"><span>${L("蓝思值区间","Lexile band")}</span><b>${L(sp.lex,sp.en.lex)}</b></div><div class="row"><span>${L("正文篇幅","Length")}</span><b>${L(sp.len,sp.en.len)}</b></div></div>
  </div>
  ${nextBtn("生成分级内容","Generate")}` + wfStrip();
}
function setlvl(k){ state.lvl = k; state.lvlManual = true; render(); }

/* ---------- Stage 7 ---------- */
/* ---------- 写作风格（7 位名人，Dify nodeStyle 映射） ---------- */
/* B10：原先只有 en 名字、没有英文描述，切到 EN 后风格名与描述仍是中文。
   descEn 为英文描述；渲染时统一走 L()。 */
const STYLES = [
  {key:"default",     name:"默认",      en:"Default",     desc:"AI 原生 · 标准分级",      descEn:"Native AI · standard grading"},
  {key:"hemingway",   name:"海明威",    en:"Hemingway",   desc:"简洁短句 · 克制",         descEn:"Short, restrained sentences"},

  {key:"ohenry",      name:"欧·亨利",   en:"O. Henry",    desc:"幽默 · 意外反转",         descEn:"Humour with a twist"},
  {key:"twain",       name:"马克·吐温", en:"Mark Twain",  desc:"幽默讽刺 · 口语",         descEn:"Satire in colloquial voice"},
  {key:"dickens",     name:"狄更斯",    en:"Charles Dickens", desc:"叙事丰富 · 社会观察", descEn:"Rich narrative, social observation"},

  {key:"shakespeare", name:"莎士比亚",  en:"Shakespeare", desc:"华丽修辞 · 诗意",         descEn:"Ornate, poetic rhetoric"},
];
function styleBarHTML(){
  const cur = state.style || "default";
  return `<div class="stylebar"><div class="sb-label">${L("写作风格","Writing style")}</div>
    ${STYLES.map(s=>`<div class="stylecard ${cur===s.key?"sel":""}" onclick="setStyle('${s.key}')">
      <div class="smeta"><div class="sname">${L(s.name,s.en)}<small>${L(s.en,s.name)}</small></div><div class="sdesc">${L(s.desc, s.descEn || s.desc)}</div></div>
    </div>`).join("")}
  </div>`;
}
function setStyle(k){
  if(state.style === k) return;
  state.style = k;
  const m = state.live && state.live.material;
  if(m && m.length >= 40){ runGeneration(); }
  render();
}
function s6(){
  /* 授权母稿链路：只要还没产出文章、且不在生成中，就显示「生成文章」按钮，
     绝不落到下面那句「还没有可展示的文章」兜底文案（授权链能进本页 = 母稿已导入分段）。
     覆盖两种进入方式：① pendingGen（确认页跳过来）② 生成中的瞬时重渲染闪一下。 */
  if(state.route === "licensed"){
    const g0 = GEN[state.lvl];
    const _has = !!(g0 && g0.paras && g0.paras.length);
    const _running = state.live.status === "running";
    if(!_has && !_running && licState().prep){
      const st = licState();
      const tgts = LIC_TARGETS[st.prep ? st.prep.level : ""] || [];
      const nSeg = (st.prep && st.prep.segs) ? st.prep.segs.length : 0;
      return head("08", L("内容生成","Graded Generation")) +
        artWorkflowBar() +
        `<div class="note" style="padding:40px;text-align:center;margin:16px 0">
          <p style="margin:0 0 14px">${L("分段已确认，即将向下生成 " + tgts.map(function(k){ return nkDisp(k); }).join(" + ") + "（" + nSeg + " 段）。点击下方按钮开始生成。",
            "Segmentation confirmed — about to generate " + tgts.map(function(k){ return nkDisp(k); }).join(" + ") + " from " + nSeg + " paragraphs. Click below to start.")}</p>
          <button class="btn" onclick="licRunGen()">${L("生成文章","Generate articles")}</button>
        </div>` + wfStrip();
    }
  }
  const g = GEN[state.lvl];
  const hasArticle = !!(g && g.paras && g.paras.length);
  const running = state.live.status === "running";
  if(!hasArticle){
    if(running){
      /* 授权母稿链路：直接逐段改写生成，不抽事实 —— 走专门的进行中文案（2026-09-22 修） */
      const isLic = state.route === "licensed";
      /* 先抽事实卡、再接续生成：进度文案与分母按当前阶段区分，避免「生成」文案配「抽取」阶段造成困惑 */
      const extracting = isLic ? false : !(state.factsCache && state.factsCache.summary);
      const denom = isLic ? GEN_EST : (extracting ? FACT_EST : GEN_EST);
      const pct = isLic

function showVSum(){
  const s=$("#vsum");
  let big="—";
  let txt=`${L("尚未运行 AI 工作流，暂无真实校验结果。运行后此处展示各档位的真实校验得分。","No AI run yet — no real validation. Run the workflow to see the real per-level check score.")}`;
  const vj = liveVJ();
  if(liveReady() && vj){
    const total = vj.total_checks || 0;
    const pass = vj.total_pass || 0;
    big = pass + "/" + total;
    const warns = (vj.results||[]).flatMap(r => (r.fail_reasons||[]));
    const allPass = total > 0 && pass === total;
    let status;
    if(allPass) status = " · " + L("全部通过","all passed");
    else if(warns.length) status = " · " + L("告警项：","warnings: ") + esc(warns.join("；").slice(0,120));
    else status = " · " + L("部分通过，存在未达标项","some checks failed");
    txt = `<b>${L("AI 真实校验：","AI LIVE validation: ")}${big} ${L("项通过","checks passed")}${status}</b>`;
    /* 词汇分级校验（EVP 词表）：超纲率 + 超纲词。
       2026-09-20 起**不再静默放行** —— 自动重试 MAX_VOCAB_RETRY 次后仍超标时，必须写清
       「哪几档没过、超了多少、该换掉哪些词」并给人工处理路径。
       静默放行 = 让不合格文章流进内容库，是最不该有的失败方式。 */
    const vcb = state.live && state.live.vocab;
    if(vcb && vcb.results){
      const rounds = state.live.vocabRounds || 0;
      const failed = [];
      const parts = allKeys().map(function(k){
        const r = vcb.results[k];
        if(!r) return null;
        if(r.exceed) failed.push(k);
        return k + " " + (r.over_rate*100).toFixed(1) + "%";
      }).filter(Boolean);
      let vhtml = L("词汇分级（EVP）：","Vocab (EVP): ") + parts.join(" · ");
      if(!failed.length){
        vhtml += " " + L("· 全部达标","· all within cap");
      } else {
        const lines = failed.map(function(k){
          const r = vcb.results[k];
          const ws = (r.avoid_words || []).slice(0, 10);
          return k + "：" + (r.over_rate*100).toFixed(1) + "% > " + (r.threshold*100).toFixed(1) + "%"
               + (ws.length ? " — " + esc(ws.join("、")) : "");
        });
        vhtml += `<br><b style="color:var(--danger)">${L("词汇未达标：已自动重试 " + rounds + " 次（每轮都带上超纲词清单重写），仍未通过","Still over level after " + rounds + " retry(ies) with word-level feedback")}</b>`
               + `<br><span style="color:var(--danger)">${lines.join("<br>")}</span>`
               + `<br><span style="color:var(--warn)">${L("处理建议：换更简单的素材，或人工替换上列词后重跑","Tip: choose an easier source, or replace the listed words and re-run")}</span>`;
      }
      txt += `<br><span class="vvocab">${vhtml}</span>`;
    }
    /* 授权链路：校验里**少一档**要说明清楚 —— 否则看起来像漏了。
       母稿档（B1/B2）本身不参与规格校验：保留原文时它的长度不由我们控制（2026-09-22 用户拍板）。 */
    const licLv = state.lic && state.lic.prep && state.lic.prep.level;
    if(licLv) txt += '<br><span style="color:var(--sub)">'
      + L("母稿档 " + nkDisp(licLv) + " 不参与规格校验（长度不由我们控制），上面的分数只统计向下产出的低档。",
          "The master level " + nkDisp(licLv) + " is not spec-checked (its length is out of our control) — the score above covers the generated lower levels only.")
      + '</span>';
    /* 逐段大意核对（图 B 的 nodeSemCheck，2026-09-22 新增）：
       段数一致是结构性保证，但「第 i 段讲的是不是母稿第 i 段那件事」**代码验不了**
       （gist_map 是模型自报的）⇒ 由这个 LLM 节点独立核对。
       ⚠️ **报警性质、不判 fail**，所以它**不进 total_checks**（分母仍是 3 档 × 11 项），
          只在这里提示 —— 界面上必须写清这一点，否则会被当成漏了一项。 */
    const semH = semWarnHTML();
    if(semH) txt += '<div style="margin-top:12px">' + semH
      + '<br><span style="color:var(--sub)">' + L("（逐段大意核对不计入上面的分数 —— 它是提醒，不拦住入库。）",
        "(The per-paragraph check is not part of the score above — it is advisory and does not block saving.)")
      + '</span></div>';
  }
  s.innerHTML=`<div class="big">${big}</div><div class="txt">${txt}</div>`;
  s.style.animation="pop .5s both";
  s.scrollIntoView({behavior:"smooth",block:"nearest"});
}

async function approve(){
  state.reviewed = true;

     backfillBankAudio() 会按 contentId 自动回填进已入库的文章（链路闭环）。 */
  const hasArt = allKeys().some(k => GEN[k] && GEN[k].paras && GEN[k].paras.length);
  if(hasArt && !Object.keys(state.audio || {}).length && !state.audioPromise){
    genArticleAudio();
  }
  /* 从文章库进入的审核：直接标记已审核（避免重建导致 contentId 不一致） */
  if(state.reviewingId){
    const list = loadBank();
    const a = list.find(x=>x.id===state.reviewingId);
    if(a){ a.reviewedBy = "审核老师"; saveBank(list); syncArticleToLibrary(a); }
    state.reviewingId = null;
    toast(L("审核通过 · 已归档到文章库","Approved — archived to the article library"));
    go(11);
    return;
  }
  const art = buildBankArticle();
  const saved = art ? addToBank(art) : false;
  if(!saved){
    // 没存进去就不能说"已存入文章库"
    toast(L("入库失败：文章未能写入本地存储，请检查浏览器存储设置后重试",
            "Failed to bank: the article could not be written to local storage — check browser storage settings"));
    render();
    return;
  }
  const na = bankAudioCount(art);
  const inflight = !!(state.audioPromise);   /* 音频仍在后台生成 → 会由 backfill 自动补齐 */
  toast((na === 6
    ? L("审核通过 · 已存入文章库（含 6 个音频）","Approved — saved with 6 audio files")
    : na > 0
      ? L("审核通过 · 已存入文章库（仅 " + na + "/6 个音频）","Approved — saved with only " + na + "/6 audio files")
      : inflight
        ? L("审核通过 · 已存入文章库（音频生成中，完成后将自动补齐）","Approved — saved; audio backfills automatically")
        : L("审核通过 · 已存入文章库（无音频，可补生成）","Approved — saved without audio")));
  go(11);
}

/* 段落对齐告警条（2026-09-20）：段数被截断 / 段落错位 / 质检层判决未过时给出明确提示 + 重试路径。
   背景：热点链路四档都是 12 段（授权母稿链路为动态段数，见 expectedParaCount），
   切档时看到的行号是对齐的 —— 但若某档「拆段 → 末尾被截断」，
   界面看起来仍然整齐，实际内容已整体跳位。这是用户唯一能察觉的入口，必须显式告警。 */
/* ══ 逐段大意核对（图 B · nodeSemCheck，2026-09-22 新增）════════════════
   为什么单独有这一块：**段数一致是结构性保证**（各档都用同一个 seg_count，
   nodeAgg 还会把多出的段截断并写进 map_warn），但「第 i 段讲的是不是母稿第 i 段
   那件事」**代码验不了** —— 图 B 不抽事实、没有独立的事实轴可反查，
   nodeValidate 的「段落对齐」项查的又只是「模型**自报**的 gist_map 格式」，
   模型完全可以自报 [i] 而实际错位。⇒ 补了一个 LLM 节点做独立语义核对。
   ⚠️ **报警性质**：不判 fail、不拦入库 —— 所以用「提醒」语气而不是「错误」。
   ⚠️ 结果可能不是合法 JSON（模型输出）⇒ 解析失败必须说出来，不许静默。 */
function semResult(){
  const o = liveOut();
  const raw = o ? String(o.sem_json || "").trim() : "";
  if(!raw) return null;                       /* 老图 / 热点链路没有这个字段 ⇒ 不显示，不是错误 */
  let j = null;
  try {
    const i = raw.indexOf("{"), k = raw.lastIndexOf("}");
    if(i >= 0 && k > i) j = JSON.parse(raw.slice(i, k + 1));
  } catch(e){ j = null; }
  if(!j || !Array.isArray(j.levels)) return { parseFail: true, raw: raw.slice(0, 240) };
  const levels = j.levels.map(function(x){
    const lv = nkKey(String((x && x.level) || ""));
    const bad = (((x && x.bad) || [])).map(function(n){ return parseInt(n, 10); })
      .filter(function(n){ return n >= 1; });
    return { level: lv, bad: bad.sort(function(a, b){ return a - b; }), notes: ((x && x.notes) || []).map(String) };
  }).filter(function(x){ return !!LEVEL_BY_KEY[x.level]; });
  const badTotal = levels.reduce(function(a, x){ return a + x.bad.length; }, 0);
  return { levels: levels, badTotal: badTotal, summary: String(j.summary || "") };
}
/* 被点名错位的段号（按档）—— 供 alignBodyHTML 给对应行加标记 */
function semBadSegs(){
  const s = semResult(), out = {};
  if(!s || s.parseFail) return out;
  s.levels.forEach(function(x){ if(x.bad.length) out[x.level] = x.bad; });
  return out;
}

      + esc(s.raw) + '</li></ul><div class="aw-fix">'
      + L("这表示核对节点没有按约定输出 JSON —— 不影响入库，但这次没有核对结果，请知悉。",
          "The check node did not return the agreed JSON. Saving is unaffected, but this run has no check result.")
      + '</div></div>';

      "Per-paragraph check: every level matches the master paragraph by paragraph.")

  s.levels.forEach(function(x){

    h += '<li><b>' + esc(nkDisp(x.level)) + '</b> '
       + L("第 " + x.bad.join("、") + " 段与母稿同一段讲的事对不上",

function syncInfo(a){

/* 打通：文章入库时同步到桥接层 /api/library（→ 飞书文章库）。

async function syncArticleToLibrary(art){
  markSync(art.id, { status:"pending", error:"", at: Date.now() });
  try {
    const r = await fetch(AGENT_REACH_API + "/api/library", {
      method: "POST", mode: "cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(art)
    });
    let why = "HTTP " + r.status;
    let j = null;
    try { j = await r.json(); } catch(e){}
    if(r.ok && j && j.ok){

async function bankRegenAudio(id){

  const list = loadBank();

  const arts = (a.articles && typeof a.articles === "object") ? a.articles : {};

  bankAudioBusy = id; render();
  let ok = false;
  try {
    const resp = await fetch(AGENT_REACH_API + "/api/tts/batch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ articles: arts, accents: ["us", "uk"] })
    });
    const j = await resp.json();
    if(j && j.ok && j.audio){
      a.audio = j.audio;
      a.audioMeta = audioMetaFrom(j.meta, j.audio, null);
      saveBank(list);
      syncArticleToLibrary(a);
      ok = true;
      toast(L("已生成 " + a.audioMeta.count + "/6 个音频并写入文章库 · " + (a.audioMeta.model || "") + " · " + (a.audioMeta.elapsedMs/1000).toFixed(1) + "s",

    } else {
      const why = (j && (j.error || j.message)) || L("桥接层未返回音频（" + AGENT_REACH_API + "）","bridge returned no audio (" + AGENT_REACH_API + ")");
      a.audioMeta = audioMetaFrom(j && j.meta, {}, why);
      saveBank(list);
      toast(L("音频生成失败：" + why, "Audio generation failed: " + why));
    }
  } catch(e) {
    const why = L("桥接层未启动（" + AGENT_REACH_API + "）。请在本机运行 output/backend/start_bridge.py",
                  "bridge not running (" + AGENT_REACH_API + "). Run output/backend/start_bridge.py locally");
    a.audioMeta = audioMetaFrom(null, {}, why);
    saveBank(list);
    toast(L("音频生成失败：" + why, "Audio generation failed: " + why));
  }
  bankAudioBusy = null;
  render();
  if(wasOpen){
    const el = document.getElementById("bc-" + id);
    if(el){ el.innerHTML = bankArtDetailHTML(a); el.style.display = "block"; }
  }
}

const MATERIAL_BANK_KEY = "wb_material_bank_v1";
/* 素材 ID：MAT-YYYYMMDD-NNN，序号 = 同日已有 ID 最大值 +1（避免删除后撞号） */
function nextMaterialId(list){
  const prefix = "MAT-" + new Date().toISOString().slice(0,10).replace(/-/g,"") + "-";
  let max = 0;
  (list||[]).forEach(m => {
    const id = String((m && m.id) || "");
    if(id.indexOf(prefix) === 0){
      const n = parseInt(id.slice(prefix.length), 10);
      if(!isNaN(n) && n > max) max = n;
    }
  });
  return prefix + String(max + 1).padStart(3, "0");
}

    if(!m.id){ m.id = nextMaterialId(list); dirty = true; }

const TOPIC_CATS = [
  {key:"world", zh:"世界", en:"World", color:"#E65425"},
  {key:"science", zh:"科学", en:"Science", color:"#E65425"},
  {key:"culture", zh:"文化", en:"Culture", color:"#E65425"},

/* 从文章对象取「结构化三层标签」：兼容新格式(curTags 对象)与旧格式(identityRecord 展示行数组) */
function artTags(a){
  const t = a && a.identity && a.identity.tags;
  if(!t) return { content: [], free: [] };
  if(!Array.isArray(t)){
    return { content: Array.isArray(t.content) ? t.content : [], free: Array.isArray(t.free) ? t.free : [] };
  }
  /* 旧格式：行数组 [{k:{zh},v:{zh}}]，从「内容标签」行回解析 "一级主题 · 标签"（可含 、 多标签） */
  const content = [];
  const row = t.find(r => r && r.k && r.k.zh === "内容标签");
  if(row && row.v && row.v.zh){
    String(row.v.zh).split(/[、,，]/).forEach(seg => {
      const m = String(seg).split(" · ");
      if(m.length >= 2){
        const zh = m[0], tag = m.slice(1).join(" · ");
        const c = TOPIC_CATS.find(x => x.zh === zh);
        if(c) content.push({ cat: c.key, catZh: c.zh, catEn: c.en, tag: tag, tagEn: tag });
      }
    });
  }
  const fr = t.find(r => r && r.k && r.k.zh === "自由标签");
  let free = [];
  if(fr && fr.v && fr.v.zh && fr.v.zh !== "无" && fr.v.zh !== "none") free = String(fr.v.zh).split(/[、,，]/);
  return { content: content, free: free };
}
function articlePrimaryCat(a){
  const c0 = artTags(a).content[0];
  return (c0 && c0.cat) ? c0.cat : "other";
}
function topicLabelOf(a){

}

/* ==================== 文章库 · 导出（Word .docx） ==================== */
/* 文件名安全化：去非法字符、压缩空白、截断 */
function safeFileName(s){
  return String(s == null ? "" : s).replace(/[\\/:*?"<>|\r\n\t]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 50) || "untitled";
}
/* 清理段落/题目内嵌标记 {f0}...{f} / {w}...{f} → 纯文本 */
function cleanPara(t){
  return String(t == null ? "" : t).replace(/\{(?:f\d*|w)\}([^{]*)\{f\}/g, "$1");
}
/* 单篇全文 Markdown：# 标题 + 按档推进，每档「先文章段落、后该档题目」。
   即 A1-(文章段落…→题目Q1/Q2/Q3) → A2(段落…→题目) → B1 → B2+，一个文档内四档并列。 */
function buildArticleAllLevelsMD(a){
  const out = ["# " + (a.title || "Untitled"), ""];
  allKeys().forEach(function(k){
    /* 该档文章段落 */
    const paras = (a.paras && a.paras[k]) || [];
    const list = [];
    if(paras.length){
      paras.forEach(function(t){ const c = cleanPara(t).trim(); if(c) list.push(c); });
    } else {
      const raw = (a.articles && a.articles[k]) || "";
      raw.split(/\n{2,}/).forEach(function(p){ const c = cleanPara(p).trim(); if(c) list.push(c); });
    }
    /* 该档题目 */
    const quiz = (a.quiz && a.quiz[k]) || [];
    if(!list.length && !quiz.length) return;
    out.push("# " + k, "");
    list.forEach(function(c){ out.push(c, ""); });
    if(quiz.length){
      out.push("", "## 题目", "");
      quiz.forEach(function(q, i){
        out.push("Q" + (i+1) + ". " + cleanPara(q.q || ""));
        (q.options || []).forEach(function(o, oi){
          out.push(("ABCD"[oi] || (oi+1)) + ". " + cleanPara(o));
        });
        out.push("答案：" + ("ABCD"[q.answer] || "—"));
        if(q.explain) out.push("解析：" + cleanPara(q.explain));
        out.push("");
      });
    }
  });
  return out.join("\n").replace(/\n+$/, "\n");
}
/* Word(.docx) 导出：用 JSZip 打包最小 WordprocessingML，零额外依赖，Word/WPS 均可打开。
   内容结构 = 标题（Heading1）+ 各档（Heading2）+ 段落（正文），与 MD 同源。 */
function docxEscape(t){
  return String(t == null ? "" : t)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&apos;");
}
function docxParagraph(text, style){
  const p = docxEscape(text);
  return '<w:p><w:pPr><w:pStyle w:val="' + style + '"/></w:pPr><w:r><w:t xml:space="preserve">' + p + '</w:t></w:r></w:p>';
}
/* MD 文本 → docx body XML：标题（居中 DocTitle）、档位（加粗 DocLevel）、正文段落（带序号 ①②③）
   withNumbers=true 时正文段落前加序号（文章用）；false 时纯段落（题目用，题目已有 Q1/A/B/C 编号） */
const DOCX_CIRCLE = ["①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩","⑪","⑫","⑬","⑭","⑮","⑯","⑰","⑱","⑲","⑳"];
function mdToDocxBody(md, withNumbers){
  const lines = String(md || "").split("\n");
  const paras = [];
  let firstHeading = true;
  let paraIndex = 0;
  let inQuiz = false;   /* 题目区：不施加段落序号（题目靠 Q1/A/B/C 自编号） */
  lines.forEach(function(line){
    const t = line.replace(/\r$/, "");
    if(/^#+\s/.test(t)){
      const txt = t.replace(/^#+\s+/, "").trim();
      if(/^(A1|A2|B1|B2)$/.test(txt)){
        paras.push(docxParagraph(nkDisp(txt), "DocLevel"));   /* 档位：加粗一级标题 */
        paraIndex = 0;
        inQuiz = false;
      } else if(firstHeading){
        paras.push(docxParagraph(txt, "DocTitle"));           /* 第一个 # = 文章标题：居中 */
        firstHeading = false;
      } else if(txt === "题目"){
        paras.push(docxParagraph(txt, "DocLevel"));           /* 「题目」小节标题：加粗 */
        paraIndex = 0;
        inQuiz = true;
      } else {
        paras.push(docxParagraph(txt, "DocLevel"));           /* 其余 #/## 小节标题：加粗 */
        paraIndex = 0;
      }
    } else if(t.trim()){
      const c = t.trim();
      if(withNumbers && !inQuiz){
        const prefix = paraIndex < DOCX_CIRCLE.length ? DOCX_CIRCLE[paraIndex] : ("(" + (paraIndex + 1) + ")");
        paras.push(docxParagraph(prefix + " " + c, "Normal"));
        paraIndex++;
      } else {
        paras.push(docxParagraph(c, "Normal"));
      }
    }
  });
  return paras.join("");
}
function buildDocxBlob(md, withNumbers){
  const xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
    '<w:body>' + mdToDocxBody(md, withNumbers) +
    '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr>' +
    '</w:body></w:document>';
  const doc = new JSZip();
  doc.file("[Content_Types].xml",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
    '</Types>');
  doc.folder("_rels").file(".rels",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
    '</Relationships>');
  doc.folder("word").file("styles.xml",
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
    '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:pPr><w:spacing w:line="360" w:lineRule="auto"/><w:jc w:val="both"/></w:pPr><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:eastAsia="SimSun"/><w:sz w:val="24"/></w:rPr></w:style>' +
    '<w:style w:type="paragraph" w:styleId="DocTitle"><w:name w:val="Doc Title"/><w:basedOn w:val="Normal"/><w:pPr><w:jc w:val="center"/><w:spacing w:after="240"/></w:pPr><w:rPr><w:b/><w:sz w:val="24"/></w:rPr></w:style>' +
    '<w:style w:type="paragraph" w:styleId="DocLevel"><w:name w:val="Doc Level"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:before="240" w:after="120"/></w:pPr><w:rPr><w:b/><w:sz w:val="24"/></w:rPr></w:style>' +
    '</w:styles>');
  doc.folder("word").file("document.xml", xml);
  return doc.generateAsync({ type: "blob" });
}
/* 导出：单篇 → 一个 .docx；多选 → 每篇各自一个 .docx，一次下载多个。
   文档内容 = # 标题 + 逐档(先文章段落、后该档题目)，4 档全在一个 Word 里。 */
async function exportArticles(ids){
  if(typeof JSZip === "undefined"){ toast(L("导出组件未加载，请联网后刷新重试","Export module not loaded — check network and refresh")); return; }
  const bank = loadBank();
  const arts = (ids || []).map(function(id){ return bank.find(function(x){ return x.id === id; }); }).filter(Boolean);
  if(!arts.length){ toast(L("没有可导出的文章","Nothing to export")); return; }
  try {
    /* 逐篇生成 docx blob（每篇内所有难度、先文章后题目） */
    const built = [];
    for(let i = 0; i < arts.length; i++){
      const a = arts[i];
      const blob = await buildDocxBlob(buildArticleAllLevelsMD(a), true);
      built.push({ name: safeFileName(a.title) + ".docx", blob: blob });
    }
    built.forEach(function(b){
      const url = URL.createObjectURL(b.blob);
      const dl = document.createElement("a");
      dl.href = url;
      dl.download = b.name;
      document.body.appendChild(dl); dl.click();
      setTimeout(function(){ document.body.removeChild(dl); URL.revokeObjectURL(url); }, 1200);
    });
  } catch(e){ toast(L("导出失败：","Export failed: ") + (e && e.message)); }
}

        <td class="mat-muted">${a.createdAt ? fmtDate(a.createdAt) : "—"}</td>

      </tr>`;
    }).join("")}</tbody>
  </table>`;

  if(!paged.length){
    html += `<div class="empty-state">${L("暂无匹配文章","No matching articles")}</div>`;
  }

  /* 分页 */
  html += `<div class="mat-pagination">
    <button class="btn sec tiny" onclick="pageArt(0)" ${artPage<=0?"disabled":""}>${L("首页","First")}</button>
    <button class="btn sec tiny" onclick="pageArt(${artPage-1})" ${artPage<=0?"disabled":""}>‹</button>
    <span>${L("第","Page")} ${artPage+1}/${totalPages}</span>
    <button class="btn sec tiny" onclick="pageArt(${artPage+1})" ${artPage>=totalPages-1?"disabled":""}>›</button>
    <button class="btn sec tiny" onclick="pageArt(${totalPages-1})" ${artPage>=totalPages-1?"disabled":""}>${L("末页","Last")}</button>
  </div>`;

  html += wfStrip();
  return html;
}

  if(!t) return [];
  return t.split(/\n{2,}/).map(x => x.trim()).filter(Boolean);

function bankAlignedHTML(a){

  /* 筛选 */
  let filtered = list;
  if(matFilter.keyword){

      (m.label||"").toLowerCase().includes(kw) ||
      (m.title||"").toLowerCase().includes(kw) ||
      (m.originalText||"").toLowerCase().includes(kw) ||
      (m.source||"").toLowerCase().includes(kw) ||
      (m.id||"").toLowerCase().includes(kw)

    filtered = filtered.filter(m => ["pending_collect","collected","screening"].indexOf(m.status) >= 0);
  } else if(matFilter.status === "__month__"){
    const mk = new Date().toISOString().slice(0,7);
    filtered = filtered.filter(m => m.collectedAt && new Date(m.collectedAt).toISOString().slice(0,7) === mk);
  } else if(matFilter.status) filtered = filtered.filter(m => m.status === matFilter.status);

  </div>`;

  /* 表格 */
  html += `<table class="mat-table">

      const statusZh = MAT_STATUS_ZH[si>=0?si:0];

    <span>${L("第","Page")} ${matPage+1}/${totalPages}</span>
    <button class="btn sec tiny" onclick="pageMat(${matPage+1})" ${matPage>=totalPages-1?"disabled":""}>›</button>

        <div class="mat-detail-row"><span>${L("来源类型","Source type")}</span><b>${esc(m.sourceType||"—")}</b></div>
        <div class="mat-detail-row"><span>${L("来源","Source")}</span><b>${esc(m.source||"—")}</b></div>
        <div class="mat-detail-row"><span>${L("原文链接","URL")}</span>${m.url?`<a href="${esc(m.url)}" target="_blank">${esc(m.url)}</a>`:"—"}</div>
        <div class="mat-detail-row"><span>${L("采集人","Collector")}</span><b>${esc(m.collectedBy||"—")}</b></div>
        <div class="mat-detail-row"><span>${L("采集时间","Collected at")}</span><b>${m.collectedAt?fmtDate(m.collectedAt):"—"}</b></div>
        <div class="mat-detail-row"><span>${L("主题","Theme")}</span><b>${esc(theme||"—")}</b></div>
        <div class="mat-detail-row"><span>${L("内容标签","Content tags")}</span><b>${tags.length?tags.join("、"):L("无","None")}</b></div>
        <div class="mat-detail-row"><span>${L("自由标签","Free tags")}</span><b>${freeTags||L("无","None")}</b></div>
        <div class="mat-detail-row"><span>${L("认知标签","Cognitive")}</span><b>${esc(m.tagCognitive||"—")}</b></div>
      </div>
      <div class="mat-detail-section">
        <h4>${L("原文预览","Original text preview")}</h4>
        <div class="mat-detail-text">${esc((m.originalText||"").slice(0,600))}${(m.originalText||"").length>600?"…":""}</div>
      </div>
    </div>
  `, `<button class="btn sec" onclick="closeDrawer()">${L("关闭","Close")}</button><button class="btn" onclick="closeDrawer();pickMaterialFromBank('${esc(m.uuid)}')">${L("选用生成","Use to generate")}</button>`);
}
/* 右侧抽屉：素材详情等 */
function openDrawer(title, bodyHTML, footHTML){
  $("#drawer").innerHTML = `
    <div class="drawer-header"><h3>${title}</h3><button class="drawer-close" onclick="closeDrawer()">✕</button></div>
    <div class="drawer-body">${bodyHTML}</div>
    ${footHTML ? `<div class="drawer-footer">${footHTML}</div>` : ""}
  `;
  $("#drawer").classList.add("open");
  $("#drawerOverlay").classList.add("open");
}
function closeDrawer(){
  $("#drawer").classList.remove("open");
  $("#drawerOverlay").classList.remove("open");
}

/* ---------- 筛选 ---------- */
function filterMat(key, value){
  if(key === "keyword"){
    matFilter.keyword = value;
  } else if(key === "status"){
    matFilter.status = value;
  } else if(key === "collector"){
    matFilter.collector = value;
  }
  matPage = 0;
  render();
}

/* ---------- 分页 ---------- */
function pageMat(p){
  matPage = p;
  render();
}
/* C10：筛选栏右侧统一显示「筛出多少 / 共多少」，并提供一键清空（原先只能逐个改回） */
function bankFilterExtras(which, shown, total, active){
  const txt = active
    ? L("筛出 " + shown + " / 共 " + total + " 条", "Filtered " + shown + " of " + total)
    : L("共 " + total + " 条", total + " items");
  return '<div class="mat-filter-extra"><span class="mf-count">' + txt + '</span>'
    + (active ? '<button class="btn sec tiny" onclick="clearBankFilter(\'' + which + '\')">' + L("清空筛选","Clear filters") + '</button>' : "")
    + '</div>';
}
function clearBankFilter(which){
  if(which === "mat"){ matFilter = { keyword:"", status:"", collector:"" }; matPage = 0; }
  else { artFilter = { keyword:"", status:"", creator:"" }; artPage = 0; }
  render();
}

/* ---------- router ---------- */
function render(){
  _bigBarUsed = false;   /* 大档切换条每页只渲染一次 */
  /* 「查看原文」独立视图：不占 step 编号（避免六处同步），优先渲染；
     返回或切换侧边栏步骤时 state.view 会被清掉，不会串台 */
  if(state.view === "srcview"){
    stage.innerHTML=`<div class="wrap">${sArticleSource()}</div>`;
    renderPasteModal();
    return;
  }
  const fns=[s0,s1,s2,s3,sMaterialBank,s4,s5,s6,s7,s9,s12,sArticleBank];
  const ro = state.user && !canOperate(cur);
  const roBanner = ro ? `<div class="ro-banner">${L("只读查看 · 本步骤由「"+ownerLabel(cur)+"」职能操作","Read-only · this step is operated by "+ownerLabel(cur))}</div>` : "";
  stage.innerHTML=`<div class="wrap${ro?" ro":""}">${backBarHTML()}${roBanner}${fns[cur]()}</div>`;
  renderPasteModal();   /* 无原文热点的「粘贴原文」弹窗（state.pendingHot 为空时自动移除） */
  mountHotPeek();       /* 右下「素材预览」面板（state 未选中时自动移除） */
  if(cur===0) renderBank();
  if(cur===1) renderHots();
  if(cur===7) typewriter();
  if(cur===8){
    VALS.forEach((v,i)=>{
      const cols=[$("#vcol"),$("#vcol2")];
      const d=document.createElement("div"); d.className="vcheck on "+v[2];
      d.innerHTML=`<div class="tickbox">${v[2]==="pass"?"✓":"!"}</div><div class="vid">${v[0]}</div><div class="vname">${L(v[1].zh,v[1].en)}</div><div class="state">${v[2]==="pass"?"PASS ":"WARN "}${v[3]}</div>`;
      cols[i%2].appendChild(d);
    });
    showVSum();
  }
}
function showReadingPreviewFull(){
  const g=GEN[state.lvl];
  if(!g||!g.paras){ toast(L("还没有生成内容，请先运行工作流","No content yet — run the workflow first")); return; }
  let cp=0,cl=state.lvl||"B1_2"; const lv=allKeys();
  function r(){
    const P=GEN[cl]&&GEN[cl].paras?GEN[cl].paras:[]; const p=P[cp]||{en:"",zh:""};
    const m=document.getElementById("main"),total=P.length;
    m.innerHTML='<div style="max-width:720px;margin:auto;padding:20px">'+
      '<h2>'+L("阅读预览","Reading Preview")+'</h2>'+
      '<div style="display:flex;gap:8px;margin:12px 0">'+lv.map(function(x){return '<button onclick="switchLvl(\''+x+'\')" style="padding:6px 16px;border-radius:6px;cursor:pointer;background:'+(cl===x?"#E65425":"#eee")+';color:'+(cl===x?"#fff":"#333")+'">'+nkDisp(x)+'</button>';}).join("")+'</div>'+
      '<div style="background:#f8f9fa;padding:20px;border-radius:10px;min-height:200px"><p style="font-size:18px;line-height:1.8">'+p.en+'</p></div>' + navBtns(cp,total) + '</div>';
  }
  r();
  window.switchLvl=function(x){ cl=x; cp=0; r(); };
  window.prevPara=function(){ if(cp>0){ cp--; r(); } };
  window.nextPara=function(){ if(cp<GEN[cl].paras.length-1){ cp++; r(); } };
}
function navBtns(cp,total){ return '<div style="display:flex;justify-content:space-between;margin:16px 0"><button id="prevBtn" '+(cp===0?"disabled":"")+' onclick="prevPara()" style="padding:8px 20px;border-radius:6px;cursor:pointer">'+L("上一段","Prev")+'</button><span style="padding:8px">'+(cp+1)+"/"+total+'</span><button id="nextBtn" '+(cp===total-1?"disabled":"")+' onclick="nextPara()" style="padding:8px 20px;border-radius:6px;cursor:pointer">'+L("下一段","Next")+'</button></div>'; }
renderKpis();
renderLogin();
checkBridge();
loadTaxonomy().then(() => { state.taxoLoaded = true; if(cur === 3 || cur === 1) render(); });
</script>
</body>
