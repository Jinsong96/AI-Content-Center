  state.live.coverBusy = false;
  render();
}
/* 图片 URL → dataURL（绕开图床 1 小时有效期） */
async function urlToDataURL(url){
  try {
    const r = await fetch(url);
    const blob = await r.blob();
    return await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(String(fr.result));
      fr.onerror = rej;
      fr.readAsDataURL(blob);
    });
  } catch(e){ return null; }
}
/* 封面容量保护：localStorage 约 5MB，单张 512 图约 0.55MB。
   超限时从最早的文章开始清封面，清到放得下为止。 */
function pruneCoverQuota(incomingLen){
  try {
    const bank = loadBank();
    let total = incomingLen;
    bank.forEach(a => { if(a.coverDataUrl) total += String(a.coverDataUrl).length; });
    const LIMIT = 3.5 * 1024 * 1024;
    if(total <= LIMIT) return true;
    const withCover = bank.filter(a => a.coverDataUrl).sort((x, y) => (x.createdAt || 0) - (y.createdAt || 0));
    let changed = false;
    for(const a of withCover){
      if(total <= LIMIT) break;
      total -= String(a.coverDataUrl).length;
      delete a.coverDataUrl;
      changed = true;
    }
    if(changed) saveBank(bank);
    return total <= LIMIT;
  } catch(e){ return true; }
}
/* 保存实时封面图到本地 */
function saveCover(){
  const live = state.live || {};
  const dataUrl = live.coverDataUrl;
  const url = dataUrl || live.coverImageUrl;
  if(!url){ toast(L("暂无实时封面图","No live cover yet")); return; }
  const name = "cover-" + String(live.label || "image").replace(/[^\w\u4e00-\u9fa5-]/g, "_").slice(0, 20) + ".png";
  if(dataUrl){
    const a = document.createElement("a");
    a.href = dataUrl; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    toast(L("封面图已保存","Cover saved"));
    return;
  }
  fetch(url).then(r => r.blob()).then(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
    toast(L("封面图已保存","Cover saved"));
  }).catch(() => { window.open(url, "_blank"); });
}

/* 调后端生成4 档 × 英音/美音 音频文件（硅基流动 TTS；后续可换微软 Azure） */
async function genArticleAudio(){
  if(!FEATURES.tts) return null;   /* TTS 已暂停：自动触发点静默跳过 */
  const arts = {};
  allKeys().forEach(k => {
    const g = GEN[k];
    if(g && g.paras && g.paras.length){
      arts[k] = (g.title ? g.title + ". " : "") + g.paras.map(p => (Array.isArray(p) ? p.join(" ") : p)).join(" ");
    }
  });
  if(!Object.keys(arts).length){ toast(L("暂无文章内容","No article content")); return false; }
  if(state.audioPromise) return state.audioPromise;   // 已有在途请求，不重复打 TTS（省钱省时）
  state.audioGenerating = true; render();
  state.audioPromise = (async () => {
    let ok = false;
    try {
      const resp = await fetch(AGENT_REACH_API + "/api/tts/batch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ articles: arts, accents: ["us", "uk"] })
      });
      const j = await resp.json();
      if(j && j.ok && j.audio){
        state.audio = j.audio;
        state.audioMeta = audioMetaFrom(j.meta, j.audio, null);
        const back = backfillBankAudio();          // 音频迟到时补写已入库的文章
        const n = state.audioMeta.count;
        const mt = state.audioMeta;
        toast(n >= 6
          ? L("已生成 6 个音频 · " + mt.model + " · " + (mt.elapsedMs/1000).toFixed(1) + "s（缓存 " + mt.cached + " / 新合成 " + mt.generated + "）",
              "Generated 6 audio files · " + mt.model + " · " + (mt.elapsedMs/1000).toFixed(1) + "s (cached " + mt.cached + " / new " + mt.generated + ")")
          : L("仅生成 " + n + "/6 个音频：" + (mt.error || L("部分档位失败","some levels failed")),
              "Only " + n + "/6 generated: " + (mt.error || "some levels failed")));
        ok = true;
      } else {
        const why = (j && (j.error || j.message)) || L("桥接层未返回音频（" + AGENT_REACH_API + "）","bridge returned no audio (" + AGENT_REACH_API + ")");
        state.audioMeta = audioMetaFrom(j && j.meta, {}, why);
        toast(L("音频生成失败：" + why, "Audio generation failed: " + why));
      }
    } catch(e) {
      const why = L("桥接层未启动（" + AGENT_REACH_API + "）。启动后可在文章库点「重新生成音频」补生成",
                    "bridge not running (" + AGENT_REACH_API + "). Start it, then use \"Regen audio\" in the library");
      state.audioMeta = audioMetaFrom(null, {}, why);
      toast(L("音频生成失败：" + why, "Audio generation failed: " + why));
    } finally {
      state.audioGenerating = false;
      state.audioPromise = null;
      render();
    }
    return ok;
  })();
  return state.audioPromise;
}
/* 音频元信息：全部来自后端上报，前端只做搬运与展示，不自行推断，
   这样文章库能如实说明「生成了几个、用的什么模型、耗时多久、为什么失败」。 */
function audioMetaFrom(meta, audio, err){
  const m = meta || {};
  const n = bankAudioCount({ audio: audio || {} });
  let status;
  if(err) status = "failed";
  else if(n >= 6) status = "ok";
  else if(n > 0) status = "partial";
  else status = "failed";
  const errs = m.errors || [];
  return {
    status: status,
    count: n,
    requested: m.requested || 0,
    model: m.model || "",
    voice: m.voice || "",
    provider: m.provider || "",
    levels: m.levels || [],
    accents: m.accents || [],
    cached: m.cached || 0,
    generated: m.generated || 0,
    failed: m.failed || 0,
    skipped: m.skipped || 0,
    elapsedMs: m.elapsed_ms || 0,
    generatedAt: m.generated_at || Date.now(),
    errors: errs,
    error: err || (errs.length ? String(errs[0].error || "") : "")
  };
}
/* 文章库徽章文案：区分「未生成 / 生成中 / 已生成 / 部分 / 失败」，不再笼统显示"无音频" */
function audioStatusInfo(a, id){
  if(bankAudioBusy === id) return { cls:"gen", text:" " + L("生成中…","Generating…"), tip:L("正在调用 TTS 合成","Calling TTS") };
  const mt = a && a.audioMeta;
  const n = bankAudioCount(a);
  if(mt && mt.status === "failed"){
    return { cls:"fail", text:" " + L("生成失败","Failed"), tip:(mt.error || L("后端未返回音频","No audio returned")) };
  }
  if(n >= 6) return { cls:"ok", text:" 6/6", tip:L("4 档 × 英音/美音 全部就绪","4 levels × UK/US ready") };
  if(n > 0) return { cls:"part", text:" " + n + "/6", tip:L("仅部分生成成功","Partially generated") };
  if(mt) return { cls:"fail", text:" " + L("生成失败","Failed"), tip:(mt.error || "") };
  return { cls:"none", text:" " + L("未生成","Not generated"), tip:L("入库时未生成音频","Not generated when banked") };
}
/* 等待在途音频生成完成（带上限，避免卡住入库流程） */
function waitForAudio(ms){

/* 用浏览器内置语音合成在线朗读（英音 en-GB / 美音 en-US，免费无需 key；分块避免 15 秒截断） */
function speakAccent(accent){
  if(!("speechSynthesis" in window)){ toast(L("当前浏览器不支持在线朗读","Browser does not support speech synthesis")); return; }
  const text = audioText(state.lvl);
  if(!text){ toast(L("暂无文章内容","No article content")); return; }
  if(accentSpeaking){ speechSynthesis.cancel(); accentSpeaking = false; return; }
  accentSpeaking = true;
  const chunks = text.match(/[^.!?]+[.!?]+/g) || [text];
  const prefix = accent === "gb" ? "en-gb" : "en-us";
  const voices = speechSynthesis.getVoices();
  const voice = voices.find(v => (v.lang||"").replace("_","-").toLowerCase().startsWith(prefix)) || voices.find(v => (v.lang||"").toLowerCase().startsWith("en"));
  chunks.forEach((c, idx) => {
    const u = new SpeechSynthesisUtterance(c.trim());
    u.lang = accent === "gb" ? "en-GB" : "en-US";
    if(voice) u.voice = voice;
    u.rate = 0.95;
    if(idx === chunks.length - 1) u.onend = () => { accentSpeaking = false; };
    speechSynthesis.speak(u);
  });
}

    return { cat:p[0], catZh:(c ? c.zh : p[0]), catEn:(c ? c.en : p[0]),
             tag:p[1], tagEn:tagEnOf(p[0], p[1]) };
  });
  const free = (state.tagFree || []).slice();
  const cognitive = state.tagCognitive || "全年龄";
  const first = content[0] || null;
  const af = defaultAngleFmt(first ? first.cat : "culture", first ? first.tag : "");
  return {
    /* 新三层结构 */
    content: content, free: free, cognitive: cognitive,
    /* 兼容字段：封面/视觉等旧代码按第一个内容标签的类别取 */
    theme: first ? first.cat : "culture",
    sub: first ? first.tag : "",
    subEn: first ? first.tagEn : "",
    angle:af.angle, angleEn:af.angleEn, fmt:af.fmt, fmtEn:af.fmtEn
  };
}
/* 选题候选（推荐排序）：热点预设 tags 优先，再叠加正文关键词匹配 */
function topicCandidates(){
  const out = []; const seen = new Set();
  /* 优先用热点自带的 theme/sub（后端已按中文品牌词精准分类，避免前端再猜错） */
  const h = curHot();
  if(h && h.theme && DIRS[h.theme]){
    const d = DIRS[h.theme];
    const si = d.subs.indexOf(h.sub);
    const sub = (si >= 0) ? h.sub : (h.sub || d.subs[0]);
    const subEn = (si >= 0) ? d.subsEn[si] : (h.sub ? (d.subsEn[si] || h.sub) : d.subsEn[0]);
    const key = h.theme + "|" + sub;
    if(!seen.has(key)){ seen.add(key); out.push({theme:h.theme, sub:sub, subEn:subEn, score:99}); }
  }
  const m = matchTopics(curMaterialText());
  for(const c of m){ const key = c.theme + "|" + c.sub; if(!seen.has(key)){ seen.add(key); out.push(c); } }
  return out;
}
function topicKey(theme, sub){ return theme + "|" + sub; }
/* 当前生效的选题集合：用户手动多选 > 智能推荐 top（未命中则兜底书籍机构） */
function curTopicSel(){
  if(state.topicSel && state.topicSel.length) return state.topicSel;
  const cands = topicCandidates();
  if(cands.length) return [{theme:cands[0].theme, sub:cands[0].sub, subEn:cands[0].subEn}];
  return [{theme:"culture", sub:"书籍机构", subEn:"Books & institutions"}];
}
/* 多选切换：点击 chip 增/删选中；全部取消则回到智能推荐 */
function toggleTopic(theme, sub, subEn){
  if(!state.topicSel) state.topicSel = curTopicSel().slice();
  const key = topicKey(theme, sub);
  const idx = state.topicSel.findIndex(t => topicKey(t.theme, t.sub) === key);
  if(idx >= 0) state.topicSel.splice(idx, 1);
  else state.topicSel.push({theme, sub, subEn});
  if(!state.topicSel.length) state.topicSel = null; resetTags();
  render();
}
/* 当前素材的中国文化术语（KB4 示例，从热点标签/事实卡提取关键名词） */
function curTerms(){
  const h = curHot();
  if(h && h._terms && h._terms.length) return h._terms;
  /* 无预设术语时，从事实卡首句提取专名/关键词作为术语示例（过滤月份/带撇号等噪声） */
  const facts = curFacts();
  const t0 = facts.length ? facts[0].stmt : curMaterialText();
  const stopRe = /^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec|The|A|An|In|On|With|Of)$/i;
  const words = (t0 || "").replace(/[.,;:()"']/g," ").split(/\s+/).filter(Boolean);
  const seen = new Set();
  const picks = [];
  for(const w of words){
    if(/^[A-Z][a-z]{2,}$/.test(w) && !stopRe.test(w) && !seen.has(w)){ seen.add(w); picks.push(w); }
    if(picks.length >= 4) break;
  }
  if(!picks.length) return [];
  return picks.map(w => [w, "「" + w + "」"]);
}

/* 后端桥接层地址 —— 可配置，工程化交付时改这里即可，业务逻辑无需改动。
 *
 * 优先级：localStorage 覆盖 > URL 参数 ?api= > window.WB_API_BASE > DEFAULT_API_BASE
 *
 *  注意：同源部署时服务端会注入 window.WB_API_BASE=""（空串=同源）。
 *    空串是合法值，判断必须用 typeof === "string"，不能用 if(window.WB_API_BASE)
 *    —— 否则空串被判为假，会错误回落到 DEFAULT_API_BASE，导致桥接永远不可达。
 */
const DEFAULT_API_BASE = "http://127.0.0.1:8787";
function readApiBase(){
  const norm = v => String(v || "").trim().replace(/\/+$/, "");
  try {
    const qs = new URLSearchParams(location.search).get("api");
    if(qs) return norm(qs);
  } catch(e){}
  /* 服务端注入（含空串=同源）优先于 localStorage：线上部署时强制同源，
     避免本机调试残留的 wb_api_base_v1 覆盖线上地址，导致跨设备打开线上链接时连不上桥接层。 */
  if(typeof window !== "undefined" && typeof window.WB_API_BASE === "string") return norm(window.WB_API_BASE);
  try {
    const saved = localStorage.getItem("wb_api_base_v1");
    if(saved) return norm(saved);
  } catch(e){}
  return DEFAULT_API_BASE;
}
/* 运行时可切换（换机器/指向新后端时用）；传空串则恢复默认 */
function setApiBase(url){
  const norm = v => String(v || "").trim().replace(/\/+$/, "");
  const next = norm(url) || DEFAULT_API_BASE;
  AGENT_REACH_API = next;
  try {
    if(norm(url)) localStorage.setItem("wb_api_base_v1", next);
    else localStorage.removeItem("wb_api_base_v1");
  } catch(e){}
  state.bridgeOk = null;
  checkBridge();
  return next;
}

   拉取失败时退回上次缓存并**明确报错**，绝不静默回退到一份内置旧词表。 */
let TAXO = null;
let taxoError = null;
async function loadTaxonomy(force){
  if(TAXO && !force) return TAXO;
  try {
    const r = await fetch(AGENT_REACH_API + "/api/tags/taxonomy", { mode: "cors" });
    if(!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if(!j || !j.ok || !Array.isArray(j.categories) || !j.categories.length) throw new Error(L("词表为空","empty taxonomy"));
    TAXO = j;
    taxoError = null;
    try { localStorage.setItem("wb_taxonomy_v1", JSON.stringify(j)); } catch(e){}
    syncDIRS();
    return TAXO;
  } catch(e){
    try {
      const cached = JSON.parse(localStorage.getItem("wb_taxonomy_v1") || "null");
      if(cached && cached.categories && cached.categories.length){ TAXO = cached; syncDIRS(); }
    } catch(e2){}
    taxoError = L("桥接层不可达（" + AGENT_REACH_API + "）","bridge unreachable (" + AGENT_REACH_API + ")");
    return TAXO;
  }
}

/* AI 提取三层标签：结果只作为「建议」写入，由人工确认与删减 */
async function extractTagsAI(){
  /* 取数：正文优先；Hacker News 等源只有标题没有正文/摘要时，降级用标题兜底，
     并明确提示精度有限（绝不能假装有完整素材）。 */
  let material = curMaterialText() || "";
  const h = curHot();
  const titleOnly = !material;
  const titleFallback = (h ? ((h.topic || "") + " " + (h.cn || "")) : (curMaterialLabel() || "")).trim();
  if(titleOnly && titleFallback) material = titleFallback;
  state.tagTitleOnly = titleOnly;
  if(!material){ toast(L("暂无素材内容，无法提取标签","No material to extract tags from")); return; }
  state.tagExtracting = true; render();
  try {
    const r = await fetch(AGENT_REACH_API + "/api/tags/extract", {
      method: "POST", mode: "cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ material: material, title: curMaterialLabel() || "" })
    });
    const j = await r.json().catch(() => null);
    if(r.ok && j && j.ok){
      state.tagAIContent = j.content || [];
      state.tagFreeCands = j.free || [];
      state.tagMeta = { dropped: j.dropped || [] };
      state.tagWarn = j.warning || "";
      /* AI 建议默认选中，人工再删减 */
      state.tagContent = (j.content || []).map(c => tagKeyOf(c.cat, c.tag));
      state.tagFree = (j.free || []).slice();
      state.tagCognitive = j.cognitive || state.tagCognitive || "全年龄";
      (j.content || []).forEach(c => { state.tagOpenCats[c.cat] = true; });
      toast(L("已提取：" + (j.content||[]).length + " 个内容标签、" + (j.free||[]).length + " 个自由标签（可删减）",
              "Extracted: " + (j.content||[]).length + " content tags, " + (j.free||[]).length + " free tags (editable)"));
    } else {
      state.tagWarn = (j && j.error) || L("提取失败：HTTP " + r.status,"Extraction failed: HTTP " + r.status);
      toast(state.tagWarn);
    }
  } catch(e) {
    state.tagWarn = L("提取失败：桥接层不可达（" + AGENT_REACH_API + "）","Extraction failed: bridge unreachable (" + AGENT_REACH_API + ")");
    toast(state.tagWarn);
  }
  state.tagExtracting = false; render();
}

const DIFY_WF_CFG = {

/* 统一 Dify 工作流调用：优先走桥接层同源代理（/api/dify/workflows/run，稳定，绕开浏览器直连
   api.dify.ai 的 UA/频率风控与网络抖动——直连会偶发 fetch 报 "Failed to fetch"），
   代理不可达或失败时回退直连公网。返回 Dify 原始 JSON（data.data.status / code 结构不变）。 */
async function difyCall(wf, inputs, user, signal){
  const cfg = DIFY_WF_OBJ[wf] || AIWF;
  const envName = (DIFY_WF_CFG[wf] || DIFY_WF_CFG.main).env;
  /* 1) 桥接层同源代理（本地 8787 / 线上 Railway 同源） */
  try {
    const r = await fetch(AGENT_REACH_API + "/api/dify/workflows/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ wf: wf, inputs: inputs, response_mode: "blocking", user: user }),
      signal: signal,
    });
    const j = await r.json();
    if(j && j.ok === false){
      if(/missing upstream api key/i.test(j.error || "")){
        throw new Error(L("服务端未配置 " + envName + " 密钥，请在部署平台（Railway → Variables）填入后重新部署。","Server missing " + envName + " key — add it in Railway → Variables and redeploy."));
      }
      return { code: "upstream_error", message: (j.error || "upstream error") + (j.detail ? " · " + String(j.detail).slice(0,200) : "") };
    }
    if(j && (j.data || j.code)) return j;   /* Dify 原始结构 */
  } catch(e){
    if(e && e.name === "AbortError") throw e;   /* 取消：原样抛给上层 */
    console.warn("[ReadPal] 桥接层代理不可用，回退直连 Dify：", e && e.message);
  }
  /* 2) 直连兜底（需前端持有密钥） */
  if(!cfg.appKey){
    throw new Error(L("AI 未运行：既无桥接层、又缺 " + envName + " 密钥。请启动 backend/agent_reach_bridge.py，或在 Railway → Variables 填入密钥后重新部署。","AI not running: no bridge and no " + envName + " key. Start backend/agent_reach_bridge.py, or add the key in Railway → Variables."));
  }
  const r2 = await fetch(cfg.apiBase + "/workflows/run", {
    method: "POST",
    headers: { "Authorization": "Bearer " + cfg.appKey, "Content-Type": "application/json" },
    body: JSON.stringify({ inputs: inputs, response_mode: "blocking", user: user }),
    signal: signal,
  });
  return await r2.json();
}

const STORIES = [{"id": "第一辑-传统节日__Spring_Festival", "book": "第一辑 · 传统节日", "title": "Spring Festival · 春节", "text": "Spring Festival\n1. Why do people think Chinese New Year falls on different\ndates each year?\n2. How do the colour red and firecrackers play an important\nrole in Chinese New Year?\n3. How might Chinese New Year be similar to Christmas in\nWestern cultures?\n\nFiX#t7 ot\nIt's time to decorate the house because it's that time of year again\nChinese New Year. Unlike the fixed date of January 1st in Western\ncultures, Chinese New Year varies each year, sometimes in January, or\nFebruary. Why is that? Today, we'll explore this unique festival, starting\nwith its unusual calendar dates. in particular, the Chinese lunisolar\ncalendar, which is unlike the Gregorian calendar used in most Western\ncountries. Discover the rich traditions from ancient legends like the\nNian beast to the vibrant customs of today. Join us as we get to know\nthe special meanings and rituals of Chinese New Year and compare\nthem to Western celebrations. It's a journey through time and tradition,\nrevealing how China welcomes a new year in its own unique way.\nMat\nOK, so we are talking about Chinese New Year, or Spring\nFestival.\nNow, of course, in my culture (I'm British), we have the important\nconcept of New Year. And I think for most of Western Europe,\nJanuary 1st is New Year's Day, so New Year's Eve is always the\n31st of December. And that's every year. This never changes. But\nI've noticed that Chinese people celebrate Chinese New Year on\na different date\nevery year, sometimes in January or sometimes\nin February. So, that's my first question: why does Chinese New\nYear fall on different dates each year?\nJocelyn OK, so the Western European New Year follows the solar\ncalendar-the solar calendar follows the sun and always has 365\ndays. All the dates on the solar calendar always fall on the same\ndate; that's why Christmas Day is always on December 25th. And\nthe last day of the year is always on December 31st, and the first\n\nday of the year- New Year's Day-is always on January 1st.\nChinese people traditionally use a different calendar system the\nterm \"lunar calendar\" is used sometimes, in some situations, but\nit can be misleading. Let's think about why. The Chinese calendar\nis not only lunar; it's a \"lunisolar\" system (that means a mix of\nboth lunar and solar). It does follow the moon's phases, but it\nalso uses the sun's position to align with the seasons. The lunar\ncalendar has about 354 days, but the Chinese calendar adjusts\nthis, with something called leap months, and this keeps it in sync\nwith the solar year. This means that Chinese New Year falls on\ndifferent dates in the solar calendar each year, but it's always\naround late January to February.\nMat\nOK, so that's the difficult part done. I think I understand\n\nmiX#t7 t\nthat. Now, let's think about the meaning of Spring Festival, or\nChinese New Year. Now in Western Europe, I think most countries\nand cultures have different ways\nof celebrating New Year. We do\ndifferent things on New Year's Eve and different things on New\nYear's Day, with some different customs. But\nthink the festival\nmeans the same thing. It's just the end of one calendar\nyear,\nthe\nend being December 31st, and then the start of the next, the new\ncalendar year, January 1st. So other than the idea of starting a\nnew year, the beginning of a new year, does Chinese New Year\nhave any interesting or special meaning?\nJocelyn There are many traditional folk tales that tell us something\nabout the origin of Chinese New Year. One very popular story\ntalks about a mythical beast called Nian. Nian lived under the sea\nand in the mountains. Every year around the start of spring, Nian\nliked to come to the villages and steal all the villagers' food and\ncrops. And sometimes, the beast would even eat people the\nvillagers and their children.\nSo, in ancient times, people were afraid of the beast around the\ntime of Spring Festival. Nian was afraid of three things-the\ncolour red, fire, and loud noises. That might explain why today,\npeople decorate their homes with red. We light lanterns, and set\noff fireworks to safely enter the new year, and to protect ourselves\nfrom Nian or bad luck.\nAnd also it's interesting that the Chinese character \"# (Nian)\"\nmeans \"year\" or \"new year,\" as well as the name of the beast.\n\nFiX#7\nMat\nOK, now that sounds quite scary-a\nmonster who\neats people. So what other rituals or traditions do\nyou\nhave for\nChinese New Year's Eve or New Year's Day? Tell me about some\nof the most important rituals or traditions.\nJocelyn\nI think there are many rituals and t"}, {"id": "第一辑-传统节日__Lantern_Festival", "book": "第一辑 · 传统节日", "title": "Lantern Festival · 元宵节", "text": "Lantern Festival\n1. Lanterns can be made in many different shapes. How\nmany shapes do you know?\n2. How many versions of sticky rice balls are there?\n3. Can you solve this riddle? \"The more\nyou take, the more\nyou leave behind. What am T?\"\n\nLantern Festival\nGet ready to explore the fun world of the Lantern Festival! This bright\ncelebration happens on the 15th day of the first month of the Chinese\ncalendar and is an exciting part of the Spring Festival. Join us as\nwe uncover its rich history. You'll discover wonderful customs, like\nmaking beautiful red lanterns and enjoying sweet sticky rice balls\ncalled tang yuan or yuan xiao, which stand for family unity. We'll also\nchallenge you\nwith fun lantern riddles that make the festival even\nmore exciting. Come and enjoy the light and happiness of the Lantern\nFestival with us!\nMat\nHello again. Today I've got some questions about another\ntraditional Chinese festival. We're talking about Lantern Festival.\nSo my first question is this: in Spring Festival, I see lots of red\nlanterns everywhere. People hang red lanterns in their homes and\nin the streets. So, is Lantern Festival\nis it the same as Spring\nFestival, or is it part of Spring Festival?\nJocelyn\nNo, it's related to New Year, but it's different. It's actually\npart of the Spring Festival. Lantern Festival comes on the 15th\nday of the first month of the Chinese calendar and remember\nthat's not the Western solar calendar. So, according to the\nWestern calendar, it's on a different date each year. So it comes\naround two weeks after the main New Year celebrations. So on\nthe Western calendar, Lantern Festival is usually in February or\nearly March.\n\nMat\nAlright, that's easy. So, we know when this festival is\ncelebrated, but what's the story behind it? What's the history? Is\nit just part of Chinese New Year, or does it have a different story-\na separate history?\nJocelyn Well, Lantern Festival dates back over 2,000 years to\nthe Western Han Dynasty. And actually, there are some different\nhistorical accounts and some different opinions about the origin\nof Lantern Festival.\nIn one popular story, Emperor Wen went into town after Chinese\nNew Year and mixed with the common local people. And he\nencouraged them to hang lanterns as a sign of peace and\nprosperity.\n\nG DUSTS\n33 AS\nFaRE L\nA % 7\n\nFiX#t7 t\nIn another legend, the festival comes from a time when monks in\nthe temple made lanterns on the 15th day of the New Year.\nSo actually, there are so many stories and legends about the\norigin of the festival, and because it's so old over 2,000 years\nold we can't be sure which one is actually true.\nMat\nOK then- so we have some different stories behind the\norigin of Lantern Festival. My next question is about the customs,\ntraditions, and rituals. So, what do people usually do during or on\nLantern Festival?\nJocelyn Traditionally, during Lantern Festival, people liked\nto make lanterns. Children made red lanterns in the shape of\nanimals, like dragons or birds; these days, maybe fruits, even\naeroplanes. These lanterns were usually made from pieces of\nbamboo and also red\npaper.\nNowadays, some people still make lanterns at home, but a lot\nof people buy ready-made lanterns. In the days around Lantern\nFestival, it's easy to buy lanterns in the street or in shops. These\nlanterns are quite fancy, and they have beautiful designs, and\nthey even have battery-powered lamps inside.\nSo, it's quite common to see children walking around with\nlanterns at this time of the year.\n\nMat\nI think you can probably guess my next question. We\nare talking about a traditional Chinese festival, so I'm sure there\nmust be some special food that you eat at this time of year or on\nthis particular day.\nJocelyn Yes, of course, you're right. Every Chinese festival has\nsome important food connection.\nDuring Lantern Festival, we eat a kind of rice ball. It's called tang\nyuan in Southern China or ruan xiao in Northern China. It's a ball\nmade of sticky rice, and it has some kind of soft, sweet centre\nmade from things like red bean paste, sesame paste, or even a\nkind of peanut butter. Actually, there are many different versions\nin the northern part of China, in the southern part of China,\nin different provinces, and even in different cities-there are\n\nFiX#7\ndifferences. And they can be boiled, fried, or steamed, and each\nhas its own special flavour. But they are quite similar in shape and\ntaste, so most Chinese people see them as the same thing-with\nregional differences.\nMat\nOK-that's interestin"}, {"id": "第一辑-传统节日__Qingming_Festival", "book": "第一辑 · 传统节日", "title": "Qingming Festival · 清明节", "text": "Qingming Festival\n1. How do you think honouring ancestors during a festival\ncan strengthen family bonds?\n2. Why might people burn paper replicas of everyday items\nlike houses or cars during a festival?\n3. Why might cleaning and maintaining graves be an\nimportant tradition for families during a festival?\n\nFIXi#7 bU\nIt's a very old festival with deep-rooted traditions and significance.\nThis important Chinese holiday, also known as Tomb-Sweeping Day,\nis a time for honouring ancestors and enjoying the arrival of spring.\nBut what exactly does Qingming mean, and what are the customs\nassociated with this festival? Join us as we explore the origins,\nrituals, and cultural importance of Qingming Festival, shedding light\non its deep-rooted traditions and how it brings families together to\nremember and respect their loved ones.\nMat\nHello, and welcome to another episode of China Lifestyle\nJourneys. Today, we're talking about the Qingming Festival. Now,\nT know this is an important traditional Chinese holiday with deep\ncultural significance. But\nmust confess, I really don't know much\nmore than that. I don't even think I know the English name of this\nfestival. So let's start there, Jocelyn. The name of the festival-\nhow does it best translate into English?\nJocelyn Good question, Mat. The name of the festival, Qingming,\ncan be translated to \"Pure Brightness\" or \"Clear and Bright.\"\nThis translation reflects the seasonal aspect of the holiday,\nwhich falls during the period of clear skies and the greenery\nthat marks the arrival of spring. So I guess we could say that\nthe name represents the clear and bright weather that typically\naccompanies this time of year in China.\nMat\nSo it sounds like it's just a festival to celebrate the\narrival of spring, a celebration of good weather and all the things\nwe associate with spring. Is that what it's about?\n\nQingming Festival\nJocelyn Well, not exactly. While Qingming Festival does coincide\nwith the arrival of spring and the favourable weather it brings,\nit's more than just a celebration of the season. This holiday has\ndeep cultural roots in China and serves several\npurposes.\nOne of\nthe primary aspects is honouring one's ancestors by visiting their\ngraves, cleaning tombstones, and making offerings. It's a time for\nfamilies to come together, pay their respects, and remember their\nloved ones. As well as this, because it's a national holiday, people\noften take advantage of the pleasant weather to go outdoors,\nenjoy nature, and participate in various recreational activities like\nflying kites. So going back to the name of the festival, in English,\nQingming Festival is usually known as Tomb-Sweeping Day\nbecause this is the most important historical tradition associated\nwith this holiday.\n\nMat\nOK, that's interesting. So do people actually sweep the\ntombs of their ancestors? I mean, like, physically. Because when\nI hear the words \"tomb-sweeping,\"\npicture a person with some\nkind of broom or brush actually sweeping away dust or leaves. Is\nthis what happens?\nJocelyn Yes, Mat, they do. Tomb-sweeping is a central tradition\nduring Qingming Festival. Families visit the gravesites of their\nancestors to clean and maintain them as a sign of respect. This\nincludes sweeping away leaves and dust, as you said, removing\nweeds, tidying up the area, and sometimes repainting or repairing\ntombstones. It's a way to show reverence and ensure that\nancestors' resting places are well-kept. But it's not just about\ncleaning; people also make offerings like food, incense, and paper\n\nQingming Festival\nmoney, believing that these items benefit their ancestors in the\nafterlife. Some even burn paper replicas of everyday items, like\nhouses or cars, as symbolic gifts. Overall, it's a heartfelt way to\nconnect with one's heritage and express gratitude to those who\ncame before us.\nMat\nAh, I've never heard of this before. You just mentioned\nthe\npaper money\nand paper replicas of everyday items. I think I've\nseen these items being sold in shops. They always fascinated me.\nSo tell me a bit more about these.\n\nFiX#t7 t\nJocelyn Yes, as you said, Mat, there are shops that specialise in\nselling paper money and paper replicas for these offerings. These\nplay a significant role in Qingming traditions. People believe that\nburning paper money and paper replicas of material goods can\nsend these to people who might still need all of those things in\nthe afterlife. These are seen as symbolic gifts intended to provide\ncomfort and luxury to the ancestors. We don'"}, {"id": "第一辑-传统节日__Dragon_Boat_Festival", "book": "第一辑 · 传统节日", "title": "Dragon Boat Festival · 端午节", "text": "Dragon Boat Festival\n1. How do old stories about a poet and dragon-shaped\nboats combine to give us a special festival?\n2. Why do people in China throw snacks into rivers during\nthe Dragon Boat Festival?\n3. There's a special food linked to this festival. It's called\nzongzi. How is it made, and what does it taste like?\n\nDragon Boat Festival\nIt's called the Dragon Boat Festival, and you might wonder, is it about\ndragons? Boats? Or maybe a combination of both? We're taking a\nlook at the origins and traditions of this unique Chinese celebration,\nincluding the story of a famous poet, the thrilling dragon boat races,\nand a unique, delicious snack with a very special connection to this\nfestival.\nMat\nHello and welcome back once again to another episode.\nToday we're talking about the Dragon Boat Festival, a traditional\nholiday celebrated in China. Now, I can remember when\nfirst\ncame to China, heard people talking about this festival, and I\nremember thinking, what is this festival? Is it about a dragon in\na boat? Is it a dragon and a boat, or is it a boat in the style of a\ndragon? So, Jocelyn, can you answer this first question for me?\nJocelyn Yes, the Dragon Boat Festival, or duan wu jie, actually\ntakes its name from a special type of boat related to the festival.\nIt's a long, thin boat that looks like a dragon when it's moving\nthrough the water. So that gives us the name Dragon Boat\nFestival.\nMat\nSo it's a festival about boats, named after a type of\nboat? That doesn't sound very traditional. Surely there's more to\nthe story than a boat that looks like a dragon.\nJocelyn Yeah, of course, there is. Let me tell\nyou\nthe rest of the\nstory. So, let's start with the basics. The holiday is celebrated on\nthe 5th day of the 5th month of the Chinese calendar (remember-\n\nsangera\nSh\nthe Chinese calendar is not directly mapped to the Western\ncalendar and the dates move around a bit each year). The date is\nusually somewhere around late May or in June. It's a public holiday\nin China and is one of the most widely celebrated festivals in the\nyear.\nThe festival has a long history dating back over 2,000 years,\nand it's traditionally been a time to honour the memory of a famous\nChinese poet named Qu Yuan.\nMat\nAh, so it's about a poet, not about a boat. Or maybe it's\nabout a poet\nwho had a boat and wrote poems about boating?\nJocelyn Okay, well, that's\ngood guess, but no, not really. Ou\nYuan was a poet and politician who lived in ancient China during\nthe Warring States period. He was a loyal patriot who was very\nvocal and active about creating\nbetter and more honest society.\nUnfortunately, his ideas were not well received by the ruling\npowers, and he was eventually exiled from his home state of Chu\n(Chu is an old name for the part of China that is now the area\n\nDragon Boat Festival\naround Hubei Province). So, while he was in exile, Qu Yuan wrote\nmany\nfamous poems, including one called Li Sao, which means\n\"Encountering Sorrow.\" And the poem expresses Qu Yuan's love\nfor his homeland and his sadness at being separated from it.\nMat\nThat's a really interesting story. But where does the boat\ncome into the story? Did he escape on a boat or something like\nthat?\nJocelyn Okay, nice idea, but not really. Well, according to the\nlegend, when Qu Yuan learned that his homeland had been\nconquered by a neighbouring state, he drowned himself in the\n\nmiX#t7 t\nMiluo River as a form of protest (so in many ways, it's kind of a tragic\nstory). The local people who admired him so much raced their boats\nto save him, but they were too late. The hero of our story drowned\nin the river. To commemorate Qu Yuan's sacrifice, people began\nholding dragon boat races on the anniversary of his death, which is\nbelieved to be the 5th day of the 5th month of the Chinese lunisolar\ncalendar (that's why the festival falls on that date). And they also\nthrow zongzi into the water to commemorate Qu Yuan.' These are\nsticky rice dumplings wrapped in leaves. And the people thought\nthat the fish might eat those dumplings, so they wrapped them in\nbamboo leaves- just to stop the fish eating them.\nMat\nWow, now that's really fascinating. Tell me more about\nthese dumplings. What did you call them? Zongzi?\nJocelyn Yeah. Well, they are made of sticky rice that has been\nstuffed with different fillings, like meat or sweet bean paste. Then,\nthey are wrapped in bamboo leaves, tied with string, and boiled\nor steamed for a while. And the result is a delicious and fragrant\ndumpling that is perfect for a meal or a"}, {"id": "第一辑-传统节日__Qixi_Festival", "book": "第一辑 · 传统节日", "title": "Qixi Festival · 七夕节", "text": "Qixi Festival\n1. Have you ever heard of Chinese Valentine's Day?\n2. Do you think it's different from the more globally\ncelebrated Valentine's Day on February 14th?\n3. How do\nyou think modernization might influence the\nway\nancient festivals are celebrated today?\n\nmiX#t7 t\nTime for something romantic! Everyone knows Valentine's Day ... but\nwhat is Chinese Valentine's Day? This thing is called the Qixi Festival.\nAre they the same? Well, not quite! While both celebrate love, they\neach have their unique stories, customs, and dates. We'll uncover the\nromantic legends behind them, explore the charming traditions like\nsecret love letters and wish-making, and reveal how modernization\nhas shaped their celebrations. Plus, there's a sweet treat waiting for\nyou at the end. Yummy!\nMat\nHello and welcome to another episode of China Lifestyle\nJourneys. And today we are talking about something that I guess\nmost people know about. And that's Valentine's Day, or should\nI say we are going to talk about two important dates in the\ncalendar, Valentine's Day and something called the Qixi Festival.\nSo, first of all, I think a good place to start is with the question: is\nthe Qixi Festival the same as Valentine's Day?\nJocelyn Thank you, Mat. Yes, that's a good question to start with.\nSo, both the Qixi Festival and Valentine's Day are celebrations of\nlove. They do have some differences. The Qixi Festival is sometimes\ncalled Chinese Valentine's Day, and I think this can cause some\nconfusion because it's actually celebrated on the seventh day of\nthe seventh month in the Chinese calendar (which is usually around\nthe month of August), whereas Valentine's Day is in February. The\nQixi Festival has its own unique customs, traditions, and cultural\nsignificance, so it's quite misleading to call it \"Chinese Valentine's\nDay,\" actually. So, while they both share some similarities on the\ntheme of love, they have distinct origins, customs, and symbolism.\n\nOixi Festival\nSo, in short, they are two quite separate and distinct celebrations.\nMat\nOK, so now we know that these are two separate things,\nreally quite different. So, let's start with the origins.\nknow that\nthe European Valentine's Day comes from both Christian and\nancient Roman traditions. It's a combination of both.\nthink it's\nnamed after a saint, Saint Valentine, but I remember reading\nsomewhere there's actually more than one Saint Valentine-\nprobably about four so nobody really knows the story behind\nthe celebration of Valentine's Day because there are many\ndifferent versions of the same story. So, Jocelyn, tell me something\nabout the origins of the Qixi Festival.\nJocelyn OK. The origins of the Qixi Festival can be traced back to\nancient Chinese folklore. The festival is based on an interesting\nlegend about two characters, Niulang (the Cowherd) and Zhinv\n(the Weaving Maid).\nThe story goes that a warm-hearted cowherd called Niulang, who\nlost his parents and led a hard life with an old ox, fell in love with\na girl named Zhinv, a weaving maid who escaped from heaven\nbecause all the strict rules there made her life dull. So, in the\nstory, they got married, and soon had two children, and lived\ntogether happily for a few years.\nHowever, Zhinv's mother, the Empress of Heaven, was quite angry\nto find that her daughter had married a simple and poor human\nand sent soldiers to fetch her back.\n\nFiX#t7 t\nThen Niulang tried to go to heaven to rescue Zhinv, but they were\nseparated by the giant river (which is actually the Milky Way),\nand they could only meet once a year on the seventh day of the\nseventh month, and that's why the Qixi Festival falls on this day.\nMat\nWow, it's quite a romantic story, which makes sense,\nreally, because it's a romantic festival. Now, obviously, on\nValentine's Day, couples buy gifts for each other; they go on\ndates. And I remember when I was a teenager, there was a special\nValentine's Day ritual. If you\nhad a crush on someone but they\ndidn't know because you hadn't told them, you bought a romantic\nValentine's card, you wrote a simple message such as \"Be my\nvalentine,\" but you didn't sign your name. It was like a secret\n\nlove letter, a mystery. It was like sending a message to someone\nsaying \"Someone likes you,\" but it was not signed, so they never\nknew who. So, are there any similar traditions or rituals for the\nQixi Festival?\nJocelyn Traditionally, in the past, one popular custom was for\nunmarried women to demonstrate their needlework skills by\ncreating intricate handicrafts, such as em"}, {"id": "第一辑-传统节日__Mid-Autumn_Festival", "book": "第一辑 · 传统节日", "title": "Mid-Autumn Festival · 中秋节", "text": "Mid-Autumn Festival\n1. What kind of stories or legends might be told about the\nmoon in different cultures?\n2. What special foods do you\nthink people might eat during\na festival celebrating the moon? Why?\n3. How do you\nthink ancient people might have used the full\nmoon to mark important events or traditions?\n\nMid-Autumn Festival\nWe're celebrating the Mid-Autumn Festival, a tradition that's 2,000\nyears old. This festival, marked by the full moon on the fifteenth day\nof the eighth month in the Chinese calendar, symbolises unity and\nfamily reunion. We explore the significance of the moon's beauty, tell\nthe legendary tale of Chang'e, the Moon Goddess, and feast on some\ndelightful mooncakes. Let's go on a lunar cake adventure!\nMat\nHello and welcome again to another episode of China\nLifestyle Journeys. As usual, in today's episode, we will be looking\nat one unique and interesting aspect of Chinese culture. Now, as\nyou can tell from the episode title, today we're talking about Mid-\nAutumn Festival. Now, personally, I've got to admit that I don't\nknow much about this festival, except that it's in the autumn (in\nthe middle of autumn,\nthink-because of the name), and on this\nfestival, I know that people eat mooncakes. So I guess that will\nbe the best place to start with the origins. So, Jocelyn, tell me\nsomething about the origins of this festival.\nJocelyn Sure, Mat. The Mid-Autumn Festival has its origins\nrooted in ancient Chinese traditions and beliefs. It dates back\nover 2,000 years and is closely tied to agricultural practices and\nthe Chinese calendar. The festival is celebrated on the fifteenth\nday of the eighth month in the Chinese calendar, when the moon\nis believed to be at its fullest and brightest. It was originally a\ntime for people to give thanks for a successful harvest and to\npray\nfor good fortune. Over time, it has evolved into a celebration\nof family reunion and the appreciation of the moon's beauty. The\nfestival has deep cultural significance and holds a special place in\n\n1 1 E\n\nMid-Autumn Festival\nChinese folklore and traditions.\nMat\nOK, so it's linked to the Chinese calendar, but you just\nmade a point about \"the appreciation of the moon's beauty\"\nisn't the moon the same at any time of the year? Is the moon\nmore beautiful during this festival? And you know, what's the\nsignificance of the moon in this particular Mid-Autumn Festival?\nJocelyn OK, let me explain. While the moon itself may not\nphysically change in its beauty throughout the\nyear, its symbolism\nand significance during the Mid-Autumn Festival are what make it\nspecial. The full moon during this festival is seen as a symbol of\n\nmiX#t7 t\nunity, completeness, and family reunion. It represents harmony\nand serves as a reminder of loved ones who may be far away.\nThe moon's round shape also signifies prosperity and good luck.\nDuring the festival, families and friends gather to admire the\nmoon together, appreciating its serene beauty and using it as\na focal point for storytelling, poetry, and heartfelt wishes. The\nmoon holds deep cultural and emotional significance, fostering a\nsense of connection and warmth among people.\nMat\nOh right, I see. Actually, you've just reminded me. I think\nI remember story about the moon, something about a moon a\ngoddess, some beautiful goddess who lived in the moon. Does\nthat story have any connection with this festival?\nJocelyn Well remembered, Mat. You're actually right. You're\ntalking about the popular Chinese legend of Chang'e, the\nMoon Goddess. According to the ancient legend, Chang'e was\na beautiful woman who consumed a special elixir to make her\nimmortal (to live forever). She drank the special elixir and floated\nup to the moon, where she still lives to this day. During the Mid-\nAutumn Festival, people pay tribute to Chang'e by offering her\nfruits, incense, and mooncakes. The story of Chang'e adds a\ntouch of magical charm and mythology to the festival, deepening\nits cultural significance. It's a great story that has been passed\ndown through generations and continues to be cherished during\nthe Mid-Autumn Festival.\n\nMat\nAh, mooncakes, finally we get to mooncakes. This\nis going to be my favourite part of the episode because we\nare talking about cakes. Now, I've had mooncakes on many\noccasions, and I always think they are quite varied. There are\nso many different fillings. Some,\nthink, are delicious; others\nnot really for me. So, before we talk about the fillings, what's the\nstory behind mooncakes?\nJocelyn I think there are many"}, {"id": "第一辑-传统节日__Double_Ninth_Festival", "book": "第一辑 · 传统节日", "title": "Double Ninth Festival · 重阳节", "text": "Double Ninth Festival\n1. Why do you think certain numbers might be lucky or\nunlucky in different cultures?\n2. Why are certain plants or flowers symbolic and important\nin certain aspects of culture?\n3. Do you think it's important to respect and honour elderly\nrelatives and citizens? Why?\n\nDouble Ninth Festival\nIt's a festival with numbers in its name, a direct reference to yin and\nyang, and a celebration of our elderly relatives. And of course, there's\nan ancient legend about a monster and a magical sword! Let's not\nforget the flowers! This festival has it all. We're talking about the\ncelebration that falls on the ninth day of the ninth month in the\nChinese calendar. Join us as we explore the legends, activities, and\ncultural importance of the Double Ninth Festival.\nMat\nHello and welcome back to another episode of China\nLifestyle Journeys. Today, we are talking about something called\nnine-nine, ninety-nine, or is it the Double Nine or Ninth Festival?\nYou can see I'm already in a mess. So please help me out,\nJocelyn. What's it called, and what is it?\nJocelyn OK, let's start with the name: the Double Ninth Festival.\nNow think about the name, Mat. I'm going to let you guess what\nit means. Think about it, \"double ninth\"-any ideas?\nMat\nAh, I think I see it. Double ninth means ninth and ninth,\nwhich probably refers to the ninth day of the ninth month on the\nChinese calendar. Am I right?\nJocelyn You are absolutely right, Mat. The Double Ninth Festival\nis celebrated on the ninth day of the ninth month. The festival is\nalso known as Chongyang Festival, or by its simple and popular\nname \"Senior Citizens' Festival.\" Now let's see if\nyou can get the\nnext bit right. How old do you think it is?\nMat\nWell, it's a traditional Chinese festival, so I'm going to\nsay . . . really old. Let's say, over 1,000 years old?\n\nFiX#7  t\nJocelyn Not bad. But it's actually even older than that. There are\nreferences to this festival that can be traced back to the Warring\nStates Period, which would make it over 2,000 years\nold.\nMat\nWow, even older than I thought. Just now you mentioned\nthat, as well as the name Double Ninth, it has another name.\nWhat was that one?\nJocelyn Right, let me explain. According to the Chinese philosophy\nof yin-yang, we can divide the world into either yin or yang.\nNow\nthis might get a bit tricky, but stay with me. Yin and yang are\ninterchangeable with one another, SO yang can become yin. The\nyin-yang duality also applies to how people should live their lives.\nThe belief is that we should not have too much or too little of\nsomething, such as food, for example. While food is essential to life\nand survival, eating too much can cause health problems, while too\nlittle causes starvation. So we have these two kinds of elements,\nyin and yang. The number nine is regarded as yang. The ninth day\nof the ninth month is a double yang day, hence the name \"Chong\nYang Festival\" (Chong means \"repeat\" in Chinese).\n\nMat\nOK, I think I get it. So what do people actually do on\nthis festival? I'm guessing, as usual, there must be some special\nactivities and certain important foods.\nJocelyn Yes, of course. People engage in various activities like\nhiking, appreciating chrysanthemums, and flying kites. This day\nis also an occasion to pay respects to ancestors, emphasising\nthe value of respecting the elderly. And as for food, while there\naren't many specific dishes associated with the festival, people\noften make and enjoy pine nut cakes. These cakes have historical\nsignificance and are a delicious treat during the celebrations.\nOverall, the festival is about honouring the elderly and cherishing\nfamily bonds.\n\nmiX#t7 t\nMat\nYou just said that appreciating chrysanthemums is an\nimportant feature of the festival. Why chrysanthemums? What's\nspecial about these flowers?\nJocelyn Ah, good question. Chrysanthemums hold a special\ncultural significance in China. They bloom in late autumn when\nmost flowers wither. The festival's timing aligns with their peak\nbloom. The chrysanthemum flower is a symbol of longevity and\nwealth, and a wish for a peaceful old age. So during the Double\nNinth Festival, it is customary to appreciate chrysanthemum\nflowers, drink chrysanthemum wine, and eat chrysanthemum\ncakes.\nMat\nYou know I like a good story. Are there any interesting\nlegends or folktales connected to this festival?\nJocelyn Actually, there are some. One well-known legend tells\nthe story of Huan Jing, who, guided by a heavenly bird, used a\nmagical sword to defeat\nnasty plag"}, {"id": "第一辑-传统节日__Winter_Solstice", "book": "第一辑 · 传统节日", "title": "Winter Solstice · 冬至", "text": "Winter Solstice\n1. Why do people in China eat specific types of food in the\nmiddle of winter?\n2. Why did people in the past divide the year into 24 parts?\n3. What are sticky rice balls? And do they have any special\nmeaning?\n\nWinter Solstice\nImagine a cold winter morning, with frost or snow outside your\nwindows. In this cosy setting, we are in the heart of winter, exploring\na unique Chinese tradition that warms the soul. Travel with us to\nChina, where people still celebrate the Winter Solstice Festival, a\nday with less sunlight than any other day of the year. Listen to our\nconversation as we find out about the customs, rituals, and delicious\nfoods that make this festival truly special.\nMat\nOK, so it's winter. I know it's winter because it's cold\noutside. I need to turn on the heating at home, and I need to\nwear warm clothes. And there are Christmas advertisements on\nthe TV all day long.\nNow, I know China doesn't celebrate Christmas, but somewhere\naround the same time, there is something called the Winter\nSolstice Festival, or is it the Mid-Winter Festival?\ndon't know\nwhich one.\nNow in the UK, we know that the winter solstice is a day\nsomewhere in the middle of winter. - don't know which day it is,\nbut I know it's the shortest day of the year. It has less sunlight\nthan any other day. Now,\nknow that because we see that on the\nTV weather report every year. On that day in winter, at the end of\nthe weather report, someone says something like,\nand today,\nof course, is the winter solstice, the shortest day of the\nyear. It's\ngoing to get dark early,\" something like that.\nBut that's it. It's just mentioned in the weather report on TV:\nwe don't do anything on that day. It's not a festival; there's no\n\ncelebration. We don't have any traditions related to this. I don't\nknow, maybe we did in the past\nmany hundreds of years ago,\nbut we don't have any today.\nBut I've heard that it's a very important traditional festival in\nChina. And everybody celebrates it in some way.\nSo, I guess my first question is: what is this Mid-Winter Festival?\nIs it called Mid-Winter Festival? Is it called the Winter Solstice\nFestival? What's the name, and what does it really mean?\nJocelyn Well, yeah, it is a very important festival in China, and it's\ncalled Dongzhi in Chinese. In English, we say the Winter Solstice\nFestival. It usually takes place on the 21st of December of the\nWestern calendar. So the winter solstice is one of the 24 solar\n\nWinter Solstice\nterms. We also translate it into \"The Extreme of Winter\", Dongzhi,\nwhich is why it is known as the Dongzhi Festival. It is also marked\nby paying respect to our ancestors and eating delicious and tasty\nfoods.\nMat\nOK, that's helpful. You just said something about \"solar\nterms\"_I don't think I know this word\nI don't know what they\nare. Can\nyou explain \"solar terms\" a little bit more?\nJocelyn Yeah, of course, it's a very Chinese concept. In the\nWestern calendar, you divide the year into 12 months, but a long\ntime ago during the Western Han Dynasty in China, people cut\nand divided the year into 24 equal segments, so these are called\nthe \"solar terms\" in China, and also we still use these today.\nIn ancient times, people used them to measure and predict\nweather. It is very useful for farming and growing crops. These\nsolar terms were a very\nuseful\nway for people to manage farming\nand other lifestyle decisions, like clothing, food, housing, and\ntransportation.\nMat\nAlright, so now I understand solar terms. But I have\nanother question: is this Mid-Winter Festival\nis it like a public\nholiday? Do students get a day off school?\nJocelyn Well, the answer is no, not today. Many people see the\nwinter solstice as an important festival day, and in some places\npeople think it's more important than the new year. A long time\nago, during the Han Dynasty, the winter solstice was a public\n\nFiX#7 *\nholiday. Public servants and officials had a holiday at this time-\nthey didn't need to work. But nowadays, it's not an official public\nholiday in China; everybody goes to work and school. People\ncelebrate this day in the evening, after school or work.\nMat\nSo I guess, like all traditional Chinese festivals, people\neat special food on this day. So can you tell me something about\nthe food that people eat during this Winter Solstice Festival?\nJocelyn Yeah. There's a\nspecial reason for eating different\nfoods during the Winter Solstice. In old times, during the Han\nDynasty, people had the idea that in the middle of the winter, in\ncold weath"}, {"id": "第一辑-传统节日__Laba_Festival", "book": "第一辑 · 传统节日", "title": "Laba Festival · 腊八节", "text": "Laba Festival\n1. Have you ever\nheard of a festival where pickled garlic is a\nkey element? What do you think might be the significance\nof this unusual food item in a festival?\n2. How do you think the timing of a festival in the calendar\ncan influence its customs and traditions?\n3. Some festivals have been celebrated for thousands of\nyears.\nWhat do you think helps certain festivals to endure\nand remain significant over such long periods?\n\nLaba Festival\nIt might not be the most well-known Chinese festival, but the Laba\nFestival, a celebration with ancient origins, rituals, and symbolic\nfoods, is a unique blend of Buddhism and folk traditions. In this\nepisode, we've got some special porridge and even some pickled\ngarlic. And we even get to talk about pancakes!\nMat\nHello, and welcome to another episode. Today, we're\ntalking about a festival. Now, Jocelyn, I must admit, when I\nheard the title of this episode, I'll be honest, I didn't really know\nanything about it. I still know almost nothing about it. I've spent\na lot of time in China, so\nknow about Spring Festival, Mid-\nAutumn Festival, and many others, but I've never heard of the\nLaba Festival. I don't even know what it means or if I'm saying it\ncorrectly. So I really need your help with this one.\nJocelyn OK. Let's start at the beginning. The Laba Festival is a\ncelebration that falls on the eighth day of the twelfth month in\nthe Chinese calendar. It has very old, deep-rooted traditions, and\none of the most iconic customs associated with this festival is the\npreparation of something called Laba congee in temples across\nChina.\nMat\nHang on. I know what Laba is. It's that kind of pickled\ngarlic, right? Are\nyou telling me that this festival is actually\nnamed after pickled garlic? Are we really talking about a festival\ncalled the Pickled Garlic Festival?\n\nJocelyn Haha, no, Mat. Not really. think you're getting something\nmixed\nup here. The Laba Festival's name represents its date\non the Chinese calendar. \"La\" is the name of the twelfth and\nfinal month, and \"ba\" means \"eight.\" The pickled garlic and the\nporridge we make are both named after the festival.\nMat\nAh,\nsee. So it's the food item that is named after the\nfestival. That makes sense now. So let's\nrecap.\nThe festival falls\non the eighth day of the twelfth month on the Chinese calendar.\nOn this festival, people like to eat Laba congee, a type of porridge.\nWhat else do we need to know?\nJocelyn One key aspect of the festival is its Buddhist influence.\nMany temples prepare Laba congee and then offer it to visitors. It's\nbelieved that by eating this congee, one can receive blessings from\nBuddha. This association with Buddhism has led to the congee\nhaving alternative names like fu shou zhou (Fortune and Longevity\n\nCongee) and fu de zhou (Fortune and Virtue Congee). Over time,\nthe festival has evolved from being mostly a religious event into\na well-known folk festival celebrated by families all across China.\nWhile Laba congee remains at the heart of the celebrations, various\nother customs have emerged around the festival.\nMat\nI'm still fascinated by the connection to pickled garlic.\nHow does something like that become an important part of a\nfestival?\nJocelyn\nI think you're getting mixed up again, Mat. Let's map\nit out clearly. The festival lends its name to the porridge, Laba\ncongee. People make porridge using a variety of grains and fruits.\nThe festival also includes the custom of Laba garlic. People soak\n\nFiX#7  t\ngarlic cloves in vinegar until they turn green, creating a crunchy,\nsharp, and slightly sour delicacy. There are other food traditions\ntoo, such as sun-drying Laba tofu in certain areas, and eating\nLaba noodles.\nMat\nAh,\nget it now. So it's a festival with strong religious\ntraditions, and there are certain food items that have special\nmeaning attached to the festival. In some ways, it reminds me\nof something: Pancake Day. This Western Christian holiday, also\nknown as Shrove Tuesday, falls on a specific day on the religious\ncalendar. Even though making and eating pancakes are key\nfeatures of the festival, the meaning of the food item is symbolic,\njust like the Laba congee and the pickled garlic.\nJocelyn Yes, exactly, Mat.\ncan see the connection. So why do\npeople make pancakes for this religious festival you call Pancake\nDay?\nMat\nIt's because just after this festival, people are supposed\nto eat less, to give up certain foods. So they make pancakes\nbefore this fasting period, to get full up and use up any remaining\neggs\nan"}, {"id": "第二辑-一饮一食__Noodles", "book": "第二辑 · 一饮一食", "title": "Noodles · 面条", "text": "Noodles\n1. Chinese noodles are pretty old. Can you guess how old\nthey are?\n2. Do you\nthink Chinese people eat noodles mostly for\nbreakfast, lunch, or dinner? Why?\n3. Have you heard the legend of \"Over-the-Bridge\" rice\nnoodles? What type of noodles might these be?\n\nAg6 Vi#t67  te\nEveryone knows what noodles are. We've all eaten a bowl of noodles\nat least once. But how much do we know about the rich history,\nvariety, and cultural significance of one of China's most beloved\nfoods? From their ancient origins over 4,000 years ago to the\nthousands of unique varieties enjoyed today, Chinese noodles are\nmuch more than just a meal. Learn about different types, popular\nregional dishes, and the customs for special occasions like birthdays\nwith longevity noodles. Discover why noodles hold a special place in\nChinese cuisine and culture.\nMat\nHello again. In today's episode, we are talking about\nnoodles, one of my favourite types of Chinese food. Now, I think\nmost people around the world, if you ask them to name one\nfamous Chinese food, I think most people will say, first of all,\nnoodles. So, we all know something about Chinese noodles. I\nthink most people around the world have tried Chinese noodles\nor have tried some kind of Chinese noodles. But let's start with\nsome history. What do we know about the history of Chinese\nnoodles?\nJocelyn OK, that's a good place to start. From what we know\ntoday, the earliest Chinese noodles date back more than 4,000\nyears. Some historians found\nbowl of noodles buried deep in\nthe ground near the Yellow River in China, and experts dated\nthese as being 4,000 years old because they were able to give\nan accurate date to the ceramic bowl. But the first real written\nreference to noodles is from the Eastern Han Dynasty, around the\nyear 100 CE.\n\nNoodles\nDuring the Song Dynasty, noodle shops were very popular in\nChinese cities, and we have many written references to eating\nnoodles in these special noodle shops.\nMat\nOK, so noodles were very popular during the Song\nDynasty, and possibly before that time. But what about today?\nHow popular are noodles in China today?\nJocelyn Noodles are still very popular in China today. There are\nthousands of varieties of noodles in China, and these differ by the\nshape of the noodles and the sauce or\ngravy. They can be dry, or\nin soup, or boiled, or fried, and there are SO many different ways\nto prepare noodles. Many noodles have local characteristics, so in\n\none city, you might find that most people eat one particular type\nof noodles, and then in a neighbouring city, the local people have\na completely different version. Traditionally, noodles in China can\nbe grouped by one of the three main ingredients: wheat flour (the\nmost popular kind), rice flour, and a kind of bean starch (these\nare often called glass noodles).\nMat\nNow, my next questions are: when do Chinese people\nusually eat noodles? Is it like for lunch, for dinner? Do\nyou eat\nnoodles with other things? Do you\nshare noodles? How does it work?\nIs there a fixed or a typical time or a typical way to eat noodles?\nJocelyn The questions are quite difficult to answer, actually,\nbecause China is such a huge country, and eating habits are very\n\nNoodles\ndifferent from city to city, province to province. So it's not easy to\ngeneralise about eating habits. A lot of people say\nthat in north\nChina, people eat more noodles, and in south China, people eat\nmore rice. But people in North China still eat rice, and people in\nSouth China still eat noodles.\nIn many parts of China, both north and south, people eat noodles\nfor breakfast. They usually have them in a local noodle restaurant\nbecause it takes time to cook noodles, and most people are in\na hurry in the morning. So, there is no typical type of breakfast\nnoodle. In some areas, people have soup noodles for breakfast; in\nother places, they have dry noodles in sauce; and in some places,\nthey eat fried noodles for breakfast.\nSo noodles are also a common lunchtime food because, if you are\nworking, they are fast and cheap.\nI think it's less common to have noodles for dinner in the evening\njust because they are quite heavy, and\nlot of people like to eat a\nlighter meal in the evening. But in almost every Chinese city, you\ncan find late-night noodle restaurants.\nSo you can see, for some people, noodles are a daily food; for\nothers, it's more like a convenience food when people are in a\nhurry or busy with work.\nMat\nI've heard some people mention some famous noodle\ndishes, some famous types of"}, {"id": "第二辑-一饮一食__Dumplings", "book": "第二辑 · 一饮一食", "title": "Dumplings · 饺子", "text": "Dumplings\n1. When you hear the word \"dumpling,\" what comes to your\nmind?\n2. Do\nyou\nthink dumplings are important foods in other\ncultures?\n3. Chinese dumplings come in many styles, shapes, sizes,\nand flavours, but is there something they all have in\ncommon?\n\nFiX#t7 ot\nThey are one of the most famous foods in Chinese cuisine, but they\nare actually much more than just a simple and delicious snack. They\ncome in many shapes, sizes, and flavours, each one with a special\nand unique name (and this can cause translation problems). Let's\nget straight down to the tasty business of uncovering the facts about\nChinese dumplings!\nMat\nHello and welcome to another episode of China Lifestyle\nJourneys! Today, we're diving into the delightful world of Chinese\ndumplings. Now, let's start with vocabulary. When we say\n\"dumpling\" in English, it typically refers to a specific type of food\n(something like a ball of bread that we traditionally put in soup\nor in some kind of meat stew). But, of course, in Chinese cuisine,\nwe use the English word \"dumpling\" to talk about a wide variety\nof food items, in a variety of shapes, sizes, and fillings, making it\na bit tricky to find the perfect translation. Jocelyn, could you tell\nus more about the different styles of Chinese dumplings and this\nrather awkward translation problem?\nJocelyn\nOK, that's a good starting point! The general word in\nChinese for dumplings is \"jiaozi\" (in Mandarin). They can be\nfound in various regional cuisines across China, and each style\nhas its unique characteristics. There are many other words\n(in Chinese) to describe these individual styles. So, of course,\nwhen we talk about these in English, the word we often use is\n\"dumpling\" as a general catch-all description, even though it\nmay not accurately capture the diversity of Chinese dumplings.\nThis can sometimes lead to confusion, because, as you said, Mat,\n\nDumplings\n\"dumpling\" in English might make us think of something that\ndoesn't fully describe the range of Chinese dumplings.\nMat\nSo, could you give us some examples of the different\ntypes of Chinese dumplings and their unique features?\nJocelyn OK! Let's explore a few popular styles of Chinese\ndumplings. I guess the most common and famous type is\nsomething generally called \"jiaozi,\" and this typically consists of\na thin wheat dough wrapper filled with a mixture of ground meat,\nvegetables, and seasonings (there are many different versions;\nthe meat can be pork, beef, lamb, or even fish or seafood, and\nthe vegetables can be anything from cabbage, onion, leeks, and\nso on).\nwould probably say the most common type is pork and\ncabbage. Now, these dumplings can be boiled, steamed, or pan-\nfried and are usually served with dipping sauces (the sauce is\n\nFiX#7\noften made from vinegar, soy sauce, and chilli-if you want it\nspicy). They vary in size and shape depending on the region.\nSo even the basic form of dumpling (or jiaozi) has quite a lot of\nvariation.\nMat\nOK! So we've covered one type, these \"jiaozi.\" Let's talk\nabout some of the other variations.\nJocelyn\nAnother well-known type is the \"shengjian bao,\" or in\nEnglish, pan-fried dumplings. These dumplings are typically filled\nwith a mixture of minced pork and vegetables and sometimes\na soup inside. They are pan-fried on the bottom, creating a\ncrispy and golden crust, while the top remains soft and steamed.\nShengjian bao are often enjoyed as a breakfast or snack in\nShanghai and other regions, and their juicy filling and contrasting\ntextures make them a really special snack.\nMat\nThere's another type I've had in Shanghai; it's the one\nwith\nsoup inside, and it's really difficult to eat. I remember spilling\nall the soup over my shorts when I was eating it. What's that one\ncalled?\nJocelyn\nAh\nyes,\nthat one. The type of dumpling you're talking\nabout is called \"xiaolong bao.\" Xiaolong bao is a famous Shanghai\nspecialty known for its delicate wrapper and soup filling. These\ndumplings are traditionally steamed in bamboo baskets, which\nallows the soup to form inside during the cooking process. When\neating xiaolong bao, it's important to handle them carefully as\n\nFiX#7  t\nthey contain really hot soup. One popular method is to gently bite\na small hole in the dumpling, allowing the soup to cool before\nenjoying the rest of the dumpling.\nMat\nNow, I've also been involved with making dumplings. At\ncertain times of the year, during Spring Festival, I think, families\nlike to make dumplings together, so I'm guessing there's some\nspecial meaning behind th"}, {"id": "第二辑-一饮一食__Hotpot", "book": "第二辑 · 一饮一食", "title": "Hotpot · 火锅", "text": "AR INN GAON\nteac\nHotpot\nadageengapre!\n1. Have\nyou ever tried cooking your own meal at the dining\ntable as you eat it?\n2. If you offered an English person \"hotpot\" for dinner, what\nwould they imagine?\nedge\nea glansierat\n3. We all know plum sauce, chilli sauce, and tomato sauce,\nbut what is a \"dipping sauce\"?\n+ 0\n{\n\nHotpot\nTry to picture a busy dining scene with people eating, the aroma\nof spices and fresh ingredients filling the air. One very important\nChinese culinary tradition is the vibrant and communal experience\nof hotpot. Journey with us as we uncover the mystery behind this\npopular dish, a staple in Chinese dining culture. We will try to discover\nthe differences between the English and Chinese interpretations of\n\"hotpot,\" understand the versatility of this meal, and learn why it's\nnot just about the food, but also about the joy of sharing, cooking,\nand savouring together.\nMat\nOK, so today we're talking about hotpot. Now, this is\na bit confusing for a British person because when we hear the\nword \"hotpot,\" we think about a very traditional English type of\nfood. It's a dish from the northwest of England, actually. It's very\nfamous.\nI'll give you the Cambridge English Dictionary definition of\n\"hotpot.\" Hotpot, a mixture of meat and vegetables, usually with\nsliced potatoes on top, cooked slowly in a covered dish inside an\noven.\nSo, can you imagine that? It's meat with vegetables, and it's\nslow-cooked in a stone pot with potatoes on top, and it's cooked\ninside an oven for about one hour. So for me, that's \"hotpot!\" So\nyou can understand how I was confused when I came to China,\nand everyone said, \"Let's eat hotpot.\" I'm thinking about the\nslow-cooked meat stew with potatoes on top. So obviously, my\nfirst question is ... what is Chinese hotpot?\n\nJocelyn Well, the Chinese name for hotpot, huoguo, literally\nmeans \"fire pot.\" It's a shared, communal meal and there's\nusually a large pot in the middle of the table. And the pot is\nfilled with a special soup, and the soup is constantly heated\nunderneath. Then we take different kinds of raw food items like\nraw meat, raw fish, and raw vegetables, and we cook them in the\nsoup. Everyone joins in this cooking activity, and then you take\nout the cooked pieces of food one by one from the soup and use\nspecial dipping sauces for extra flavour. So sometimes the soup\nis made of vegetables, sometimes from meat, and sometimes it's\nreally spicy.\n\nmiX#t7 t\nMat\n- see, SO you cook the food yourself, and everyone\nshares the big pot of soup in the middle of the table. But you\nsaid\nthe soup is really spicy-what if I don't like spicy food? What\nhappens then? You said everyone is enjoying the spicy hotpot,\nspicy soup,\nbut if\ndon't like spicy food, do\nhave to\ngo hungry?\nDo I eat nothing?\nJocelyn Ah, that's where it gets interesting. Nowadays, many\npeople choose a twin or double hotpot, and the soup dish is\ndivided into two-and you can have one half spicy and the other\nhalf not spicy. And there's also another solution: you can even get\nindividual little hotpots, so each diner has their own little soup\npot in front of them, and everyone can choose what kind of\nsoup\nthey want- not spicy,\nlittle spicy, spicy, or really spicy. That\nway, everyone is happy.\nMat\nOK, I see, but I still don't really understand why this is\npopular. In my culture, when we go to a restaurant for dinner, we\ndon't want to cook for ourselves. We want someone to cook for\nus the cook, the chef. I want somebody else to do the cooking.\nJocelyn Well, that's the great thing everyone participates in\ncooking while enjoying the food at the same time. So it's an ideal\nparty meal it's a wonderful shared experience. That's the special\npart of hotpot sharing the cooking and sharing the eating.\nSo, hotpot restaurants can be found everywhere in China, and\nmost of them are quite cheap-so everyone can enjoy the\nexperience. But lots of Chinese families still enjoy having hotpot\n\nHotpot\nin their own homes. The feeling is the same we cook together at\na table, and we eat together.\nMat\nRight, I think I'm starting to understand. It's not just\nabout the food; it's also the act of sharing, cooking together, and\neating together like a friend activity-enjoying it together. So,\nI guess my next question is, and this is the big question: what\nthings do you\ncook in Chinese hotpot?\nJocelyn Well, one of the important things is the soup, or we call\nit broth the liquid in the pot. Hotpot in different regions uses\ndifferent soup or broth. Some are really simple, wit"}, {"id": "第二辑-一饮一食__Chinese_Wine", "book": "第二辑 · 一饮一食", "title": "Chinese Wine · 中国酒", "text": "Chinese Wine\n1. What does the expression \"empty cup\" mean in China?\n2. A famous poet wrote a poem about wine in the year\n743.\nWhat do\nyou\nthink he wrote about in his poem?\n3. For English speakers, the concept of \"Chinese wine\" can\nbe confusing. Can you guess why?\n\nChinese Winel\nJoin us today as we learn about \"Chinese wine.\" For many English\nspeakers, \"wine\" usually means 0 drink made from\ngrapes containing\nalcohol. But in China, \"wine\" can mean different things. We'll look into\nwhy the Chinese word jiu is often called \"wine\" in English and what it\nreally stands for. Discover the fascinating world of traditional Chinese\ndrinks, which are different from grape wine, and learn about the\ncustoms and tastes that make them special. Let's find out together\nwhat makes \"Chinese wine\" unique!\nMat\nIn this episode today, we are trying to understand\nsomething more about \"Chinese wine.\"\nNow, I'm a little bit confused about the name \"Chinese wine.\" Let\n\nFiX#7\nme explain. For most English-speaking people, when we\nsay \"wine,\"\nwe are talking about an alcoholic drink made from grapes-\nsometimes red, sometimes light yellow in colour or white,\nsometimes pink, and sometimes with bubbles. But\nthink this is\nhow most people in my\nculture would describe \"wine.\"\nNow, for me, \"wine\" is not beer. Beer is made from grains like\nwheat, rice, and things like that. Now, stay with me. In my\nunderstanding, \"Chinese wine\" is made from things like grains\nand rice, and these kinds of things; it's not made from grapes. So\nwhy is it called \"wine\"?\nJocelyn\nOK, that's a good place to start. The Chinese character\njiu is often translated into English as \"wine.\" But actually, this\nis not a good translation. In Chinese, we use the word jiu to\ndescribe many different types of alcoholic drinks, spirits, liquor,\nand almost any drink with alcohol in it. So, yeah, you're right-\n\"wine\" isn't really an accurate translation.\nMat\nOK, then, so\nif \"wine\" isn't really an accurate translation,\nit's not a good translation, then what word should I use instead if\nif\ndon't use the word \"wine\"?\nJocelyn Well, I think it's still OK to use the word \"wine,\" or people\nsometimes use \"alcohol.\" There are many famous old Chinese\npoems translated into English that use the word \"wine,\" but we\nneed to remember that when we are talking about traditional\nChinese culture, \"wine\" is not the same wine in European culture.\nActually, in Chinese, we call that putaojiu.\n\nMat\nOK, you just mentioned some famous old Chinese poems\ntranslated into English. I've never heard of these. Do you know any?\nCan you tell me one of these poems? I think I'd like to hear one.\nJocelyn Ah, let me see. I think one of the most famous wine\npoems is by Li Bai. And he wrote this around the year 743.\nAnd I'll read a few lines from a book. It's very famous. It's called\nAT}L (Drinking Alone by Moonlight).\nA pot of wine among the flowers, #biel-seps,\nDrinking alone with no one to love. JE EHEL.\nI raise my cup to toast the bright moon, #*HT1E 9AFT,\nThe moon, my shadow and I, the three of us. MABEX.\n\nmiX#t7 t\nMat\nWow, that's quite powerful. I really like that. So let me\nimagine the scene. It's a long time ago; it's the year 743, and the\npoet Li Bai. He is there. He is drinking his Chinese wine, toasting\nthe moon. What do we think he was drinking? I know it wasn't\ngrape\nwine. So what kind of wine do we think Li Bai was drinking\nall those years ago\nwhen he wrote that poem?\nJocelyn OK, so when we talk about Chinese wine, most of the\ntime we are talking about the grain spirit (baijiu). This has a very\ndistinct flavour, and it tastes strong and\nsavoury,\nnot sweet. The\nstrength, I mean, the percentage of alcohol, is very high-over\n50%-so you can taste the alcohol level. It gives you\nthat warm,\nalmost burning sensation in the mouth as you\nswallow.\nBut when we talk about \"Chinese wine,\" that can also be\nsomething called huangiiu, yellow wine. And this is a kind of wine\nmade from cereal things like rice, millet, or corn. And the alcohol\nlevel is much lower than baijiu, around 15%, and the flavour is\noften quite sweet.\nMat\nOK, SO . . . when I'm in a restaurant or something like that,\nwhen I ask for Chinese wine, I need to remember that baijiu is the\nstrong one with the savoury taste, and huangjiu is much lower\nin alcohol and tastes sweeter. OK, I think 1 like the sound of the\nsweet yellow wine (huangjiu).\nOK, then, so . . .\nIf I'm drinking Chinese wine with Chinese friends,\nare there\nany\ncultural rules or customs that I need to know?\n\nChin"}, {"id": "第二辑-一饮一食__Chinese_Pastries", "book": "第二辑 · 一饮一食", "title": "Chinese Pastries · 中式点心", "text": "Chinese Pastries\n1 . Do you think it's possible to make pastries from beans or\nlotus seed paste? What do you think they taste like?\n2. Why do you think English cakes are often heavy and rich,\nwhile Chinese pastries are light and delicate?\n3. Can you guess\nhow the climate and history of a country\nmight influence the types of cakes (for Western) and\npastries (for Chinese) they make and eat?\n\nChinese Pastries\nIt's time for some cake. Join us as we bite into the delicate flavours\nof Chinese mooncakes and the rich indulgence of English fruitcakes.\nDiscover how climate and history shaped each country's cake\ncreations, fro
