nMat\nWe've spoken quite a lot about the plot, Mulan herself,\nShakespeare, and the original versions versus the Disney\nversions. Is there anything else that we need to talk about? What\nhave we forgotten?\nJocelyn One i"}, {"id": "第四辑-经典文化__Chinese_Music", "book": "第四辑 · 经典文化", "title": "Chinese Music · 中国音乐", "text": "Chinese Music\n1 . How would\nyou\ndescribe the differences between Chinese\ntraditional music and Western classical music?\n2. How do\nyou think historical and cultural backgrounds\ninfluence the way Chinese and Western music are played\nand appreciated?\n3. Which aspects of traditional or classical music can be\nchallenging to play or learn?\n\nFIXi#7 kU\nLet the music play. Everyone likes music in one form or another. From\npop to classical, jazz to rock, the musical world has something for\nall tastes. Prepare to join our special guest, 12-year-old Steven, as\nhe shares his musical journey and experiences with both musical\ntraditions. Discover Steven's unique perspective on playing the piano\nChinese and Western music.\nfor five years and his insights into the distinct characteristics of\nMat\nWelcome to another episode. Today, we are talking about\ntraditional Chinese music and Western music, and we have a\nspecial guest, Steven, who will be my co-presenter for this special\nintroduce yourself to the readers?\nChildren's Day episode. So, first of all, Steven, would you\nad end\nL L\nprogertag\n1198 8P 119\nlike to\n3a hurt es5.\n\nChinese Music\nSteven\nHi everyone, my name is Steven, and I'm 12 years\nold. Today, I'm going to share my experience of both Chinese\ntraditional music and Western classical music. I've been playing\nthe piano for 5 years now, so I have some experience with both\nChinese and Western music.\nMat\nOK, good. So, first of all, I'll start with a simple question.\nWhich\ntype of music do you prefer playing, Chinese or Western\nmusic?\nSteven\nWell, if\nhave to choose one, I think I'd say Western\nclassical music. And the reason is that Western music, it allows\nfor more creativity and is kind of like breaking the rules, if\nthat makes sense. Because Chinese music, for me, feels more\nstrict. It's quite strict in its style, and you always need to follow\ncertain rules. Maybe I could explain it in a different\nway: Western\nclassical music often feels quite \"loose and open\" when you play\nit, but Chinese traditional music feels quite \"tight\" when you play\nit. There's less freedom.\nMat\nThat's a very interesting way to explain it, and I think I\nknow what you mean. So why do you think that is? Why are they\ndifferent in this way?\nSteven\nSo,\nthink Western music is more international. Well,\nwhat I mean is, it comes from different countries (like Italy,\nFrance, Germany, Britain, and so on), and these countries all\nhave different cultures and traditions, so there is more influence\n\nChinese Music\nand sharing of ideas. So\nthink that as Western classical music\nevolved, it's like a mixture from many different origins. On the\nother hand, Chinese music is only from one country, one culture,\nso it became refined over many years. It's like Western classical\nmusic has many elements from many sources, but Chinese music\nis just one pure, concentrated form.\nMat\nYes, that's interesting. I think I agree with you there. So,\nwhat about listening to music? Which type of music do\nyou prefer\nlistening to?\nSteven\nWell, if I'm totally honest, I like listening to all kinds of\nmusic, you know, pop, blues, and different types of modern music.\nIt really depends on the situation and my mood. So, for traditional\nmusic or classical music, sometimes I prefer listening to Western\nmusic because it has stories in it, a variety of emotions, and it\ncan be dramatic, full of suspense and excitement. However, when\nI want to relax or even sleep, I prefer Chinese music because it's\nusually calming and peaceful.\nMat\nOK, so what do you think is the most challenging aspect\nof playing each type of music?\nSteven\nFor Western music, it's important to feel the soul, to try\nto understand the deeper feeling and the composer's intention,\nand that could be really difficult. But for Chinese music, quite\noften it was written for traditional instruments many centuries\nago, and it followed some fixed rules that were also written\n\nmiX#t7 t\nhundreds of years ago\nfor instruments that we don't have today.\nSo, it can be difficult trying to feel what the music should be like\nin its original form many hundreds of years ago.\nMat\nSo let's talk about composers now. Do\nyou\nhave a\nfavourite composer? Which composer do you enjoy playing the\nmost, and what's your favourite piece?\nSteven\nI think for me personally, there's a composer called\nChopin. When I play Chopin's music, feel like I'm able to express\nmyself better, and the music itself feels very beautiful. There's\none piece by Chopin called Nocturne Number 2, and tha"}, {"id": "第四辑-经典文化__Chinese_Opera", "book": "第四辑 · 经典文化", "title": "Chinese Opera · 中国戏曲", "text": "Chinese Opera\n1. Why do you\nthink traditional Chinese\nopera uses brightly\ncoloured and patterned face paint instead of realistic\nmakeup?\n2. How do\nyou think the unique singing styles in Chinese\nopera convey different characters' personalities and\nemotions?\n3. Why is there a tradition of men performing female roles in\nChinese opera?\n\nFiX#7 t\nPut on\nyour\nface paint and get on stage. We are jumping into the\nworld of Chinese opera-an enchanting fusion of singing, acting, and\ntradition. Unlike Western opera, Chinese opera boasts distinctive\nfeatures, from its symbolic stage design to unique singing techniques.\nWe'll look into the intriguing history of men performing female roles\nand discover how each role's singing style conveys personality and\nemotion. Join us for an immersive journey into the captivating realm\nof Chinese opera.\nMat\nHello and welcome to another episode. Today, we're\ngoing to be discussing an unusual topic opera. Now, you might\nnot be an expert on opera, but I think it's still an interesting\ntheme to explore, as it can help us to understand some\ninteresting historical and cultural ideas with this quite unique\nmedium. So, for my first question, Jocelyn, tell me: what is\nyour general definition or experience of opera from a Chinese\nperspective?\nJocelyn Well, I'm not really an expert on Chinese or Western\nopera, but I've seen a few performances of both. I'd say that,\nfrom a Chinese perspective, opera is a performing art form\nthat combines singing, dancing, and acrobatics to tell a story.\nObviously, the most common one that most people know is Beijing\nopera, and that originated in Beijing in the late 18th century.\nPerformances are typically characterised by stylised singing and\nactions that symbolise the story. Each performer's actions are an\nimportant way to tell the story, rather than just the singing. So, it's\na visual performance, like acting, as well as a singing performance.\n\nChinese Opera\nMat\nThat's interesting. From my experience of watching\ntypical Western European opera (which is often, but not\nalways, Italian), there's\nlot of powerful singing and emotional\nexpression, and this is central to the performance, while the\nacting is quite simple and lifelike. And the stage setup for Western\nopera is usually quite elaborate, with lots of vivid props and stage\ndesign. I've seen a couple of Beijing opera performances, and\nI remember that the stage was very simple. So, that's my first\nquestion why is the stage so simple in a typical Beijing opera?\nJocelyn In Beijing opera, the stage is normally a simple platform\nthat only has one side exposed to the audience. This is because\nthe focus is more on the performers and their actions, rather than\n\nChinese Opera\non the props or the stage design. It allows the audience to focus\nmore on the story and the performers. In fact, the performers'\ncostumes and make-up are more complex and detailed, with each\ncharacter having their own distinct look and style. The make-\nup is thick and unnatural, with heavy colours that symbolise the\ncharacter roles. I think this is quite different from Western opera,\nwhere the make-up is closer to real life. The characters look real\nin Western opera, but I'm sure you'll agree that in Chinese opera,\nthe singers often look quite unnatural and this is because\nthey symbolise an idea, an exaggerated character or role. It's a\nperformance; it's like imaginary theatre, and it's not aiming to\nshow real life.\nMat\nOK, that's interesting. Now we've mentioned the singing\nstyles, I think we can talk about that a little bit more. Now, I'm\nsure you'll agree with me that when\nyou\nlisten to a Western opera\nperformance, the singing is quite emotional; it can be warm,\ncalm, sad, tragic, passionate, or joyful and celebrating. But am\nright in saying that in most Beijing opera, the singing is like\nit\nsounds kind of weird to me, not like a human singing; sometimes\nit sounds like a musical instrument. When they sing, their voices\nsound like some strange violin or something. And there must be a\nreason for this.\nJocelyn Well, you're right. The singing style in Beijing opera\ncan seem quite unnatural and artificial to Western European\nears. And this is because each role in Beijing opera requires\na unique singing technique. And the style is very specific and\n\nmiX#t7 t\noften includes special tones, which make individual sounds much\nlonger and drawn out, as you said, sometimes like a musical\ninstrument, and with very sharp changes in pitch and tone. And\nthis technique is "}, {"id": "第四辑-经典文化__The_Game_of_Go_(Weiqi)", "book": "第四辑 · 经典文化", "title": "The Game of Go (Weiqi) · 围棋", "text": "The Game of Go (Weiqi)\n1. Why are some ancient games still popular today?\n2. What makes a simple board game so popular with players\nall around the world?\n3. Why are some games (like chess) often regarded as \"more\nthan games\"?\n\nFIXi#7 BU\nYou've almost certainly seen it, and you may even have played it\nyourself. It's that board game with little black and white stones on\na simple line grid. It's got different names in different countries, but\nmany people just know it by its simple name, \"the game\nof Go.\" Did\nyou know that it's actually an ancient Chinese board game with lots\nof history, cultural significance, and strategic depth? This timeless\ngame has captured the hearts and minds of players for over 2,500\nyears. Let's play the game of Go!\nMat\nHello and welcome to another episode. Today, we're\ntalking about games, board games, but just one in particular: the\nChinese game of \"Go\" (or weiqi as it's known in Chinese). Now, I'll\nbe completely honest, Jocelyn, - don't know anything about the\nhistory of this game, and I've only played it once, and I wasn't\nvery good at it. So, I think we've got quite a lot to cover. So where\nshould we begin?\nJocelyn Well, for those readers who are unfamiliar with the\ngame, I guess we should start with a description of how the\ngame is played and what it looks like. The\ngame of Go is a two-\nplayer, strategy-based board game played on a grid, a bit like\na chessboard but with lines instead of\nsquares.\nThe board\nstarts empty, and players take turns placing their stones, one\nat a time, on the intersections of the lines. It's quite simple to\nplay: one player uses black stones, and the other uses white\nstones. The aim of the game is to control the largest area on the\nboard by surrounding your opponent's stones or territory while\nmaintaining your own.\n\nThe Game of Go (Weiqi)\nMat\nHang on a second, you said it's quite simple, but then\nyou said something about surrounding your opponent's territory\nwhile maintaining your own. That doesn't sound simple to me.\nJocelyn\nOK, let me put it in a different way. Let's say you're white\nand I'm black. The board starts empty, we take turns placing\none piece on the board, and we can never move those pieces.\nWe can only remove them. Let's say you have a group of your\nwhite pieces on the board, and after a few turns, I surround those\npieces with my black pieces. Then I've surrounded and captured\nyour white pieces, and they are removed from the game. That's\njust the basics. There are many other rules, but we won't talk\nabout those today.\nMat\nOK, that's much simpler. So we know the rules; it does\nactually sound quite simple. So, am I missing something? Is it\njust putting these little stones on lines, on a grid, on a board, and\nthen counting up the pieces in the end to see who lost the most?\n\nmiX#t7 t\nJocelyn Ah, that's what makes the game so special. It might\nlook simple on the surface, but it becomes far more complex as\nthe board is gradually filled with stones, and strategic decisions\nbecome increasingly important. Every game is different because\nwe can lay our pieces wherever we want, so we are creating\nfairly unique patterns of play. Some experts say there are more\npotential board positions in the game of Go than there are atoms\nin the universe. It's a game\nthat can be learned in a few minutes\nbut takes a lifetime to master.\nFR\n\nThe Game of Go (Weiqi)\nMat\nOK, so we've talked about the\ngame itself. Now, let's think\nabout the history behind the game. I'm guessing it's quite old. I\nknow that the popular game\nof international chess is about 1,500\nyears old, so how does the game of Go compare on this timeline?\nJocelyn\nThe\ngame\nof Go is pretty old. Its origins can be traced\nback over 2,500 years, making it one of the oldest board games\nstill played today. It's believed to have been invented in China\nduring the Warring States period, which lasted from the 5th to\nthe 3rd century BCE. The earliest references to the\ngame\nof Go\ncan be found in historical texts from this time. So, it predates\ninternational chess by quite a bit!\n\nFiX#7\nMat\nSo it's very old, over 2,500 years old by some accounts.\nSo when something is as old as that, it must have some\nreferences in old literature, poetry, and things like that. It sounds\nlike the kind of thing that would get mentioned quite a lot.\nJocelyn You're right. When we look back at old historical writings,\nwe see references to something called the \"Four Arts.\" Now,\nthese are four thingslet's call them skilled arts or talents-\nthat ancient ed"}, {"id": "第四辑-经典文化__Chinese_Painting", "book": "第四辑 · 经典文化", "title": "Chinese Painting · 中国绘画", "text": "Chinese Painting\n1. Why would a painter choose to paint only with black ink?\n2. Why are so many traditional Chinese paintings about\nnature, mountains, and trees?\n3. Have\nyou\nnoticed that some Chinese paintings include\nwords or poems? What do\nyou\nthink these add to the\nartwork?\n\nFIXi#7 kU\nOil paint on canvas or black ink on white\npaper? Clean\nyour\nbrushes\nand get ready. We are diving into this unique art form, where ink\nmeets philosophy on silk and rice paper canvases. Discover how\nsymbols convey harmony, nature's power, and the flow of life. Learn\nwhy black ink and special brushwork matter more than realistic\ndetail. It's time to get\ncreative and discover the art of Chinese\npainting.\nMat\nHello and welcome back to another episode. Today, we\nwill be looking at the topic of Chinese paintings. Now, I know\nsomething about painting because, when I was a student, I\nstudied art, and I learned how to paint, but I have never really\nunderstood Chinese painting. Let me explain. When I think about\npainting,\nimagine lots of thick paint in all different colours,\nportraits of people, or dramatic landscapes. But when I think\nabout Chinese painting, most of these elements seem to be\nmissing. So, I guess my question is .. why?\nJocelyn Well, Chinese painting is different from Western painting\nbecause of its development over many thousands of years, and\nthis really influences the style and materials. Chinese paintings\nusually show nature, like mountains, trees, and animals. And the\npaintings are often simple and focus on balance and harmony. And\nthe artist is not trying to paint a realistic portrait or landscape. In\nChinese paintings, many things have deeper meanings. For example,\na bamboo plant can show strength. And there is a lot of symbolism\ngoing on, SO you need to be able to interpret this symbolism if you\nwant to truly appreciate Chinese painting.\n\nChinese Painting\nMat\nOK, so this seems like\ngood starting point. Tell me\nmore about this symbolism.\nJocelyn Symbolism in Chinese painting helps to tell stories and\nconvey messages. Objects and animals in the paintings can\nhave special meanings. For example, as I said before, bamboo\ncan represent strength and flexibility, while a plum blossom\ncan symbolise hope and perseverance. Birds might represent\nfreedom and happiness. And the symbols help people understand\nthe deeper message behind the painting. To appreciate Chinese\npainting, it's important to learn about these symbols and what\nthey mean. This way, you can enjoy the beauty of the painting\nand understand the story the artist wants to share.\n\nMat\nOK, I think I have a clearer understanding already. A lot\nof Chinese paintings show mountains and trees and sometimes\nwater, like a waterfall. So, what does that symbolise?\nJocelyn Well, in Chinese paintings, mountains, trees, and water,\nlike waterfalls, often represent or show harmony with nature and\nthe balance between different elements. Mountains can represent\nstability, strength, and a connection to the spiritual world. Trees\ncan stand for longevity and resilience. Water, such as waterfalls\nor rivers, symbolises the flow of life, change, and the passage\nof time. By including these elements in their paintings, Chinese\nartists try to express the beauty and power of nature, as well as\nthe importance of living in harmony with it.\n\nChinese Painting\nMat\nOK, so I think I get the content, symbolism. But I'm still\na little unclear about the materials. Why are most of the paintings\njust black without any colour?\nJocelyn\nWell, most Chinese paintings use black ink because of\nthe tradition and the unique look it creates. In traditional Chinese\nart, artists use ink and brushes to paint on silk or rice\npaper.\nThe\nblack ink allows them to create different shades and textures\nwith just one colour. Using only black ink also adds a sense of\nsimplicity and elegance to the paintings. However, some Chinese\npaintings do have colour, but it's usually not as bright or bold as\nin Western art. The focus is more on brushstrokes, lines, and the\noverall feeling of the painting, rather than on vivid colours.\nMat\nActually,\nknow that calligraphy in handwriting is a\nvery important part of Chinese artistic tradition. Sometimes,\nwhen I see a traditional Chinese painting, it almost feels like\na combination; it's part picture, part writing. Sometimes the\npaintings have words written on them as part of the picture. Am\nright here?\nJocelyn Yes, you're absolutely right! Calligraphy is a significant\npart of the Chinese artistic "}, {"id": "第五辑-中国符号__Chinese_Characters", "book": "第五辑 · 中国符号", "title": "Chinese Characters · 汉字", "text": "Chinese Characters\n1. Have you ever wondered how many Chinese characters\nthere are? Can you guess?\n2. How old do you\nthink the oldest Chinese characters are?\n3. If you wanted to learn Chinese characters, what do you\nthink would be the best way to start?\n\nFE Xi#7 bE\nGet your pens and pencils ready; it's time to do some writing! Written\ncharacters, deeply rooted in China's language and culture, have\na fascinating history. But just how many\ndifferent characters are\nthere? We know they are old, but just how old are they? How much\ndo we know about their origins? How do they compare to English\nletters? Discover the differences between traditional and simplified\ncharacters, and gain valuable advice for learning them. Get ready for\na captivating journey into the topic of Chinese characters!\nMat\nHello again! Today, we're talking about Chinese characters!\nAs we may already know, Chinese characters have a long and\nrich history, and are an essential part of the Chinese language\nand culture. Today, I'll be asking some important questions about\nthis fascinating aspect of Chinese culture. Let's start with the\nbasics. How many Chinese characters are there? Is it hundreds?\nThousands?\nJocelyn Well, the thing about Chinese characters is that there are\na lot of them. Like, seriously, a LOT. The exact number is kind of\nhard to say, but it's somewhere in the region of 50,000 to 60,000\ncharacters.\nAnd, of course, you don't need to know all of them to be able to\nread and write in Chinese. In fact, you only need to know a few\nthousand to be considered literate. But still, it's kind of crazy to\nthink about just how many characters are out there!\nMat\nSo, if there are over 50,000 of them, guess they've been\naround for a long time. I don't think they are a modern invention,\n\nChinese Characters\nare they? So, tell me something about the history of Chinese\ncharacters.\nJocelyn Chinese characters have a fascinating history that\ngoes way back in time. The earliest known examples of Chinese\ncharacters were carved onto bones and other objects during\nthe Shang Dynasty, which was over 3,000 years ago! And these\ncharacters were originally pictographs, which means they looked\nlike pictures of the things they represented. For example, the\nChinese character for \"sun\" originally looked like a circle with\na dot in the middle, representing the image of the sun. And the\ncharacter for \"tree\" looked like a simple drawing of a tree, with\nroots, a trunk, and branches. Over time, the characters evolved\nand became more complex. And today, some characters look\nlike the things they represent, but many have evolved into more\ncomplicated characters.\n\npil A4 * T $\nAxE*'\nMat\nAs someone who grew up with English as a first language,\nI am very familiar with the English writing system-ABC, spelling.\nYou learn the alphabet, and then you can read words, even new\nwords-words you've never seen before. You can sound out each\nletter and then say the word, even when you don't know what it\nmeans. Now, can we do this with Chinese characters?\nJocelyn Well, when it comes to writing systems, Chinese and\nEnglish are pretty different. The big thing is that Chinese uses\ncharacters that represent whole words or ideas, while English\nuses letters that stand for sounds-and these sounds make up\nthe word. It's definitely easier to sound out new words in English\n\nChinese Characters\nbecause\nyou\nlearn the alphabet, and then you can say the letters\nto read a word or say it out loud. But when it comes to Chinese\ncharacters, it's a little different. Chinese characters don't really\nfollow the same rules as English words, and we can't just sound\nthem out based on the characters themselves or the lines within\nthe character. Instead, each character represents a word or an\nidea, and they're often made up of multiple parts that give us a\nclue about the meaning. So, yeah, it's quite different. When we\nlearn a Chinese character, we have to learn how to read and write\nit, what it means, and how to pronounce it, and then we have to\nremember all these elements.\nMat\nYeah, that sounds much more challenging than learning\nthe English alphabet. Now, when I look at Chinese dictionaries\nand textbooks, I often see something like \"traditional characters\"\nor \"simplified characters.\" So, what's the difference between\ntraditional and simplified Chinese characters?\nJocelyn\nOK, that is a good question. There are two types of Chinese\ncharacters: traditional and simplified. Traditional characters are\nthe older version of the charac"}, {"id": "第五辑-中国符号__Silk", "book": "第五辑 · 中国符号", "title": "Silk · 丝绸", "text": "Silk\n1. What are some key characteristics that make high-quality\nsilk different from lower-quality silk?\n2. Why do\nyou think silk has the nickname \"The Queen of\nTextiles\"?\n3. How did the ancient Silk Road help silk become such an\nimportant luxury fashion product?\n\nFag Zi#t67 ate\nWe're fashionably glamorous in this episode. We are dressing up in\nsilk, that timeless symbol of beauty and luxury. Silk, known for its\nsilky smooth texture and elegant drape, holds a cherished place in\nChinese fashion culture. Beyond its glossy sheen, high-quality silk\nholds a few surprising facts. Join us on a journey to unravel the\nsecrets of \"The Queen of Textiles\" and discover its global significance\nin the realm of luxury fashion.\nMat\nHello! Welcome to a rather glamorous episode of China\nLifestyle Journeys. Today, we're looking at the world of silk and its\nrole in both Chinese fashion culture and even global fashion. Now,\nsilk has always been cherished in China as a symbol of beauty,\nelegance, and luxury. We know that;\nthink everyone knows this.\nalso know that silk has a really smooth texture. (Actually, there's\na word or an expression that we use quite a lot in English to mean\nreally smooth \"silky smooth.\" And we use this expression 'silky\nsmooth\" to talk about anything like food, drinks, or materials,\nwhen the texture is really smooth\nwe say it's silky smooth.) So,\nI know that silk is smooth, but apart from this, what makes it so\nspecial as a fabric for clothing? So, Jocelyn, let's talk about silk\nfashions and what makes silk so special for Chinese women.\nJocelyn OK, I think that's a great place to start! Silk has been an\nimportant part of Chinese fashion culture for centuries. Silk is\nsmooth, or \"silky smooth,\" as you say in English. It has a unique\nshiny finish to it. It flows and hangs in a really beautiful and\nelegant way. Imagine a large piece of cotton; think about how\nit hangs down. Now imagine a piece of silk hanging, and\nyou\n\nSilk\ncan almost picture that special quality, the way that it drapes\nso elegantly. Now, that's just the start. It also feels very soft\nand delicate on the skin when you wear it. So, because of these\nqualities, silk is perfect for making elegant shapes in traditional\nChinese clothes like qipao dresses, tangzhuang jackets, and\nthings like that.\nMat\nHang on a second; I get the part about the silky smooth\ntexture and the way it hangs, but what were those words you just\nsaid, qipao and tangzhuang? I think you'll need to explain those\nbefore we continue.\n\nJocelyn Sure! A qipao is a traditional Chinese dress that's known\nfor its elegant, fairly tight, figure-hugging design. It's often worn\nby women on special occasions and features a high collar and\nunique patterns. You've definitely seen one before-it's the classic\ntraditional Chinese dress. It's a symbol of grace and femininity.\nA tangzhuang, on the other hand, is a style of traditional Chinese\njacket. It has a straight cut and a stand-up collar. Both of these\nclassic clothing items look best when they're made from silk.\nMat\nAh yes,\ncan picture them now. So, let's get back to the\nfabric, silk. Now, I know that there are different\ntypes of silk, like\ndifferent quality levels or grades (I remember this, I think, when\nI was in a traditional silk shop somewhere). So, how can we tell\nhow good a piece of silk is? How do we measure the quality?\n\nSilk\nJocelyn So, when it comes to silk quality, there are a few things\nto look for. One of the most important things is the sheen (that's\njust a fancy word for how shiny the fabric is or the material is).\nThe highest-quality silk has a natural, beautiful shine. It looks\nglossy and almost wet. And it behaves like a liquid; it has a unique\nfluid flow (that I've mentioned before). The highest-quality silk\nlooks so shiny that it has a strange reflective quality to it. Now,\nas you go down in quality, the sheen is lower, so the silk looks\nless shiny, and this gives it a less fluid appearance, and it looks\nkind of flat. And there's another important difference: the higher-\nquality silks are stronger because they are made from the best\nraw material. Cheaper, lower grade silk isn't as strong because\nit's made from inferior materials; it doesn't last very long and it\ncan break or tear quite easily.\nMat\nNow, that's quite interesting because I thought the\nopposite would be true. In my mind, when I picture high-quality\nsilk, I imagine a fabric that is really delicate and easy to rip. But it\nseems like you're saying that this isn't the ca"}, {"id": "第五辑-中国符号__Paper-Cutting", "book": "第五辑 · 中国符号", "title": "Paper-Cutting · 剪纸", "text": "Paper-Cutting\n1. Why do you think traditional handicrafts are historically\nimportant to a culture?\n2. What materials do you think were used for handicrafts\nbefore paper was invented?\n3. Why might it be important to preserve\nand continue\npractising traditional handicrafts in modern times?\n\nFEX#7 k\nIt's one of the most unique and unusual Chinese handicrafts. Paper-\ncutting has a rich history, and this might surprise you: the handicraft\nis older than the invention of paper itself. Join us on this journey\nof fascinating cultural heritage that has shaped these beautiful\ncreations over thousands of years. Get ready for a journey through\nthe delicate and detailed world of Chinese paper-cutting.\nMat\nHello, and welcome to another episode of China Lifestyle\nJourneys. Today, we are talking about traditional Chinese\nhandicrafts. Just like most countries, China has a long history of\nartistic traditions in the form of handicrafts that have been passed\ndown through the generations. I have\nfeeling that this is going\nto be quite a big topic. So, Jocelyn, where should we start with\nthis topic of handicrafts?\nJocelyn OK, let's begin with the basics. Traditional Chinese\nhandicrafts cover a wide range of different crafts, including\nceramics, calligraphy, embroidery, paper-cutting, and SO on.\nThese handicrafts have evolved over thousands of years and\nare rooted in China's cultural heritage. Each craft has its own\nunique story, influenced by history and the artistic sensibilities of\ndifferent dynasties throughout history.\nMat\nAh, stories. You know I love\ngood story. I think we can\nstart with one of these handicrafts that comes with a good story.\nJocelyn I think paper-cutting is a good place to start. It's a famous\nChinese handicraft with a great story. Before we look at the story,\nlet's think about what paper-cutting actually is. It's a highly\n\nPaper-Cutting\ndecorative art form where very detailed and delicate designs are\ncarefully cut out of paper using scissors or a very sharp knife.\nThese designs can range from beautiful floral patterns to elaborate\nscenes from Chinese mythology. It takes quite a lot of skills to\ncreate these.\nNow, here's the story behind the origins of paper-cutting. Chinese\npaper-cutting has been around for centuries, and no one knows for\nsure when it began, but here's the really interesting part: paper-\ncutting as a handicraft might actually be older than paper itself.\nMat\nHang on, that doesn't make any sense. How can paper-\ncutting as a handicraft be older than paper?\n\nFIXi#t7pENe\nS\n\nPaper-Cutting\nJocelyn Yes, I know it sounds odd, but let me explain. Long\nbefore paper was invented, there had been records of the Chinese\nusing other thin materials, such as leaves, gold foil, silk, and\nleather, to carve hollowed patterns. It was found that during the\nWestern Zhou Dynasty, people had already been cutting tree\nleaves intol different patterns and designs, and giving them as\ngifts on special occasions.\nMat\nAh, OK,\nget it. So even though today it's called \"paper-\ncutting,\" originally the handicraft started out with other materials\nbefore\npaper, because at that time, paper hadn't been invented.\nAnd then later, when people had paper, they realised that this\npattern-cutting handicraft (that they'd already been doing for\nyears) worked really well with paper-better than the other\nmaterials-so everyone stopped using leaves, metal foil, silk, and\nthey just used paper. And it became known as \"paper-cutting.\"\nRight, I get it. Interesting.\nJocelyn Yes, that's what happened. And then, as paper\nbecame\neasier to produce and cheaper to buy, the art of paper-cutting\nbecame more and more popular, especially among women in rural\nareas. There was a time when it was expected of every girl to\nmaster the craft, and potential brides were often judged by their\npaper-cutting skills. Later in history, during the Southern Song\nDynasty, craftsmen mostly male-made a decent living out of\npaper-cutting. Some specialised in cutting Chinese characters,\nwhile others specialised in cutting flowers and other designs.\n\nFiX#7  t\nMat\nSo, people cut these delicate and detailed designs into\npaper,\nbut what do these designs actually mean? Are they just\npretty pictures?\nJocelyn Well, just like many aspects of traditional culture, in the\npast, paper-cutting designs were connected to agriculture (just\nbecause most people at that time relied on agriculture for their\nincome). So traditionally, many paper-cuttings depicted scenes of\nagricultural life or animals, and th"}, {"id": "第五辑-中国符号__Kung_Fu", "book": "第五辑 · 中国符号", "title": "Kung Fu · 功夫", "text": "Kung Fu\n1. What do you think makes kung fu more than just a\n\"fighting martial art\"?\n2. Why are there some animal-inspired kung fu styles, like\nsnake or monkey?\n3. What qualities do you think are necessary to become a\nkung fu master?\n\nFiX#7  t\nWe're kicking and punching with everyone's favourite fighting art,\nkung fu! While many know it just as a martial art, kung fu is far\nmore than just fighting; it's about all-round personal development.\nDiscover the rich history and origins of this ancient practice that has\nevolved into a philosophy of discipline, mental focus, and spiritual\ngrowth. Uncover the true meaning of 'kung fu\" and its diverse styles,\nincluding the famous Shaolin style. Learn how animal-inspired forms,\nlike snake and monkey, are real training methods, and find out what\nit takes to become a kung fu master.\nMat\nHello and welcome to another episode of China Lifestyle\nJourneys! Today, we're talking about the mysterious topic of\nChinese kung fu. Now, I'm sure everyone around the world knows\nthat kung fu comes from China. I think everyone has seen a kung fu\nfilm (or at least a scene from a Chinese kung fu film). But I wonder\nhow much most people really know about kung fu. So, Jocelyn,\nlet's go right back to the beginning and start with the history and\norigins of Chinese kung fu.\nJocelyn Absolutely, Mat! Chinese kung fu has a long and well-\ndocumented history that can be traced back thousands of years.\nIn its early days, it originated as a method of self-defence and\na system of combat techniques developed by ancient Chinese\nsoldiers. So, it started out as combat practice for ancient armies.\nBut over time, it has evolved into something more comprehensive,\ncombining physical training, mental discipline, and philosophical\nprinciples.\n\nKung Fu\nMat\nThat's fascinating, Jocelyn. So, kung fu isn't just about\nfighting then, even though that's what most people think.\nJocelyn Well, of course, kung fu is famous for its combat\ntechniques (basically as a way of fighting), but it encompasses\nmuch more than just fighting. It also focuses on cultivating inner\nstrength, discipline, and personal growth. People who practise\nkung fu strive for physical fitness, clear mental concentration, and\nspiritual balance. It promotes holistic well-being and encourages\npeople to develop virtues such as patience, perseverance, and\nhumility.\nMat\nWhat about the name \"kung fu\"? What does it mean and\nwhere does the name come from?\nJocelyn That's a great question, Mat! The term \"kung fu\" is often\nmisunderstood. In Chinese, the term \"kung fu\" doesn't specifically\nrefer to martial arts. It has a broader meaning that includes skill,\neffort, and achievement in any discipline or field. In the context\nof martial arts, \"kung fu\" represents the time, dedication, and\neffort put into mastering the art form. It's about the continuous\npractice and improvement of techniques, discipline, and mental\nfocus. The name \"kung fu\" is derived from the Mandarin\npronunciation of the characters \"I)*,\" which together mean \"hard\nwork\" or \"accomplishment through great effort.\" So, when we\ntalk about Chinese kung fu, we're referring to the mastery of\nmartial arts through dedication and diligent practice.\n\nmiX#t7 t\nMat\nI see, so kung fu goes beyond the physical aspect and\nhas a strong emphasis on personal development. Something like\ndeveloping a mindset and mental well-being through physical\nexercise? So, I guess there must be different styles or forms of\nkung fu.\nJocelyn Absolutely. Chinese kung fu is really diverse, with\nlots of different styles and forms. Each style has its unique\ncharacteristics, movements, and philosophies. I guess\nthe most\nfamous and well-known kung fu style is probably Shaolin. The\nShaolin style originated from the famous Shaolin Temple in Henan\nprovince, where Buddhist monks developed a system of martial\narts to promote physical fitness, self-defence, and spiritual\ngrowth. Shaolin kung fu is known for its powerful and dynamic\nmovements, precise strikes, and a combination of both strong\nand gentle techniques. Many people believe that the Shaolin style\nis the original form of kung fu and that the Shaolin Temple is the\nbirthplace of Chinese kung fu.\nMat\nI remember when I was a teenager, I liked watching kung\nfu films. Actually,\nstill like watching them today, and there's\nsomething I'll always remember from those films I saw years ago.\nSome of the styles are named after animals, like the snake or the\nmonkey, and the movements kind of copy the movements of tha"}, {"id": "第五辑-中国符号__The_Five_Elements", "book": "第五辑 · 中国符号", "title": "The Five Elements · 五行", "text": "The Five Elements\n1. How did ancient cultures use elements to describe the\nworld around us?\n2. How are elements like wood, fire, and water related to\nyour body and feelings?\n3. Which element do you think is linked to the emotion of\nanger: wood, metal, water, earth, or fire?\n\nThe Five Elements\nHave you heard of the Five Elements? If the answer is \"no,\" then don't\nworry. Many people are unfamiliar with this intriguing and mysterious\naspect of Chinese culture. We're going to explore the essence of the\nFive Elements: wood, fire, earth, metal, and water. Discover how these\nelements shape Chinese practices like acupuncture and feng shui and\nfind out how they play a role in understanding emotions, health, and\nthe world around us. Get ready to unravel the mysteries of the Five\nElements.\nMat\nHello and welcome to another episode. Today, we'll be\nlooking at something called the Five Elements. Now, I have to\nadmit, I don't know much about the Five Elements; actually, I'd\neven say\nthat I know absolutely nothing about this. I don't even\nknow where to start with this episode, Jocelyn, so I'm going to\nask\nyou to suggest a good starting point.\nJocelyn\nOK, sure thing, Mat. So, in traditional Chinese culture,\nthe Five Elements are the five basic substances that make up\nthe universe: wood, fire, earth, metal, and water. Each element is\nassociated with certain qualities and characteristics, and together\nthey form a system that helps to explain and understand the\nnatural world. The Five Elements are also used in various Chinese\npractices, such as acupuncture, feng shui, and Chinese astrology.\nSo, understanding the basics of the Five Elements can help us\nto gain a deeper appreciation and understanding of traditional\nChinese culture.\nMat\nOK, so I understand so far that they are five basic substances\n\nmiX#t7 t\nthat make up the universe: wood, fire, earth, metal, and water,\nand they're used in various aspects of Chinese culture, I guess, to\nhelp explain and understand the natural world. To me, it sounds\nlike something related to ancient natural philosophy-these\nelements that make up the universe. So, what kind of importance\ndo they play in our daily lives today?\nJocelyn That's a great question, Mat. The Five Elements play\nan important role in Chinese culture and are believed to be\npresent in everything around us, including our bodies. So each\nelement has its own unique characteristics and is associated\nwith different organs, emotions, and even seasons. For example,\nwood is associated with the liver and the emotion of anger;\n1/. & g\ne FALSIIGNE BU HOD IN K DART AWRLMORRANR OR TRUEDEHONTENWMENTNAPE At co #h sta go mns a reas Sit alarmIn tagss MaD & MAWHECTAYE FAX ATA RAPE MNA I TEEINT FIRSTY Me g DemOn So(m GEwtmnEs W111 SR TH C HER PO LIS M HOH S FE SAXOYN ALHSDON S TE DaM Bh SEne la tastele ME URI HACE ST ATRGOT BET DIE HIRBIE SHE GANEA finite b each inle\ny\n\nThe Five Elements\nfire is associated with the heart and the emotion of joy, and\nearth is associated with the spleen and the emotion of worry;\nmetal is associated with the lungs and the emotion of grief, and\nwater is associated with the kidneys and the emotion of fear. By\nunderstanding these associations, we can use the Five Elements\nto help maintain balance and harmony in our daily lives.\nMat\nHang on. Now I'm really confused. Wood is associated\nwith the liver and anger and a season? It's getting quite confusing\nalready. Is there an easier way\nto look at this?\nJocelyn OK, 1- understand how it seemed overwhelming at first,\nMat. But basically, the Five Elements are a way to categorise\nand understand different aspects of the natural world, including\nour own bodies and emotions. Each element represents a group\nof related characteristics, such as colours, shapes, tastes,\nand seasons. By understanding the basic associations of each\nelement, we can start to see patterns and connections in the\nworld around us, and even in ourselves. So, while it may seem\ncomplex, the Five Elements can ultimately help us to gain a\ndeeper appreciation and understanding of the world we live in.\nMat\nI'm even more confused now. You're telling me that each\nelement represents a group of related characteristics, such as\ncolours, shapes, tastes, seasons and parts of the body. I think\nI need some kind of real-world example, maybe the way that\nChinese people think about this in their daily lives. I think that\nwould be quite helpful because right now, I'm still quite confused.\n\nmiX#t7 t\nJocelyn OK, Mat. Let me put it another "}, {"id": "第五辑-中国符号__Tai_Chi", "book": "第五辑 · 中国符号", "title": "Tai Chi · 太极", "text": "Tai Chi\n1. What do\nyou think the term \"martial art\" actually means?\n2. Why do you\nthink people like practicing certain martial\narts in parks or quiet natural places?\n3. How long do you\nthink it takes to become a Tai Chi\nMaster?\n\nAgE Xi#7 ke\nPut on some comfortable clothes and shoes! We're going to the park\nto practice Tai Chi, a Chinese martial art that has gained global\npopularity. While Tai Chi is often associated with serene natural\nsettings and slow movements, it encompasses more than meets the\neye. We explore the connection between Tai Chi and parks, and delve\ninto its holistic aspects of relaxation, meditation, and a bond with\nnature. Get ready to uncover the essence of this ancient practice.\nMat\nHello and welcome to another episode of our show.\nToday, we'll be looking at the mysterious world of Tai Chi, a\nChinese martial art that has become very popular all around the\nworld. Now, I have to admit that I don't know much about Tai\nChi. Actually, before I came to China, had seen people doing it\nin my hometown in London in the morning. Sometimes you see\nold people doing it in parks in London really early in the morning.\nThen I came to China, and\nsaw lots of old people doing Tai Chi\n\nTai Chi\nin parks in China in the morning. So, you can probably guess my\nfirst question before we look at the history in detail. What's the\nthing with parks? Why do people always seem to be doing Tai Chi\nin parks?\nJocelyn OK, guess that's a good question to begin with. So, Tai\nChi and parks, what's the connection? Tai Chi is often practised\nin public parks in China (and in other countries) because they\nprovide\npeaceful and natural environment that helps people\nrelax. Relaxation and meditation are important features of Tai\nChi (and we'll talk more about this later). Also, the peaceful and\nnatural surroundings of parks provide an ideal setting for Tai Chi\npractice, as they create a sense of connection with nature (another\nimportant aspect of Tai Chi). And of course, in most cities, it's\neasy to find a local park, and they're usually free to use. That's\nwhy Tai Chi is commonly practised in parks.\nMat\nOK, that makes sense. So it sounds like Tai Chi is more\nthan just a physical exercise. You just mentioned relaxation,\nmeditation, and a connection with nature. Can you\ntell me more\nabout these aspects of Tai Chi?\nJocelyn Absolutely, Mat. Tai Chi is more than just a physical\nexperience; it's also a way of promoting mental and spiritual well-\nbeing. And the practice involves slow, flowing movements that\nare coordinated with deep breathing and focused attention. And\nthis combination of movement, breathing, and mindfulness can\nhelp us to reduce stress and anxiety, improve mental clarity and\n\nTai Chi\nfocus, and enhance overall feelings of calm and relaxation. Tai Chi\nis also sometimes described as a moving meditation because the\nfocus is on being present and letting go of distracting thoughts.\nAnd as for the connection with nature, many of the movements in\nTai Chi are inspired by animals or natural elements, such as trees\nor water. Practising Tai Chi in a natural setting can help to deepen\nthis connection and enhance the overall experience.\nMat\nThat's quite fascinating. So, if someone wanted to start\npractising Tai Chi, where would they start? Is there any special\nequipment or clothing they need?\nJocelyn OK, so if someone is interested in starting to practise Tai\nChi, I would recommend finding a local Tai Chi class or teacher.\nTai Chi is best learned through practice and guidance from an\nexperienced instructor. And you can ask around in your local\ncommunity or search online for Tai Chi classes near you.\nWhen\nyou\nfind a class, just wear comfortable clothing (like something\nyou'd wear for jogging) and comfortable shoes, and of course,\nbring an open mind. Tai Chi is accessible to people of all ages\nand fitness levels, so don't worry if you've never done it before.\nJust be patient with yourself and enjoy the experience of learning\nsomething new.\nMat\nNow there's one thing H really don't understand.\nSometimes Tai Chi is described as a martial art, a traditional form\nof fighting, like kung fu or Chinese boxing. But when I see those\npeople in the park, doing their slow relaxing movements, as you\n\nF Xi#7 BU\nsaid earlier, inspired by animals or natural elements, such as\ntrees or water it doesn't really look like fighting to me.\nJocelyn\nunderstand your confusion, Mat. Tai Chi is indeed a I\nmartial art, but it's\nunique form of martial art that focuses on\ndefenc"}, {"id": "第五辑-中国符号__Traditional_Chinese_Medicine", "book": "第五辑 · 中国符号", "title": "Traditional Chinese Medicine · 中医", "text": "Traditional Chinese Medicine\n1. What do you\nthink it means to take a \"holistic approach\"\nto healthcare?\n2. In what ways do you think lifestyle and environment could\nimpact your overall well-being?\n3. How might traditional Chinese medicine offer different\nsolutions for treating common problems like headaches\ncompared to Western medicine?\n\nTraditional Chinese Medicine\nAre you feeling OK? Do you need to see a doctor? Well, you're in\nthe right place, as we step into the world of Traditional Chinese\nMedicine (or TCM for short). TCM, practiced for thousands of years\nin China, takes a holistic approach to healthcare. Instead of just\ntreating symptoms, it focuses on overall well-being and balance. TCM\nprinciples, like qi and yin-yang, guide its practices. Learn how TCM\naddresses immediate concerns like headaches while promoting long-\nterm health. Discover the fascinating concepts that underpin TCM's\neffectiveness. If you're curious about ancient healing wisdom, this\nepisode is for you.\nMat\nHello and welcome to another episode of China Lifestyle\nJourneys. Today, we are exploring the fascinating world of\nTraditional Chinese Medicine, also known as TCM. Now,\ndon't\nknow much about TCM, but\ndo know that it has been practised\nin China for thousands of years. But apart from that, I don't really\nknow anything else. So, Jocelyn, where should we start with this\ntopic?\nJocelyn OK, let's start with the basics. TCM is an ancient\ntraditional system of healthcare that considers the overall\nconnection between the body, mind, and spirit. Instead of just\ntreating individual symptoms or diseases, TCM focuses on\npromoting overall well-being and restoring balance in all aspects\nof life.\nTo better understand this, let's take an example. Imagine\nsomeone experiencing frequent headaches. In standard Western\nmedicine, the focus would be on finding a specific treatment for\n\nmiX#t7 t\nthe headache, such as painkillers. However, in TCM, the doctor\n(or practitioner, as they are sometimes called) would take a step\nback and look at the person as a whole. And they would consider\nvarious factors like the person's lifestyle, diet, emotions, and even\nthe environment they are in.\nFor instance, the headaches could be seen as a sign of an\nimbalance in the body's energy flow, or qi. The TCM practitioner\nmay explore different techniques, like acupuncture or herbal\nremedies, to restore the flow of qi and bring the body back\ninto harmony. They might also suggest lifestyle changes, such\nas stress management techniques or dietary adjustments, to\naddress underlying factors that could be contributing to the\nheadaches.\n\nmiX#t7 t\nMat\nOK, I think understand this. The TCM doctor is trying to\nimprove my overall health so that I won't get any more headaches\nin the future. But what if I just want the headaches to be cured\nnow, today? I don't want to wait around for a long time, trying to\nimprove my overall health. just want .. . \"Can\nyou get rid of this\nheadache? Please help me.\" Can TCM help me in this situation?\nJocelyn Of course, that's the great thing about TCM. It can\ncertainly help with immediate symptom relief, like your headache.\nBut the main focus is on long-term well-being, so a lot of\nTCM treatments, like acupuncture, herbal remedies, or other\nmodalities, aim to help with immediate concerns while also\nconsidering the underlying imbalances for lasting results. So\nbasically, in the future, you'll get fewer headaches. In\nessence,\nTCM recognises that our well-being is influenced by multiple\nfactors and aims to address the root causes of imbalances rather\nthan alleviating symptoms. Some people describe this as a more\nholistic approach to healthcare.\nMat\nOK, so now that\nhave a better understanding of TCM's\napproach to helping with overall well-being. I'm quite interested\nand curious about the specific concepts and methods that form\nthe foundations of TCM. What are these key principles that I've\nheard about or some kind of beliefs that guide TCM practices? Or\nto put it in a really simple question, how does it work?\nJocelyn That's a great question! TCM is based on two important\nideas: qi and yin-yang. Qi is like a special energy that flows\nthrough our bodies and keeps us healthy. TCM treatments focus\n\nTraditional Chinese Medicine\non making sure this energy flows smoothly to keep us balanced.\nYin and yang are like opposites that need to be in harmony.\nYin is connected to things like darkness and rest, while yang is\nconnected to light and activity. TCM practitioners use these i"}, {"id": "第五辑-中国符号__The_Colour_Red", "book": "第五辑 · 中国符号", "title": "The Colour Red · 中国红", "text": "The Colour Red\n1. Have you ever heard of red envelopes with money inside?\n2. Why do Chinese people hang red paper on doors during\nChinese New Year?\n3. Why is red the traditional wedding colour in China?\n\nFIXi#7 bU\nLet's consider the importance of the colour red in Chinese culture.\nHave you ever wondered why red is everywhere during Chinese New\nYear from envelopes to lanterns? We're going to explore some of the\nprofound meanings behind the colour red in Chinese traditions. From\nthe symbolism of red envelopes to the significance of door couplets\nand lanterns, join us as we learn about the cultural richness and\ncustoms associated with this vibrant, special colour. Get ready to\nembark on a journey through the world of red in China.\nMat\nOK, so in this episode, we're going to talk about the\ncolour red. So last time, we talked about the Spring Festival, or\nthe Chinese New Year, and one thing that I always notice at this\ntime of year in China or in Chinatown is lots of red things. So,\nlet's start with the simple, basic question. Why red? What does\nthe colour red mean?\nJocelyn Well, red is the colour of good fortune, happiness and\nsuccess. It is a colour that is thought to bring luck, recognition,\nand fame. This is why Chinese people give each other during\nChinese New Year red envelopes with money as a gift. Red is\nfound everywhere during Chinese New Year, and other holiday\ncelebrations and family gatherings. In addition to the New Year, the\ntraditional Chinese wedding colour is also red since ancient times.\nMat\nSo, during Chinese New Year, we see many different red\nthings. I'd like to ask you about one of those red things first. So\nguess the most important one, red envelopes with money in I\nthem. Can\nyou tell me something about those?\n\nThe Colour Red\nJocelyn Oh, hongbao in Mandarin. A red envelope is a gift of\nmoney inserted into a red pocket or envelope made of paper.\nThey are given on important occasions, especially Chinese New\nYear, birthdays, and weddings, as a way to send good wishes. The\ncolour red means energy, happiness, and good luck in Chinese\nculture. So traditional red envelopes are often decorated with\nbeautiful Chinese calligraphy, pictures, and symbols.\nActually, the significance of red envelopes is the red paper and\nthe beautiful designs, not really the money inside. Wrapping lucky\nmoney in red envelopes is expected to bring more happiness,\ngood luck, and blessings to the receivers.\no\n\nFiX#7\nGenerally, on Chinese New Year's Eve or New Year's Day, young\nchildren and grandchildren give their best wishes to their parents\nand grandparents. In return, grandparents and parents gift their\nchildren and grandchildren red envelopes with money, wishing\nthem good luck in the New Year. Parents and grandparents\nalso receive red envelopes given by their grown-up children or\ngrandchildren as a way of sending them good luck, happiness,\nand health.\nNowadays, it is also a trend to send red envelopes digitally.\nMat\nAround Chinese New Year, I've also noticed that people\nput red pieces of paper on their doors, like two pieces of paper-\none on the left side, one on the right side, and sometimes at the\ntop-but usually on each side of the door. Those red pieces of\npaper they have some words on them, maybe some pictures.\nSo, what are those pieces of paper? And why do people do this?\nJocelyn Well, during the Han Dynasty, red peach wood planks\nwere hung outside homes to ward off misfortune, and this custom\nevolved into displaying auspicious words written in elegant\ncalligraphy, and that's the origin of the spring couplets. That's\nwhy these red paper designs are very traditional; sometimes\npeople just put red paper pictures of animals or flowers on the\ndoor, but sometimes they put words as well. These are called\nChinese couplets in English, duilian or chunlian in Chinese. They're\nwords written in black ink on red paper, one half on each side of\na door as a Spring Festival decoration. And they usually express\nbest wishes for the coming year.\n\nthem\nCHOLERAIRDE\nwe a kes $ sin2\ntea.\nPRAGANO\n$6.0\n\n4 th A9\nG ite*\noreos ay .sy\nBE 8 KE\nTh e\nvotaril\nUsually, the two lines are of the same number of characters that\nparallel each other grammatically and poetically. And the easy\nway to describe this is as short poems written in a special way.\nIt can be elegant, seasonal, witty, practical or in an extremely\nconcise\nway.\nMat\nOK, so I have one more question about red things during\nChinese New Year. Just before New Year, the streets are decorated\nwith th"}, {"id": "第五辑-中国符号__Terracotta_Warriors", "book": "第五辑 · 中国符号", "title": "Terracotta Warriors · 兵马俑", "text": "Terracotta Warriors\n1. What would you do if you found some ancient artefacts\nburied in a field?\n2. How many \"Terracotta Warriors\" do you think there are?\n3. Why was such a huge army of statues buried underground?\n\nTerracotta Warriors\nThey are, without doubt, one of the world's most amazing\narchaeological discoveries the Terracotta Warriors. Unearthed\nby chance in 1974 by local farmers in Shaanxi province, these life-\nsized clay soldiers, hidden underground for over 2,200 years,\noffer\na glimpse into the grandeur and mystery of ancient China. Discover\nthe fascinating story behind their creation by Emperor Qin Shi Huang,\nand learn about the ongoing excavations that continue to reveal new\nsecrets from this monumental site.\nMat\nHello, and welcome to another episode of China Lifestyle\nJourneys. Today, we're going to explore one of the most amazing\narchaeological discoveries in the world the Terracotta Warriors.\nSo, before we look at all the interesting facts and stories, let's\nstart with the discovery, because that in itself is a great story.\nJocelyn Yes, the discovery is a remarkable part of the story. It\nall began in 1974 when a group of local farmers near the city of\nXi'an in Shaanxi province of China were digging a well. As they\nwere digging, they found something quite unusual little pieces\nof clay figures. They continued digging their well (they had no\nidea what was beneath their feet under the ground), and they\ncontinued to find pieces of metal and pottery, and then a life-size\nterracotta warrior (a figure of an ancient warrior made of clay).\nMat\nWow, so let me just imagine-I'm a farmer, and I'm\ndigging a well with some of my neighbours and relatives, and\nwe keep finding these old pieces of pottery. And then we find a\ncomplete, life-size figure this ancient soldier or warrior. I can\n\nFiX#7\nimagine their surprise. They were probably thinking, what is this?\nWhat do we do with it? So, what did they do?\nJocelyn Well, according to their own story, the farmers contacted\na local historical centre and gave them the relics they had\nfound. Then, someone visiting this cultural centre saw these\nquite unusual relics and contacted a national department and\nshowed them pictures. They sent a team to investigate, and what\nhappened next was truly remarkable. When the professional\narchaeologists started to dig, they found an entire terracotta\n(or clay) army, crafted on an industrial scale 2,200 years earlier,\ncomplete with horses and chariots, hidden underground and\nnever meant to be seen by the living. This was a complete\nsurprise to everyone because there are no historical records\nof them, or of any underground army. These soldiers had sat\nuntouched underground for more than 2,200 years. So, this really\nadds to the mystery of the story.\n\nMat\nWow. What a great story. So, I guess they've been\ndigging and excavating since then. What have they found up to\nnow? Have they uncovered everything at the site?\nJocelyn That's what makes the story even more exciting and\nintriguing. The excavation has been ongoing since 1974. So far,\nabout 8,000 warriors have been partially or fully unearthed,\nalong with hundreds of weapons, chariots, and horses. But this\nonly represents a fraction of the total of what we think is buried at\nthe site. Archaeologists estimate that over 2,000 warriors remain\nto be excavated now, so new discoveries continue regularly! The\nfull extent of the site is still unknown.\nMat\nOK. So, let's pause\nfor a second and see where we are.\n\nFiX#7\nThese people discovered\nhuge army (made of clay or, as we\noften say, terracotta which is a special type of clay with that red\ncolour), and these statues were buried underground for over\n2,000 years, and the history books never mentioned this place.\nSo, what's going on? Who made this army, and then why did they\nbury it?\nJocelyn You're right-it's quite a mystery how such a huge historical\ndiscovery could have been lost to history for so long. The\nTerracotta Army was constructed on the orders of Qin Shi Huang,\nthe first emperor of China. Qin unified China in 221 BCE and\nthen commissioned the army to be created to guard his tomb\nin the afterlife. Each highly detailed warrior was made by hand,\nreflecting the massive resources available to the emperor.\n\nTerracotta Warriors\nIt's difficult to say, but some estimates think that over 700,000\nartists and craftsmen worked on the emperor's tomb complex.\nAfter the emperor died in 210 BCE, written records indicate\nthe tomb was sealed off, and those who knew i"}, {"id": "第五辑-中国符号__The_Forbidden_City", "book": "第五辑 · 中国符号", "title": "The Forbidden City · 紫禁城", "text": "The Forbidden City\n1. What does the word \"forbidden\" actually mean when\nwe're talking about The Forbidden City?\n2. Is The Forbidden City really a city?\n3. Why does the number 9 have significance for The Forbidden\nCity?\nLObiT\n\nThe Forbidden City\nWe're stepping through the gate into one of the most iconic and\nhistorically important places in China the Forbidden City. This\nenormous palace complex was once the home of Chinese emperors,\nthe a place where no one could enter or leave without emperor's\npermission. Despite the name, it's not an actual city; it's more like\na sprawling palace complex, functioning like a self-contained city.\nIt symbolises imperial power and authority, showcasing impressive\narchitecture and symbolic design. Join us as we explore the\nfascinating history, unique features, and enduring legacy of this\nremarkable site.\nMat\nHello and welcome to another episode of China Lifestyle\nJourneys. Today, we're taking a trip to one of the most iconic\nand historically important places in China the Forbidden City. I\nvisited The Forbidden City many years ago, but\ndon't remember\nmany of the facts and important stories about this place. So\ntoday will be a good opportunity to revisit those facts and stories.\nNow, Jocelyn,\nguess we should start with the name. Why is it\ncalled The Forbidden City (when it's not forbidden, I went there,\nand it's not really a city)?\nJocelyn\nThe name \"Forbidden City\" can indeed be a bit misleading\ntoday. The name dates back to the period when this enormous\npalace network was the home of the Chinese\nemperors, and\nno one could enter or leave without the emperor's permission.\nCommon people were forbidden from entering, and even most\ngovernment officials and military leaders could only enter for\nofficial business. And yes, you're right, it's not actually a city,\n\nmiX#t7 t\nbut more like a palace complex covering over 180 acres (if you\nimagine about 120 soccer fields, that's how big it is). In the past,\npeople called it \"a city\" because inside, it seemed like a city. At\nits peak, over 10,000 people lived within its walls, including the\nimperial family, servants, guards, and officials. So while it wasn't\nan actual city open to the public, it functioned like a city within its\nwalls.\nMat\nOK, that makes sense. It was self-contained and\nfunctioned like a small city, so that's where we get the name from.\nNow, let's think a bit more about the history. Who built it, when\ndid they bu function esc(s){ return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function mdParas(t){
  const raw = String(t || "");
  let blocks = raw.split(/\r?\n\s*\r?\n/).map(b => b.trim()).filter(Boolean);
  if(blocks.length <= 1 && raw.length > 200){
    const sents = raw.match(/[^.!?]*[.!?]+[\s]*/g) || [raw];
    let buf = [], len = 0;
    for(const s of sents){
      if(len + s.length > 200 && buf.length){ blocks.push(buf.join("")); buf=[]; len=0; }
      buf.push(s); len += s.length;
    }
    if(buf.length) blocks.push(buf.join(""));
  }
  return blocks.map(b => b.replace(/^#\s+.+$/gm, "").trim()).filter(Boolean);
}
function alignParas(arts){
  const keys=["A2","B1","B2"];
  const split={};
  let N=0;
  keys.forEach(k=>{const p=mdParas(arts[k]);split[k]=p;if(p.length>N)N=p.length;});
  keys.forEach(k=>{while(split[k].length<N){let li=0,mx=0;
    split[k].forEach((p,i)=>{if(p.length>mx){mx=p.length;li=i;}});
    const sents=split[k][li].match(/[^.!?]*[.!?]+[\s]*/g)||[split[k][li]];
    if(sents.length<2)break;
    const mid=Math.ceil(sents.length/2);
    const a=sents.slice(0,mid).join(""),b=sents.slice(mid).join("");
    split[k].splice(li,1,a,b);
  }});
  return split;
}
/* 读 AI 分级结果（AI 推荐档位）：用户未手动切档时，设为默认展示档位 */
function applyLive(){
  const o = liveOut(); if(!o || isExcludedStatus(o.status)) return;
  /* 缓存抽取好的事实，供后续换风格时直连「生成专用」工作流（跳过事实抽取/排查/分级） */
  if(o.summary && o.facts_text){
    state.factsCache = { summary: o.summary, facts_text: o.facts_text, angle: o.angle, level: o.level, facts_raw: o.facts_raw || o.fact_json || "" };
  }
  /* 解析练习题（quiz_json：每档 4 题 = 2 阅读理解 + 2 literacy[词汇/文化背景]） */
  if(o.quiz_json){
    try {
      const qj = JSON.parse(o.quiz_json);
      if(qj && typeof qj === "object" && (qj.A2 || qj.B1 || qj.B2)){
        state.quiz = qj;
        state.quizShow = {};
      }
    } catch(e) { /* 题目解析失败不影响主流程 */ }
  }
  /* 解析段落↔事实卡绑定（fact_map），失败不影响主流程 */
  if(o.fact_map){
    try {
      const fm = JSON.parse(o.fact_map);
      if(fm && typeof fm === "object"){ state.factMap = fm; state.unusedFacts = []; }
    } catch(e) { /* 绑定解析失败不影响主流程 */ }
  }
  if(o.unused_facts && (!state.unusedFacts || !state.unusedFacts.length)){
    try {
      const uf = JSON.parse(o.unused_facts);
      if(Array.isArray(uf)) state.unusedFacts = uf.map(n=>parseInt(n,10)).filter(n=>n>=1);
    } catch(e) { /* 同上 */ }
  }
  const vj = liveVJ();
  if(o.level && ["A2","B1","B2"].includes(o.level)){
    state.live.recommendedLevel = o.level;
    if(!state.lvlManual) state.lvl = o.level;
  }
  const arts = { A2: o.article_a2, B1: o.article_b1, B2: o.article_b2 };
  /* 事实抽取专用工作流只返回事实卡，没有文章字段 —— 此处跳过建 GEN，
     由「内容生成」环节的 runGeneration 产出文章后再走下面的逻辑。 */
  if(!o.article_a2 && !o.article_b1 && !o.article_b2) return;
  /* 优先用 Dify 工作流 nodeAlign（⑥+ 段落对齐）返回的对齐结果；未运行旧版工作流时本地兜底 */
  let alignedParas = null;
  try {
    const pk = { A2: o.paras_a2, B1: o.paras_b1, B2: o.paras_b2 };
    const parsed = {}; let ok = true;
    Object.keys(pk).forEach(k => {
      const v = JSON.parse(pk[k]);
      if (!Array.isArray(v) || !v.length) ok = false; else parsed[k] = v;
    });
    if (ok) alignedParas = parsed;
  } catch(e) { alignedParas = null; }
  if (!alignedParas) alignedParas = alignParas(arts);
  const wcOf = t => (String(t || "").match(/[A-Za-z][A-Za-z''-]*/g) || []).length;
  const sentOf = t => Math.max(1, (String(t || "").split(/[.!?]+(?:\s|$)/).filter(s => s.trim().length > 2).length));
  Object.keys(arts).forEach(k => {
    const raw = String(arts[k] || "");
    const paras = alignedParas[k];
    const firstLine = String(raw).split(/\r?\n/).map(l => l.trim()).find(Boolean) || "";
    const title = firstLine.replace(/^#+\s*/, "").replace(/^Title:\s*/i, "").trim() || o.title || "Untitled";
    const wc = wcOf(raw), sc = sentOf(raw);
    const r = vj && vj.results ? vj.results.find(x => x.level === k) : null;
    const score = r ? r.score : null;
    const metrics = [
      [{ zh: (score != null ? "校验 " + score + "/8" : "—"), en: (score != null ? score + "/8 checks" : "—") }, score != null ? Math.round(score / 8 * 100) : 30],
      [{ zh: (wc / sc).toFixed(1) + " 词/句", en: (wc / sc).toFixed(1) + " w/s" }, 70],
      [{ zh: state.live.elapsed + " s（全流程）", en: state.live.elapsed + " s (workflow)" }, 55],
      [{ zh: wc + " 词", en: wc + " words" }, Math.min(100, Math.round(wc / 4))],
    ];
    const used = r ? r.checks.map(c => (c.status === "pass" ? "✓" : c.status === "warn" ? "!" : "✕") + " " + c.name + (c.detail ? " · " + c.detail : "")) : [L("（校验数据待运行后填充）", "(run workflow to populate)")];
    GEN[k] = {
      title: title,
      by: "Graded rewrite · CEFR " + k + " · " + wc + " words · AI LIVE",
      cover: { tag: { zh: "中国故事 · " + (state.live.book || "授权素材"), en: "China's Story" },
               line: title.toUpperCase().slice(0, 42),
               sub: { zh: state.live.label || "", en: state.live.label || "" } },
      paras: paras.map(p => [p]), metrics: metrics, used: used,
    };
  });
  if(vj && vj.results){
    const names = [];
    vj.results.forEach(r => r.checks.forEach(c => { if(!names.includes(c.name)) names.push(c.name); }));
    VALS = names.map((n, i) => {
      const st = vj.results.map(r => ((r.checks.find(c => c.name === n) || {}).status) || "pass");
      const worst = st.includes("fail") ? "warn" : st.includes("warn") ? "warn" : "pass";
      const detail = vj.results.map((r, ix) => r.level + " " + (st[ix] === "pass" ? "✓" : st[ix] === "warn" ? "!" : "✕")).join(" · ");
      return ["V" + (i + 1), { zh: n, en: n }, worst, detail];
    });
  }
  /* 工作流跑完后，为当前素材实时生成专属封面（异步，失败回退主题封面图） */
  genLiveCover();
}

function buildRail(){
  rail.innerHTML = "";
  RAIL.forEach(sec => {
    /* 占位一级标题（团队成员） */
    if(sec.type === "ph"){
      const h = document.createElement("div"); h.className = "rl1 ph";
      h.innerHTML = `<span class="rt">${L(sec.name, sec.nameEn)}</span>`;
      h.onclick = () => toast(L("模块开发中…","Under development"));
      rail.appendChild(h);
      return;
    }
    /* 直达一级标题（素材库 / 内容库） */
    if(sec.type === "item"){
      const lb = stepLabel(sec.idx);
      const h = document.createElement("div"); h.className = "rl1"; h.dataset.idx = sec.idx;
      h.innerHTML = `<span class="rt">${L(lb.zh, lb.en)}</span>`;
      h.onclick = () => go(sec.idx);
      rail.appendChild(h);
      return;
    }
    /* 可展开一级标题（工作台 / 发布管理） */
    const exp = expandedSections.has(sec.id);
    const h = document.createElement("div"); h.className = "rl1";
    h.innerHTML = `<span class="rt">${L(sec.name, sec.nameEn)}</span><span class="caret">${exp?"▼":"▶"}</span>`;
    h.onclick = () => toggleSection(sec.id);
    rail.appendChild(h);
    if(exp){
      sec.steps.forEach(i => {
        const d = document.createElement("div"); d.className = "rstep sub"; d.dataset.idx = i;
        d.innerHTML = railStepHTML(i);
        d.onclick = () => go(i); rail.appendChild(d);
      });
    }
  });

}
function toggleSection(id){ if(expandedSections.has(id)) expandedSections.delete(id); else expandedSections.add(id); buildRail(); }
function refreshRail(){
  $$(".rstep").forEach(r=>{
    if(r.classList.contains("ph")) return;
    const j = +r.dataset.idx;
    /* 「素材创建」菜单（step 0）在其子流程（step 0-3）内保持高亮 */
    const inMatCreate = j===0 && cur>=0 && cur<=3;
    /* 「文章生产」菜单（step 5）在其生产子流程（step 5-10）内保持高亮 */
    const inArtProd = j===5 && cur>=5 && cur<=10;
    r.classList.toggle("locked", !canOperate(j));
    r.classList.toggle("active", j===cur || inMatCreate || inArtProd);
    r.classList.toggle("skipped", isSkipped(j));
  });
  /* 直达一级标题（素材库 / 内容库）的激活态与只读态 */
  $$(".rl1[data-idx]").forEach(r=>{
    const j = +r.dataset.idx;
    r.classList.toggle("active", j===cur);

  });
}

  if(!state.user){

    state.customHots = real.map((r)=>({
      custom:true, type:"url", name: r.source || "自定义信源", tag:{zh:"真实抓取",en:"live"},
      topic: r.topic, cn: r.source, heat: r.heat || 60, srcs: 1,
    }));
    toast(L("已真实抓取 "+real.length+" 条内容","Fetched "+real.length+" real items"));

  }
  render();
}

/* ---- Agent-Reach 真实抓取（后端桥接层，失败回退内置数据） ---- */
/* 记录最近一次请求失败的原因。原来 !r.ok 与异常都返回 null，
   调用方无法区分「桥接层不可达」和「确实没有数据」，界面一律显示"暂无热点"。 */
let lastFetchError = null;
async function fetchJSON(url){
  try {
    const r = await fetch(url, { mode: "cors" });
    if(!r.ok){
      lastFetchError = { url: url, status: r.status, msg: "HTTP " + r.status };
      return null;
    }
    lastFetchError = null;
    return await r.json();
  } catch(e){
    lastFetchError = { url: url, status: 0, msg: (e && e.message) || String(e) };
    return null;
  }
}
/* 抓取结果的降级信息：{ degraded, errors[] }，供界面区分「没有内容」与「抓取失败」 */
/* 渲染器（headless Chrome / CDP）不可用只是次要路径失效：正文有直达文章 JSON 兜底，
   实测 30/30 条目仍有完整正文。这类 warn 不算「降级」，避免界面显示误导性提示。 */
function isRenderWarn(e){
  const s = String((e && e.scope) || "");
  return s.indexOf("render.") === 0 && (e && e.severity) === "warn";
}
function digestFetchResult(j, scope){
  if(j && Array.isArray(j.items)){
    const errs = j.errors || [];
    return { items: j.items, degraded: !!(j.degraded || errs.some(e => !isRenderWarn(e))), errors: errs };
  }
  // j 为 null → 请求本身失败（桥接层不可达等），绝不能当作"没有内容"
  const why = (lastFetchError && lastFetchError.msg) || L("桥接层不可达","bridge unreachable");
  return { items: null, degraded: true, errors: [{ severity: "error", scope: scope, msg: why }] };
}
async function fetchRealTrends(theme, sub){
  const q = "theme=" + encodeURIComponent(theme) + (sub ? "&sub=" + encodeURIComponent(sub) : "");
  const j = await fetchJSON(AGENT_REACH_API + "/api/trends?" + q);
  const r = digestFetchResult(j, "trends");
  state.trendsDegraded = r.degraded;
  state.trendsErrors = r.errors;
  return r.items;
}
async function fetchRealScan(){
  const srcs = (state.user && state.user.sources) || [];
  if(!srcs.length) return null;
  const urls = srcs.map(s => s.url).join(",");
  const j = await fetchJSON(AGENT_REACH_API + "/api/scan?urls=" + encodeURIComponent(urls));
  const r = digestFetchResult(j, "scan");
  state.trendsDegraded = r.degraded;
  state.trendsErrors = r.errors;
  return r.items;
}
async function checkBridge(){
  const j = await fetchJSON(AGENT_REACH_API + "/api/health");
  state.bridgeOk = !!(j && j.ok);
  if(state.bridgeOk && !state.realHots){
    state.realScanning = true; startScanTimer(); if(cur === 1) render();
    const items = await fetchRealTrends("all", null);
    state.realHots = items; state.realScanning = false; stopScanTimer();
  }
  if(cur === 1) render();
}
async function setHotTheme(k){
  state.hotTheme = k; state.hotSubTheme = null; state.realHot = null;
  if(!k){ state.realHots = null; state.realScanning = true; startScanTimer(); render();
    const items = await fetchRealTrends("all", null);
    state.realHots = items; state.realScanning = false; stopScanTimer(); render(); return; }
  state.realHots = null; state.realScanning = true; startScanTimer(); render();
  const items = await fetchRealTrends(k, null);
  state.realHots = items; state.realScanning = false; stopScanTimer(); render();
}
async function setHotSub(k){
  state.hotSubTheme = k; state.realHot = null;
  if(!state.hotTheme){ render(); return; }
  state.realHots = null; state.realScanning = true; startScanTimer(); render();

/* 扫描计时：抓取时实时显示"已用 X 秒 / 预计约 Y 秒"，避免用户以为卡住 */
let scanTimer = null;
function startScanTimer(){
  state.scanElapsed = 0;
  if(scanTimer) clearInterval(scanTimer);
  scanTimer = setInterval(() => {
    state.scanElapsed += 1;
    if(cur === 1) renderHots();

}
function stopScanTimer(){ if(scanTimer){ clearInterval(scanTimer); scanTimer = null; } }
/* 预估耗时：首次含 AI 双向翻译约 50-90s；之后命中缓存约 15-30s */
function scanEstimateText(){

/* 刷新：重新探测后端并真实抓取当前主题（未选主题时抓全部），后端未连接则明确提示、不静默回退演示数据 */
async function refreshTrends(){
  const health = await fetchJSON(AGENT_REACH_API + "/api/health");
  state.bridgeOk = !!(health && health.ok);
  if(!state.bridgeOk){
    state.realHots = null;
    const _local = /127\.0\.0\.1|localhost/i.test(AGENT_REACH_API);
    toast(_local
      ? L("后端桥接未连接（" + AGENT_REACH_API + "），无法真实抓取。请先在本机运行 backend/agent_reach_bridge.py","Backend bridge not connected (" + AGENT_REACH_API + ") — run backend/agent_reach_bridge.py locally first")
      : L("后端桥接无响应（" + (AGENT_REACH_API || "同源") + "）。请确认服务已部署且 /api/health 可访问","Backend bridge unreachable (" + (AGENT_REACH_API || "same-origin") + "). Check the service is deployed and /api/health responds"));
    render();
    return;
  }
  state.realHot = null;
  state.realHots = null;
  state.realScanning = true;
  startScanTimer();
  render();
  const theme = state.hotTheme || "all";
  const items = await fetchRealTrends(theme, state.hotSubTheme || null);
  state.realScanning = false; stopScanTimer();
  if(items === null){
    state.bridgeOk = false; state.realHots = null;
    toast(L("真实抓取失败 · 后端未响应","Live fetch failed — backend not responding"));
  } else if(items.length){
    state.realHots = items;
    toast(L("已刷新 · 真实抓取 "+items.length+" 条热点","Refreshed — fetched "+items.length+" live topics"));
  } else if(items.length === 0 && state.trendsDegraded){
    // 有源失败时不能说"没有热点"——那是抓取失败，不是没内容
    state.realHots = [];
    toast(L("抓取失败：0 条内容，且有信源报错（详见页面提示）","Fetch failed: 0 items and some sources errored (see the notice on this page)"));
  } else {
    state.realHots = items || [];
    toast(L("本次抓取无匹配热点，请换一个主题试试","No matching topics — try another theme"));
  }
  render();
}
/* 素材是否有可用正文。低于 200 字符基本只剩标题/摘要，事实抽取抽不出有价值的事实卡。
   实测：用 40–84 字符的纯标题跑抽取，status 全是 succeeded 但只出 0–3 张废话卡。 */
function hasUsableText(h){
  const len = (h && h.fulltext_len != null) ? h.fulltext_len : ((h && h.fulltext) ? h.fulltext.length : 0);
  return len >= 200;
}

/* 复制原文链接。navigator.clipboard 在非 HTTPS / 无权限时不可用，降级到 execCommand */
function copySourceUrl(){
  const h = state.pendingHot;
  const url = (h && h.url || "").trim();
  if(!url){ toast(L("没有可复制的链接","No link to copy")); return; }
  const done = () => toast(L("链接已复制，去新标签页打开并复制正文","Link copied — open it in a new tab and copy the body"));
  const fail = () => toast(L("复制失败，请手动选中链接复制","Copy failed — please select and copy the link manually"));
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done, fail);
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = url;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
    document.body.removeChild(ta);
    ok ? done() : fail();
  }catch(e){ fail(); }
}
function cancelPasteHot(){ state.pendingHot = null; render(); }
/* 跳过粘贴，仍用标题继续（已明确告知后果，用 _skipPaste 放行避免重复弹窗） */

function submitPasteHot(){
  const h = state.pendingHot; if(!h) return;

  state.pendingHot = null;

}
function pickRealHot(h){

function toggleTopicIdx(theme, si){
