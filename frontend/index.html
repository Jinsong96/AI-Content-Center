.mat-stat-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.mat-stat-card.clickable{cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;user-select:none}
.mat-stat-card.clickable:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,24,40,.09)}
.mat-stat-card.active{border-width:2px;padding:11px;font-weight:700}
.mat-stat-ico{font-size:20px}
.mat-stat-num{font-size:20px;font-weight:800;color:var(--text);margin:4px 0}
.mat-stat-lbl{font-size:11px;color:var(--sub)}
.mat-toolbar{display:flex;flex-direction:column;gap:8px;margin:0 0 10px}
.mat-search{width:100%;padding:9px 12px;border:1px solid var(--border2);border-radius:8px;font-size:13px;font-family:var(--font)}
.mat-search:focus{outline:none;border-color:var(--pri)}

.mat-filter-btn{font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid var(--border2);background:#fff;color:var(--sub);cursor:pointer;transition:all .12s}
.mat-filter-btn.active{border-width:2px;font-weight:700}
.mat-filter-btn:hover{background:var(--bg)}
.mat-collector-filters{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.mat-collector-filters select{padding:4px 8px;border:1px solid var(--border2);border-radius:6px;font-size:12px;font-family:var(--font)}

.mat-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.mat-table th{background:var(--bg);font-size:11px;font-weight:700;color:var(--sub);padding:10px 8px;text-align:left;border-bottom:1px solid var(--border)}
.mat-table td{padding:8px;border-bottom:1px solid var(--border);font-size:12px}
.mat-table tr:last-child td{border-bottom:none}
.mat-title-cell{cursor:pointer}
.mat-title-cell:hover b{color:var(--pri)}
.mat-table input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--pri);vertical-align:middle}
.mat-muted{color:var(--muted)}
.mat-status-badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid}
.mat-pagination{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0;font-size:12px;color:var(--sub)}
.empty-state{padding:44px;text-align:center;color:var(--muted);font-size:13px}

/* 文章库 · 人工审核上下文条（从文章库进入分档审核时显示在页顶） */
.rvbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;margin:0 0 12px;background:#FFF7ED;border:1px solid #FDD9A8;border-radius:10px}
.rvbar-l{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.rvbar-tag{flex:0 0 auto;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:#F79009;color:#fff}
.rvbar-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);min-width:0}
.rvbar-meta b{font-size:13px;color:var(--tx)}
.rvbar-meta code{font-size:11px;background:#fff;border:1px solid var(--border2);border-radius:4px;padding:1px 5px}
/* 素材详情弹窗 */
.mat-detail{padding:4px}
.mat-detail-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.mat-detail-h h3{font-size:16px;font-weight:800}
.mat-detail-meta{display:grid;gap:8px;margin-bottom:16px}
.mat-detail-row{display:flex;gap:10px;font-size:12px;line-height:1.6}
.mat-detail-row span{color:var(--muted);min-width:80px;flex-shrink:0}
.mat-detail-row b{font-weight:600}
.mat-detail-row code{font-size:10.5px;color:var(--pri);background:var(--pri-t);padding:1px 4px;border-radius:4px}
.mat-detail-row a{color:var(--pri);word-break:break-all}
.mat-detail-section{margin-bottom:16px}
.mat-detail-section h4{font-size:13px;font-weight:700;margin-bottom:8px}
.mat-detail-text{font-size:12px;line-height:1.7;color:var(--sub);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;white-space:pre-wrap;max-height:200px;overflow-y:auto}
.mat-detail-actions{display:flex;gap:8px}
/* ============ 右侧抽屉（素材详情） ============ */
.drawer-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(16,24,40,.35);z-index:9998;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;width:min(420px,88vw);height:100vh;background:var(--card);box-shadow:0 8px 32px rgba(16,24,40,.18);z-index:9999;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.22,1,.36,1)}
.drawer.open{transform:translateX(0)}
.drawer-header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border)}
.drawer-header h3{font-size:16px;font-weight:700}
.drawer-close{width:30px;height:30px;border:none;background:none;font-size:22px;line-height:1;color:var(--muted);cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:center}
.drawer-close:hover{background:var(--bg);color:var(--text)}
.drawer-body{flex:1;overflow-y:auto;padding:18px 22px 24px}
.drawer-footer{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--border)}

/* ================= 2026-09-15 窄屏骨架（A1） =================
   根因：全站 9 条 @media 只改了卡片网格，没有一条处理骨架。
   420px 视口下 #body 的 1fr 列被内容顶到 ~336px，页面被撑到 557px，右侧按钮落到屏幕外。
   处理：① 主区允许收缩（minmax(0,1fr) + min-width:0）② ≤860px 时左侧栏改为可唤起的抽屉。 */
.railbtn{display:none;width:34px;height:34px;border:1px solid var(--border2);background:#fff;border-radius:9px;cursor:pointer;flex-direction:column;justify-content:center;align-items:center;gap:3px;padding:0;flex-shrink:0}
.railbtn span{display:block;width:15px;height:2px;border-radius:2px;background:var(--text)}
.railbtn:hover{border-color:var(--pri)}
.rail-overlay{position:fixed;inset:56px 0 0 0;background:rgba(16,24,40,.35);z-index:9000;display:none}
.rail-overlay.open{display:block}
#stage .wrap,#stage .workbench,#stage .aligngrid,#stage .dashcols{min-width:0}
#stage .alignrow{min-width:0}
@media (max-width:860px){
  .railbtn{display:flex}
  #body{grid-template-columns:minmax(0,1fr)}
  #rail{position:fixed;top:56px;left:0;bottom:0;width:252px;z-index:9001;transform:translateX(-100%);transition:transform .25s cubic-bezier(.22,1,.36,1);box-shadow:0 12px 32px rgba(16,24,40,.18)}
  #rail.open{transform:none}
  #topbar{padding:0 12px;gap:8px;min-width:0}
  #topbar .logo{flex-shrink:0}
  #topbar .langctl{flex-shrink:0}
  #topbar .title{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
  #topbar .userchip{min-width:0;flex-shrink:1}
  #topbar .userchip .uinfo{min-width:0;overflow:hidden}
  #topbar .userchip .uinfo b{max-width:100%}
  #topbar .userchip .uinfo span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #topbar .badge{display:none}
  .wrap{padding:18px 14px 44px}
  .workbench{grid-template-columns:1fr}
  .mat-table{display:block;overflow-x:auto;white-space:nowrap}
  .bigbar{padding:8px 10px;gap:6px}
}
/* A1 收尾：≤560px 顶栏字号下调一级并隐藏平台名（页面名已由 stagehead 承担），
   给「角色 + 账号 + 退出 + 语言」留出空间，避免顶栏把整页撑出横向滚动条。 */
@media (max-width:560px){
  #topbar{padding:0 10px;gap:6px}
  #topbar .title{display:none}
  #topbar .logo{font-size:11.5px;height:24px;padding:0 8px}
  #topbar .langctl button{font-size:11px;padding:0 7px}
}

/* ===== 2026-09-15 窄屏收尾：多列栅格塌列（修 420px 下卡片被挤到 60~90px、每 2~3 字换行） ===== */
/* 🔴 入口卡 2026-09-21 从 3 张变 4 张 → 写死 repeat(3,1fr) 会让第 4 张单独占一行且只占 1 列，
   右边空两格。改用 auto-fit，3 / 4 张都自适应，窄屏由下面的媒体查询接管。
   （同族的坑：改档位数量时 CSS 列数必须同步改，否则卡片塌成 ~0 宽、文字竖排。） */
.routegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
@media (max-width:720px){
  .routegrid,.hotgrid,.tagboard,.specgrid,.kbgrid,.sigcols{grid-template-columns:1fr}
  .idrow,.bankcaps,.dashstats,.mat-stats,.mat-stats.c5{grid-template-columns:repeat(2,1fr)}
  .genlayout,.frow,.slotrow2,.review3{grid-template-columns:1fr}
  .srccard p{min-height:0}
}
@media (max-width:480px){
  .idrow,.bankcaps,.dashstats,.mat-stats,.mat-stats.c5{grid-template-columns:1fr}
}

/* ================= 2026-09-21 授权母稿导入面板（第四入口） ================= */
.licimp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:860px){ .licimp{grid-template-columns:1fr} }
.licimp-c{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.licimp-t{font-size:12.5px;font-weight:800;color:var(--text);margin-bottom:8px}
.licimp-c textarea{width:100%;box-sizing:border-box;border:1px solid var(--border2);border-radius:9px;padding:10px 12px;font-size:13px;line-height:1.7;font-family:inherit;resize:vertical;outline:none;background:#fff;color:var(--text)}
.licimp-c textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-t)}
.licimp-n{font-size:11.5px;color:var(--muted);margin-left:10px}
.licdrop{display:flex;flex-direction:column;gap:6px;align-items:flex-start;justify-content:center;min-height:126px;border:1px dashed var(--border2);border-radius:10px;padding:16px 18px;cursor:pointer;background:#fff;transition:all .15s}
.licdrop:hover{border-color:var(--pri);background:var(--pri-t)}
.licdrop b{font-size:13px;color:var(--pri-tx)}
.licdrop span{font-size:11.5px;color:var(--sub);line-height:1.7}
.licsum{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin-bottom:10px}
.licempty{background:var(--bg);border:1px dashed var(--border2);border-radius:10px;padding:26px 20px;text-align:center;font-size:12.5px;color:var(--muted)}
.licrow{border:1px solid var(--border);border-radius:11px;padding:13px 15px;margin-bottom:10px;background:#fff}
.lich{display:flex;align-items:center;gap:10px}
.licno{font-size:11px;font-weight:800;color:var(--pri-tx);background:var(--pri-t);border-radius:6px;padding:2px 8px;flex:none}
.lictitle{flex:1;min-width:0;border:1px solid transparent;border-radius:8px;padding:6px 9px;font-size:13.5px;font-weight:700;color:var(--text);font-family:inherit;background:transparent}
.lictitle:hover{border-color:var(--border2)}
.lictitle:focus{border-color:var(--pri);background:#fff;outline:none}
.licdel{flex:none;min-height:32px;padding:5px 12px;font-size:12px;font-weight:700;color:#A32D2D;background:var(--bg);border:1px solid var(--border2);border-radius:8px;cursor:pointer;font-family:inherit}
.licdel:hover{background:#FEF3F2;border-color:#FDA29B}
.licmeta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:9px}
.licf{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.licf select,.licf input[type=number]{font-family:inherit;font-size:12.5px;color:var(--text);background:#fff;border:1px solid var(--border2);border-radius:7px;padding:5px 8px;min-height:32px}
.licf input[type=number]{width:64px}
.licf select:focus,.licf input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-t)}
.licchk{cursor:pointer;user-select:none}
.licchk input{width:16px;height:16px;accent-color:var(--pri)}
.liccalc{margin-top:9px;padding-top:9px;border-top:1px solid var(--border);font-size:12px;color:var(--sub);line-height:1.8}
.liccalc.warn{color:#D04418}
.licdet{margin-top:8px}
.licdet summary{font-size:11.5px;color:var(--muted);cursor:pointer;min-height:26px;padding:3px 0}
.licdet summary:hover{color:var(--pri-tx)}
.licdet pre{margin:8px 0 0;padding:11px 13px;background:var(--bg);border:1px solid var(--border);border-radius:9px;font-size:11.5px;line-height:1.8;color:var(--sub);white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto;font-family:inherit}
.licneed{margin-top:14px;padding:11px 15px;background:#FFFAEB;border:1px solid #FFDFCF;border-radius:10px;font-size:12.5px;color:#D04418;line-height:1.8}
/* 预处理结果**未达标**时用更重的样式（2026-09-22）：段数/词数任一不合格都走这里，
   不能让 ok=false 的结果看起来跟正常的一样。 */
.licneed.bad{background:#FEF2F2;border-color:#F0B0B0;color:#B42318}
.licneed.bad b{font-weight:600}
.licok{margin-top:14px;padding:11px 15px;background:var(--bg);border:1px dashed var(--border2);border-radius:10px;font-size:12.5px;color:var(--sub)}
/* 分段确认页（图 A 跑完后的人工确认环节） */
.licseg{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:9px;background:#fff}
.licsegh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:7px}
.licsegw{font-size:12px;font-weight:800;color:var(--sub)}
.licsegw.warn{color:#D04418}
.licsegt{font-size:11.5px;color:var(--muted)}
.licmini{min-height:28px;padding:3px 10px;font-size:11.5px;font-weight:700;color:var(--sub);background:var(--bg);border:1px solid var(--border2);border-radius:7px;cursor:pointer;font-family:inherit}
.licmini:hover{border-color:var(--pri);color:var(--pri-tx)}
.licmini:disabled{opacity:.45;cursor:not-allowed}
.licmini.danger{color:#A32D2D;margin-left:auto}
.licmini.danger:hover{border-color:#FDA29B;color:#A32D2D}
.licseg textarea{width:100%;box-sizing:border-box;border:1px solid var(--border2);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.75;font-family:inherit;resize:vertical;outline:none;color:var(--text);background:#fff}
.licseg textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-t)}

/* ================= 2026-09-15 可用性修正（A4 / A6 / B3 / B7 / C4 / C5 / C10） ================= */
.tint.neutral{background:var(--neutral-t);color:var(--sub)}
.tint.pri{background:var(--pri-t);color:var(--pri-tx)}
/* A4 引导型空态（统计卡 / 分页 / 「暂无匹配」三件套的替代） */
.guide-empty{background:#fff;border:1px dashed var(--border2);border-radius:14px;padding:44px 30px;text-align:center;margin:18px 0}
.guide-empty .ge-t{font-size:16px;font-weight:800;color:var(--text);margin-bottom:10px}
.guide-empty .ge-d{font-size:13px;line-height:1.85;color:var(--sub);max-width:620px;margin:0 auto 20px}
.guide-empty .ge-d b{color:var(--text)}
.guide-empty .ge-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* A6 事实卡引用：可悬停、可点开 */
.fcite .fcref{display:inline-block;font-weight:700;color:var(--pri-tx);background:var(--pri-t);border:1px solid #FFDFCF;border-radius:6px;padding:1px 7px;margin-right:4px;cursor:pointer;transition:all .12s}
.fcite .fcref:hover{background:#FFE3D6;border-color:var(--pri)}
.fcite .fcref:focus{outline:2px solid var(--pri);outline-offset:1px}
.fcbox .fcbox-en{font-size:14px;line-height:1.7;color:#1D2939;font-weight:600}
.fcbox .fcbox-zh{font-size:13px;line-height:1.7;color:var(--sub);margin-top:8px;padding-left:10px;border-left:2px solid var(--border)}
/* A7 内部代号：收进 hover 提示 */
.hintcode{color:var(--muted);border-bottom:1px dotted var(--border2);cursor:help;font-size:12px}
