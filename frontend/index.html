<style>
:root{
  --bg:#FFFDF9; --card:#ffffff; --border:#EAECF0; --border2:#D0D5DD;
  --text:#101828; --sub:#475467; --muted:#98A2B3;
  --pri:#E65425; --pri-d:#D04418; --pri-t:#FFF0EB;
  --ok:#079455; --ok-t:#ECFDF3; --warn:#DC8017; --warn-t:#FEF0C7;
  --danger:#E31D1C; --danger-t:#FEF3F2; --purple:#6938EF; --purple-t:#F4F3FF;
  --teal:#107569; --teal-t:#F0F9F7;
  --font:'Inter','Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
  --shadow-lg:0 12px 16px -4px rgba(16,24,40,.08),0 4px 6px -2px rgba(16,24,40,.03);
  --r:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);color:var(--text);background:var(--bg);overflow:hidden;font-size:14px}
#app{display:grid;grid-template-rows:56px 1fr;height:100vh}

/* ============ TOPBAR ============ */
#topbar{background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;z-index:10}
#topbar .logo{height:26px;padding:0 10px;border-radius:8px;background:linear-gradient(135deg,#E65425,#F79009);display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;letter-spacing:.2px;white-space:nowrap}
#topbar .title{font-size:14.5px;font-weight:700}
#topbar .badge{font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--border);padding:2px 8px;border-radius:99px;font-weight:600}
#topbar .spacer{flex:1}
/* lang segmented control */
.langctl{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px}
.langctl button{border:none;background:transparent;font-family:var(--font);font-size:11.5px;font-weight:600;color:var(--muted);padding:3px 12px;border-radius:6px;cursor:pointer;transition:all .15s}
.langctl button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.1)}

#body{display:grid;grid-template-columns:252px 1fr;overflow:hidden}

/* ============ SIDEBAR ============ */
#rail{background:#fff;border-right:1px solid var(--border);overflow-y:auto;padding:14px 12px}
#rail::-webkit-scrollbar{width:0}
#rail .rail-h{font-size:16px;font-weight:800;color:#000;letter-spacing:.08em;padding:6px 10px 10px}
.rstep{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background .12s;margin-bottom:2px}
.rstep:hover{background:#FFF5F1}
.rstep.active{background:var(--pri-t)}
.rstep .t{font-size:13px;font-weight:600;color:var(--sub)}
.rstep.active .t{color:var(--pri);font-weight:700}
.rstep.skipped{opacity:.3;cursor:default}
.rstep.skipped .t{text-decoration:line-through}
/* 一级导航标题（并列层级） */
.rl1{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;transition:background .12s;margin-bottom:2px}
.rl1:hover{background:#FFF5F1}
.rl1 .rt{font-size:14px;font-weight:700;color:var(--text)}
.rl1.active{background:var(--pri-t)}
.rl1.active .rt{color:var(--pri)}
.rl1 .caret{margin-left:auto;font-size:10px;color:var(--muted)}
.rl1.ph{opacity:.5;cursor:default}
.rl1.ph:hover{background:transparent}
.rl1.locked{opacity:.45;cursor:not-allowed}
.rl1.locked:hover{background:transparent}
/* 子菜单缩进 */
.rstep.sub{padding-left:22px}
#railKpis{margin-top:14px;border-top:1px solid var(--border);padding:12px 10px 4px}
#railKpis .lbl{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.1em;margin-bottom:8px}
.kpi{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin-bottom:5px}
.kpi b{font-weight:700;color:var(--text)}

/* ============ STAGE ============ */
#stage{overflow-y:auto}
#stage::-webkit-scrollbar{width:8px}
#stage::-webkit-scrollbar-thumb{background:#D0D5DD;border-radius:4px}
.wrap{max-width:1000px;margin:0 auto;padding:26px 32px 60px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #07945533}50%{box-shadow:0 0 0 7px #07945500}}

.stagehead{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px;animation:rise .4s both}
.stagehead .num{width:34px;height:34px;border-radius:10px;background:var(--pri-t);color:var(--pri);font-weight:800;font-size:14px;display:grid;place-items:center;flex-shrink:0}
.stagehead h2{font-size:21px;font-weight:800;letter-spacing:-.01em}
.stagehead .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.lede{font-size:13.5px;color:var(--sub);line-height:1.75;max-width:760px;margin:10px 0 22px;animation:rise .4s .06s both}
.lede b{color:var(--text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);animation:pop .4s both}
.note{margin-top:14px;font-size:12.5px;line-height:1.75;color:var(--sub);background:var(--warn-t);border:1px solid #F5D899;border-radius:10px;padding:11px 15px}
.note b{color:var(--text)}
.pri-note{background:var(--pri-t);border-color:#FFD1BF}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font);font-weight:600;font-size:13.5px;
  background:var(--pri);color:#fff;border:1px solid var(--pri);padding:9px 20px;border-radius:10px;cursor:pointer;
  transition:all .15s;box-shadow:var(--shadow)}
.btn:hover{background:var(--pri-d);border-color:var(--pri-d)}
.btn.sec{background:#fff;color:var(--text);border-color:var(--border2)}
.btn.sec:hover{background:var(--bg)}
.btn.ghost{background:#fff;color:var(--pri);border-color:var(--pri)}
.btn:disabled{opacity:.4;cursor:not-allowed}
/* 列表内的小按钮（此前 .tiny 无 CSS，实际仍是默认大号，导致操作列拥挤） */
.btn.tiny{padding:4px 10px;font-size:11.5px;border-radius:7px;gap:4px;line-height:1.5;box-shadow:none;white-space:nowrap}
.btn.sec.danger{color:var(--danger);border-color:#F4B6B5}
.btn.sec.danger:hover{background:var(--danger-t);border-color:var(--danger)}
/* 表格操作列按钮组：小按钮 + 统一间距，避免挤在一起 */
.mat-actions{display:flex;align-items:center;gap:6px;white-space:nowrap}
.mat-actions .btn{flex:0 0 auto}
.nextbar{display:flex;justify-content:space-between;align-items:center;margin-top:32px;padding-top:18px;border-top:1px solid var(--border);animation:fadeIn .35s both}
.nextbar .hint{font-size:12px;color:var(--warn);font-weight:600}
.nextbar .ctx{font-size:11.5px;color:var(--muted)}
.wfstrip{margin-top:28px;padding-top:16px;border-top:1px solid var(--border2,var(--border))}
.wfstrip-h{font-size:11px;color:var(--muted);margin-bottom:10px;font-weight:600}
.wfstrip-bar{display:flex;flex-wrap:wrap;gap:6px}
.wfnode{display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;border:1px solid var(--border2,var(--border));font-size:11px;color:var(--muted);background:#fff}
.wfnode .wfn-no{font-weight:700;color:var(--muted);font-size:10px}
.wfnode.done{background:#ECFDF3;border-color:#ABEFC6;color:#079455}
.wfnode.done .wfn-no{color:#079455}
.wfnode.cur{background:var(--pri-t);border-color:var(--pri);color:var(--pri);font-weight:700}
.wfnode.cur .wfn-no{color:var(--pri)}
.mbcard{border:1px solid var(--border2,var(--border));border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fff}
.mbtop{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:6px}
.mbtop b{font-size:14px}
.mbmeta{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.mbmeta a{color:var(--pri)}
.mbbody{font-size:12.5px;color:var(--sub);line-height:1.6;margin-bottom:10px}
.mbactions{display:flex;gap:8px}
.kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--border2,var(--border));border-radius:12px;padding:16px;text-align:center}
.kpi b{font-size:26px;display:block;color:var(--pri)}
.kpi span{font-size:12px;color:var(--muted)}
.opsgrid{display:grid;grid-template-columns:1fr;gap:12px}
.opscard{background:#fff;border:1px solid var(--border2,var(--border));border-radius:12px;padding:16px 18px}
.opscard h4{font-size:13.5px;margin:0 0 12px;font-weight:600}
.obar{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12.5px}
.obar span{min-width:70px;color:var(--sub)}
.obar b{margin-left:auto;color:var(--muted);font-weight:600}
.obart{flex:1;height:8px;background:#F2F4F7;border-radius:4px;overflow:hidden}
.obart i{display:block;height:100%;background:var(--pri);border-radius:4px}
.qrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border2,var(--border));font-size:13px}
.qrow .qno{min-width:34px;text-align:center;background:#F2F4F7;border-radius:6px;padding:2px 6px;font-size:11px;color:var(--muted)}
.qrow b{flex:1;font-weight:600}
.qmeta{font-size:11.5px;color:var(--muted)}
.empty{font-size:12px;color:var(--muted);padding:8px 0}
.banksec{margin-top:18px}
.banksec h4{font-size:14px;margin:0 0 10px;font-weight:600;color:var(--sub)}
.banksec h4 b{color:var(--pri);margin-left:4px}

/* ============ 发布管理四大模块 CSS ============ */

/* --- 通用 --- */
.ops-section{margin-top:22px}
.ops-section h4{font-size:15px;font-weight:700;margin-bottom:12px}

/* --- 库存格子 --- */
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.inv-card{background:#fff;border:1px solid var(--border2,var(--border));border-radius:12px;padding:16px;animation:pop .4s both;cursor:pointer;transition:all .15s}
.inv-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.inv-card .inv-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.inv-card .inv-head .inv-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.inv-card .inv-head b{font-size:14px;font-weight:700}
.inv-card .inv-head .inv-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:auto}
.inv-card .inv-head .inv-badge.ok{background:var(--ok-t);color:var(--ok)}
.inv-card .inv-head .inv-badge.warn{background:var(--warn-t);color:var(--warn)}
.inv-card .inv-head .inv-badge.danger{background:var(--danger-t);color:var(--danger)}
.inv-card .inv-stats{display:flex;gap:10px;font-size:11.5px;color:var(--sub);margin-bottom:8px}
.inv-card .inv-stats span{background:var(--bg);padding:2px 8px;border-radius:6px;font-weight:600}
.inv-card .inv-foot{font-size:11px;color:var(--muted)}
.inv-detail{margin-top:14px;display:none}
.inv-detail.open{display:block}
.inv-detail .inv-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--border2,var(--border));font-size:12.5px}
.inv-detail .inv-item b{flex:1;font-weight:600}
.inv-detail .inv-item .inv-lvl{font-size:11px;color:var(--muted)}
.inv-detail .inv-item .inv-date{font-size:11px;color:var(--muted)}
.inv-detail .inv-item .inv-empty{color:var(--muted);padding:16px;text-align:center}

/* --- 警示区 --- */
.alert-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;animation:pop .4s both}
.alert-item{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;font-size:12.5px;font-weight:600}
.alert-item.danger{background:var(--danger-t);color:var(--danger)}
.alert-item.warn{background:var(--warn-t);color:var(--warn)}
.alert-item .alert-btn{padding:4px 10px;font-size:11px;border-radius:6px;margin-left:auto}

/* --- 发布管理 --- */
.pub-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.pub-stat-card{background:linear-gradient(145deg,#fff,#f8f9fa);border:1px solid var(--border2,var(--border));border-radius:14px;padding:16px 12px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.04);transition:transform .2s,box-shadow .2s}
.pub-stat-card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.pub-stat-card .pub-stat-ico{font-size:22px;margin-bottom:4px}
.pub-stat-card .pub-stat-num{font-size:26px;font-weight:800;color:var(--pri)}
.pub-stat-card .pub-stat-lbl{font-size:11px;color:var(--muted);margin-top:2px}
.pub-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:800px){.pub-layout{grid-template-columns:1fr}}
.pub-panel{background:#fff;border:1px solid var(--border2,var(--border));border-radius:14px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.pub-panel h4{font-size:14px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.pub-topic{display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:8px;background:var(--bg);border-radius:10px;font-size:13px}
.pub-topic-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.pub-topic b{flex:1;font-weight:700}
.pub-topic-count{font-size:11px;font-weight:700;color:var(--muted);background:#fff;padding:2px 10px;border-radius:10px;border:1px solid var(--border2,var(--border))}
.pub-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border2,var(--border));animation:pop .3s both}
.pub-item:last-child{border-bottom:none}
.pub-item b{flex:1;font-weight:600;font-size:13px}
.pub-item-lvl{font-size:11px;font-weight:700;color:#fff;padding:2px 10px;border-radius:10px;display:inline-block}
.pub-item-lvl.A2{background:#2969F9}
.pub-item-lvl.B1{background:#12B76A}
.pub-item-lvl.B2{background:#8B5CF6}
.pub-item-date{font-size:11px;color:var(--muted)}
.pub-item-btn{padding:5px 16px;font-size:12px;border-radius:8px;background:var(--pri);color:#fff;border:none;cursor:pointer;font-weight:600;transition:all .15s}
.pub-item-btn:hover{opacity:.85;transform:scale(1.03)}
.pub-history{display:flex;flex-direction:column;gap:6px}
.pub-entry{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:10px;transition:all .15s}
.pub-entry:hover{background:#f0f2f5}
.pub-entry .pub-status{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pub-entry .pub-status.done{background:var(--ok)}
.pub-entry b{flex:1;font-weight:600;font-size:13px}
.pub-entry .pub-meta{font-size:11px;color:var(--muted)}
.pub-entry .pub-time{font-size:11px;color:var(--muted);font-weight:600}

/* --- 运营看板 --- */
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px}
.dash-card{background:#fff;border:1px solid var(--border2,var(--border));border-radius:12px;padding:16px 18px;animation:pop .4s both}
.dash-card .dash-num{font-size:30px;font-weight:800;color:var(--pri)}
.dash-card .dash-lbl{font-size:12px;color:var(--muted);margin-top:2px}
.dash-card .dash-sub{font-size:11px;color:var(--muted);margin-top:6px}
.chart-container{background:#fff;border:1px solid var(--border2,var(--border));border-radius:12px;padding:16px 18px;margin-bottom:16px}
.chart-container h4{font-size:14px;font-weight:700;margin-bottom:12px}
.chart-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.chart-row .chart-lbl{min-width:70px;font-size:12.5px;font-weight:600;color:var(--sub)}
.chart-row .chart-bar{flex:1;height:20px;background:var(--bg);border-radius:6px;overflow:hidden}
.chart-row .chart-bar i{display:block;height:100%;border-radius:6px;transition:width .6s ease}
.chart-row .chart-val{min-width:36px;text-align:right;font-size:12px;font-weight:700;color:var(--muted)}
.charts-two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:800px){.charts-two-col{grid-template-columns:1fr}}
.svg-chart{width:100%;height:auto}

/* --- 用户反馈 --- */
.fdb-section{margin-top:22px}
.fdb-section h4{font-size:15px;font-weight:700;margin-bottom:14px}
.fdb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:800px){.fdb-grid{grid-template-columns:repeat(2,1fr)}}
.fdb-card{background:linear-gradient(145deg,#fff,#f8f9fa);border:1px solid var(--border2,var(--border));border-radius:14px;padding:16px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.04);transition:transform .2s,box-shadow .2s}
.fdb-card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.fdb-card .fdb-ico{font-size:24px;margin-bottom:4px}
.fdb-card .fdb-num{font-size:28px;font-weight:800;color:var(--pri)}
.fdb-card .fdb-lbl{font-size:11px;color:var(--muted);margin-top:2px}
.fdb-card .fdb-sub{font-size:10px;color:var(--muted);margin-top:4px}
.fdb-chart{display:flex;flex-direction:column;gap:10px}
.fdb-chart-row{display:flex;align-items:center;gap:10px}
.fdb-chart-row .fdb-chart-lbl{min-width:70px;font-size:12px;font-weight:600;color:var(--sub)}
.fdb-chart-row .fdb-chart-track{flex:1;height:22px;background:var(--bg);border-radius:8px;overflow:hidden}
.fdb-chart-row .fdb-chart-fill{display:flex;align-items:center;height:100%;border-radius:8px;padding-left:8px;font-size:10px;font-weight:700;color:#fff;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.fdb-chart-row .fdb-chart-val{min-width:50px;text-align:right;font-size:12px;font-weight:700;color:var(--muted)}
.fdb-chart-container{background:#fff;border:1px solid var(--border2,var(--border));border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.fdb-chart-container h4{font-size:14px;font-weight:700;margin-bottom:14px}
.fdb-rank-list{display:flex;flex-direction:column;gap:8px}
.fdb-rank-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--bg);border-radius:10px;transition:all .15s}
.fdb-rank-item:hover{background:#f0f2f5}
.fdb-rank-item .fdb-rank-num{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.fdb-rank-item .fdb-rank-num.gold{background:linear-gradient(135deg,#F79009,#E67E22)}
.fdb-rank-item .fdb-rank-num.silver{background:linear-gradient(135deg,#A0AEC0,#718096)}
.fdb-rank-item .fdb-rank-num.bronze{background:linear-gradient(135deg,#CD7F32,#A0522D)}
.fdb-rank-item .fdb-rank-num.normal{background:var(--muted)}
.fdb-rank-item b{flex:1;font-weight:600;font-size:13px}
.fdb-rank-item .fdb-rank-likes{font-size:12px;color:#E53E3E;font-weight:700}
.fdb-controls{display:flex;gap:8px;margin-bottom:18px}
.fdb-reset-btn{padding:8px 18px;font-size:12px;border-radius:10px;background:var(--bg);border:1px solid var(--border2,var(--border));cursor:pointer;font-weight:600;color:var(--sub);transition:all .15s}
.fdb-reset-btn:hover{background:var(--danger-t);border-color:var(--danger);color:var(--danger)}

/* chips & tags */
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border:1px solid var(--border2);padding:5px 12px;border-radius:8px;background:#fff;cursor:pointer;transition:all .12s;user-select:none;margin:3px}
.chip:hover{border-color:var(--pri);color:var(--pri)}
.chip.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.rec{border-color:var(--teal);color:var(--teal);background:#F0FDF9}
.chip.rec::after{content:"★";font-size:9px;margin-left:5px;color:var(--teal)}
.chip.sel::before{content:"✓ ";font-size:10px}
.tint{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px}
.tint.ok{background:var(--ok-t);color:var(--ok)}
.tint.warn{background:var(--warn-t);color:var(--warn)}
.tint.danger{background:var(--danger-t);color:var(--danger)}
.tint.pri{background:var(--pri-t);color:var(--pri)}
.tint.purple{background:var(--purple-t);color:var(--purple)}
.tint.teal{background:var(--teal-t);color:var(--teal)}

/* ============ S1 trends ============ */
.agentbar{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-bottom:18px;box-shadow:var(--shadow);animation:pop .4s both}
.agentbar .agent{font-size:11px;font-weight:800;color:#fff;background:var(--pri);padding:4px 12px;border-radius:7px;letter-spacing:.03em}
.agentbar .desc{flex:1;font-size:12.5px;color:var(--sub);line-height:1.65}
.agentbar .pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite;flex-shrink:0}
.hotgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.hotcard{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);animation:pop .45s both;transition:all .15s;cursor:pointer;position:relative}
.hotcard:hover{border-color:var(--pri);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.hotcard .rank{position:absolute;top:12px;right:14px;font-size:11px;font-weight:800;color:var(--muted)}
.hotcard h4{font-size:13.5px;font-weight:700;line-height:1.45;margin-bottom:4px}
.hotcard .cn{font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:12px}
.heatbar{height:6px;background:var(--bg);border-radius:3px;position:relative;margin-bottom:9px;overflow:hidden}
.heatbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#F79009,#E65425);border-radius:3px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.hotcard .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.hotcard .meta b{color:var(--pri);font-weight:800;font-size:12px}
/* custom source config (trend discovery) */
.btn.mini{padding:7px 14px;font-size:12px;border-radius:8px;flex-shrink:0}
.srccfg{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow);animation:pop .4s both}
.srccfg-head{display:flex;align-items:center;gap:12px;margin-bottom:13px;flex-wrap:wrap}
.srccfg-head .t{font-size:14px;font-weight:800;display:inline-flex;align-items:center;gap:7px}
.srccfg-head .sub{font-size:11.5px;color:var(--muted);flex:1;min-width:200px;line-height:1.55}
.srcform{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.srcform select,.srcform input{font-family:var(--font);font-size:12.5px;color:var(--text);background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:8px 10px;outline:none}
.srcform select{width:122px}
.srcform input:focus{border-color:var(--pri)}
.srcform .sn{width:150px}.srcform .st{width:112px}.srcform .su{flex:1;min-width:160px}
.srclist{display:flex;flex-direction:column;gap:7px}
.srclist-empty{font-size:12px;color:var(--muted);text-align:center;padding:14px 0;border:1px dashed var(--border2);border-radius:10px;background:var(--bg)}
.srcrow{display:flex;align-items:center;gap:11px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 13px;animation:pop .3s both}
.srcrow .sico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.srcrow .sinfo{flex:1;min-width:0}
.srcrow .sinfo b{display:block;font-size:12.5px;font-weight:700}
.srcrow .sinfo span{display:block;font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcrow .sdel{width:24px;height:24px;border:none;border-radius:7px;background:#FEE4E2;color:#D92D20;font-size:11px;cursor:pointer;flex-shrink:0;transition:all .12s}
.srcrow .sdel:hover{background:#D92D20;color:#fff}
.interest{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow);animation:pop .4s both}
.interest .int-badge{font-size:11px;font-weight:700;color:var(--pri);background:var(--pri-t);padding:3px 9px;border-radius:99px;white-space:nowrap}
.intlist{display:flex;flex-direction:column;gap:8px}
.introw{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 12px;animation:pop .3s both}
.int-rank{width:20px;height:20px;border-radius:6px;background:#fff;border:1px solid var(--border2);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted);flex-shrink:0}
.int-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.int-info{flex:1;min-width:0;font-size:12.5px}
.int-info b{font-weight:700}
.int-heat{width:130px;height:7px;background:#EFF1F5;border-radius:5px;overflow:hidden;flex-shrink:0}
.int-heat i{display:block;height:100%;border-radius:5px;transition:width .6s ease}
.int-score{font-size:12px;font-weight:800;color:var(--pri);width:24px;text-align:right;flex-shrink:0}
.int-reads{font-size:11px;color:var(--muted);width:76px;text-align:right;white-space:nowrap;flex-shrink:0}
.int-trend{font-size:14px;font-weight:800;width:16px;text-align:center;flex-shrink:0}
.int-trend.up{color:#E31D1C}
.int-trend.down{color:#079455}
.int-trend.flat{color:var(--muted)}
.int-foot{font-size:11.5px;color:var(--sub);margin-top:11px;padding-top:11px;border-top:1px dashed var(--border2)}
@media (max-width:720px){.introw{flex-wrap:wrap}.int-heat{width:100%;order:5}.int-reads{width:auto;margin-left:auto}}
.hotcard.custom{border-style:dashed;border-color:#C4B5FD}
.hotcard.custom .rank{color:#8B5CF6}
.srctag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:#8B5CF6;background:#F5F3FF;border:1px solid #EDE9FE;border-radius:99px;padding:2px 9px;margin-bottom:8px}
.srctag i{width:6px;height:6px;border-radius:50%}

/* ============ S2 sensitivity ============ */
.filterlist{display:flex;flex-direction:column;gap:9px}
.frow{display:grid;grid-template-columns:1fr 110px 220px;align-items:center;gap:14px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 16px;opacity:0;transform:translateX(-10px);transition:all .4s;box-shadow:var(--shadow)}
.frow.on{opacity:1;transform:none}
.frow .topic{font-size:13px;font-weight:700}
.frow .topic small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.frow .freason{font-size:11.5px;color:var(--sub);line-height:1.55}
.frow.blocked{opacity:.6;background:var(--danger-t);border-color:#F4B6B5}
.frow.blocked .topic{text-decoration:line-through;color:var(--sub)}

/* live screening stage tracker */
.livestages{display:flex;align-items:center;gap:4px;flex-wrap:wrap;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.lstage{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 10px;border-radius:8px;transition:all .3s;position:relative}
.lstage i{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-style:normal;font-weight:800;font-family:var(--font);background:var(--bg);color:var(--muted)}
.lstage .lsx{white-space:nowrap}
.lstage.done{color:var(--ok)}
.lstage.done i{background:var(--ok);color:#fff}
.lstage.cur{color:var(--pri);background:var(--pri-t)}
.lstage.cur i{background:var(--pri);color:#fff;animation:pulse 1.6s infinite}
.lstage + .lstage::before{content:"›";color:var(--border2);margin-right:4px;font-weight:700}

/* ============ S3 tags ============ */
.tagboard{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tagcol{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;animation:pop .45s both}
.tagcol .th{padding:11px 16px;border-bottom:1px solid var(--border);font-weight:800;font-size:13px;background:#F9FAFB}
.tagcol .th small{font-weight:500;color:var(--muted);font-size:11px;margin-left:6px}
.tagcol .opts{padding:12px 12px 8px}
.taglegend{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--sub);background:var(--bg);border:1px dashed var(--border2);border-radius:8px;padding:8px 12px}

/* ============ S4 sources ============ */
.srccard{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:18px 16px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow);animation:pop .45s both;position:relative}
.srccard:hover{border-color:var(--pri);transform:translateY(-2px)}
.srccard.sel{border-color:var(--pri);border-width:2px;box-shadow:0 0 0 3px var(--pri-t),var(--shadow)}
.srccard .cls{position:absolute;top:-10px;left:14px;color:#fff;font-weight:800;font-size:11px;padding:2px 11px;border-radius:6px}
.srccard h4{font-size:14.5px;font-weight:800;margin:6px 0 6px}
.srccard p{font-size:12px;color:var(--sub);line-height:1.65}
.srccard .foot{margin-top:10px;padding-top:9px;border-top:1px solid var(--border);font-size:11px;color:var(--teal);font-weight:700}
.article{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:20px 24px;margin-top:22px;box-shadow:var(--shadow);animation:pop .45s both}
.article .meta{display:flex;gap:12px;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.article h3{font-weight:800;font-size:19px;margin-bottom:2px}
.article h3 .cn{font-weight:600;font-size:12.5px;color:var(--muted);display:block;margin-top:3px}
.article .body{font-size:13.5px;line-height:1.85;color:#344054;margin-top:10px}
.article .body .hl{background:linear-gradient(transparent 58%,#D6E4FF 58%);border-radius:2px}
.shownote{margin-top:12px;font-size:11.5px;color:var(--ok);font-weight:700}

/* ============ 已选素材原文卡片（material card） ============ */
.materialcard{background:#fff;border:1px solid var(--border2);border-radius:12px;padding:14px 16px;margin:0 0 18px;box-shadow:var(--shadow);animation:pop .45s both}
.materialcard .mchead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.materialcard .mcico{font-size:20px}
.materialcard .mcinfo{flex:1;min-width:200px}
.materialcard .mctitle{font-weight:800;font-size:14.5px;line-height:1.4}
.materialcard .mcmeta{font-size:11.5px;color:var(--muted);margin-top:2px}
.materialcard .mcmeta a{text-decoration:none}
.materialcard .mcbody{font-size:13px;line-height:1.85;color:#344054;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:12px 14px;max-height:520px;overflow:auto}
.materialcard .mclink{margin-top:9px;font-size:11.5px;color:var(--sub);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.materialcard .mclink a{color:var(--pri);text-decoration:none;font-weight:600;word-break:break-all}
.materialcard .mclink a:hover{text-decoration:underline}
.materialcard .mccn{font-weight:600;font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
/* 原文状态徽章（后端如实上报，前端只搬运） */
.fstat{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;border-radius:99px;padding:2px 9px;margin:2px 4px 8px 0;line-height:1.6}
.fstat-ok{background:var(--ok-t);color:var(--ok);border:1px solid #D1FADF}
.fstat-warn{background:#FFFAEB;color:#B54708;border:1px solid #FEDF89}
.fstat-bad{background:#FEF3F2;color:#B42318;border:1px solid #FECDCA}
.hotcard .fstat{margin-bottom:6px}
/* 无原文热点的「粘贴原文」弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:22px 22px 18px;box-shadow:0 12px 40px rgba(16,24,40,.18)}
.modal h5{margin:0 0 8px;font-size:15px;font-weight:700}
.modal .mdesc{margin:0 0 8px;font-size:12.5px;color:var(--sub);line-height:1.65}
.modal .merr{margin:0 0 12px;font-size:11.5px;color:#B42318;background:#FEF3F2;border:1px solid #FECDCA;border-radius:7px;padding:7px 10px;line-height:1.55}
.modal textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12.5px;line-height:1.65;font-family:inherit;resize:vertical;outline:none;box-sizing:border-box}
.modal textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-t)}
.modal .mmeta{margin:6px 0 14px;font-size:11.5px;color:var(--muted);text-align:right}
.modal .macts{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.modal .mskip{margin-right:auto;font-size:11.5px;color:var(--muted);cursor:pointer;text-decoration:underline}
.modal .mskip:hover{color:var(--sub)}
.modal .mlink{display:flex;align-items:center;gap:8px;margin:0 0 8px;padding:9px 11px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.modal .mlabel{font-size:11px;font-weight:700;color:var(--muted);flex:none}
.modal .mlink a{flex:1;min-width:0;font-size:11.5px;color:var(--pri);font-weight:600;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal .mlink a:hover{text-decoration:underline}
.modal .btn-copy{flex:none;font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;font-family:inherit}
.modal .btn-copy:hover{border-color:var(--pri);color:var(--pri)}
.materialcard .mcstatus{margin:2px 0 4px}

/* ============ S5 facts ============ */
.workbench{display:grid;grid-template-columns:1.05fr .95fr;gap:16px;align-items:start}
.pane-h{font-size:11px;letter-spacing:.1em;font-weight:800;color:var(--muted);margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.article-mini{font-size:12px;line-height:1.8;color:#344054;background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;max-height:400px;overflow:auto;box-shadow:var(--shadow)}
.article-mini .sen{border-radius:3px;padding:0 2px;transition:background .3s;cursor:default}
.article-mini .sen.linked{background:var(--ok-t);box-shadow:inset 0 -2px 0 var(--ok)}
.article-mini .sen.skip{color:var(--muted)}
.factlist{display:flex;flex-direction:column;gap:10px;min-height:160px}
.fcard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 15px;box-shadow:var(--shadow);animation:pop .45s both;transition:all .15s}
.fcard:hover{border-color:var(--pri);transform:translateX(3px)}
.fcard .top{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.fcard .fid{font-size:10px;color:var(--muted);font-weight:600}
.fcard .stmt{font-size:12.5px;line-height:1.6;color:#1D2939;font-weight:500}
.fcard .zh{font-size:11.5px;line-height:1.55;color:#667085;margin-top:3px;padding-left:8px;border-left:2px solid var(--border);font-weight:400}
.fcard .meta{display:flex;gap:10px;margin-top:8px;font-size:10.5px;color:var(--sub);align-items:center;flex-wrap:wrap}
.confbar{flex:1;min-width:56px;height:5px;background:var(--bg);border-radius:3px;position:relative;overflow:hidden}
.confbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);border-radius:3px}
.confbar.low i{background:var(--warn)}
.senref{font-size:10px;color:var(--teal);margin-top:6px;font-weight:700}

/* ============ S6 KB ============ */
.kbgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kbitem{background:#fff;border:1px solid var(--border);border-radius:10px;padding:13px 15px;box-shadow:var(--shadow);animation:pop .4s both}
.kbitem .n{font-size:10.5px;font-weight:800;color:var(--pri)}
.kbitem h5{font-size:12.5px;font-weight:700;margin:3px 0 3px}
.kbitem p{font-size:10.5px;color:var(--muted)}
.lvlpick{display:flex;gap:10px;margin-bottom:16px}
.lvl{flex:1;border:1px solid var(--border);background:#fff;padding:11px 10px;text-align:center;cursor:pointer;transition:all .12s;border-radius:10px;box-shadow:var(--shadow)}
.lvl b{font-size:17px;font-weight:800}
.lvl span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.lvl.sel{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 0 0 3px var(--pri-t)}
.lvl.sel span{color:#D6E4FF}
.specgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.spec{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);animation:pop .4s both}
.spec h6{font-size:10.5px;letter-spacing:.12em;color:var(--pri);font-weight:800;margin-bottom:8px}
.spec .row{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:5px 0;border-bottom:1px dashed var(--border)}
.spec .row:last-child{border:none}
.spec .row span{color:var(--sub)}
.spec .row b{font-weight:700;text-align:right}
.termbox{margin-top:16px;background:var(--teal-t);border:1px dashed var(--teal);border-radius:10px;padding:12px 16px;animation:pop .45s both}
.termbox h6{font-size:11px;letter-spacing:.1em;color:var(--teal);font-weight:800;margin-bottom:6px}
.termbox .term{display:inline-block;margin:3px 6px 3px 0;font-size:11.5px;color:var(--sub)}
.termbox .term b{color:var(--teal);font-weight:700}

/* ============ S7 generation ============ */
.gentabs{display:flex;gap:8px;margin:14px 0 18px}
.gentab{border:1px solid var(--border);background:#fff;padding:7px 18px;cursor:pointer;font-weight:700;font-size:12.5px;border-radius:8px;transition:all .12s;box-shadow:var(--shadow)}
.gentab.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.genlayout{display:grid;grid-template-columns:1fr 280px;gap:16px;align-items:start}
.genpaper{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:24px 28px;min-height:380px;box-shadow:var(--shadow);position:relative}
.genloading{position:absolute;inset:0;background:rgba(255,255,255,.72);backdrop-filter:blur(2px);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5}
.genloading .gl-txt{font-size:14px;font-weight:700;color:var(--pri)}
.genloading .gl-time{font-size:12px;color:var(--muted)}
.genpaper h3{font-weight:800;font-size:19px;line-height:1.35;margin-bottom:4px}
.genpaper h3.done::after{content:"▮";color:var(--pri);animation:blink 1s steps(1) infinite}
.genpaper .byline{font-size:11px;color:var(--muted);margin-bottom:13px;padding-bottom:9px;border-bottom:1px solid var(--border)}
.genpaper .body p{font-size:13.5px;line-height:1.9;color:#1D2939;margin-bottom:11px}
.genpaper .fs{background:var(--ok-t);box-shadow:inset 0 -2px 0 var(--ok);border-radius:3px;padding:0 2px}
.gencover{position:relative;border-radius:14px;overflow:hidden;height:240px;margin:0 0 16px;display:flex;align-items:flex-end;box-shadow:var(--shadow);transition:background 1.2s ease;background-size:cover;background-position:center}
.gencover::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 100% at 88% -10%,rgba(255,255,255,.24),transparent 55%),radial-gradient(90% 90% at -5% 110%,rgba(255,255,255,.12),transparent 50%);pointer-events:none}
.gencover .shimmer{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.30) 50%,transparent 70%);background-size:250% 100%;animation:cvsh 1.1s linear infinite;opacity:0;pointer-events:none;z-index:3}
.gencover.loading .shimmer{opacity:1}
@keyframes cvsh{0%{background-position:160% 0}100%{background-position:-160% 0}}
.gencover.in{animation:cvIn .8s ease both}
@keyframes cvIn{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
.gencover .cv-badge{position:absolute;top:12px;left:14px;z-index:4;font-size:9.5px;font-weight:800;letter-spacing:1.4px;color:#fff;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.45);padding:4px 11px;border-radius:20px;backdrop-filter:blur(4px)}
.gencover .cv-save{position:absolute;top:10px;right:12px;z-index:4;font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:4px 11px;cursor:pointer;backdrop-filter:blur(4px);transition:background .15s;font-family:inherit}
.gencover .cv-save:hover{background:rgba(0,0,0,.48)}
.gencover .cv-in{position:relative;z-index:2;padding:14px 18px;width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.gencover .cv-tags{display:flex;gap:6px;flex-wrap:wrap}
.gencover .cv-tag{font-size:10px;font-weight:700;letter-spacing:.4px;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.4)}
.genside{display:flex;flex-direction:column;gap:10px}
.audiobar{margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.audiobar h6{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:800;margin-bottom:10px}
.audiobar .ab-item{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.audiobar .ab-label{font-size:11.5px;color:var(--sub);font-weight:600;min-width:110px;white-space:nowrap}
.audiobar audio{height:34px;flex:1}
.audiobar .ab-dl{font-size:15px;text-decoration:none;color:var(--pri);font-weight:700;padding:4px 6px}
.audiobar .ab-wait{font-size:11px;color:var(--muted)}
.audiobar .ab-tip{font-size:10.5px;color:var(--muted);margin-top:2px}
.audiobar .ab-accent{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.audiobar .ab-btn{font-size:11.5px;font-weight:700;color:var(--pri);background:var(--pri-t);border:1px solid var(--pri);border-radius:7px;padding:5px 12px;cursor:pointer;font-family:inherit}
.audiobar .ab-btn:hover{background:var(--pri);color:#fff}
.audiobar .ab-btn.on{background:var(--pri);color:#fff}
.audiobar .ab-btn:disabled{opacity:.45;cursor:not-allowed;background:#F2F4F7;color:var(--muted);border-color:var(--border)}
/* 练习题 */
.quizwrap{margin-top:18px;padding-top:15px;border-top:1px solid var(--border)}
.quizwrap h6{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:800;margin-bottom:10px}
.qcard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.qcard .qtop{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.qcard .qtint{font-size:9.5px;font-weight:800;color:var(--pri);background:var(--pri-t);border-radius:5px;padding:2px 7px;letter-spacing:.04em}
.qcard .qno{font-size:10px;font-weight:800;color:var(--muted);margin-left:auto}
.qcard .qtext{font-size:12.5px;line-height:1.6;color:#1D2939;font-weight:600;margin-bottom:8px}
.qcard .qopts{display:flex;flex-direction:column;gap:5px;margin-bottom:9px}
.qcard .qopt{font-size:12px;line-height:1.5;color:#344054;padding:6px 10px;background:#F9FAFB;border:1px solid var(--border);border-radius:7px}
.qcard .qopt.ans{background:#ECFDF3;border-color:#12B76A;color:#027A48;font-weight:700}
.qcard .qact{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qcard .qans{font-size:11.5px;color:var(--sub);line-height:1.5}
.qcard .qans b{color:#12B76A}
/* 三档练习题对照（行=题号，列=A2/B1/B2，与段落对齐网格同构） */
.quizalign{margin-top:16px}
.quizalign .qalign-hbar{display:grid;grid-template-columns:44px 1fr 1fr 1fr;gap:10px;margin-bottom:4px;align-items:stretch}
.quizalign .qalign-hbar .qspacer{}
.quizalign .qalign-hint{font-size:11px;color:var(--muted);margin:4px 0 12px;line-height:1.55}
.quizalign .qalignrow{display:grid;grid-template-columns:44px 1fr 1fr 1fr;gap:10px;align-items:stretch;margin-bottom:12px}
.quizalign .qalignrow .qrow-no{display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--pri);background:var(--pri-t);border:1px dashed #FFD1BF;border-radius:11px}
.quizalign .qcell{height:100%}
.quizalign .qcell .qcard{margin:0;height:100%}
.quizalign .qcard.qplaceholder{opacity:.55}
@media (max-width:900px){.quizalign .qalignrow,.quizalign .qalign-hbar{grid-template-columns:1fr}}
.metric{background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 14px;box-shadow:var(--shadow);animation:pop .4s both}
.metric .k{font-size:10.5px;letter-spacing:.05em;color:var(--muted);font-weight:700}
.metric .v{font-weight:800;font-size:18px;margin-top:2px}
.metric .v small{font-size:10.5px;font-weight:500;color:var(--muted)}
.metric .bar{height:5px;background:var(--bg);border-radius:3px;margin-top:7px;position:relative;overflow:hidden}
.metric .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--pri);border-radius:3px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.factused{background:var(--purple-t);border:1px dashed var(--purple);border-radius:10px;padding:11px 14px;animation:pop .45s both}
.factused h6{font-size:10.5px;letter-spacing:.08em;color:var(--purple);font-weight:800;margin-bottom:6px}
.factused li{font-size:10.5px;line-height:1.7;color:var(--sub);list-style:none;padding-left:14px;position:relative}
.factused li::before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:800}
.factused li b{color:#1D2939;font-weight:600}
.factused li .zh{display:block;color:#667085;font-size:10px;line-height:1.5;margin-top:1px;font-weight:400}
.word{background:var(--warn-t);box-shadow:inset 0 -2px 0 var(--warn);border-radius:2px;padding:0 2px}
.wtooltip{position:relative;cursor:help}
.wtooltip:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#101828;color:#fff;font-size:10.5px;font-weight:500;padding:6px 10px;border-radius:6px;white-space:nowrap;z-index:9}

/* ============ S8 validation + identity ============ */
.validate{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.vcheck{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#fff;border:1px solid var(--border);border-radius:9px;margin-bottom:7px;opacity:0;transform:translateX(-8px);transition:all .35s;box-shadow:var(--shadow)}
.vcheck.on{opacity:1;transform:none}
.vcheck .vid{font-weight:800;font-size:11.5px;color:var(--pri);min-width:28px}
.vcheck .vname{flex:1;font-size:11.5px;font-weight:500;color:var(--sub)}
.vcheck .state{font-size:10.5px;font-weight:800}
.vcheck.pass .state{color:var(--ok)}
.vcheck.warn .state{color:var(--warn)}
.tickbox{width:19px;height:19px;border:1.5px solid var(--border2);border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:800;flex-shrink:0;color:var(--muted)}
.vcheck.pass .tickbox{background:var(--ok);border-color:var(--ok);color:#fff}
.vcheck.warn .tickbox{background:var(--warn);border-color:var(--warn);color:#fff}
.vsum{grid-column:1/-1;display:flex;gap:18px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px 22px;box-shadow:var(--shadow)}
.vsum .big{font-weight:800;font-size:34px;color:var(--ok)}
.vsum .txt{flex:1;font-size:12.5px;line-height:1.65;color:var(--sub)}
.vsum .txt b{color:var(--text)}
.idcard{margin-top:16px;background:var(--teal-t);border:1.5px solid var(--teal);border-radius:var(--r);padding:16px 20px;animation:pop .5s both}
.idcard .idhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.idcard .idhead h4{font-weight:800;font-size:15px}
.idcard .idhead .cid{font-size:11px;color:var(--sub);font-weight:600}
.idcard .aibadge{margin-left:auto;background:var(--pri);color:#fff;font-size:10.5px;font-weight:800;padding:4px 12px;border-radius:7px;letter-spacing:.05em}
.chain{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11.5px;font-weight:600}
.chain .cnode{border:1px solid var(--border2);background:#fff;padding:5px 11px;border-radius:7px;color:var(--sub)}
.chain .carrow{color:var(--teal);font-weight:800}
.idrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.idcell{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 11px}
.idcell .k{font-size:9.5px;letter-spacing:.1em;color:var(--muted);font-weight:800}
.idcell .v{font-size:12px;font-weight:700;margin-top:2px;word-break:break-all}
.idnote{margin-top:11px;font-size:11px;color:var(--sub);line-height:1.65}
/* two-column identity card */
.idcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.idcol-h{font-size:11.5px;font-weight:800;color:var(--teal);margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid #CBE5DF}
.tagrows{display:flex;flex-direction:column;gap:5px}
.tagrow{display:flex;gap:10px;align-items:baseline;background:#fff;border:1px solid var(--border);border-radius:8px;padding:6px 10px}
.tagrow .tk{font-size:10px;font-weight:800;color:var(--muted);min-width:96px;letter-spacing:.03em}
.tagrow .tv{font-size:11.5px;font-weight:600;color:#1D2939}
@media (max-width:1000px){.idcols{grid-template-columns:1fr}}

/* ============ S9 review ============ */
.review3{display:grid;grid-template-columns:1.15fr .9fr;gap:16px;align-items:start}
.revdraft{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;font-size:12.5px;line-height:1.95;box-shadow:var(--shadow)}
.revdraft p{margin-bottom:10px}
.revdraft .fs{border-radius:3px;padding:1px 3px;cursor:pointer;transition:background .2s}
.revdraft .fs.ok{background:var(--ok-t);box-shadow:inset 0 -2px 0 var(--ok)}
.revdraft .fs.ok:hover{background:#C8EFDC}
.revdraft .fs.q{background:var(--warn-t);box-shadow:inset 0 -2px 0 var(--warn)}
.revmap{display:flex;flex-direction:column;gap:9px}
.mapcard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 13px;box-shadow:var(--shadow);animation:pop .4s both;opacity:.5;transition:all .2s}
.mapcard.lit{opacity:1;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-t)}
.mapcard .mh{display:flex;gap:7px;align-items:center;margin-bottom:4px}
.mapcard .stmt{font-size:12px;line-height:1.55;color:#1D2939;font-weight:500}
.mapcard .anchor{font-size:10px;color:var(--teal);margin-top:5px;font-weight:700}
.verdict{margin-top:14px;display:flex;gap:10px}

/* ============ S10 bank handoff ============ */
.approvebanner{display:flex;align-items:center;gap:16px;background:var(--ok-t);border:1.5px solid #ABEFC6;border-radius:var(--r);padding:20px 24px;margin-bottom:18px;animation:pop .45s both}
.approvebanner .okicon{width:46px;height:46px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800;flex-shrink:0}
.approvebanner .t{font-size:17px;font-weight:800}
.approvebanner .d{font-size:12.5px;color:var(--sub);margin-top:4px;line-height:1.65}
.banklink{background:#fff;border:1.5px solid var(--pri);border-radius:var(--r);padding:24px;box-shadow:0 0 0 4px var(--pri-t),var(--shadow);text-align:center;animation:pop .5s .15s both}
.banklink .ico{font-size:34px;margin-bottom:8px}
.banklink h3{font-size:17px;font-weight:800;margin-bottom:6px}
.banklink p{font-size:12.5px;color:var(--sub);line-height:1.7;max-width:560px;margin:0 auto 16px}
.banklink a.btn{text-decoration:none;font-size:14.5px;padding:12px 32px}
.banklink .url{margin-top:10px;font-size:11px;color:var(--muted)}
.bankcaps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.bankcap{background:#fff;border:1px solid var(--border);border-radius:10px;padding:13px 15px;box-shadow:var(--shadow);animation:pop .45s both}
.bankcap .ico{font-size:19px}
.bankcap h5{font-size:12.5px;font-weight:800;margin:6px 0 4px}
.bankcap p{font-size:11px;color:var(--sub);line-height:1.6}
.bankbar{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--sub);margin:6px 0 10px}
.bankbar b{color:var(--text);font-size:15px}
.banklist{display:flex;flex-direction:column;gap:10px}
.bankcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);animation:pop .35s both}
.bankcard .bchead{display:flex;align-items:center;gap:9px}
.bankcard .bcdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.bankcard .bcttl{font-size:14.5px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bankcard .bcmeta{font-size:11.5px;color:var(--muted);margin:6px 0 10px}
.bankcard .bcactions{display:flex;gap:8px}
.bankcard .btn{padding:5px 13px;font-size:12px;border-radius:8px}
.bankcard .btn:disabled{opacity:.5;cursor:not-allowed}
.bankcard .bcbody{margin-top:12px;border-top:1px dashed var(--border);padding-top:12px}
.bankcard.has-cover{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start}
.bankcard.has-cover .bc-main{min-width:0}
.bc-cover{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;border:1px solid var(--border);background:var(--bg) center/cover no-repeat;flex-shrink:0}
.bc-cover .bc-cv-dl{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:600;text-align:center;padding:3px 0;cursor:pointer;border:none;width:100%;font-family:inherit;transition:background .15s}
.bc-cover .bc-cv-dl:hover{background:rgba(0,0,0,.78)}
.bc-cover-tag{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.5);color:#fff;font-size:8.5px;font-weight:700;letter-spacing:.6px;padding:2px 6px;border-radius:20px}
@media(max-width:700px){.bankcard.has-cover{grid-template-columns:1fr}}
.bc-lvl{margin-bottom:12px}
.bc-lvl-h{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:5px}
.bc-lvl-h b{color:var(--pri)}
.bc-lvl-h span{color:var(--muted);font-size:11px}
.bc-lvl-body{font-size:12.5px;line-height:1.7;color:var(--text);white-space:pre-wrap;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.bc-audio{margin-top:8px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
.bc-aud-h{font-size:10.5px;letter-spacing:.05em;color:var(--muted);font-weight:800;margin-bottom:7px}
.bc-aud-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.bc-aud-row:last-child{margin-bottom:0}
.bc-aud-row.empty{opacity:.6}
.bc-aud-tag{font-size:11px;font-weight:700;color:var(--sub);min-width:66px;white-space:nowrap}
.bc-aud-url{flex:1;min-width:180px;font-size:10.5px;line-height:1.5;color:var(--pri);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace)}
.bc-aud-url:hover{text-decoration:underline}
.bc-aud-none{font-size:10.5px;color:var(--muted);font-style:italic}
.bc-audio .ab-btn{font-size:10.5px;padding:4px 10px;border-radius:6px}
.bc-audio .ab-dl{font-size:14px;text-decoration:none;color:var(--pri);font-weight:700;padding:2px 4px}
.bc-aud-tip{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.5}
.bc-aud-badge{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;white-space:nowrap}
.bc-aud-badge.ok{color:#0F6E56;background:#E1F5EE}
.bc-aud-badge.part{color:#854F0B;background:#FAEEDA}
.bc-aud-badge.fail{color:#A32D2D;background:#FCEBEB}
.bc-aud-badge.gen{color:#185FA5;background:#E6F1FB}
.bc-aud-badge.none{color:var(--muted);background:var(--bg);border:1px solid var(--border)}
.bc-aud-meta{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:8px;font-size:10.5px}
.bc-aud-mrow{display:flex;gap:10px;line-height:1.7}
.bc-aud-mrow span{color:var(--muted);min-width:78px}
.bc-aud-mrow b{color:var(--text);font-weight:600;word-break:break-all}
.bc-aud-meta.failed{border-color:#F09595;background:#FCEBEB}
.bc-aud-err{margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);color:#A32D2D;line-height:1.6;word-break:break-word}
.bkstat{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:12px;box-shadow:var(--shadow)}
.bkstat .bkdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.bkstat.ok .bkdot{background:#1D9E75}
.bkstat.down .bkdot{background:#E24B4A}
.bkstat.unknown .bkdot{background:#888780}
.bkstat.ok{background:#F0F9F7;border-color:#9FE1CB}
.bkstat.down{background:#FCEBEB;border-color:#F09595}
.bkstat.down b{color:#A32D2D}
.bkstat .bkapi{color:var(--muted);font-size:10.5px;flex:1;min-width:180px}
.degraded{margin:12px 0 4px;padding:11px 14px;border-radius:10px;border:1px solid #F09595;background:#FCEBEB}
.degraded .dgb-h{font-size:11.5px;font-weight:700;color:#A32D2D;margin-bottom:7px;line-height:1.6}
.degraded .dgb-row{display:flex;gap:8px;flex-wrap:wrap;font-size:10.5px;line-height:1.7;color:#791F1F}
.degraded .dgb-tag{font-weight:700;min-width:96px;color:#A32D2D}
.degraded .dgb-msg{flex:1;min-width:160px;word-break:break-word}
.degraded .dgb-url{font-size:10px;color:#993C1D;opacity:.85;word-break:break-all}
.degraded.degraded-mini{padding:7px 12px;font-size:11.5px;font-weight:600;color:#A32D2D;line-height:1.5}
.bc-aud-badge.sync-ok{color:#0F6E56;background:#E1F5EE}
.bc-aud-badge.sync-fail{color:#A32D2D;background:#FCEBEB}
.bc-aud-badge.sync-gen{color:#185FA5;background:#E6F1FB}
.bc-aud-badge.sync-none{color:var(--muted);background:var(--bg);border:1px solid var(--border)}
.tagsection{border:1px solid var(--border);border-radius:var(--r);background:#fff;padding:13px 15px;margin-bottom:12px;box-shadow:var(--shadow);animation:fadeIn .3s both}
.tagsec-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:13px;font-weight:800;margin-bottom:11px}
.tagsec-h span{font-size:11px;color:var(--muted);font-weight:400}
.tagsec-h .btn{margin-left:auto;padding:3px 11px;font-size:11px}
.tagcat{border-top:1px dashed var(--border);padding:9px 0}
.tagcat:first-of-type{border-top:none;padding-top:0}
.tagcat:last-child{padding-bottom:0}
.tagcat.closed{display:flex;align-items:center;gap:9px;cursor:pointer;padding:9px 0}
.tc-head{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.tc-name{font-size:12.5px;font-weight:700}
.tc-name small{margin-left:6px;font-size:10.5px;color:var(--muted);font-weight:400}
.tc-count{margin-left:auto;font-size:10.5px;color:var(--muted)}
.tc-count b{color:var(--pri)}
.tc-arrow{font-size:11px;color:var(--muted);width:12px;text-align:center}
.tc-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tc-empty{font-size:11.5px;color:var(--muted);padding:8px 0}
.tagadd{display:flex;gap:7px;margin-top:10px}
.tagadd input{flex:1;max-width:320px;font-size:12px;padding:6px 10px;border:1px solid var(--border);border-radius:7px;font-family:inherit}
.tagextract{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tagextract .te-meta{font-size:10.5px;color:var(--muted)}
.tagextract .te-reason{font-size:11px;color:var(--sub);flex:1;min-width:200px;line-height:1.5}
.tagdropped{font-size:10.5px;color:#854F0B;background:#FAEEDA;border:1px solid #FAC775;border-radius:8px;padding:7px 11px;margin-bottom:12px;line-height:1.6}
.tagselbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:4px;padding:11px 13px;background:var(--bg);border:1px solid var(--border);border-radius:10px}
.tsb-label{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.05em}
.tsb-chip{font-size:11px;padding:3px 10px;border-radius:99px;background:#fff;border:1px solid var(--border)}
.tsb-chip.c{color:var(--pri);border-color:#B5D4F4;background:#E6F1FB}
.tsb-chip.f{color:#0F6E56;border-color:#9FE1CB;background:#E1F5EE}
.tsb-chip.g{color:#854F0B;border-color:#FAC775;background:#FAEEDA}
.tsb-empty{font-size:11px;color:var(--muted)}
.bkstat .btn{padding:4px 12px;font-size:11.5px;border-radius:7px}

/* ============ WORKFLOW FOOTER STRIP ============ */
.wfstrip{margin-top:34px;background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;animation:fadeIn .4s both}
.wfstrip .wfhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.wfstrip .wfhead .t{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--text)}
.wfstrip .wfhead .loop{font-size:11px;color:var(--teal);font-weight:600;background:var(--teal-t);border-radius:6px;padding:2px 9px}
.wfstrip .wfhead .ext-note{font-size:11px;color:var(--muted)}
.wfchips{display:flex;flex-wrap:wrap;gap:6px}
.wfstep{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--sub);background:var(--bg);border:1px solid var(--border);border-radius:99px;padding:4px 11px}
.wfstep .i{font-size:10px;color:var(--muted);font-weight:700}
.wfstep.cur{background:var(--pri);border-color:var(--pri);color:#fff}
.wfstep.cur .i{color:#fff}
.wfstep.ext{border-style:dashed;color:var(--muted)}
.wfstep .lnk{color:var(--pri);font-size:10px}
.wfstrip .wfhead .legend{display:inline-flex;gap:9px;margin-left:auto;flex-wrap:wrap}
.legend-it{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);font-weight:600}
.legend-it i{width:7px;height:7px;border-radius:50%}
.rstep .t .lk{font-size:9px;margin-left:5px;color:var(--muted);background:var(--bg);border:1px solid var(--border);padding:1px 5px;border-radius:4px;font-weight:600}

/* ============ 素材创建 · 顶部工作流步骤条 ============ */
.matflow{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;margin:0 0 18px;box-shadow:var(--shadow)}
.matflow-h{font-size:12px;font-weight:800;letter-spacing:.02em;color:var(--muted);margin-bottom:12px}
.matflow-steps{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mfs{display:inline-flex;align-items:center;gap:9px;cursor:pointer;padding:6px 12px 6px 6px;border-radius:99px;transition:background .12s}
.mfs:hover{background:var(--bg)}
.mfs-no{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;background:var(--bg);color:var(--muted);border:2px solid var(--border2);transition:all .15s}
.mfs-t{font-size:15px;font-weight:700;color:var(--muted);transition:color .15s}
.mfs.done .mfs-no{background:var(--ok-t);color:var(--ok);border-color:var(--ok)}
.mfs.done .mfs-t{color:var(--sub)}
.mfs.cur .mfs-no{background:var(--pri);color:#fff;border-color:var(--pri);transform:scale(1.1);box-shadow:0 2px 6px rgba(41,105,249,.35)}
.mfs.cur .mfs-t{color:var(--pri)}
.mfs-arrow{color:var(--border2);font-size:16px;font-weight:700}

/* ============ S11 content bank (imported) ============ */
.banktabs{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}
.btab{border:1px solid var(--border);background:#fff;padding:7px 16px;cursor:pointer;font-weight:600;font-size:12.5px;border-radius:8px;transition:all .12s;box-shadow:var(--shadow);color:var(--sub)}
.btab:hover{border-color:var(--pri);color:var(--pri)}
.btab.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.btab .cnt{display:inline-block;background:var(--danger);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:0 6px;margin-left:5px;line-height:16px}
/* dashboard */
.dashstats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.dstat{background:#fff;border:1px solid var(--border);border-radius:10px;padding:15px 16px;box-shadow:var(--shadow);animation:pop .4s both}
.dstat .top{display:flex;align-items:center;gap:9px}
.dstat .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:16px}
.dstat .v{font-weight:800;font-size:24px}
.dstat .v small{font-size:11px;font-weight:500;color:var(--muted);font-family:var(--font)}
.dstat .k{font-size:11.5px;color:var(--sub);font-weight:600;margin-top:2px}
.dstat .tr{font-size:10.5px;color:var(--muted);margin-top:3px}
.dashcols{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.dashpanel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow);animation:pop .45s both}
.dashpanel h4{font-size:13px;font-weight:800}
.dashpanel .cap{font-size:11px;color:var(--muted);margin:2px 0 12px}
.strow{display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:9px}
.strow .nm{width:110px;font-weight:600;color:var(--sub)}
.strow .bar{flex:1;height:7px;background:var(--bg);border-radius:4px;overflow:hidden}
.strow .bar i{display:block;height:100%;border-radius:4px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.strow b{font-weight:800;font-size:11.5px;min-width:32px;text-align:right}
.nextslot{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--border)}
.nextslot:last-child{border:none}
.nextslot .when{min-width:78px}
.nextslot .when .d{font-size:12px;font-weight:800}
.nextslot .when .t{font-size:10px;color:var(--muted)}
.nextslot .info{flex:1}
.nextslot .info .ti{font-size:12.5px;font-weight:700}
.nextslot .info .id{font-size:10.5px;color:var(--muted);margin-top:2px}
/* content library table */
.arttable{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);font-size:11.5px;animation:pop .45s both}
.arttable th{background:#F9FAFB;padding:10px 10px;text-align:left;font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap}
.arttable td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:top;color:#344054}
.arttable tr:last-child td{border:none}
.arttable tr:hover td{background:#F9FAFB}
.arttable .t{font-weight:700;color:var(--text);font-size:12px}
.arttable .t small{display:block;font-weight:500;color:var(--muted);font-size:10px;margin-top:1px}
/* bank map */
.mapthemes{display:flex;flex-direction:column;gap:13px}
.mtheme{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);animation:pop .45s both}
.mtheme .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.mtheme .mh .n{font-size:13px;font-weight:800}
.mtheme .mh .d{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted)}
.mtheme .mh .d b{font-weight:800;font-size:12px}
.mcells{display:flex;gap:6px;flex-wrap:wrap}
.mcell{flex:1;min-width:74px;border-radius:8px;padding:9px 6px;text-align:center;font-size:11px;font-weight:700;color:#fff;transition:transform .15s;cursor:default}
.mcell:hover{transform:translateY(-2px)}
.bmlegend2{display:flex;gap:12px;margin-top:13px;font-size:10.5px;flex-wrap:wrap;color:var(--sub)}
.bmlegend2 span{display:inline-flex;align-items:center;gap:5px}
.bmlegend2 i{width:11px;height:11px;border-radius:4px;display:inline-block}
.sigcols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.sigpanel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 15px;box-shadow:var(--shadow);animation:pop .4s both}
.sigpanel h5{font-size:12px;font-weight:800;margin-bottom:3px}
.sigpanel .cap{font-size:10.5px;color:var(--muted);line-height:1.6;margin-bottom:2px}
.siglist{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.sigitem{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--sub);line-height:1.5}
.sigitem .dot{width:6px;height:6px;border-radius:50%;margin-top:6px;flex-shrink:0}
/* schedule */
.slotrow2{display:grid;grid-template-columns:120px 76px 1fr;gap:13px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow);animation:pop .45s both}
.slotrow2 .when .d{font-size:13px;font-weight:800}
.slotrow2 .when .t{font-size:10.5px;color:var(--muted);margin-top:2px}
.slotrow2 .art .ti{font-size:13px;font-weight:800}
.slotrow2 .art .id{font-size:11px;color:var(--muted);margin:3px 0 7px}
.checkrow{display:flex;gap:8px;flex-wrap:wrap}
.chk{font-size:10.5px;font-weight:700;border-radius:6px;padding:3px 9px}
.chk.pass{background:var(--ok-t);color:var(--ok)}
.chk.warn{background:var(--warn-t);color:var(--warn)}
.chk.fail{background:var(--danger-t);color:var(--danger)}
/* history & cooldown */
.histgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;align-items:start}
.histitem{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--border)}
.histitem:last-child{border:none}
.histitem .dt{font-size:11px;font-weight:800;color:var(--muted);min-width:40px}
.histitem .ti{font-size:12.5px;font-weight:700}
.histitem .ti small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;margin-top:1px}
.coolitem{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--border);font-size:12px}
.coolitem:last-child{border:none}
.coolitem .n{font-weight:700}
.coolitem .n small{display:block;font-weight:500;color:var(--muted);font-size:10.5px;margin-top:1px}
/* action queue */
.qtable{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);font-size:11.5px;animation:pop .45s both}
.qtable th{background:#F9FAFB;padding:10px 12px;text-align:left;font-size:10.5px;font-weight:800;color:var(--muted);border-bottom:1px solid var(--border)}
.qtable td{padding:11px 12px;border-bottom:1px solid var(--border);color:#344054;vertical-align:middle}
.qtable tr:last-child td{border:none}
.actag{display:inline-block;font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:6px}
.pri-h{background:var(--danger-t);color:var(--danger)}
.pri-m{background:var(--warn-t);color:var(--warn)}
.pri-l{background:var(--bg);color:var(--sub)}
/* engage table */
.engtable{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);font-size:11.5px;animation:pop .45s both}
.engtable th{background:#F9FAFB;padding:10px 12px;text-align:left;font-size:10.5px;font-weight:800;color:var(--muted);border-bottom:1px solid var(--border)}
.engtable td{padding:10px 12px;border-bottom:1px solid var(--border);color:#344054}
.engtable tr:last-child td{border:none}
.minibar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;min-width:54px}
.minibar i{display:block;height:100%;border-radius:3px}

/* ============ LOGIN OVERLAY ============ */
#loginOv{position:fixed;inset:0;background:var(--bg);z-index:100;display:grid;place-items:center;overflow-y:auto}
#loginOv .lwrap{width:min(980px,94vw);padding:36px 10px 52px}
#loginOv .lhead{text-align:center;margin-bottom:26px}
#loginOv .lhead .lgo{height:52px;padding:0 22px;border-radius:14px;background:linear-gradient(135deg,#E65425,#F79009);display:inline-grid;place-items:center;color:#fff;font-weight:800;font-size:19px;letter-spacing:.3px;margin-bottom:14px;box-shadow:var(--shadow-lg);white-space:nowrap}
#loginOv .lhead h1{font-size:23px;font-weight:800;letter-spacing:-.01em}
#loginOv .lhead p{color:var(--muted);font-size:13px;margin-top:7px}
#loginOv .lhead .langmini{margin-top:14px}
.lroles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:880px){.lroles{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.lroles{grid-template-columns:1fr}}
.lrole{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px 18px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow);position:relative;width:100%;animation:rise .45s both;display:flex;flex-direction:column;min-height:272px}
.lrole:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--border2)}
.lrole h4{font-size:15px;font-weight:800;margin-bottom:6px}
.lrole .rscope{font-size:11px;color:var(--muted);margin:5px 0 11px;line-height:1.6;min-height:36px}
.lrole .rmods{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;min-height:48px;align-content:flex-start}
.lrole .rmods span{font-size:10px;font-weight:700;color:var(--sub);background:var(--bg);border:1px solid var(--border);padding:2px 8px;border-radius:99px}
.lrole .rbtn{display:block;width:100%;text-align:center;padding:9px;border-radius:9px;font-size:12.5px;font-weight:700;color:#fff;border:none;cursor:pointer;transition:opacity .12s;margin-top:auto}
.lrole .rbtn:hover{opacity:.88}
.lrole .racc{font-size:10px;color:var(--muted);text-align:center;margin-top:9px}
/* inline login form */
.lform{position:absolute;inset:0;background:#fff;border-radius:14px;padding:22px 20px;display:none;flex-direction:column;justify-content:center;z-index:2;animation:fadeIn .18s both}
.lrole.open .lform{display:flex}
.lform h4{font-size:14.5px;font-weight:800;margin-bottom:3px}
.lform .lsub{font-size:11px;color:var(--muted);margin-bottom:15px}
.lform label{font-size:11px;font-weight:700;color:var(--sub);display:block;margin-bottom:4px}
.lform input{width:100%;border:1px solid var(--border2);border-radius:8px;padding:9px 11px;font-family:var(--font);font-size:13px;margin-bottom:11px;outline:none;transition:border .12s;background:#fff}
.lform input:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-t)}
.lform .row{display:flex;gap:8px;margin-top:3px}
.lform .row button{flex:1;padding:9px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;border:none;font-family:var(--font)}
.lform .ok{background:var(--pri);color:#fff}
.lform .ok:hover{background:var(--pri-d)}
.lform .cancel{background:var(--bg);color:var(--sub)}
.lfoot{text-align:center;margin-top:22px;font-size:11px;color:var(--muted)}
/* topbar user chip */
.userchip{display:flex;align-items:center;gap:9px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:4px 6px 4px 5px}
.userchip .uico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.userchip .uinfo{line-height:1.25;padding-right:4px}
.userchip .uinfo b{display:block;font-size:11.5px;font-weight:700;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userchip .uinfo span{font-size:10px;color:var(--muted);font-weight:600}
.userchip .uout{border:none;background:#fff;border:1px solid var(--border2);color:var(--sub);font-size:11px;font-weight:600;padding:4px 9px;border-radius:7px;cursor:pointer;font-family:var(--font);transition:all .12s}
.userchip .uout:hover{color:var(--danger);border-color:var(--danger)}
/* sidebar: owner dot + locked state */
.rstep{position:relative}
.rstep .rdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.rstep.locked{opacity:.42;cursor:not-allowed;background:transparent}
.rstep.locked:hover{background:transparent}
.rstep.locked .t{color:var(--muted)}
/* rail role legend */
#railRoles{margin-top:12px;padding:10px 10px 2px}
#railRoles .rl{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--sub);margin-bottom:5px}
#railRoles .rl i{width:7px;height:7px;border-radius:50%;flex-shrink:0}
#railRoles .rl b{font-weight:700;color:var(--text)}
/* module owner tag in stage head */
.modtag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#fff;border-radius:99px;padding:4px 12px;margin-top:9px}
.modtag .lk2{opacity:.85}
.modtag.ro-tag{background:#FFF3E0!important;color:#9A5B00!important;border:1px dashed #F5B158}
/* read-only view: banner + whole-stage interaction lock (workflow strip stays navigable) */
.ro-banner{margin:0 0 14px;padding:9px 14px;border:1px dashed #F5B158;border-radius:10px;background:#FFF8EC;color:#9A5B00;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.wrap.ro *{pointer-events:none!important;opacity:.62}
.wrap.ro .ro-banner{pointer-events:auto!important;opacity:1}
.wrap.ro .wfstrip{pointer-events:auto!important;opacity:1}
.wrap.ro .wfstrip *{pointer-events:auto!important;opacity:1}

/* toast */
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-8px);background:#101828;color:#fff;font-size:12.5px;font-weight:600;padding:10px 18px;border-radius:10px;box-shadow:var(--shadow-lg);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:82vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:1050px){#body{grid-template-columns:220px 1fr}.wrap{padding:22px 20px 50px}.dashcols,.histgrid,.sigcols{grid-template-columns:1fr}}

/* ============ S9-S11 段落切分 / 对齐 / 调校 ============ */
.plvlbar{display:flex;gap:10px;margin:0 0 18px;flex-wrap:wrap}
.plvl-pill{flex:1;min-width:170px;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--border);border-radius:11px;padding:11px 14px;box-shadow:var(--shadow);animation:pop .4s both}
.plvl-pill .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.plvl-pill b{font-weight:800;font-size:14px;letter-spacing:.02em}
.plvl-pill span{font-size:11.5px;color:var(--muted)}
.pcols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:start}
.pcol{display:flex;flex-direction:column;gap:10px}
.pcol-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12.5px;padding:0 2px;color:var(--text)}
.pcard{background:#fff;border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);overflow:hidden;transition:border-color .15s,box-shadow .15s;animation:pop .4s both}
.pcard:hover{border-color:var(--border2);box-shadow:var(--shadow-lg)}
.pcard .ph{display:flex;align-items:center;gap:8px;padding:7px 12px;background:#F9FAFB;border-bottom:1px solid var(--border)}
.pcard .pno{font-size:10px;font-weight:800;color:#fff;background:var(--pri);border-radius:6px;padding:2px 8px;letter-spacing:.04em}
.pcard .ptag{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.pcard .pword{margin-left:auto;font-size:10px;color:var(--muted);font-weight:600}
.pcard .pbody{font-size:13px;line-height:1.9;color:#344054;padding:12px 14px;outline:none;white-space:pre-wrap;word-break:break-word;transition:background .15s,box-shadow .15s}
.pcard .pbody[contenteditable="true"]{cursor:text}
.pcard .pbody[contenteditable="true"]:hover{background:#FBFBFF}
.pcard .pbody[contenteditable="true"]:focus{background:var(--pri-t);box-shadow:inset 0 0 0 2px var(--pri)}
.aligngrid{display:flex;flex-direction:column;gap:12px}
