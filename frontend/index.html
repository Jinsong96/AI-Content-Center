m light and subtle to dense and lasting. We'll sample\nbeloved recipes and flavours as we savour the stories and traditions\nbehind iconic Chinese and British cakes. Grab a fork and taste the\ndelicious diversity across two cake-loving cultures.\nMat\nHello, and welcome back to another episode. Today,\nwe are talking about one of life's sweetest pleasures cake!\nSo, Jocelyn, I'm sure you have something to say.\nWhat are\nyour\nthoughts on Chinese pastries?\nJocelyn Well, if I'm totally honest, I think Chinese pastries are\ndefinitely better than English cakes. They are often lighter, less\nsweet, and have more diverse flavours than English cakes. For\nexample, we have mooncakes, which are traditionally eaten\nduring the Mid-Autumn Festival; you must know them. And there\nare those round pastries with a pattern on top and have a thin,\nsoft crust with a sweet filling made of lotus seed paste or red\nbean paste. Actually, you can get all kinds of fillings.\nMat\nLet me stop you there for a moment\nMooncakes. I\ncan't really get my head around the idea of mooncakes. I don't\nreally understand the concept. I mean, beans\nbeans in a\npastry? I'm English, so putting beans in a pastry just doesn't\nseem right to me. When I think of cakes, I think of sweet,\nindulgent treats like chocolate cake or Victoria sponge lots of\n\nsugar, and butter, and cream-not something savoury like beans.\nBeans belong on a plate, at breakfast time, with eggs and bacon\nand things like that.\nJocelyn Well, I think I understand your point of view, but\nyou\nhave to try mooncakes to appreciate them. They are not just\npastries; they are actually\nsymbol of family reunion and good\nluck in Chinese culture. And the filling can be really delicious.\nIt's not always beans; you can have fillings like lotus seed paste,\nwhich is sweet and fragrant. You can get green tea fillings, and\nnowadays, you can even find mooncakes with chocolate fillings.\nSo, actually, mooncakes are more diverse than\nyou think. Plus, the\ncrust, the outer layer, is often made with butter, and sometimes\nit's sweet, so it's not always savoury like you\nthink.\n\nMat\nI see. Well, I'm still not sure about the beans in a cake,\nbut I'd love to try a chocolate mooncake. Now, there's another\ncake, one that is quite popular in England and in China. In China,\nyou\ncall it egg tart, but in England, we call it custard tart. Now,\nthese are almost the same thing. So, it seems that we have one\npastry in common. So, why are all our other cakes so different?\nmean, Chinese pastries are light and delicate, and English cakes\nare really heavy and kind of seriously indulgent, almost like a\ncomplete meal-really filling.\nJocelyn\nI think that Chinese pastries are often lighter and more\ndelicate because they tend to use less butter, sugar,\nand cream\nthan English cakes. Instead, they use ingredients like rice flour,\nsweet potato starch, and bean paste, which give the pastries a\n\nFiX#7\nmore subtle and nuanced, delicate flavour. Also, with Chinese\npastries, the focus is often on the subtle balance and harmony of\nthe softer flavours, rather than the overwhelming sweetness and\nrichness that\nyou get with many English cakes.\nMat\nYeah, I think you're right. I remember reading something\nelse too: the climate and the ingredients available in England\nhistorically meant that preserving cakes for long periods of time\nwas important, which led to the development of those really\nheavy fruitcakes and other cakes that could last for weeks or\nmonths. Some English fruitcakes are so rich and heavy that they\ncan last for up to a year. So, I guess that probably influences our\ntaste and the way that we expect a cake to taste.\n\nChinese Pastries\nJocelyn So, I know\nyou like cakes, Mat. So is there one Chinese\npastry that you've tried that has left an impression on you?\nMat\nI was waiting for this question. I remember many\nyears ago, I was in a restaurant in South "}, {"id": "第二辑-一饮一食__Summer_Ice_Treats", "book": "第二辑 · 一饮一食", "title": "Summer Ice Treats · 夏日冰品", "text": "Summer Ice Treats\n1. You probably know about \"culture shock,\" but have you\never experienced \"weather shock\"?\n2. How do people sleep comfortably in very hot summer\nweather?\n3. What do you think are some popular summer snacks in\nChina? How might they differ from winter snacks?\n\nmiX#t7 t\nWhen summer arrives, it brings with it scorching temperatures and\nstifling humidity. How do people in different parts of the world cope\nwith the summer heat? We're looking at the ways people adapt to\nthe summer season's demands. Whether it's sleeping tips, typical\nsummer foods, or delicious ice treats, we've got everything you\nneed\nto stay cool in the crazy heat of summer.\nMat\nHello, and welcome once again to another episode.\nToday, we are talking about summer\nor summer days. Now,\nof course, I'm English. I think that everyone knows that English\nsummers are, well, let's say \"fairly mild.\" It's quite common to\nhave cool, grey, and rainy days in the middle of summer. Now,\nI can remember many years ago, my first trip to China; it was\nin the month of August, and I arrived in Shanghai. One of the\nthings that shocked me most wasn't really \"culture shock\"-it\nwas weather shock. I couldn't believe how hot it was. So, Jocelyn,\nI know\nyou spent\nfew years in the UK studying and living. Did\nyou have the same feeling in your first English summer? Did you\nexperience weather shock?\nJocelyn Well, absolutely. can vividly remember my first summer\nin England. I remember thinking, when is summer going to arrive?\nI kept waiting for the hot, sunny weather, but it never came. You\nknow, I grew up in Wuhan, one of the hottest cities in summer in\nChina, so my idea of summer is, how can I say it ... quite \"extreme\"\nand my experience of summer in the UK was\nwell\nextremely\n\"mild\"!\n\nSummer Ice Treats\nMat\nSo, I think we've both experienced \"weather shock\"-\nbut in quite different ways. There's one thing I remember: after\narriving in Shanghai in August and then travelling to Wuhan in the\nsame month, I remember people seemed to be good at keeping\ncool in such hot temperatures.\nJocelyn Yes, that's true. Over the\nyears,\nChinese people have\ndeveloped many different ways to keep cool during hot summers.\nOne of the simplest ways is to wear light cotton clothes,\nsomething like pyjamas. You probably saw people sleeping on\nbamboo mats to keep cool during hot summer nights. And for\nsome people, especially in rural areas, sleeping outside is quite\ncommon.\n\nFiX#7\nMat\nSleeping outside? Do people really do that? In England,\nI can't imagine anyone ever sleeping outside. Even in summer, it\nwould be too cold.\nJocelyn Yeah, in China we did sometimes, especially in some\nparts of China where the nights can be really hot and humid. And\nsome people find it cooler and more comfortable to sleep outside,\nespecially if there is a cool breeze. In fact, when I was growing up\nin Wuhan, I remember seeing people sleeping outside during the\nsummer. They had a special bamboo bed that was set up under the\ntrees, and they would sleep there every night. Some people even\nslept on the Yangtze River bridges because they can get the cool\nbreeze from the river-it's like nature's air-conditioner-and it's free.\n\nSummer Ice Treats\nMat\nNow, there's something else I remember about my first\nsummer in Wuhan, and that's the special summer snack food.\nI remember certain food items that were popular in summer.\nThere was one that\nlove, still to this day: cold noodles. I love the\nflavours the sesame sauce, the vinegar, and the chilli flavour-\nit's amazing. But there's another one that\nreally don't like: cold\ngreen bean soup. Do people really like that?\nJocelyn\nGreen bean soup is actually a really popular summer\nfood in many regions of China. And\nyou have to understand that\nwe don't just have it because of the \"flavour\" it's got\nspecific\nfunction. It's believed to have cooling properties, which can\nhelp to reduce body heat and prevent heatstroke during the hot\nsummer months. In traditional Chinese medicine, green beans are\nconsidered to have a special \"cooling\" effect on the body and are\noften used in the treatment of fever, thirst, and other symptoms\nof heat-related illnesses. So we have this cold green bean soup\nas a remedy for the intense summer heat. I guess you don't need\nthings like that in England, where the weather is so mild.\nMat\nNo, we don't need any kind of remedy for summer\nweather because it's never really hot. I mean, we do like ice cream\nin summer-it's kind of a tradition for us. When it's\nsunny,\nwhich\nis not"}, {"id": "第二辑-一饮一食__Preserved_Fruits", "book": "第二辑 · 一饮一食", "title": "Preserved Fruits · 果脯", "text": "Preserved Fruits\n1. Have\nyou ever\ntried a sweet treat made from dried or\npreserved fruits?\n2. Why do you\nthink people in China enjoy preserved fruits\nas snacks, while in England they're mostly used in\nbaking?\n3. Can you guess why preserved fruits are often given as\ngifts during Chinese New Year?\n\nFiX#t7 t\nEveryone likes fruit. We are always being told that we should eat more\nfresh fruit because it's good for our health. But what about preserved\nfruits? Why is this unusual approach to fruit important in China? Is it\nunique to China? Join us on a sweet journey as we compare\nChinese\nand British snacks using dried fruits. We'll learn about the history of\nChinese preserved fruits and their importance as festive gifts, then\nsample the crunch and tang of something special: bingtanghulu.\nMat\nHello and welcome back to another episode. Today we're\ntalking about a sweet treat that's popular in China-preserved\nfruits. Now, preserved fruits are fruits that have been dried\nand preserved in sugar or syrup. So let's start. Jocelyn, tell me\nsomething about preserved fruits.\nJocelyn Of course. In China, preserved fruits have a long history,\ngoing back to the Tang Dynasty. The traditional method of\nmaking preserved fruits involves soaking fresh fruits in a sugar or\nhoney solution and then drying them in the sun. And this process\nnot only preserves\nthe fruits but also enhances their natural\nsweetness and flavour.\nMat\nNow, I think I may have had something similar to this. I\nremember I was in a park in Wuhan, and I saw an old man with a\nbicycle. On the back of his bicycle, there was a glass box. In this\nglass box, there were many of these sticks. And on the sticks, there\nwere all of these differently coloured things; they looked like little\nballs of things. I remember\nsaw one,\nand there were these red\nballs covered in like clear sugar. I'm sure you\nknow what I mean.\n\nJocelyn Ah yeah. I think you're talking about bingtanghulu,\nwhich is a traditional Chinese snack usually made with hawthorn\nberries that are coated in hard, clear sugar syrup. And the berries\nare typically skewered on a stick and then dipped into the syrup\nto create a crunchy, sweet outer layer. And bingtanghulu is often\nenjoyed during the winter months and is popular in the northern\npart of China. Sometimes, you can find it in shops in packaged\nform, or other versions including fruits such as strawberries\nor kiwis. But ask any Chinese person; they will tell you\nthat the\nstreet version is better. Did you try it?\nMat\nYes, I did. It was quite an experience. I remember those\nberries, the hawthorn berries they were like really sour, but that\nsugar coating made them taste sweet and crunchy. I had never\n\nPreserved Fruits\ntasted anything quite like that before. It's like that really unique\ntexture and flavour. The crunchy outer layer of the sugar that\nsugar coating breaks when you bite it, then you have that juicy,\nsour flesh inside -that hawthorn berry. I would say that of all the\nfoods and snacks I've tried in China, this was probably the most\nunique. There's nothing like that in England.\nJocelyn Really? So in England, don't you\nhave any preserved\nfruits?\nMat\nWell, in England, we also have a variety of preserved\nfruits, including like dried apricots, figs, and raisins. And we often\nuse them in baking, especially for cakes and puddings. So, we see\nthem more as ingredients for cooking. We seldom eat them as\nfoods on their own.\nJocelyn That's interesting. It's quite different in China, where we\nsee preserved fruits as a snack on their own, and they come in a\nwide range of flavours and textures. And some preserved fruits\nare soft and chewy, while others are hard and crunchy. There\nare so many fruits that are used for preserving, including plums,\ndates, peaches, and so on.\nMat\nWell, in England, as\nsaid before, we tend to think of\npreserved fruits as something to be used in cooking, in very small\namounts, rather than like\nstand-alone snack. For example, we\nmight use preserved lemons in a chicken dish, or we might add\ndried cranberries to bread, or even to a salad. So to eat preserved\nfruits on their own seems a bit weird to us.\n\nFiX#7 *\nJocelyn Oh, so I'm guessing you don't give preserved fruits as\ngifts in England. You know, in China, preserved fruits are often\ngiven as gifts, particularly during the Chinese New Year. It is a\nway of sharing good luck and prosperity with friends and family.\nAnd because preserved fruits have a long shelf life, they can be\nenjoyed for weeks and even month"}, {"id": "第二辑-一饮一食__Beijing_Duck", "book": "第二辑 · 一饮一食", "title": "Beijing Duck · 北京烤鸭", "text": "Beijing Duck\n1 . If you were asked to name the single most famous Chinese\ndish, what would it be?\n2. Why is Beijing Duck often called Peking Duck in other\ncountries?\n3. Why do you think certain food items, like Beijing Duck,\nbecome internationally famous and are associated with a\nparticular country?\n\nBeijing Duck\nBeijing Duck is an undoubted culinary treasure known and loved\nworldwide. It has a rich history, needs meticulous preparation,\nand has iconic cultural significance. Join us as we trace its origins\nfrom ancient Chinese dynasties to its status as a symbol of Chinese\nculinary excellence. We'll also discuss the unique dining experience it\noffers and why it's cherished by locals and tourists alike. Get ready to\ntantalise your taste buds and discover why Beijing Duck holds such a\nspecial place in Chinese cuisine.\nMat\nHello, and welcome to another exciting episode of China\nLifestyle Journeys! Today, we're talking about the delicious world\nof Beijing Duck, a food treasure that is famous all around the\nworld. In this tasty episode, we'll explore the history, preparation,\nand cultural significance of this iconic dish.\nJocelyn So, Mat, tell me first of all, what's your experience of\nBeijing Duck? From my experience, it seems to be popular in\nChinese restaurants overseas and a real favourite for overseas\ntourists when they visit China.\nMat\nWell, Jocelyn, you're absolutely right! Beijing Duck is\nnot only popular in China, but also overseas. I remember my\nfirst encounter with this mouthwatering dish was actually in\nLondon's Chinatown. Back when I was a kid, I remember going\nto a restaurant with my parents. I was amazed by the crispy skin,\ntender meat of the duck, and those warm pancakes. Something\nelse I remember was seeing the waiter prepare the duck on a little\ntrolley beside our table. I had never seen that before. But nothing\n\nmiX#t7 t\ncompares to the experience of enjoying it in its birthplace, Beijing.\nThere's something truly special about savouring authentic Beijing\nDuck in its birthplace Beijing. So, I think that's my first question:\nwhy is it called Beijing Duck? What's the story behind it?\nJocelyn Well, that's a good question to begin with, but it's not so\neasy to answer. Duck has been eaten for many centuries in China,\nacross many dynasties. In very old cookery and recipe books\ndating back to the Tang Dynasty (618-907 CE), we can find\nreferences to shao yazi (simply \"roast duck\"). The descriptions\ntell us that this fresh duck was grilled over a wood or charcoal\nfire. This same dish appears throughout the history of Chinese\ncuisine, with small adjustments and improvements by later\n\nBeijing Duck\ngenerations. Later, in the Ming Dynasty (around the 1300s), we\ncan find various references to a dish that the emperor liked very\nmuch. This was officially named \"roast duck\" (kaoya) by the\nimperial court. But it's important to note that at this time, Beijing\nwasn't the capital; Nanjing was.\nMat\nSo, was it called Nanjing Duck? How did the dish move to\nBeijing and get its name \"Beijing Duck\"?\nJocelyn In the Ming Dynasty, the imperial court moved to Beijing,\nbringing roast duck along with it. By then, Beijing Duck was an\nestablished staple of imperial menus. In the Qing Dynasty, Beijing\nDuck spread to the nobility, where the dish was often praised by\nscholars and poets.\n\nMat\nI have a question about the name. I've seen it called\nBeijing Duck and Peking Duck. Why does it have two names?\nJocelyn Ah, good question. The name Peking Duck comes from\nan older way of writing Chinese names in English. In the past,\nBeijing was spelled as Peking in English. So, when the duck dish\nfirst became famous in the West, it was referred to as Peking\nDuck, since that was how the city's name was commonly spelled\nin English back then.\nHowever, in the 1950s, a different writing system was created\nas the standard way for translating Chinese into English (this is\ncalled pinyin). And in pinyin, the city's name is spelled as \"Beijing.\"\n\nSo, in China, in Chinese, it only has one name. But sometimes\nyou'll still see the old name \"Peking Duck\" on menus, especially\nin Chinese restaurants overseas. \"Beijing Duck\" has become the\nmore modern and accurate English translation to align with the\npinyin spelling system. But both names refer to the exact same\nthing.\nMat\nGreat explanation. Now I have a difficult question for\nyou. Imagine if someone has never tried or even seen Beijing\nDuck before, how would you describe it? Not just the \"duck\" part,\nbut the whole exp"}, {"id": "第二辑-一饮一食__Tea", "book": "第二辑 · 一饮一食", "title": "Tea · 茶", "text": "Tea\n1. Can you guess\nhow many different types of Chinese tea\nthere are?\n2. What do you think the English expression \"not my cup of\ntea\" means?\n3. Have you ever heard the phrase \"I wouldn't do it for all\nthe tea in China\"? What do\nyou\nthink it means?\n\nmiX#t7 t\nTea is, undoubtedly, one of the world's most beloved beverages.\nWhat will we discover when we compare tea cultures in China and the\nUK? While the English prefer tea with milk, Chinese tea is enjoyed in\nvarious forms, focusing on pure flavours and unique health benefits.\nThere's a lot to discover about the diversity of Chinese teas, ranging\nfrom green to scented varieties. With centuries of history, China's tea\nculture boasts a rich tapestry of tastes. It's time to take a sip of the\nfascinating stories behind this beloved drink.\nMat\nHello and welcome back once again. Today we are\ntalking about one of the world's most popular drinks tea. We'll\nbe talking about tea culture in both China and the UK. So here\nwe go. It's tea time. So, of course, I'm English, and the English\ntypically drink their tea with milk, which is added to the cup\nbefore the tea. So it's milk first, then tea. And we usually use\nloose-leaf tea in a teapot, not tea bags, to prepare it. So, how do\nChinese people usually drink tea?\nJocelyn In China, most people always use the loose-leaf brewing\nstyle, and sometimes in a teapot, but more often in individual\ncups.\nAnd these are big enough for one large serving of tea, like\na large cup of tea in the UK. We add the loose-leaf tea to the\ncup and pour the hot water directly into the cup.\nChinese tea is\nusually enjoyed without milk or sugar, so the focus is really on\nthe taste and aroma of the tea itself, the specific type of tea. So\nit's all about savouring the flavours and experiencing the unique\nhealth benefits that different teas can provide.\n\nTea\nMat\nWe have lots of different types in England. We have the\nfamous English breakfast tea, which is normally enjoyed with milk\nand\nsugar.\nWe also have Earl Grey tea, which is flavoured with\nsomething called bergamot, and it gives the tea this kind of citrus\nsweet lemon taste. There's also Darjeeling, which has a delicate\nfloral aroma, and another one, Assam, which is quite strong and\nsharp and that's often enjoyed with milk and sugar. So we've got\nloads of types of tea. Can you beat that?\nJocelyn You said you had lots of types; that's only four! Can\nbeat four? Well, let me see. Off the top of my head, we classify\nChinese tea by the degree of fermentation. First of all, we have\ngreen tea, like Longjing, or Biluochun or Maojian. We also have\n\nblack tea like your English tea. We have Dianhong; we have\nJinjunmei. We also have oolong tea, like Dahongpao, Tieguanyin,\nFenghuang Dancong. We also have white tea. We have Baihao\nYinzhen, Baimudan, Shoumei. We also have yellow tea. We have\nJunshan Yinzhen. We also have dark tea: Pu'er tea, Liubao tea.\nLast but not least, we have scented tea, like Jasmine tea, Rose\ntea, Chrysanthemum tea.\nSo that's about 20 almost! I could probably go on to name a few\nmore. Actually, in China, we have hundreds if not thousands of\ndifferent tea varieties. Tea has been a part of Chinese culture\nfor thousands of years, so there's a deep history of growing and\ndrinking tea that has created many different varieties and styles\nover the centuries. China has such a diverse geography and\n\nTea\nclimate. All the different regions have different growing conditions\nfor different\ntypes of tea plants. So, you end up with different\ntypes of tea being planted in different areas.\nMat\nOK, actually, think you win on this one. In England, we\nonly started drinking tea in the 17th century, and we don't grow\nany tea ourselves; we import it from other countries. We can't\ngrow\ntea because our climate isn't warm enough. So we don't\nhave many kinds of tea, and those that we do have are actually\ngrown in other countries. Technically, they are not even our own\nteas.\nJocelyn There's something else I forgot to mention too: Chinese\ntea has a lot of health benefits, and it can also be good for your\nhealth. Tea contains natural antioxidants and other compounds\nthat may help protect your body against certain health\nconditions. For example, green tea is known for its potential\nto reduce the risk of heart disease by helping to lower blood\npressure or cholesterol levels. So I think that Chinese tea is\nprobably healthier than your English tea.\nMat\nWell, that's not completely true. English tea has its own\nspecial health benefits to"}, {"id": "第二辑-一饮一食__Dining_Etiquette", "book": "第二辑 · 一饮一食", "title": "Dining Etiquette · 用餐礼仪", "text": "Dining Etiquette\nmagnod\n1 . Do\nyou\nspecial?\nknow where the most important person\nsits at\na Chinese dinner table? Why do you think that spot is\n2. Have\nyou ever wondered why you shouldn't stick your\nchopsticks upright in a bowl of rice? What do you\nsymbolises?\nthink it\n3. Why might it be seen as rude to keep eating a lot of the\nsame dish at a Chinese meal?\n\nDining Etiquette\nSit down. It's time for dinner. Do you know where to sit? All those\nchairs are around the large round table are there rules about who\nsits where? Of course, there are rules, and they are not just about\nseating positions. There are rules about how much you eat, using\nchopsticks, and even paying the bill. In fact, Chinese dining comes\nwith its own special set of complex social rules. Once you've learned\nthem, you'll be an expert Chinese diner, so sit down wherever you\nwant and get ready for your\nmain course: a serving of Chinese dining\netiquette.\nMat\nHello and welcome back to another episode on Chinese\nculture. Today, we're going to talk about Chinese dining etiquette.\nSo, etiquette is just \"doing things in a polite way\" in different\nsituations, behaving in an appropriate and polite way.\nNow, I remember the first time that came to China and my first\nbig dinner with workmates. I remember I was quite nervous\nbecause I didn't know anything about Chinese dining etiquette.\nSo, let's start with the basics. Let's imagine that\nam going to\nChina for the first time; what do I need to know?\nJocelyn The first thing to keep in mind is the seating arrangement.\nIn a Chinese banquet or formal meal, the host usually sits at the\nhead of the table, and the guests are seated based on their status\nor age, with the most senior guest sitting closest to the host. So\nremember, the most important person sits at the head of the table.\nMat\nNow, I'm a bit confused about this because, in a typical\nEuropean dining situation, the table is like a rectangle, usually a\n\nFiX#7 *\nlong rectangle. So I know where the \"head of the table\" is; it's\nat that end. But in most formal Chinese dining situations, the\ntable is round. So, where is the \"head of the table\" if the table is\nround? What's the most important seat?\nJocelyn Yeah,\nthink you're right. In traditional Chinese culture,\nthe \"head of the table\" or the best seat, the seat for the most\nimportant person, is the seat facing the door, as it is believed to\nbe the most important and prestigious position. So it's always\nbest to wait for the host to direct you to your seat, regardless of\nthe table shape. In fact, it's quite normal for someone to take the\njob of assigning seats, someone who knows the rules, so don't\nworry; there will usually be someone telling everyone where to\nsit. So, it's unlikely that you\nwill sit in the wrong place.\n\nDining Etiquette\nMat\nOK, so every Chinese meal is eaten with chopsticks, of\ncourse. And before\ncame to China for the first time, I read in a\nbook that it's very rude to use your chopsticks in certain ways.\nAnd I was quite worried when I sat down for that first big dinner\nbecause I couldn't remember the chopstick rules. So, tell me\nsomething about this.\nJocelyn Yeah, in China, there are certain chopstick etiquette\nrules to keep in mind. One important rule is to never stick your\nchopsticks upright in\nbowl of rice. This is because it looks like\nincense burning at a funeral and is considered bad luck. Also, it's\nnot polite to use your chopsticks to point or gesture at people,\nas it's seen as rude. Also, if you're not using your chopsticks, just\n\nFiX#7  k\nrest them on a chopstick holder or on the edge of your plate, and\nnot on the table or in your food, and put them together neatly.\nMat\nNow, what about finishing all the food on your plate?\nBecause I've heard different people say different things. T\nremember someone at the table saying, \"Don't leave any food;\nlet's finish everything. Otherwise, it's wasting food.\" At other\ntimes I've heard people say, \"You know, don't eat too much.\nOtherwise, you look like a greedy pig.\" So, this is like confusing\nfor me.\nJocelyn Ah, yes. I think it's a common understanding that you\nmust finish all the food on your plate in Chinese culture. Actually,\nthis isn't really true. It's important to take only what\nyou can eat\nfrom the dishes on the table, and it's kind of impolite to waste\nfood. If you can't finish all the food, it's acceptable to leave a\nsmall amount\non your plate. However, it's also not polite to leave\ntoo much food, as it may be seen as wasteful. As for eating\ntoo muc"}, {"id": "第三辑-日常生活__Chinese_Names", "book": "第三辑 · 日常生活", "title": "Chinese Names · 中国人的名字", "text": "1ST4\nChinese Names\n1. Have you ever wondered why Chinese family names come\nfirst and given names come second?\n2. How do Chinese parents choose names for their children?\n\"Lao\n3. Why might your Chinese friends call you \"Xiao\n\"? What do you think these nicknames mean?\nor\nmale\n\nAgE Xi#7 bE\nSome names are long, others are short. In some cultures, the family\nname comes first, while in others it comes at the end. We're looking\ninto the fascinating world of Chinese names. We'll learn how these\nnames reflect deep-rooted cultural values, symbolising respect for\nfamily and traditions. We'll also discover the differences between\nfamily names and given names, and the significance behind them.\nLastly, we'll learn about the customs, meanings, and stories behind\nChinese\nnames,\nand gain insight into how to properly address people\nin China.\nMat\nToday we are talking about Chinese names. Now, I know\nthat the obvious difference between Chinese names and names\nin the English-speaking world is that the name order is different.\nIn the English-speaking world, we put the family name last; in\nChinese names, the family name comes first. Is there a reason for\nthat?\nJocelyn Chinese names are always written with the surname, or\nfamily name first, and the personal, or given name second. This is\nbecause traditionally, people need to show respect to their family\nor clan, and the individual person is not as important as the\nfamily. And the family is the most important thing; family comes\nfirst, so the family name comes first.\nMat\nOK-so let's talk a bit more about surnames I think it's\neasier if we call them family names. We'll call the Chinese names\nfamily names and the Western names surnames.\nthink that's\neasier. Tell me what should know about Chinese family names.\n\nFEL\nshit tis\nJocelyn I think most family names in China are just one syllable,\nlike my family name, Wang. Although two-syllable family names\nexist, like Ouyang, they are not very common. And the most\ncommon family names in China, shared by a lot of people, might\nbe Wang, Li, Zhang, Liu, Chen. And there are actually thousands\nof Chinese family names, but many of these are very rare; we don't\nsee them very often. So, in fact, the 100 most common surnames\nare used by a large proportion of China's total population.\nMat\nOK, SO I think I understand family names a bit more.\nNow let's talk about given names. So, in my culture-I'm English,\nof course-names for children are chosen in a fairly simple way.\nCertain names are fashionable at certain times during certain\nyears, and many parents will choose a name that is popular at the\n\nFiX#7\ntime of the child's birth. Sometimes, these names are influenced\nby popular culture. For example, if there is a very popular TV star,\npop star, or movie star called Rosie, then many people will name\na baby girl \"Rosie\" just because it's fashionable. Now, in my class\nat school, there were four of us called Mat because Mat was a\npopular name at that time. Is it the same with Chinese given\nnames? Is that how Chinese parents choose a given name for\ntheir kids?\nJocelyn In China, when a baby is born, a given name must be\nchosen. Most given names are one syllable, like my name; my\nfamily name is Wang, and my given name is Jun. It means a kind\nof beautiful jade. It's one word. Some people have two syllables,\ntwo words, as their given name, like Li Xiaohua.\nSo, sometimes the two words in the given name are the same,\nlike Zhang Xiaoxiao. Sometimes the given names are different,\nanother example would be Li Xiaohua. Li is her family name and\nXiaohua is the given name.\nSo Chinese parents do not choose a name because it's fashionable;\nnames are chosen for their important social or deeper philosophical\nmeanings and are typically chosen for their symbolism.\nSo I know a lot of people; their given names are Jianhua, Jianguo\nand Guoqing, because they were born in the 1950s. So many\ngiven names are based on the female or male qualities, with\nsuggestions of strength, bravery for males, and peace, beauty,\nfragrance for females.\n\nUNN CAR\nTEle (13689, 9\nm mi ve tz  10 920\ntEWMIRS/At\n*a\n12AM.\n$14\nKILmTR\n18 .001 .3\nany *E *171\nS46*A<] TE Asset 80 t alt I MUSHeR SA13R\nto paltre eal\n2 20.0244\n335 4e. tro\nit itb 2\no\nthen f.\na B eK stal\n*Nil ag'e**\noRkh**\nPASTEE REREK *\nReSER ERees\n-36\n#R4\n1.-4h\nTERE\nLOkt\nFr to eel\nFA. CHIRIK\nFor example, common feminine given names are things like Hua\n(flower), and Mei (beauty). And common masculine names might\nMost Chinese people believe that a good name brings"}, {"id": "第三辑-日常生活__Chinese_Zodiac", "book": "第三辑 · 日常生活", "title": "Chinese Zodiac · 生肖", "text": "HR (S\nar at canes\ntat sat see Che\nChinese Zodiac\neiser gny nol-soo ( aisk tely\nB HEISECEN\nno er aard HeNd\n1 . Do you\npersonality?\n2. Why do you\nof stars?\nbelieve that your Chinese zodiac matches your\nthink the Chinese zodiac uses animals instead\nneed to do to have a lucky year?\n3. If it's your zodiac year, what special things might you\nSUR\nE.102\n[S\n(15\n\nAgE Xi#7 bE\nUnlike the Western zodiac that uses months and star signs, the\nChinese zodiac is based on the year of your birth and features twelve\nunique animal signs. Each animal has its own intriguing story and\ncharacteristics, influencing personality and destiny. Join us as we\nexplore the history, traditions, and meanings behind this ancient\nsystem, and learn why this might be your year of good fortune if you\nwear something red, according to your Chinese zodiac sign!\nMat\nHello, today we are talking about the zodiac. Now, in\nmy culture, we have signs of the zodiac. I know that the Western\nconcept of the zodiac was used around the time of the Romans\nand I think the ancient Greeks. It's pretty simple the calendar\nyear is divided into 12 equal parts, kind of like months, but not\nthe same as months. They are about 30 days long, and these are\ndivided according to the movement of the stars. And your birth\ndate decides your zodiac \"star sign.\" Pretty simple.\nSo, my birthday is the 22nd of September. So according to the\nWestern idea of the zodiac, that means my sign is \"Virgo.\" So, my\nfirst question today is: how is the Chinese zodiac system different\nto the Western system?\nJocelyn Well, the most obvious difference is that the Chinese\nzodiac uses the year of your birth, not the month or calendar date\nof your birth. The Chinese zodiac also has 12 signs, but these are\nanimals quite different from the Western system. So, a person's\n\"animal sign\" is decided by the year when they were born.\n\nChinese Zodiacl\nMat\nOK-so you just mentioned that there are 12 animal\nsigns. What are the 12 animals?\nJocelyn The Chinese zodiac traditionally begins with the sign of\nthe rat, and then the following signs in this order: ox, tiger, rabbit,\ndragon, snake, horse, goat, monkey, rooster, dog, and pig.\nMat\nNow, in the Western zodiac system, the order of the\nsigns, one follows the other, then the next one. The order follows\nthe movement of different stars in the sky. Is it the same for the\nChinese zodiac? Do the animals represent different stars in the\nsky? And how is the order decided?\n\nmiX#t7 te\nJocelyn There are different opinions about this. Many people\nbelieve it's based on an ancient tale. It\ngoes\na little like this ...\nThe story says that the Jade Emperor-one of the most important\ngods in traditional Chinese religion invited all the animals in the\nworld to take part in a race.\nTwelve animals agreed to enter the race: pig, dog, rooster,\nmonkey, goat, horse, snake, dragon, rabbit, tiger, ox, and rat.\nThe race included a very big river the clever rat used its brain to\ncross the river by persuading the kind ox to let it sit on its head\nas it crossed. On the other side, after crossing the river on the\nhead of the ox, the rat ran to the finish line to be the winner of\nthe race, and the ox came in second place. That's why the rat is\nthe first animal in the zodiac, followed by the ox.\nThe story is quite long. It tells us what happened to each animal\nin the race, and in what order each animal finished the race.\nI will jump to the end of the race- the last two animals are the\ndog and the pig. When the dog arrived at the river, it became\nvery\nexcited and just wanted to play in the water, splashing around,\ninstead of crossing it. So, the dog finished almost last.\nIn the last place was the pig. The pig felt hungry during the race.\nAfter stopping for some food, it became sleepy and decided to\ntake a nap. When the pig woke up, all the other animals had\nalready finished the race.\nAs a reward for finishing the race, the Emperor gave each animal\na year in the zodiac in the order they finished.\n\nxy\nU41 7149\nUR2\n:\nE\n#\n1P12\nB\n#1 Lu\n\"it hb\ntx\n\nmiX#t7 te\nMat\nThat's a great story, and it uses the typical characteristics\nof each animal. The rat is smart, the dog is playful, and the pig iS\nkind of lazy. So, does that mean people under one animal sign will\nhave the characteristics of that animal? Are people born in the\nyear of the rat ... are they usually clever? Are people born in the\nyear of the dog very playful? And are people born in the year\nof\nthe pig, people like me, are we lazy and greedy?\nJocelyn Well, actually"}, {"id": "第三辑-日常生活__Breakfast", "book": "第三辑 · 日常生活", "title": "Breakfast · 早餐", "text": "Breakfast\n1. What do\nyou\nthink is the most common breakfast choice\nfor many people in China?\n2. How do you\nthink Chinese breakfast differs from a typical\nWestern European-style breakfast?\n3. Dim sum is very popular in Southern China (and many other\nareas now), but where did this idea originally come from?\n\nmiX#t7 te\nIt's morning; you've just woken up, and you're hungry. You'd better\neat something. How about some Wuhan hot dry noodles, rice noodle\nrolls, or lovely steamed pork buns? We are eating our way through\nthe deliciously diverse world of Chinese breakfast. Come with us as\nwe sample the morning flavours of China. Learn about the rich history\nand cultural significance behind these breakfast delights. Discover\nthe stories, traditions, and regional variations that make Chinese\nbreakfast a delightful culinary adventure. Get ready to savour the\nearly morning taste of China.\nMat\nHello and welcome to another episode. Today, we're\ngoing to be exploring the topic of Chinese breakfast. Now, I'm\nreally excited about this topic because I love food and food\nculture, and I've tried lots of different Chinese dishes in different\nregions of China. So, now to start off with - I'm going to ask you\n\na challenging question, Jocelyn what do\nyou think my three\nfavourite Chinese breakfast items are?\nJocelyn Well, actually, I know your number one favourite is\nWuhan hot dry noodles because I know\nyou\nlived in Wuhan for\nmany years. We used to work together in Wuhan in the same\nschool, and it was quite a well-known fact that you\nloved hot dry\nnoodles!\nMat\nYeah, you're right. Wuhan hot dry noodles are my\nnumber one favourite. Actually, every foreigner I've ever met who\nhas tried them says they are amazing. And we'll come back to this\nlater, but you still haven't guessed my number two and three.\nJocelyn\nOK, let me think\nEm\nI'll have a few guesses. So how\nabout youtiao and\nbowl of soy milk, doujiang. Maybe jianbing,\nwhich is a type of savoury pancake filled with egg, scallions, and\nsometimes meat or vegetables. And what else? Maybe something\n\nFiX#7 *\nlike dim sum, the popular breakfast food in Southern China,\nparticularly in Guangdong province. Maybe one of those small,\nbite-sized dishes that are usually served as dim sum. Am I right?\nMat\nWell, yes and no. First of all,\nreally don't like youtiao\nand soy milk. Jianbing is OK, but dim sum is definitely a yes.\nNow\nI used to live in Southern China, so I really learned to love dim\nsum. And there's something I never really understood, though.\nDim sum is meant to be a morning thing, a breakfast tradition. It's\neven called morning tea sometimes, but I often saw people eating\nit in the afternoon and even late at night. So, is it really breakfast,\nor is it just served all day long and throughout the evening?\nJocelyn OK. That's a good question. Dim sum is traditionally eaten\nfor breakfast or brunch in Southern China, but just like other\nbreakfast dishes, some people want to eat it during the day or\neven at night. So, if the customers want it, the restaurants will\nserve it! Think about your traditional English breakfast: eggs,\nbacon, sausage, toast\ncan you buy that in the afternoon?\nMat\nYes, absolutely. No problem. On menus, you will see \"AlI\nDay Breakfast\" to show that it's available at any time.\nJocelyn So it's exactly the same with dim sum.\nMat\nNow, dim sum always seemed interesting to me, all those\nlittle plates with just two or three items. So, is there some kind of\nstory or history behind this style of breakfast dining, these small\nplates with just two or three items on each plate?\n\nmiX#t7 te\nJocelyn The story goes that many centuries ago, dim sum was\nserved in teahouses for brunch. Travellers used to stop for a\nbreak to have tea or two small food items to eat with their tea.\nThis eventually became known as \"yum cha.\" Dim sum culture\ngrew quickly during the 19th century in Guangzhou, with chefs\nintroducing different cooking styles and ingredients. So today, dim\nsum has a wide range of flavours and can be enjoyed for breakfast,\nlunch, or even as a late-night snack, as we just mentioned. So tell\nme, which item is your favourite from the dim sum trolley? We still\ndon't know your number two and number three.\nMat\nSo my number two is those rice noodle rolls, especially\nthe BBQ pork version. And my number three is similar; it's also\nfrom the dim sum trolley. It's steamed pork buns.\n\n3 30\nJocelyn So your favourites are Wuhan hot dry noodles, rice\nnoodle rolls, and steamed pork buns. Tell me why these are y"}, {"id": "第三辑-日常生活__Night_Markets", "book": "第三辑 · 日常生活", "title": "Night Markets · 夜市", "text": "REEKI ER ERG STE HER it ERE ANVERING\nare hib bo\nNight Markets\n1. What makes night markets different from typical morning\n*hit iL\nor afternoon markets?\n2. What types of food would you expect to find at a Chinese\nnight market?\n3. Have you ever haggled or bargained for a better price at\nWe aga\na market? What tips do you think might help you get a\ngood deal?\nE MICE VER\nHe la /Ebon\nBER\n113 21 ES1 ED\n41125 *\n1#4\nKEN*TE\n18 11 12 Ffh\nx7og* flih# WERE\nn vote\nAGG\nEtr\n-au**s\nT+ *p BEA\nmo roto-\nshit\n\nmiX#t7 ot\nYou know the scene. Daylight is fading, darkness is falling, and in a\nbusy shopping area, a new world flickers to life the bright lights of\nthe night market. We're going for g stroll through these busy, bustling\nstreet markets. Taste sizzling street snacks under neon lights, browse\nstalls bursting with handicrafts, and haggle for deals. Learn why\nevenings are the right time for shopping, socialising, and savouring\nthe local flavours of busy Chinese cities after dark.\nMat\nHello and welcome back to another episode. Today, we're\ntalking about traditional Chinese night markets. Now, when I first\nheard the expression \"night market,\" I got slightly confused. I\ngrew up in London, a city with lots of markets-many of them\nquite traditional: flower markets, food markets, fish markets,\ntextile, fabric, and clothing markets. Now, when I think of these\nmarkets, they all have one thing in common. They open really\nearly in the morning, like REALLY early, around 5 a.m., and you'll\nget the best deal, maybe the best quality, the earlier\nyou go. So,\nmany of these markets are actually closed by lunchtime and they\nare not open in the afternoon. So, for me, the idea of a \"night\nmarket\" seems quite confusing. So, please explain this, Jocelyn.\nJocelyn Well, the traditional Chinese night market dates back\nto the Tang and Song dynasties, and they are still very popular\ntoday in contemporary China. So, to answer your first question,\nwhy are they \"night markets\"? The most common explanation\ngoes like this. Traditionally, these markets were located in\ndifferent parts of the city, and often near the city centre. These\nstreets were very narrow, and during the day they were very\n\nNight Markets\nbusy with people going about their business, carts going back\nand forth. In those days, there were no cars, of course, so as you\ncan imagine, the streets were busy and bustling during the day,\nbut became quieter at night. So, local people started setting up\nstalls selling local snacks and handmade goods, like traditional\nhandicrafts and art. It's very interesting that you mentioned that\nmarkets in London close around lunchtime, because Chinese\nnight markets are usually open\nfrom around 5 p.m. to as late as\n3 a.m. in the morning.\nMat\nOK, SO that makes sense. So, where are they located\nnowadays? Are they still in similar locations as the old original ones?\n. hel\nnow co e\nloop r fooll\nGRAND\nFIREA\n\nNight Markets\nJocelyn If you visit any Chinese city and head for the city\ncentre, somewhere near the main shopping district, maybe in a\nresidential side street, you'll probably find a night market. They\nare easy to find because it's night time, and these markets have\nlots of stalls lining the streets and they are all brightly lit up.\nSome\nof them are quite big, covering more than one street, and some are\nreally famous like Wangfujing and Nanluoguxiang in Beijing.\nMat\nOK, SO what kind of things can\nfind in night markets?\nAre they famous or well-known for selling certain items?\nJocelyn Well, night markets in China are famous for their food\nofferings. The most popular items are local snacks, such as\ndumplings, fried rice, noodles, and grilled meat skewers. And\nthese snacks are usually cheap and delicious, and they are\ncooked in the street. And you're meant to buy them in the street\nand eat them in the street, so they are really like the best example\nof \"Chinese street food.\" I think for\nmany\nChinese people, when\nwe think about the true meaning of \"street food,\" we think about\nfood from a night market.\nMat\nSo, it's not just a market for buying things; it's more like\na fun and interesting place to hang out?\nJocelyn Yes, you're right. It's not just about shopping, but also\nabout experiencing the local food and culture. If you're lucky,\nat certain times of the year, you'll find a night market that has\ntraditional performances such as lion dances, dragon dances,\n\nFiX#7 *\nand musicians, and even street theatre and Peking opera.\nThese\nperformances are a way to showcase local culture a"}, {"id": "第三辑-日常生活__Chinese_Weddings", "book": "第三辑 · 日常生活", "title": "Chinese Weddings · 中式婚礼", "text": "Chinese Weddings\n1. How do weddings in Chinese culture differ from those in\nWestern cultures?\n2. What foods do you imagine are served at a Chinese\nwedding banquet?\n3. Why do people give red envelopes with money at Chinese\nweddings?\n\nF Xi#7 BU\nChinese weddings blend rich traditions and family values. We'll\nexplore the deep meaning of marriage in traditional Chinese culture,\nwhere \"marriage\" isn't just between two individuals but also their\nfamilies. Join us as we uncover the fascinating customs, from\nchoosing auspicious wedding dates to the beautiful tea ceremonies\nand elaborate wedding banquets. Discover how these age-old\npractices continue to shape modern Chinese weddings and the\nsignificant role they play in celebrating love and family bonds.\nMat\nToday, we're talking about weddings. Now,\nthink that\nthere are actually two different things to talk about here. So, first\nof all, marriage itself the idea of marriage in traditional Chinese\nculture-and then the actual wedding itself. So we'll talk about\nwhat happens on the wedding day, and we'll do that later. But\nfirst of all, then, tell me something about the meaning of marriage\nin traditional Chinese culture.\nJocelyn OK, I think we can start with an old definition from Shen\nFu, who was a famous Chinese writer in the Qing Dynasty.\nHis definition goes something like, \"A happily married couple seek\nto remain together for a long time, two people of the same heart\nand mind, relying on each other, indifferent to the affairs of the\nworld.\"\nI think this helps to describe the true Chinese attitude toward\nmarriage-\"two hearts, joined together, moving in the same\ndirection.\" So, I think this captures the traditional Chinese idea of\na \"loving couple,\" which is the essence of a happy marriage.\n\nMat\nOK. I can't say that I'm an expert on marriage or weddings.\nI know something about the typical English idea of marriage; it's\nquite simple. If two people like each other, they date for a while,\nand if they really like each other, they probably live together. And\nthen they might decide to get engaged and then married. That's\nit. It's usually just two people deciding that they want to be\ntogether. Is it different in China?\nJocelyn\nYes, I think it's different in China. Marriage isn't just a\nunion between a man and a woman, but also a union between the\ntwo families. Even today, two families will often sit down together.\nAnd marriage and family are tightly linked. So, it's not just two\nyoung people in love who want to be together; it's actually the\ntwo families becoming connected. So in Chinese culture, family\n\nnada oatE\nand community are highly valued. So marriage isn't just between\nthe two people, but also between the two families. Parents often\nplay a big role in choosing\npartner based on things like family\nbackground, education, and social status. Even today, families\nwill often meet and get to know each other before agreeing to a\nmarriage, to make sure it will be a good and stable marriage. So,\nin Chinese culture, marriage is seen as an important connection\nbetween families as well as individuals.\nMat\nNow, I've been to many weddings in England and quite\na few weddings in China. And when we think of the wedding\nday rituals, ceremonies, and customs, I think there's one really\nobvious difference. Most of my experience in Western European\n\nChinese Weddings\ncultures is that there isn't really one typical ceremony; it differs\nbetween countries and cultures. But one thing I do see is that\nthe wedding traditions in Western Europe are often closely linked\nto religious beliefs. And just as there are many different types\nof religion, so obviously there are many different wedding day\ntraditions and customs. So, what are the most important Chinese\nwedding customs?\nJocelyn Well, there are various different wedding traditions in\nChina, because there are some cultural differences between\ndifferent regions. For example, Southern Chinese culture isn't\nexactly the same as regions in the North. And China has\nmany\ndifferent ethnic\ngroups,\nand each of these has its own traditions.\nSo, weddings are not usually religious ceremonies in China. So\nthe easiest thing for me is to explain the most common traditions\nactually.\nOne important custom is choosing an auspicious or \"lucky\"\nwedding date. And this is because Chinese culture places a lot\nof importance on the calendar, and selecting the right date is\nbelieved to bring good luck and fortune to the couple.\nAnother common custom is the clothing worn by the bride an"}, {"id": "第三辑-日常生活__Guanxi", "book": "第三辑 · 日常生活", "title": "Guanxi · 关系", "text": "Guanxi\n1 . How important do you think personal connections are in\ngetting things done?\n2. Why do you think some cultures place a lot of importance\non personal relationships?\n3. What do you think the English expression \"you scratch my\nback and I'll scratch yours\" means?\nT Gatt\n\nAgE Xi#7 bE\nIt's just one little word with a lot of special meaning: \"guanxi.' This\nis where personal relationships matter. While personal connections\nare vital in cultures worldwide, the concept of guanxi plays a very\nimportant role in Chinese culture. We're uncovering the intricacies of\nguanxi, using a practical example to highlight its importance and how\nit shapes interactions in Chinese society.\nMat\nHello and welcome to another episode of China Lifestyle\nJourneys! Today, we're delving into the fascinating topic of guanxi,\nor as we say\nin English, \"personal relationships\" in Chinese\nculture. So, personal relationships hold significant importance in\nChinese society, but I think this is also an important part of many\ncultures, so let's explore the differences. So first of all, Jocelyn, I\nthink we should start with an example.\nJocelyn Yeah, sure, Mat! Let's create an example with a fictional\nstory rather than using\nreal-life example. So imagine a\ncharacter, a Chinese businessperson named Li, and his colleague,\nZhang. Li and Zhang have been working together for several years\nand have developed a strong guanxi (a personal connection).\nThey often go out for meals together, exchange small gifts on\nspecial occasions, and help each other out whenever needed.\nThis personal relationship goes beyond just business interactions\nand creates a sense of trust and mutual support between them.\nFor instance, if Li needs a favour or an introduction to someone,\nZhang would be more likely to assist him because of their\nestablished guanxi. It's a friendship that extends beyond the\nworkplace and enhances their professional collaboration.\n\nony,\nthen, en\nother thee,\nMat\nI'm not sure if I get it. It sounds like they are workmates,\nthey get on well with each other, and when they need a favour,\nthey help each other out, just like most people do in this situation.\nTo me, this sounds like just any kind of normal relationship\nbetween colleagues. I can imagine this happening in my country.\nSo, what am I missing here?\nJocelyn OK, let me give\ndifferent example using our two\ncharacters, Li and Zhang. Let's say that Li is getting married and\nneeds to hire a restaurant for the wedding party. Zhang's uncle\nowns a fancy restaurant in the neighbourhood. And Zhang says,\n\"I'll ask my uncle if he can give you a good deal on the wedding\nparty.\" Zhang's uncle agrees,\nand Li can hire out the restaurant\n\nthe a.le\nfor a very good price. Zhang's uncle will even give some free\ndrinks and snacks on the table. Li is very happy; he accepts this\noffer. And Zhang has done him a big favour. Li knows this, and\nZhang knows it. And it is stored in their heads. Imagine it like a\nfootball score: Zhang One, Li Zero. Zhang is owed a favour. Now\nthis is where it gets interesting because Zhang can call in that\nowed favour any time he wants-next week, next month, and\neven next year. It will not be forgotten.\nMat\nOK, so it's similar to the English expression, \"You scratch\nhe can ask Li to help with the restaurant arrangements for his\nmy\nback and I'll scratch yours.\" So when Zhang gets married,\nwedding. Is that how it works?\n\nGuanxil\nJocelyn Well, yes, that's possible, but Zhang is owed a favour of a\n\"similar social value\" it could be something completely unrelated\nto weddings. So let's say Zhang's sister has a very important\nuniversity examination coming up; she needs some guidance with\nher studies. Li's sister is a teacher; Zhang asks Li, \"Can your sister\nhelp my sister with her exam?\" Li is obliged to say yes.\nMat\nOK, so Zhang asks Li to repay the favour. And Li cannot\nrefuse. But what happens if Zhang asks Li to lend him a million\ndollars or something like that?\nJocelyn Well, that's it; you've kind of found the true meaning\nof \"guanxi\" here. There is an understanding that the favours\n\nFIXi#7 *E\nexchanged should be within a reasonable and appropriate range\nequal in size to the favour owed. Asking for a million dollars\nwould likely be considered beyond the scope of the guanxi\nrelationship between Li and Zhang. It's important to note that\nguanxi operates within certain boundaries and is based on trust\nand balance. Asking for such a large sum of money would likely\nput a strain on the relationship and go agains"}, {"id": "第三辑-日常生活__Education", "book": "第三辑 · 日常生活", "title": "Education · 教育", "text": "Education\n1. In just a few words, can you describe your idea of \"the\ngoal of education\"?\n2. Do you think people in China and Western countries have\ndifferent views on \"the goal of education\"?\n3. What do\nyou\nthink is more important in education,\nacademic achievement or developing creativity?\n\nA X#t7  k\nIt's time to go to school. Two parents from quite different cultural\nbackgrounds, English and Chinese, explore their attitudes and\nperspectives on educating their children. We're not trying to say\nthat one approach is better than the other; this conversation aims\nto shed light on the intriguing differences and interesting overlaps in\nthese two educational philosophies. From the emphasis on academic\nachievement to nurturing creativity and individuality, get ready for a\nlively lesson on the essence of education.\nMat\nHello and welcome to another episode. Today we\nare talking about something very important: education. Now,\nas parents, we both have first-hand experience of our kids'\neducation. So I think this will be a good opportunity to compare\nour attitudes towards educating children. Now I'm sure we'll have\nsome very different ideas on this topic because of our cultural\nbackground-I'm English and you're Chinese. We're not trying to\nshow how one way is better than the other; I think it's just going\nto be interesting to explore the differences. So, Jocelyn, my first\nquestion is very general. In a few sentences, can you\nsummarise\nyour view of \"the main aim or goal of education\"?\nJocelyn Yeah, I agree with your point. We're not trying to prove\nthat one way is better;\nthink we'll be highlighting that there\nare some differences and maybe even some similarities. So, for\nme, I guess 1 4 have a typical Chinese parent's attitude towards\neducation. So to summarise, I'd say that education is highly\nvalued and considered to be the key to success in later life. So\nthe main aim of education is to go to a good school with the best\n\nU\na\nE\n*\ntip soone\ni\n3 200-\n1  e34\nmo the\nBe7aa*s\nE\ni\ni\n#\n\nmiX#t7 t\npossible teachers and to use all the available resources to get the\nbest education possible (and that often means paying tuition fees\nfor the best schools). So there should be a lot of peer pressure\nto perform well, and the competition should be quite intense\nbecause this can push a student to perform at their very best.\nThe ultimate goal is to get into a good university and secure a\ngood job in the future. So that's why students in China tend to be\nvery focused and hardworking in their studies.\nMat\nThat's interesting, and it does differ from my answer. I\nwould say that generally, for most parents in the UK, education\nis also important, but I think there's a greater emphasis on\ndeveloping individuality and creativity. We encourage\nstudents to\nfind their own passions and interests, and to follow them within\nthe framework of their education and then these passions might\nlead to future career decisions. Of course, academic achievement\nis still important, but there's far less\npressure\nto achieve a certain\nstandard. I think we have a more relaxed approach to learning,\nwith a focus on independent thinking and critical analysis. So as\nparents in the UK, certainly we value subjects like music, visual\narts, and drama more than maths, science, and English, I think,\nor certainly as much as equally. Would you say that's true of\nChinese parents?\nJocelyn Well, I think generally, Chinese parents won't encourage\nkids to focus on the arts as much as academic subjects like\nmaths, science, and Chinese. There's a good reason for this-\nit's because in Chinese education, there is a strong focus on high\n\nTI foot puns\nRA\nKERi\nat ant hith itt\nendea\nschool and university entrance exams (zhongkao and gaokao), and\nsuccess is often measured by getting good scores in these exams.\nPursuing artistic subjects, on the other hand, might be seen as\nwasting an opportunity because these are not so important in\nthese exams, at least now. So, for this reason, Chinese parents\ncan be quite controlling when it comes to their children's\neducation paths and choices. So they may try to influence their\nchildren's decision-making or even completely control it, as they\nbelieve it's their responsibility to ensure their children's success.\nSo, while individuality and creativity are valued, academic\nachievement and a secure future are often prioritised above all\nelse.\nMat\nThat's interesting because my son Oscar (who is 18 now),\nhe has spent the last two years of high school studying music, art,"}, {"id": "第三辑-日常生活__Bamboo", "book": "第三辑 · 日常生活", "title": "Bamboo · 竹子", "text": "Bamboo\n1. Have\nyou\never seen bamboo used in art? What do you\nthink it represents?\n2. Did you\nknow that bamboo can be used in cooking? What\ndishes do you\nthink might include bamboo?\n3. Can you imagine writing a poem\nabout bamboo? What\nthemes or qualities would you focus on?\n\nBamboo\nHow can a simple plant inspire so many ideas about art and emotions?\nWhich plant are we talking about? Of course, it's bamboo, that towering\nsymbol of Chinese culture. See how strength and flexibility make bamboo\nan icon. Discover bamboo poetry. Taste bamboo's flavour as a truly\nunique food item. Get a deeper understanding of how this very common\ntype of grass has such deep cultural roots, with traditions spanning\nacross centuries in parks, gardens, forests, fields, and our imaginations.\nMat\nHello and welcome to another episode. Today, we're going\nto be exploring the topic of bamboo. Now,\nwill be honest, when\nI first saw the title of this episode \"bamboo,\" my reaction was,\n\"Bamboo? How can we do a whole episode on the topic of bamboo?\nIt's a plant, and pandas eat it. And that's it. End of episode.\" So,\nJocelyn, tell me, how are we going to do a whole episode on\nbamboo?\nJocelyn Well, I can understand why you might think that, but\nbamboo is actually a fascinating plant that has been really\nimportant in Chinese culture for many centuries. It has been used\nfor everything from building materials to food, medicine, musical\ninstruments, and it's really important in art and literature. So,\ndon't worry, we've got lots to explore when it comes to bamboo.\nMat\nI'm still not sure. You haven't really convinced me. When\nI think about bamboo,\nstill just see a plant that pandas eat. So\nplease, tell me what I'm missing.\n\nJocelyn OK-let's start with symbolism. In Chinese culture, bamboo\nis a very important symbol. It stands for strength, resilience,\nand flexibility. It's like a strong person who can bend without\nbreaking. Bamboo also represents other good qualities, like\nhonesty, loyalty, and friendship.\nSo\nyou can see the symbol of bamboo in many different parts of\nChinese culture. It's in art, like paintings and calligraphy, and in things\nlike ceramics or textiles, as well as classical literature and poetry.\nAlso, bamboo is associated with the virtue of filial piety in Chinese\nculture. This is the idea that children should respect and care for\ntheir parents and grandparents, and it's also considered one of\nthe most important virtues in Chinese society.\nIn Chinese folklore, bamboo is often used as a symbol of filial\npiety because of its strength and flexibility. Just like how bamboo\nis strong enough to withstand harsh weather conditions, it also\n\nrepresents the strength and resilience needed to care for aging\nparents and grandparents. Additionally, the flexibility of bamboo\nreflects the idea that children should be able to adapt to their\nparents' changing needs and sacrifice their own interests for the\nwell-being of their family.\nHave I convinced you yet, Mat? I can keep talking if you need more.\nMat\nWow, I think we could probably do two episodes on\nbamboo. But let's just finish this one first. So, I see how bamboo\nis important as a symbol in Chinese culture. Now I understand the\nsymbolism of filial piety, but you mentioned something to do with\nliterature and poetry. Do you mean that people actually wrote\npoems about bamboo and stories about bamboo in traditional\nChinese literature?\n\nFiX#7\nJocelyn Sure, there's a type of poetry actually called \"bamboo\npoetry.\" It's a well-known traditional style that focuses on the\nbeauty and symbolism of bamboo. It became popular during\nthe Tang Dynasty and continued to be written throughout the\nfollowing centuries. These poems often describe the physical\nappearance of bamboo and its symbolic meanings in Chinese\nculture. They may also use metaphors to explore deeper themes\nrelated to human nature and the natural world.\nOne famous bamboo\npoem\nis \"Bamboo and Rocks\" by the poet\nZheng Xie. And this poem explores the relationship between the\nstrength of rocks and the gentle swaying movement of bamboo,\nmeaning that being able to bend and adapt to different situations\nis just as important as being strong and staying firm in your\nbeliefs. It's like how a bamboo tree can bend with the wind but not\nbreak, showing how it's important to be flexible and resilient in life.\nMat\nWow, to be honest, had no idea that one plant, bamboo,\ncould inspire so much creativity. I'm quite impressed. So, we've\nlooked at symbolism in the creative arts. W"}, {"id": "第三辑-日常生活__Kites", "book": "第三辑 · 日常生活", "title": "Kites · 风筝", "text": "Kites\n1. What do\nyou think kites were originally used for?\n2. Why are bamboo and handmade\npaper\nideal materials for\ncrafting traditional Chinese kites?\n3. Do the common kite designs of birds and dragons have\nany special meaning?\nIRANOTH\n\nKites\nIt's windy. Let's go to the park, watch some leaves blowing in the\nwind, and fly some kites. The ancient art of Chinese kites dates back\nover two thousand years. Discover their military origins and vital\nrole in communication. Learn about the symbolic meanings behind\nmodern kite designs, like birds and dragons. Uncover the hidden\nskills of kite-flying, where precision and control are essential. And\ndon't forget the skill and craftsmanship behind traditional Chinese\nkite design and construction. Kites aren't just child's play; they carry\na rich cultural legacy.\nMat\nHello and welcome to another episode of China Lifestyle\nJourneys. Today, we are talking about a fascinating Chinese\nhandicraft, something that has a long and interesting history,\nsomething everyone knows- Chinese kites. So for most people,\nand I think me included, kites are something that kids play with.\nI didn't realise that kites had such a \"colourful\" history until we\nstarted talking about this today. So, I guess the obvious place to\nstart, Jocelyn, is with the question: what do we know about the\nhistory of Chinese kites?\nJocelyn OK, sure, let's start with some history. Chinese kites\nhave a rich cultural heritage that dates back thousands of years.\nAnd they were believed to have originated in China between 475\nBCE and 221 BCE, with the earliest kites being made of wood and\nresembling the shapes of birds. Over time, craftsmen began using\nlighter materials such as silk and bamboo, and later, paper and\nbamboo, to create these beautiful flying objects.\n\nCC ALt9\nsaut\nMat\nSo, I think that's an important point for everyone. The\nidea of kites was actually invented by the Chinese a few thousand\nyears ago.\nHow do we know this? Do we have\nany\nsolid evidence?\nJocelyn Well, most historians agree that the origins of kites can\nbe traced back to ancient China. We have quite a lot of historical\nrecords and accounts that provide strong indications that the\nancient Chinese invented kites.\nMat\nSo, if the kites were invented by the ancient Chinese all\nthose years ago, what were they doing with these kites? Were\nthey just going to the park like people today, flying their kites in\nthe park as a way\nto relax?\n\nKites\nJocelyn That's a very good question, actually. In ancient China,\nkites had important practical uses (actually they didn't start out\nas something fun in the park-this came much later). Kites were\noriginally developed for military purposes, particularly during the\nWarring States Period (475-221 BCE). There are some historical\naccounts that tell us about two people, Mozi and Lu Ban. They\nboth played a role in inventing kites for military intelligence,\nmeasuring distances, and calculating wind readings. Actually,\nkites provided valuable information for strategic movements and\ncommunication, similar to ship flags at sea. So, think about it: if\nyou\nhad a huge army on a field and you wanted to give orders,\nlike this\ngroup move over there, and that group move forward and\nso on, they didn't have mobile phones or radio communication,\nbut they did have kites. So, early kites were a form of signal\ncommunication; different shapes, different colours, and different\ndesigns had specific meanings (related to military movements).\nMat\nWow, I have never thought about kites in that\nway. So\nactually, kites are more important than we think. They were an\nearly form of communication; that's pretty cool, actually. So when\ndid people start designing and creating the types of kites that\nwe see today, in the shape of birds, dragons, fish, and things like\nthis? And do these animal designs have any special meanings?\nJocelyn Well, the designs we see in modern kites, such as birds,\ndragons, and fish, have evolved over time. The art of designing\nand creating elaborate and beautiful kites really began sometime\nduring the Ming (1368-1644 CE) and Qing (1636-1912 CE)\n\nFiX#7 *\ndynasties. During this period, kites changed quite a lot in terms of\nsize, design, decoration, and even flying skills. The shapes of\nanimals in kites often carry symbolic meanings deeply rooted in\nChinese culture. Birds may represent freedom and grace, while\ndragons symbolise power and prosperity. And fish can symbolise\nabundance and good fortune.\nMat\nYou just mentioned \"flying skills.\" Is th"}, {"id": "第三辑-日常生活__Fans", "book": "第三辑 · 日常生活", "title": "Fans · 扇子", "text": "Fans\n1. How did ancient Chinese people keep cool before the\ninvention of air conditioning?\n2. As well as keeping cool, what other functions did fans\nhave in ancient times?\n3. Does decorating fans with calligraphy and paintings have\nany special meaning?\n\nFE Xi#7 k\nIt's a hot summer day. Don't turn on the air-con. We don't need\nmodern technology to keep cool. We've got something invented\nbefore the era of electricity-traditional Chinese fans. They come\nin a wide range of distinctive fan styles, like the elegant half-moon-\nshaped \"tuanshan\" or \"gongshan,\" used for shading nobles from the\nsun. We'll think about fan decoration, using calligraphy and paintings\nfor meaningful phrases. We'll also talk about fans as popular fashion\naccessories. Keep cool with this FAN-tastic episode.\nMat\nHello and welcome to another episode of China Lifestyle\nJourneys! Today, we're talking about Chinese fans. So, if you've\nbeen in a Chinese city in summer, hot summer weather, you've\nprobably seen people keeping cool with a handheld fan. Now, I'm\nsure there's more to fans than just keeping cool. So, let's start\nwith the basics. Jocelyn, what do we know about the history of\nChinese fans?\nJocelyn OK, so the history of fans in China dates back to over\n3,000 years ago. Actually, their original function was the same\nas the way we use them today-in ancient times, people used\nfans to create a breeze and stay cool in hot weather. Obviously,\nin those days, there was no air conditioner or electric fans. So,\nhandheld fans were probably the best option for keeping cool.\nMat\nSo, over 3,000 years ago, people who were feeling hot in\ncities used fans to keep themselves cool. And today, we still use\nthem for the same thing. So, have fans ever been used for other\npurposes over the years?\n\nJocelyn Actually, yes, they have. Besides keeping people cool,\nfans have had some other important uses too. There was one\ntype of fan, called zhangshan. This was a long-handled fan, and\nit was shaped like a door and used for ceremonial\npurposes.\nIt was believed to be invented by a king a really long time ago.\nAnd it represented imperial power and authority during the Qing\nDynasty.\nMat\nI think I've seen those fans. The wooden handle is quite\nlong, and the fan part is in the shape of, kind of like a rectangle.\nAs you said, it looks like a door. But I guess for most people, if\nthey imagine a traditional Chinese fan, they picture one that looks\nlike half a circle, kind of like a moon shape. Does that fan, or that\ntype of fan, does it have a name?\n\nFiX#7\nJocelyn\nI think you're talking about something called tuanshan,\nor gongshan. Yes, this is\nfamous style of fan. And these fans\nwere often quite big and were originally used to protect important\npeople (like the kings) from the sun, wind, or even sand (during a\nsandstorm). Servants used to hold these fans for the nobles. So,\nthese were not really for creating a breeze; these were more like a\nshade, to shade people from the sunshine.\nMat\nOK. Now, whenever I've seen a Chinese fan, it usually\nhas some kind of painting on it, some kind of design, either a\npicture or some writing. Can you tell me something about that?\nJocelyn Yeah, sure. There's a long tradition of fans being\ndecorated with calligraphy, paintings, and auspicious patterns.\nThey were like little pieces of art. People would use fans with\nM.428\n\ndifferent designs to express their status or personal preferences.\nSo, it was a way to show off their creativity and taste. The\ncalligraphy on the fan could be meaningful phrases, poetry,\nor even famous quotes. Paintings were also a popular choice,\nfeaturing various subjects like landscapes, flowers, birds, and\neven mythical creatures.\nMat\nNow, I think most people know about folding fans; I'm\nguessing that they arrived later because they are a little bit more\ncomplicated than the other types of fans. So, when did folding\nfans become popular?\nJocelyn Folding fans started to become popular during the Han\nDynasty, around 2,000 years ago.\nBamboo and hand-woven leaf\n\nFiX#7\nfans were invented, making fans more affordable for common\npeople. So, around the same time, silk fans started to become\npopular. And because of the sturdy materials (bamboo and\nMat\nsilk), many ancient examples are still around today. In certain\nSo, I guess\nmuseums, you can see fans that are thousands of years old.\n\"fan-making\" industry.\naccessory in their day, and there was probably something like a\nthese were quite an important fashion\nBUREANATHA **oN\n\"\ni\nparo4pNowaaa1"}, {"id": "第四辑-经典文化__Romance_of_the_Three_Kingdoms", "book": "第四辑 · 经典文化", "title": "Romance of the Three Kingdoms · 三国演义", "text": "T\n* VIRE TE\n1 a 1\nRomance of the Three Kingdoms\nhistorical novel?\n1. What are the \"three kingdoms\" in the title of this\nChinese novel?\n2. Why are there different English titles for this famous\n3. What elements do you think make a historical story\ninteresting to readers today?\ng\ng\n\nFE Xi#7 bE\nGet ready, book-lovers! We're opening one of China's most renowned\nliterary works, Romance of the Three Kingdoms. What's the\nsignificance of the title? Don't be misled by the term \"romance\"-it's\nnot a romantic love story. Discover some of the stories behind these\nthree kingdoms, each with its unique culture and geography. Join us\nas we open\nthe\npages\nof this captivating narrative!\nMat\nWelcome back to China Lifestyle Journeys! Today, we're\ntalking about a very famous Chinese book called Romance of the\nThree Kingdoms. Now, I know that this is one of China's most\nfamous historical novels. So, let's start at the beginning with\nthe title. Why is it Romance of the Three Kingdoms-what's the\nsignificance of \"three kingdoms\"?\n9t\nkeit\nE\nTh\nDIRAC\n\nRomance of the Threel Kingdoms\nJocelyn\nGood question! The \"three\" in the title Romance of the\nThree Kingdoms refers to a critical period in Chinese history\nknown as the Three Kingdoms period. This era occurred between\nthe fall of the Han Dynasty and the rise of the Jin Dynasty, roughly\nspanning the years from 220 to 280 CE. During this time, the\nland that was previously unified under the Han Dynasty broke\ninto three major states: Wei, Shu, and Wu. These three powers\n(or states), along with several other smaller factions, fought\nfor power, leading to a complex and difficult period in Chinese\nhistory. So, the title Romance of the Three Kingdoms captures this\ncentral theme of the novel the struggle for power among these\nthree distinct states.\nMat\nOK, SO it sounds like a historical account with lots of\nintrigue and battles, but I'm a bit confused. When I did some\nbackground reading for this episode,\nsaw this book is titled\nRomance of the Three Kingdoms. Now, it doesn't really sound like\na romantic love story.\nJocelyn\nAh, I can see why that might sound confusing. The term\n\"romance\" might indeed be\nbit misleading in this context. In\nthe case of Romance of the Three Kingdoms, the word \"romance\"\ndoesn't refer to romantic love, as we often think of it today.\nInstead, it's used in an older sense of the word. In literature,\na \"romance\" can mean a tale of bravery, honour, heroism, and\nadventure set against a historical backdrop. So, when\nyou see\nRomance of the Three Kingdoms, it means a narrative that's not\njust about battles and political intrigue, but also about the heroic\n\nmiX#t7 t\ndeeds, courage, and strategic thinking of the characters during\nthat difficult period.\nMat\nAh,\nsee now. So it's not a love story; it's about these\nthree kingdoms. I've forgotten the names already. So tell me\nagain, what are they called? Are these fictional places these\nthree kingdoms? Are they real? Or are they just invented for the\nbook? Do they represent real places that we know in China today?\nJocelyn The three kingdoms are called Wei, Shu, and Wu.\nThey might sound unfamiliar, but they were real historical states\nduring the Three Kingdoms period. Wei was in the north, Shu in\nthe southwest, and Wu in the southeast of ancient China. These\nkingdoms aren't fictional; they represent actual regions with their\nown language and culture. It's not easy to map them onto today's\n\nRomance of the Threel Kingdoms\nmap of China, but a very simple explanation is that Wei was located\nin northern China, generally around modern-day Henan, Shanxi,\nShandong, Hebei, and other provinces. Shu was situated in the\nsouthwest, mainly covering present-day Sichuan and parts of Gansu,\nShaanxi, Yunnan, etc. Wu, on the other hand, was positioned in the\nsoutheast, encompassing areas of today's Jiangsu, Zhejiang, Anhui,\nJiangxi, Hunan, and other provinces. As I said, this is just a rough\nidea of where they were located. These locations were strategically\nimportant during the Three Kingdoms period. They each had unique\ngeography and culture, playing a significant role in the historical\nevents depicted in the novel.\nMat\nSo, to me, the novel sounds like major historical struggle,\na war even, between the north, the middle part of China, and the\nsouth of China. So, obviously, my question here is: who won the war?\nJocelyn You're right, Mat. It was indeed a major struggle between\nthree powerful states. In the end, the Western Jin Dynasty replaced\nthe state of Wei, brou"}, {"id": "第四辑-经典文化__Water_Margin_(Heroes_of_the_Marsh)", "book": "第四辑 · 经典文化", "title": "Water Margin (Heroes of the Marsh) · 水浒传", "text": "Water Margin (Heroes of the\nMarsh)\n1. How can a character in a novel be both a hero and an\noutlaw at the same time?\n2. Why might an author choose to include both realistic and\nmagical elements in a story?\n3. Water Margin (Heroes of the Marsh) is based on the\ntheme of fighting injustice. Do you\nknow any other stories\nwith a similar theme?\n\nAny discussion on classic Chinese literature needs to mention the\nmasterpiece, Water Margin (Heroes of the Marsh), also known as\nin its title, and we're here to explore why that is. This captiv
