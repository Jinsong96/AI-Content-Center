/* 用 LLM 把「标题 + 摘要」转成英文视觉描述词，相关性显著强于关键词拼接。
   失败自动回退 buildCoverPrompt()，不会让封面链路挂掉。 */
async function buildCoverPromptLLM(){
  const o = liveOut();
  const g = GEN[state.lvl];
  const title = (g && g.title) || (o && o.title) || curMaterialLabel() || "";
  const summary = (o && o.summary) || curMaterialLabel() || "";
  if(!title) return buildCoverPrompt();
  /* 重试 2 次：第一次失败后用更激进的 system 再试一次，避免被质量不稳的输出打到 fallback */
  for(let attempt = 0; attempt < 2; attempt++){
    try {
      if(!SF_LLM.apiKey) return buildCoverPrompt();   /* 无密钥直接走本地兜底，不浪费重试 */
        const resp = await fetch(SF_LLM.apiBase + "/chat/completions", {
        method: "POST",
        headers: { "Authorization": "Bearer " + SF_LLM.apiKey, "Content-Type": "application/json" },
        body: JSON.stringify({
          model: SF_LLM.model,
          messages: [
            { role: "system", content: attempt === 0 ? COVER_SYS : COVER_SYS_RETRY },
            { role: "user", content: "Title: " + title + "\nSummary: " + String(summary).slice(0, 200) }
          ],
          max_tokens: 45, temperature: 0.4
        })
      });
      const d = await resp.json();
      let txt = d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
      txt = String(txt || "").replace(/<\/?think>/g, "").trim();
      /* 关键清洗：剔除一切非 ASCII 可打印字符（中文、繁体、日文、emoji 等）。
         Kolors 见到这些要么抛错要么画歪，而 Qwen2.5 偶尔会吐中文混入。 */
      txt = txt.replace(/[^\x20-\x7E]/g, " ").replace(/\s+/g, " ").trim();
      /* 防御 Qwen2.5 偶发的「重复词死循环」（如 palette palette…）。
         同词连续 2 次就折叠为 1 次（实战中正常 prompt 不会重复同一词两次以上）。 */
      txt = txt.replace(/(\b\w+\b)(?:\s+\1\b){1,}/gi, "$1").trim();
      /* 硬截断到 200 字符（避开失控长尾）。Kolors prompt 50-120 词足够画图。 */
      if(txt.length > 200) txt = txt.slice(0, 200).trim();
      /* 自动补关键收尾字段：Kolors 没有 "modern flat illustration / no text" 收尾容易跑偏 */
      if(!/flat illustration/i.test(txt)) txt += ", modern flat illustration";
      if(!/no text/i.test(txt)) txt += ", no text";
      /* 有效英文判定：至少含 4 个英文单词、长度 20-260，否则视为无效 */
      const words = txt.match(/\b[a-z]{3,}\b/gi) || [];
      /* 阈值收紧到 ≥6 个有意义英文词（排除 no/in/at 等虚词），且 ≥12 字符；
         避免补字段后凑成 4 词通过、实际原 prompt 仅 1 词的「假通过」 */
      if(words.length >= 6 && txt.length >= 12 && txt.length <= 200) return txt.slice(0, 300);
    } catch(e){ /* 重试 */ }
  }
  return buildCoverPrompt();
}

    });

/* 图片 URL → dataURL（绕开图床 1 小时有效期） */
async function urlToDataURL(url){
  try {
    const r = await fetch(url);
    const blob = await r.blob();
    return await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(String(fr.result));
      fr.onerror = rej;
      fr.readAsDataURL(blob);
    });
  } catch(e){ return null; }
}
/* 封面容量保护：localStorage 约 5MB，单张 512 图约 0.55MB。
   超限时从最早的文章开始清封面，清到放得下为止。 */
function pruneCoverQuota(incomingLen){
  try {
    const bank = loadBank();
    let total = incomingLen;
    bank.forEach(a => { if(a.coverDataUrl) total += String(a.coverDataUrl).length; });
    const LIMIT = 3.5 * 1024 * 1024;
    if(total <= LIMIT) return true;
    const withCover = bank.filter(a => a.coverDataUrl).sort((x, y) => (x.createdAt || 0) - (y.createdAt || 0));
    let changed = false;
    for(const a of withCover){
      if(total <= LIMIT) break;
      total -= String(a.coverDataUrl).length;
      delete a.coverDataUrl;
      changed = true;
    }
    if(changed) saveBank(bank);
    return total <= LIMIT;
  } catch(e){ return true; }
}

        const n = state.audioMeta.count;
        const mt = state.audioMeta;
        toast(n >= 6
          ? L("已生成 6 个音频 · " + mt.model + " · " + (mt.elapsedMs/1000).toFixed(1) + "s（缓存 " + mt.cached + " / 新合成 " + mt.generated + "）",
              "Generated 6 audio files · " + mt.model + " · " + (mt.elapsedMs/1000).toFixed(1) + "s (cached " + mt.cached + " / new " + mt.generated + ")")
          : L("仅生成 " + n + "/6 个音频：" + (mt.error || L("部分档位失败","some levels failed")),
              "Only " + n + "/6 generated: " + (mt.error || "some levels failed")));
        ok = true;
      } else {
        const why = (j && (j.error || j.message)) || L("桥接层未返回音频（" + AGENT_REACH_API + "）","bridge returned no audio (" + AGENT_REACH_API + ")");
        state.audioMeta = audioMetaFrom(j && j.meta, {}, why);
        toast(L("音频生成失败：" + why, "Audio generation failed: " + why));
      }
    } catch(e) {
      const why = L("桥接层未启动（" + AGENT_REACH_API + "）。启动后可在内容库点「重新生成音频」补生成",
                    "bridge not running (" + AGENT_REACH_API + "). Start it, then use \"Regen audio\" in the library");
      state.audioMeta = audioMetaFrom(null, {}, why);
      toast(L("音频生成失败：" + why, "Audio generation failed: " + why));
    } finally {
      state.audioGenerating = false;
      state.audioPromise = null;
      render();
    }
    return ok;
  })();
  return state.audioPromise;
}
/* 音频元信息：全部来自后端上报，前端只做搬运与展示，不自行推断，
   这样内容库能如实说明「生成了几个、用的什么模型、耗时多久、为什么失败」。 */
function audioMetaFrom(meta, audio, err){
  const m = meta || {};
  const n = bankAudioCount({ audio: audio || {} });
  let status;
  if(err) status = "failed";
  else if(n >= 6) status = "ok";
  else if(n > 0) status = "partial";
  else status = "failed";
  const errs = m.errors || [];
  return {
    status: status,
    count: n,
    requested: m.requested || 0,
    model: m.model || "",
    voice: m.voice || "",
    provider: m.provider || "",
    levels: m.levels || [],
    accents: m.accents || [],
    cached: m.cached || 0,
    generated: m.generated || 0,
    failed: m.failed || 0,
    skipped: m.skipped || 0,
    elapsedMs: m.elapsed_ms || 0,
    generatedAt: m.generated_at || Date.now(),
    errors: errs,
    error: err || (errs.length ? String(errs[0].error || "") : "")
  };
}
/* 内容库徽章文案：区分「未生成 / 生成中 / 已生成 / 部分 / 失败」，不再笼统显示"无音频" */
function audioStatusInfo(a, id){
  if(bankAudioBusy === id) return { cls:"gen", text:" " + L("生成中…","Generating…"), tip:L("正在调用 TTS 合成","Calling TTS") };
  const mt = a && a.audioMeta;
  const n = bankAudioCount(a);
  if(mt && mt.status === "failed"){
    return { cls:"fail", text:" " + L("生成失败","Failed"), tip:(mt.error || L("后端未返回音频","No audio returned")) };
  }
  if(n >= 6) return { cls:"ok", text:" 6/6", tip:L("三档 × 英音/美音 全部就绪","3 levels × UK/US ready") };
  if(n > 0) return { cls:"part", text:" " + n + "/6", tip:L("仅部分生成成功","Partially generated") };
  if(mt) return { cls:"fail", text:" " + L("生成失败","Failed"), tip:(mt.error || "") };
  return { cls:"none", text:" " + L("未生成","Not generated"), tip:L("入库时未生成音频","Not generated when banked") };
}
/* 等待在途音频生成完成（带上限，避免卡住入库流程） */
function waitForAudio(ms){

/* 用浏览器内置语音合成在线朗读（英音 en-GB / 美音 en-US，免费无需 key；分块避免 15 秒截断） */
function speakAccent(accent){
  if(!("speechSynthesis" in window)){ toast(L("当前浏览器不支持在线朗读","Browser does not support speech synthesis")); return; }
  const text = audioText(state.lvl);
  if(!text){ toast(L("暂无文章内容","No article content")); return; }
  if(accentSpeaking){ speechSynthesis.cancel(); accentSpeaking = false; return; }
  accentSpeaking = true;
  const chunks = text.match(/[^.!?]+[.!?]+/g) || [text];
  const prefix = accent === "gb" ? "en-gb" : "en-us";
  const voices = speechSynthesis.getVoices();
  const voice = voices.find(v => (v.lang||"").replace("_","-").toLowerCase().startsWith(prefix)) || voices.find(v => (v.lang||"").toLowerCase().startsWith("en"));
  chunks.forEach((c, idx) => {
    const u = new SpeechSynthesisUtterance(c.trim());
    u.lang = accent === "gb" ? "en-GB" : "en-US";
    if(voice) u.voice = voice;
    u.rate = 0.95;
    if(idx === chunks.length - 1) u.onend = () => { accentSpeaking = false; };
    speechSynthesis.speak(u);
  });
}

    if(/^[A-Z][a-z]{2,}$/.test(w) && !stopRe.test(w) && !seen.has(w)){ seen.add(w); picks.push(w); }
    if(picks.length >= 4) break;
  }
  if(!picks.length) return [];
  return picks.map(w => [w, "「" + w + "」"]);
}

/* Agent-Reach 后端桥接层：真实热点/信源抓取（本机运行 python3 backend/agent_reach_bridge.py） */
/* 后端桥接层地址 —— 可配置，工程化交付时改这里即可，业务逻辑无需改动。
 *
 * 优先级：localStorage 覆盖 > URL 参数 ?api= > window.WB_API_BASE > DEFAULT_API_BASE
 *
 *  注意：同源部署时服务端会注入 window.WB_API_BASE=""（空串=同源）。
 *    空串是合法值，判断必须用 typeof === "string"，不能用 if(window.WB_API_BASE)
 *    —— 否则空串被判为假，会错误回落到 DEFAULT_API_BASE，导致桥接永远不可达。
 */
const DEFAULT_API_BASE = "http://127.0.0.1:8787";
function readApiBase(){
  const norm = v => String(v || "").trim().replace(/\/+$/, "");
  try {
    const qs = new URLSearchParams(location.search).get("api");
    if(qs) return norm(qs);
  } catch(e){}
  try {
    const saved = localStorage.getItem("wb_api_base_v1");
    if(saved) return norm(saved);
  } catch(e){}
  if(typeof window !== "undefined" && typeof window.WB_API_BASE === "string") return norm(window.WB_API_BASE);
  return DEFAULT_API_BASE;
}
/* 运行时可切换（换机器/指向新后端时用）；传空串则恢复默认 */
function setApiBase(url){
  const norm = v => String(v || "").trim().replace(/\/+$/, "");
  const next = norm(url) || DEFAULT_API_BASE;
  AGENT_REACH_API = next;
  try {
    if(norm(url)) localStorage.setItem("wb_api_base_v1", next);
    else localStorage.removeItem("wb_api_base_v1");
  } catch(e){}
  state.bridgeOk = null;
  checkBridge();
  return next;
}

let TAXO = null;

async function loadTaxonomy(force){
  if(TAXO && !force) return TAXO;
  try {

    if(!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if(!j || !j.ok || !Array.isArray(j.categories) || !j.categories.length) throw new Error(L("词表为空","empty taxonomy"));
    TAXO = j;
    taxoError = null;
    try { localStorage.setItem("wb_taxonomy_v1", JSON.stringify(j)); } catch(e){}
    syncDIRS();

  } catch(e){

      const cached = JSON.parse(localStorage.getItem("wb_taxonomy_v1") || "null");

}

/* AI 提取三层标签：结果只作为「建议」写入，由人工确认与删减 */
async function extractTagsAI(){
  /* 取数：正文优先；Hacker News 等源只有标题没有正文/摘要时，降级用标题兜底，
     并明确提示精度有限（绝不能假装有完整素材）。 */
  let material = curMaterialText() || "";
  const h = curHot();
  const titleOnly = !material;
  const titleFallback = (h ? ((h.topic || "") + " " + (h.cn || "")) : (curMaterialLabel() || "")).trim();
  if(titleOnly && titleFallback) material = titleFallback;
  state.tagTitleOnly = titleOnly;
  if(!material){ toast(L("暂无素材内容，无法提取标签","No material to extract tags from")); return; }
  state.tagExtracting = true; render();
  try {
    const r = await fetch(AGENT_REACH_API + "/api/tags/extract", {
      method: "POST", mode: "cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ material: material, title: curMaterialLabel() || "" })
    });
    const j = await r.json().catch(() => null);
    if(r.ok && j && j.ok){
      state.tagAIContent = j.content || [];
      state.tagFreeCands = j.free || [];
      state.tagAIReason = j.reason || "";
      state.tagMeta = { model: j.model, provider: j.provider, elapsedMs: j.elapsed_ms, cached: j.cached, dropped: j.dropped || [] };
      state.tagWarn = j.warning || "";
      /* AI 建议默认选中，人工再删减 */
      state.tagContent = (j.content || []).map(c => tagKeyOf(c.cat, c.tag));
      state.tagFree = (j.free || []).slice();
      state.tagCognitive = j.cognitive || state.tagCognitive || "全年龄";
      (j.content || []).forEach(c => { state.tagOpenCats[c.cat] = true; });
      toast(L("已提取：" + (j.content||[]).length + " 个内容标签、" + (j.free||[]).length + " 个自由标签（可删减）",
              "Extracted: " + (j.content||[]).length + " content tags, " + (j.free||[]).length + " free tags (editable)"));
    } else {
      state.tagWarn = (j && j.error) || L("提取失败：HTTP " + r.status,"Extraction failed: HTTP " + r.status);
      toast(state.tagWarn);
    }
  } catch(e) {
    state.tagWarn = L("提取失败：桥接层不可达（" + AGENT_REACH_API + "）","Extraction failed: bridge unreachable (" + AGENT_REACH_API + ")");
    toast(state.tagWarn);
  }
  state.tagExtracting = false; render();
}

often take advantage of the pleasant weather to go outdoors,\nenjoy nature, and participate in various recreational activities like\nflying kites. So going back to the name of the festival, in English,\nQingming Festival is usually known as Tomb-Sweeping Day\nbecause this is the most important historical tradition associated\nwith this holiday.\n\nMat\nOK, that's interesting. So do people actually sweep the\ntombs of their ancestors? I mean, like, physically. Because when\nI hear the words \"tomb-sweeping,\"\npicture a person with some\nkind of broom or brush actually sweeping away dust or leaves. Is\nthis what happens?\nJocelyn Yes, Mat, they do. Tomb-sweeping is a central tradition\nduring Qingming Festival. Families visit the gravesites of their\nancestors to clean and maintain them as a sign of respect. This\nincludes sweeping away leaves and dust, as you said, removing\nweeds, tidying up the area, and sometimes repainting or repairing\ntombstones. It's a way to show reverence and ensure that\nancestors' resting places are well-kept. But it's not just about\ncleaning; people also make offerings like food, incense, and paper\n\nQingming Festival\nmoney, believing that these items benefit their ancestors in the\nafterlife. Some even burn paper replicas of everyday items, like\nhouses or cars, as symbolic gifts. Overall, it's a heartfelt way to\nconnect with one's heritage and express gratitude to those who\ncame before us.\nMat\nAh, I've never heard of this before. You just mentioned\nthe\npaper money\nand paper replicas of everyday items. I think I've\nseen these items being sold in shops. They always fascinated me.\nSo tell me a bit more about these.\n\nFiX#t7 t\nJocelyn Yes, as you said, Mat, there are shops that specialise in\nselling paper money and paper replicas for these offerings. These\nplay a significant role in Qingming traditions. People believe that\nburning paper money and paper replicas of material goods can\nsend these to people who might still need all of those things in\nthe afterlife. These are seen as symbolic gifts intended to provide\ncomfort and luxury to the ancestors. We don'"}, {"id": "第一辑-传统节日__Dragon_Boat_Festival", "book": "第一辑 · 传统节日", "title": "Dragon Boat Festival · 端午节", "text": "Dragon Boat Festival\n1. How do old stories about a poet and dragon-shaped\nboats combine to give us a special festival?\n2. Why do people in China throw snacks into rivers during\nthe Dragon Boat Festival?\n3. There's a special food linked to this festival. It's called\nzongzi. How is it made, and what does it taste like?\n\nDragon Boat Festival\nIt's called the Dragon Boat Festival, and you might wonder, is it about\ndragons? Boats? Or maybe a combination of both? We're taking a\nlook at the origins and traditions of this unique Chinese celebration,\nincluding the story of a famous poet, the thrilling dragon boat races,\nand a unique, delicious snack with a very special connection to this\nfestival.\nMat\nHello and welcome back once again to another episode.\nToday we're talking about the Dragon Boat Festival, a traditional\nholiday celebrated in China. Now, I can remember when\nfirst\ncame to China, heard people talking about this festival, and I\nremember thinking, what is this festival? Is it about a dragon in\na boat? Is it a dragon and a boat, or is it a boat in the style of a\ndragon? So, Jocelyn, can you answer this first question for me?\nJocelyn Yes, the Dragon Boat Festival, or duan wu jie, actually\ntakes its name from a special type of boat related to the festival.\nIt's a long, thin boat that looks like a dragon when it's moving\nthrough the water. So that gives us the name Dragon Boat\nFestival.\nMat\nSo it's a festival about boats, named after a type of\nboat? That doesn't sound very traditional. Surely there's more to\nthe story than a boat that looks like a dragon.\nJocelyn Yeah, of course, there is. Let me tell\nyou\nthe rest of the\nstory. So, let's start with the basics. The holiday is celebrated on\nthe 5th day of the 5th month of the Chinese calendar (remember-\n\nsangera\nSh\nthe Chinese calendar is not directly mapped to the Western\ncalendar and the dates move around a bit each year). The date is\nusually somewhere around late May or in June. It's a public holiday\nin China and is one of the most widely celebrated festivals in the\nyear.\nThe festival has a long history dating back over 2,000 years,\nand it's traditionally been a time to honour the memory of a famous\nChinese poet named Qu Yuan.\nMat\nAh, so it's about a poet, not about a boat. Or maybe it's\nabout a poet\nwho had a boat and wrote poems about boating?\nJocelyn Okay, well, that's\ngood guess, but no, not really. Ou\nYuan was a poet and politician who lived in ancient China during\nthe Warring States period. He was a loyal patriot who was very\nvocal and active about creating\nbetter and more honest society.\nUnfortunately, his ideas were not well received by the ruling\npowers, and he was eventually exiled from his home state of Chu\n(Chu is an old name for the part of China that is now the area\n\nDragon Boat Festival\naround Hubei Province). So, while he was in exile, Qu Yuan wrote\nmany\nfamous poems, including one called Li Sao, which means\n\"Encountering Sorrow.\" And the poem expresses Qu Yuan's love\nfor his homeland and his sadness at being separated from it.\nMat\nThat's a really interesting story. But where does the boat\ncome into the story? Did he escape on a boat or something like\nthat?\nJocelyn Okay, nice idea, but not really. Well, according to the\nlegend, when Qu Yuan learned that his homeland had been\nconquered by a neighbouring state, he drowned himself in the\n\nmiX#t7 t\nMiluo River as a form of protest (so in many ways, it's kind of a tragic\nstory). The local people who admired him so much raced their boats\nto save him, but they were too late. The hero of our story drowned\nin the river. To commemorate Qu Yuan's sacrifice, people began\nholding dragon boat races on the anniversary of his death, which is\nbelieved to be the 5th day of the 5th month of the Chinese lunisolar\ncalendar (that's why the festival falls on that date). And they also\nthrow zongzi into the water to commemorate Qu Yuan.' These are\nsticky rice dumplings wrapped in leaves. And the people thought\nthat the fish might eat those dumplings, so they wrapped them in\nbamboo leaves- just to stop the fish eating them.\nMat\nWow, now that's really fascinating. Tell me more about\nthese dumplings. What did you call them? Zongzi?\nJocelyn Yeah. Well, they are made of sticky rice that has been\nstuffed with different fillings, like meat or sweet bean paste. Then,\nthey are wrapped in bamboo leaves, tied with string, and boiled\nor steamed for a while. And the result is a delicious and fragrant\ndumpling that is perfect for a meal or a"}, {"id": "第一辑-传统节日__Qixi_Festival", "book": "第一辑 · 传统节日", "title": "Qixi Festival · 七夕节", "text": "Qixi Festival\n1. Have you ever heard of Chinese Valentine's Day?\n2. Do you think it's different from the more globally\ncelebrated Valentine's Day on February 14th?\n3. How do\nyou think modernization might influence the\nway\nancient festivals are celebrated today?\n\nmiX#t7 t\nTime for something romantic! Everyone knows Valentine's Day ... but\nwhat is Chinese Valentine's Day? This thing is called the Qixi Festival.\nAre they the same? Well, not quite! While both celebrate love, they\neach have their unique stories, customs, and dates. We'll uncover the\nromantic legends behind them, explore the charming traditions like\nsecret love letters and wish-making, and reveal how modernization\nhas shaped their celebrations. Plus, there's a sweet treat waiting for\nyou at the end. Yummy!\nMat\nHello and welcome to another episode of China Lifestyle\nJourneys. And today we are talking about something that I guess\nmost people know about. And that's Valentine's Day, or should\nI say we are going to talk about two important dates in the\ncalendar, Valentine's Day and something called the Qixi Festival.\nSo, first of all, I think a good place to start is with the question: is\nthe Qixi Festival the same as Valentine's Day?\nJocelyn Thank you, Mat. Yes, that's a good question to start with.\nSo, both the Qixi Festival and Valentine's Day are celebrations of\nlove. They do have some differences. The Qixi Festival is sometimes\ncalled Chinese Valentine's Day, and I think this can cause some\nconfusion because it's actually celebrated on the seventh day of\nthe seventh month in the Chinese calendar (which is usually around\nthe month of August), whereas Valentine's Day is in February. The\nQixi Festival has its own unique customs, traditions, and cultural\nsignificance, so it's quite misleading to call it \"Chinese Valentine's\nDay,\" actually. So, while they both share some similarities on the\ntheme of love, they have distinct origins, customs, and symbolism.\n\nOixi Festival\nSo, in short, they are two quite separate and distinct celebrations.\nMat\nOK, so now we know that these are two separate things,\nreally quite different. So, let's start with the origins.\nknow that\nthe European Valentine's Day comes from both Christian and\nancient Roman traditions. It's a combination of both.\nthink it's\nnamed after a saint, Saint Valentine, but I remember reading\nsomewhere there's actually more than one Saint Valentine-\nprobably about four so nobody really knows the story behind\nthe celebration of Valentine's Day because there are many\ndifferent versions of the same story. So, Jocelyn, tell me something\nabout the origins of the Qixi Festival.\nJocelyn OK. The origins of the Qixi Festival can be traced back to\nancient Chinese folklore. The festival is based on an interesting\nlegend about two characters, Niulang (the Cowherd) and Zhinv\n(the Weaving Maid).\nThe story goes that a warm-hearted cowherd called Niulang, who\nlost his parents and led a hard life with an old ox, fell in love with\na girl named Zhinv, a weaving maid who escaped from heaven\nbecause all the strict rules there made her life dull. So, in the\nstory, they got married, and soon had two children, and lived\ntogether happily for a few years.\nHowever, Zhinv's mother, the Empress of Heaven, was quite angry\nto find that her daughter had married a simple and poor human\nand sent soldiers to fetch her back.\n\nFiX#t7 t\nThen Niulang tried to go to heaven to rescue Zhinv, but they were\nseparated by the giant river (which is actually the Milky Way),\nand they could only meet once a year on the seventh day of the\nseventh month, and that's why the Qixi Festival falls on this day.\nMat\nWow, it's quite a romantic story, which makes sense,\nreally, because it's a romantic festival. Now, obviously, on\nValentine's Day, couples buy gifts for each other; they go on\ndates. And I remember when I was a teenager, there was a special\nValentine's Day ritual. If you\nhad a crush on someone but they\ndidn't know because you hadn't told them, you bought a romantic\nValentine's card, you wrote a simple message such as \"Be my\nvalentine,\" but you didn't sign your name. It was like a secret\n\nlove letter, a mystery. It was like sending a message to someone\nsaying \"Someone likes you,\" but it was not signed, so they never\nknew who. So, are there any similar traditions or rituals for the\nQixi Festival?\nJocelyn Traditionally, in the past, one popular custom was for\nunmarried women to demonstrate their needlework skills by\ncreating intricate handicrafts, such as em"}, {"id": "第一辑-传统节日__Mid-Autumn_Festival", "book": "第一辑 · 传统节日", "title": "Mid-Autumn Festival · 中秋节", "text": "Mid-Autumn Festival\n1. What kind of stories or legends might be told about the\nmoon in different cultures?\n2. What special foods do you\nthink people might eat during\na festival celebrating the moon? Why?\n3. How do you\nthink ancient people might have used the full\nmoon to mark important events or traditions?\n\nMid-Autumn Festival\nWe're celebrating the Mid-Autumn Festival, a tradition that's 2,000\nyears old. This festival, marked by the full moon on the fifteenth day\nof the eighth month in the Chinese calendar, symbolises unity and\nfamily reunion. We explore the significance of the moon's beauty, tell\nthe legendary tale of Chang'e, the Moon Goddess, and feast on some\ndelightful mooncakes. Let's go on a lunar cake adventure!\nMat\nHello and welcome again to another episode of China\nLifestyle Journeys. As usual, in today's episode, we will be looking\nat one unique and interesting aspect of Chinese culture. Now, as\nyou can tell from the episode title, today we're talking about Mid-\nAutumn Festival. Now, personally, I've got to admit that I don't\nknow much about this festival, except that it's in the autumn (in\nthe middle of autumn,\nthink-because of the name), and on this\nfestival, I know that people eat mooncakes. So I guess that will\nbe the best place to start with the origins. So, Jocelyn, tell me\nsomething about the origins of this festival.\nJocelyn Sure, Mat. The Mid-Autumn Festival has its origins\nrooted in ancient Chinese traditions and beliefs. It dates back\nover 2,000 years and is closely tied to agricultural practices and\nthe Chinese calendar. The festival is celebrated on the fifteenth\nday of the eighth month in the Chinese calendar, when the moon\nis believed to be at its fullest and brightest. It was originally a\ntime for people to give thanks for a successful harvest and to\npray\nfor good fortune. Over time, it has evolved into a celebration\nof family reunion and the appreciation of the moon's beauty. The\nfestival has deep cultural significance and holds a special place in\n\n1 1 E\n\nMid-Autumn Festival\nChinese folklore and traditions.\nMat\nOK, so it's linked to the Chinese calendar, but you just\nmade a point about \"the appreciation of the moon's beauty\"\nisn't the moon the same at any time of the year? Is the moon\nmore beautiful during this festival? And you know, what's the\nsignificance of the moon in this particular Mid-Autumn Festival?\nJocelyn OK, let me explain. While the moon itself may not\nphysically change in its beauty throughout the\nyear, its symbolism\nand significance during the Mid-Autumn Festival are what make it\nspecial. The full moon during this festival is seen as a symbol of\n\nmiX#t7 t\nunity, completeness, and family reunion. It represents harmony\nand serves as a reminder of loved ones who may be far away.\nThe moon's round shape also signifies prosperity and good luck.\nDuring the festival, families and friends gather to admire the\nmoon together, appreciating its serene beauty and using it as\na focal point for storytelling, poetry, and heartfelt wishes. The\nmoon holds deep cultural and emotional significance, fostering a\nsense of connection and warmth among people.\nMat\nOh right, I see. Actually, you've just reminded me. I think\nI remember story about the moon, something about a moon a\ngoddess, some beautiful goddess who lived in the moon. Does\nthat story have any connection with this festival?\nJocelyn Well remembered, Mat. You're actually right. You're\ntalking about the popular Chinese legend of Chang'e, the\nMoon Goddess. According to the ancient legend, Chang'e was\na beautiful woman who consumed a special elixir to make her\nimmortal (to live forever). She drank the special elixir and floated\nup to the moon, where she still lives to this day. During the Mid-\nAutumn Festival, people pay tribute to Chang'e by offering her\nfruits, incense, and mooncakes. The story of Chang'e adds a\ntouch of magical charm and mythology to the festival, deepening\nits cultural significance. It's a great story that has been passed\ndown through generations and continues to be cherished during\nthe Mid-Autumn Festival.\n\nMat\nAh, mooncakes, finally we get to mooncakes. This\nis going to be my favourite part of the episode because we\nare talking about cakes. Now, I've had mooncakes on many\noccasions, and I always think they are quite varied. There are\nso many different fillings. Some,\nthink, are delicious; others\nnot really for me. So, before we talk about the fillings, what's the\nstory behind mooncakes?\nJocelyn I think there are many"}, {"id": "第一辑-传统节日__Double_Ninth_Festival", "book": "第一辑 · 传统节日", "title": "Double Ninth Festival · 重阳节", "text": "Double Ninth Festival\n1. Why do you think certain numbers might be lucky or\nunlucky in different cultures?\n2. Why are certain plants or flowers symbolic and important\nin certain aspects of culture?\n3. Do you think it's important to respect and honour elderly\nrelatives and citizens? Why?\n\nDouble Ninth Festival\nIt's a festival with numbers in its name, a direct reference to yin and\nyang, and a celebration of our elderly relatives. And of course, there's\nan ancient legend about a monster and a magical sword! Let's not\nforget the flowers! This festival has it all. We're talking about the\ncelebration that falls on the ninth day of the ninth month in the\nChinese calendar. Join us as we explore the legends, activities, and\ncultural importance of the Double Ninth Festival.\nMat\nHello and welcome back to another episode of China\nLifestyle Journeys. Today, we are talking about something called\nnine-nine, ninety-nine, or is it the Double Nine or Ninth Festival?\nYou can see I'm already in a mess. So please help me out,\nJocelyn. What's it called, and what is it?\nJocelyn OK, let's start with the name: the Double Ninth Festival.\nNow think about the name, Mat. I'm going to let you guess what\nit means. Think about it, \"double ninth\"-any ideas?\nMat\nAh, I think I see it. Double ninth means ninth and ninth,\nwhich probably refers to the ninth day of the ninth month on the\nChinese calendar. Am I right?\nJocelyn You are absolutely right, Mat. The Double Ninth Festival\nis celebrated on the ninth day of the ninth month. The festival is\nalso known as Chongyang Festival, or by its simple and popular\nname \"Senior Citizens' Festival.\" Now let's see if\nyou can get the\nnext bit right. How old do you think it is?\nMat\nWell, it's a traditional Chinese festival, so I'm going to\nsay . . . really old. Let's say, over 1,000 years old?\n\nFiX#7  t\nJocelyn Not bad. But it's actually even older than that. There are\nreferences to this festival that can be traced back to the Warring\nStates Period, which would make it over 2,000 years\nold.\nMat\nWow, even older than I thought. Just now you mentioned\nthat, as well as the name Double Ninth, it has another name.\nWhat was that one?\nJocelyn Right, let me explain. According to the Chinese philosophy\nof yin-yang, we can divide the world into either yin or yang.\nNow\nthis might get a bit tricky, but stay with me. Yin and yang are\ninterchangeable with one another, SO yang can become yin. The\nyin-yang duality also applies to how people should live their lives.\nThe belief is that we should not have too much or too little of\nsomething, such as food, for example. While food is essential to life\nand survival, eating too much can cause health problems, while too\nlittle causes starvation. So we have these two kinds of elements,\nyin and yang. The number nine is regarded as yang. The ninth day\nof the ninth month is a double yang day, hence the name \"Chong\nYang Festival\" (Chong means \"repeat\" in Chinese).\n\nMat\nOK, I think I get it. So what do people actually do on\nthis festival? I'm guessing, as usual, there must be some special\nactivities and certain important foods.\nJocelyn Yes, of course. People engage in various activities like\nhiking, appreciating chrysanthemums, and flying kites. This day\nis also an occasion to pay respects to ancestors, emphasising\nthe value of respecting the elderly. And as for food, while there\naren't many specific dishes associated with the festival, people\noften make and enjoy pine nut cakes. These cakes have historical\nsignificance and are a delicious treat during the celebrations.\nOverall, the festival is about honouring the elderly and cherishing\nfamily bonds.\n\nmiX#t7 t\nMat\nYou just said that appreciating chrysanthemums is an\nimportant feature of the festival. Why chrysanthemums? What's\nspecial about these flowers?\nJocelyn Ah, good question. Chrysanthemums hold a special\ncultural significance in China. They bloom in late autumn when\nmost flowers wither. The festival's timing aligns with their peak\nbloom. The chrysanthemum flower is a symbol of longevity and\nwealth, and a wish for a peaceful old age. So during the Double\nNinth Festival, it is customary to appreciate chrysanthemum\nflowers, drink chrysanthemum wine, and eat chrysanthemum\ncakes.\nMat\nYou know I like a good story. Are there any interesting\nlegends or folktales connected to this festival?\nJocelyn Actually, there are some. One well-known legend tells\nthe story of Huan Jing, who, guided by a heavenly bird, used a\nmagical sword to defeat\nnasty plag"}, {"id": "第一辑-传统节日__Winter_Solstice", "book": "第一辑 · 传统节日", "title": "Winter Solstice · 冬至", "text": "Winter Solstice\n1. Why do people in China eat specific types of food in the\nmiddle of winter?\n2. Why did people in the past divide the year into 24 parts?\n3. What are sticky rice balls? And do they have any special\nmeaning?\n\nWinter Solstice\nImagine a cold winter morning, with frost or snow outside your\nwindows. In this cosy setting, we are in the heart of winter, exploring\na unique Chinese tradition that warms the soul. Travel with us to\nChina, where people still celebrate the Winter Solstice Festival, a\nday with less sunlight than any other day of the year. Listen to our\nconversation as we find out about the customs, rituals, and delicious\nfoods that make this festival truly special.\nMat\nOK, so it's winter. I know it's winter because it's cold\noutside. I need to turn on the heating at home, and I need to\nwear warm clothes. And there are Christmas advertisements on\nthe TV all day long.\nNow, I know China doesn't celebrate Christmas, but somewhere\naround the same time, there is something called the Winter\nSolstice Festival, or is it the Mid-Winter Festival?\ndon't know\nwhich one.\nNow in the UK, we know that the winter solstice is a day\nsomewhere in the middle of winter. - don't know which day it is,\nbut I know it's the shortest day of the year. It has less sunlight\nthan any other day. Now,\nknow that because we see that on the\nTV weather report every year. On that day in winter, at the end of\nthe weather report, someone says something like,\nand today,\nof course, is the winter solstice, the shortest day of the\nyear. It's\ngoing to get dark early,\" something like that.\nBut that's it. It's just mentioned in the weather report on TV:\nwe don't do anything on that day. It's not a festival; there's no\n\ncelebration. We don't have any traditions related to this. I don't\nknow, maybe we did in the past\nmany hundreds of years ago,\nbut we don't have any today.\nBut I've heard that it's a very important traditional festival in\nChina. And everybody celebrates it in some way.\nSo, I guess my first question is: what is this Mid-Winter Festival?\nIs it called Mid-Winter Festival? Is it called the Winter Solstice\nFestival? What's the name, and what does it really mean?\nJocelyn Well, yeah, it is a very important festival in China, and it's\ncalled Dongzhi in Chinese. In English, we say the Winter Solstice\nFestival. It usually takes place on the 21st of December of the\nWestern calendar. So the winter solstice is one of the 24 solar\n\nWinter Solstice\nterms. We also translate it into \"The Extreme of Winter\", Dongzhi,\nwhich is why it is known as the Dongzhi Festival. It is also marked\nby paying respect to our ancestors and eating delicious and tasty\nfoods.\nMat\nOK, that's helpful. You just said something about \"solar\nterms\"_I don't think I know this word\nI don't know what they\nare. Can\nyou explain \"solar terms\" a little bit more?\nJocelyn Yeah, of course, it's a very Chinese concept. In the\nWestern calendar, you divide the year into 12 months, but a long\ntime ago during the Western Han Dynasty in China, people cut\nand divided the year into 24 equal segments, so these are called\nthe \"solar terms\" in China, and also we still use these today.\nIn ancient times, people used them to measure and predict\nweather. It is very useful for farming and growing crops. These\nsolar terms were a very\nuseful\nway for people to manage farming\nand other lifestyle decisions, like clothing, food, housing, and\ntransportation.\nMat\nAlright, so now I understand solar terms. But I have\nanother question: is this Mid-Winter Festival\nis it like a public\nholiday? Do students get a day off school?\nJocelyn Well, the answer is no, not today. Many people see the\nwinter solstice as an important festival day, and in some places\npeople think it's more important than the new year. A long time\nago, during the Han Dynasty, the winter solstice was a public\n\nFiX#7 *\nholiday. Public servants and officials had a holiday at this time-\nthey didn't need to work. But nowadays, it's not an official public\nholiday in China; everybody goes to work and school. People\ncelebrate this day in the evening, after school or work.\nMat\nSo I guess, like all traditional Chinese festivals, people\neat special food on this day. So can you tell me something about\nthe food that people eat during this Winter Solstice Festival?\nJocelyn Yeah. There's a\nspecial reason for eating different\nfoods during the Winter Solstice. In old times, during the Han\nDynasty, people had the idea that in the middle of the winter, in\ncold weath"}, {"id": "第一辑-传统节日__Laba_Festival", "book": "第一辑 · 传统节日", "title": "Laba Festival · 腊八节", "text": "Laba Festival\n1. Have you ever\nheard of a festival where pickled garlic is a\nkey element? What do you think might be the significance\nof this unusual food item in a festival?\n2. How do you think the timing of a festival in the calendar\ncan influence its customs and traditions?\n3. Some festivals have been celebrated for thousands of\nyears.\nWhat do you think helps certain festivals to endure\nand remain significant over such long periods?\n\nLaba Festival\nIt might not be the most well-known Chinese festival, but the Laba\nFestival, a celebration with ancient origins, rituals, and symbolic\nfoods, is a unique blend of Buddhism and folk traditions. In this\nepisode, we've got some special porridge and even some pickled\ngarlic. And we even get to talk about pancakes!\nMat\nHello, and welcome to another episode. Today, we're\ntalking about a festival. Now, Jocelyn, I must admit, when I\nheard the title of this episode, I'll be honest, I didn't really know\nanything about it. I still know almost nothing about it. I've spent\na lot of time in China, so\nknow about Spring Festival, Mid-\nAutumn Festival, and many others, but I've never heard of the\nLaba Festival. I don't even know what it means or if I'm saying it\ncorrectly. So I really need your help with this one.\nJocelyn OK. Let's start at the beginning. The Laba Festival is a\ncelebration that falls on the eighth day of the twelfth month in\nthe Chinese calendar. It has very old, deep-rooted traditions, and\none of the most iconic customs associated with this festival is the\npreparation of something called Laba congee in temples across\nChina.\nMat\nHang on. I know what Laba is. It's that kind of pickled\ngarlic, right? Are\nyou telling me that this festival is actually\nnamed after pickled garlic? Are we really talking about a festival\ncalled the Pickled Garlic Festival?\n\nJocelyn Haha, no, Mat. Not really. think you're getting something\nmixed\nup here. The Laba Festival's name represents its date\non the Chinese calendar. \"La\" is the name of the twelfth and\nfinal month, and \"ba\" means \"eight.\" The pickled garlic and the\nporridge we make are both named after the festival.\nMat\nAh,\nsee. So it's the food item that is named after the\nfestival. That makes sense now. So let's\nrecap.\nThe festival falls\non the eighth day of the twelfth month on the Chinese calendar.\nOn this festival, people like to eat Laba congee, a type of porridge.\nWhat else do we need to know?\nJocelyn One key aspect of the festival is its Buddhist influence.\nMany temples prepare Laba congee and then offer it to visitors. It's\nbelieved that by eating this congee, one can receive blessings from\nBuddha. This association with Buddhism has led to the congee\nhaving alternative names like fu shou zhou (Fortune and Longevity\n\nCongee) and fu de zhou (Fortune and Virtue Congee). Over time,\nthe festival has evolved from being mostly a religious event into\na well-known folk festival celebrated by families all across China.\nWhile Laba congee remains at the heart of the celebrations, various\nother customs have emerged around the festival.\nMat\nI'm still fascinated by the connection to pickled garlic.\nHow does something like that become an important part of a\nfestival?\nJocelyn\nI think you're getting mixed up again, Mat. Let's map\nit out clearly. The festival lends its name to the porridge, Laba\ncongee. People make porridge using a variety of grains and fruits.\nThe festival also includes the custom of Laba garlic. People soak\n\nFiX#7  t\ngarlic cloves in vinegar until they turn green, creating a crunchy,\nsharp, and slightly sour delicacy. There are other food traditions\ntoo, such as sun-drying Laba tofu in certain areas, and eating\nLaba noodles.\nMat\nAh,\nget it now. So it's a festival with strong religious\ntraditions, and there are certain food items that have special\nmeaning attached to the festival. In some ways, it reminds me\nof something: Pancake Day. This Western Christian holiday, also\nknown as Shrove Tuesday, falls on a specific day on the religious\ncalendar. Even though making and eating pancakes are key\nfeatures of the festival, the meaning of the food item is symbolic,\njust like the Laba congee and the pickled garlic.\nJocelyn Yes, exactly, Mat.\ncan see the connection. So why do\npeople make pancakes for this religious festival you call Pancake\nDay?\nMat\nIt's because just after this festival, people are supposed\nto eat less, to give up certain foods. So they make pancakes\nbefore this fasting period, to get full up and use up any remaining\neggs\nan"}, {"id": "第二辑-一饮一食__Noodles", "book": "第二辑 · 一饮一食", "title": "Noodles · 面条", "text": "Noodles\n1. Chinese noodles are pretty old. Can you guess how old\nthey are?\n2. Do you\nthink Chinese people eat noodles mostly for\nbreakfast, lunch, or dinner? Why?\n3. Have you heard the legend of \"Over-the-Bridge\" rice\nnoodles? What type of noodles might these be?\n\nAg6 Vi#t67  te\nEveryone knows what noodles are. We've all eaten a bowl of noodles\nat least once. But how much do we know about the rich history,\nvariety, and cultural significance of one of China's most beloved\nfoods? From their ancient origins over 4,000 years ago to the\nthousands of unique varieties enjoyed today, Chinese noodles are\nmuch more than just a meal. Learn about different types, popular\nregional dishes, and the customs for special occasions like birthdays\nwith longevity noodles. Discover why noodles hold a special place in\nChinese cuisine and culture.\nMat\nHello again. In today's episode, we are talking about\nnoodles, one of my favourite types of Chinese food. Now, I think\nmost people around the world, if you ask them to name one\nfamous Chinese food, I think most people will say, first of all,\nnoodles. So, we all know something about Chinese noodles. I\nthink most people around the world have tried Chinese noodles\nor have tried some kind of Chinese noodles. But let's start with\nsome history. What do we know about the history of Chinese\nnoodles?\nJocelyn OK, that's a good place to start. From what we know\ntoday, the earliest Chinese noodles date back more than 4,000\nyears. Some historians found\nbowl of noodles buried deep in\nthe ground near the Yellow River in China, and experts dated\nthese as being 4,000 years old because they were able to give\nan accurate date to the ceramic bowl. But the first real written\nreference to noodles is from the Eastern Han Dynasty, around the\nyear 100 CE.\n\nNoodles\nDuring the Song Dynasty, noodle shops were very popular in\nChinese cities, and we have many written references to eating\nnoodles in these special noodle shops.\nMat\nOK, so noodles were very popular during the Song\nDynasty, and possibly before that time. But what about today?\nHow popular are noodles in China today?\nJocelyn Noodles are still very popular in China today. There are\nthousands of varieties of noodles in China, and these differ by the\nshape of the noodles and the sauce or\ngravy. They can be dry, or\nin soup, or boiled, or fried, and there are SO many different ways\nto prepare noodles. Many noodles have local characteristics, so in\n\none city, you might find that most people eat one particular type\nof noodles, and then in a neighbouring city, the local people have\na completely different version. Traditionally, noodles in China can\nbe grouped by one of the three main ingredients: wheat flour (the\nmost popular kind), rice flour, and a kind of bean starch (these\nare often called glass noodles).\nMat\nNow, my next questions are: when do Chinese people\nusually eat noodles? Is it like for lunch, for dinner? Do\nyou eat\nnoodles with other things? Do you\nshare noodles? How does it work?\nIs there a fixed or a typical time or a typical way to eat noodles?\nJocelyn The questions are quite difficult to answer, actually,\nbecause China is such a huge country, and eating habits are very\n\nNoodles\ndifferent from city to city, province to province. So it's not easy to\ngeneralise about eating habits. A lot of people say\nthat in north\nChina, people eat more noodles, and in south China, people eat\nmore rice. But people in North China still eat rice, and people in\nSouth China still eat noodles.\nIn many parts of China, both north and south, people eat noodles\nfor breakfast. They usually have them in a local noodle restaurant\nbecause it takes time to cook noodles, and most people are in\na hurry in the morning. So, there is no typical type of breakfast\nnoodle. In some areas, people have soup noodles for breakfast; in\nother places, they have dry noodles in sauce; and in some places,\nthey eat fried noodles for breakfast.\nSo noodles are also a common lunchtime food because, if you are\nworking, they are fast and cheap.\nI think it's less common to have noodles for dinner in the evening\njust because they are quite heavy, and\nlot of people like to eat a\nlighter meal in the evening. But in almost every Chinese city, you\ncan find late-night noodle restaurants.\nSo you can see, for some people, noodles are a daily food; for\nothers, it's more like a convenience food when people are in a\nhurry or busy with work.\nMat\nI've heard some people mention some famous noodle\ndishes, some famous types of"}, {"id": "第二辑-一饮一食__Dumplings", "book": "第二辑 · 一饮一食", "title": "Dumplings · 饺子", "text": "Dumplings\n1. When you hear the word \"dumpling,\" what comes to your\nmind?\n2. Do\nyou\nthink dumplings are important foods in other\ncultures?\n3. Chinese dumplings come in many styles, shapes, sizes,\nand flavours, but is there something they all have in\ncommon?\n\nFiX#t7 ot\nThey are one of the most famous foods in Chinese cuisine, but they\nare actually much more than just a simple and delicious snack. They\ncome in many shapes, sizes, and flavours, each one with a special\nand unique name (and this can cause translation problems). Let's\nget straight down to the tasty business of uncovering the facts about\nChinese dumplings!\nMat\nHello and welcome to another episode of China Lifestyle\nJourneys! Today, we're diving into the delightful world of Chinese\ndumplings. Now, let's start with vocabulary. When we say\n\"dumpling\" in English, it typically refers to a specific type of food\n(something like a ball of bread that we traditionally put in soup\nor in some kind of meat stew). But, of course, in Chinese cuisine,\nwe use the English word \"dumpling\" to talk about a wide variety\nof food items, in a variety of shapes, sizes, and fillings, making it\na bit tricky to find the perfect translation. Jocelyn, could you tell\nus more about the different styles of Chinese dumplings and this\nrather awkward translation problem?\nJocelyn\nOK, that's a good starting point! The general word in\nChinese for dumplings is \"jiaozi\" (in Mandarin). They can be\nfound in various regional cuisines across China, and each style\nhas its unique characteristics. There are many other words\n(in Chinese) to describe these individual styles. So, of course,\nwhen we talk about these in English, the word we often use is\n\"dumpling\" as a general catch-all description, even though it\nmay not accurately capture the diversity of Chinese dumplings.\nThis can sometimes lead to confusion, because, as you said, Mat,\n\nDumplings\n\"dumpling\" in English might make us think of something that\ndoesn't fully describe the range of Chinese dumplings.\nMat\nSo, could you give us some examples of the different\ntypes of Chinese dumplings and their unique features?\nJocelyn OK! Let's explore a few popular styles of Chinese\ndumplings. I guess the most common and famous type is\nsomething generally called \"jiaozi,\" and this typically consists of\na thin wheat dough wrapper filled with a mixture of ground meat,\nvegetables, and seasonings (there are many different versions;\nthe meat can be pork, beef, lamb, or even fish or seafood, and\nthe vegetables can be anything from cabbage, onion, leeks, and\nso on).\nwould probably say the most common type is pork and\ncabbage. Now, these dumplings can be boiled, steamed, or pan-\nfried and are usually served with dipping sauces (the sauce is\n\nFiX#7\noften made from vinegar, soy sauce, and chilli-if you want it\nspicy). They vary in size and shape depending on the region.\nSo even the basic form of dumpling (or jiaozi) has quite a lot of\nvariation.\nMat\nOK! So we've covered one type, these \"jiaozi.\" Let's talk\nabout some of the other variations.\nJocelyn\nAnother well-known type is the \"shengjian bao,\" or in\nEnglish, pan-fried dumplings. These dumplings are typically filled\nwith a mixture of minced pork and vegetables and sometimes\na soup inside. They are pan-fried on the bottom, creating a\ncrispy and golden crust, while the top remains soft and steamed.\nShengjian bao are often enjoyed as a breakfast or snack in\nShanghai and other regions, and their juicy filling and contrasting\ntextures make them a really special snack.\nMat\nThere's another type I've had in Shanghai; it's the one\nwith\nsoup inside, and it's really difficult to eat. I remember spilling\nall the soup over my shorts when I was eating it. What's that one\ncalled?\nJocelyn\nAh\nyes,\nthat one. The type of dumpling you're talking\nabout is called \"xiaolong bao.\" Xiaolong bao is a famous Shanghai\nspecialty known for its delicate wrapper and soup filling. These\ndumplings are traditionally steamed in bamboo baskets, which\nallows the soup to form inside during the cooking process. When\neating xiaolong bao, it's important to handle them carefully as\n\nFiX#7  t\nthey contain really hot soup. One popular method is to gently bite\na small hole in the dumpling, allowing the soup to cool before\nenjoying the rest of the dumpling.\nMat\nNow, I've also been involved with making dumplings. At\ncertain times of the year, during Spring Festival, I think, families\nlike to make dumplings together, so I'm guessing there's some\nspecial meaning behind th"}, {"id": "第二辑-一饮一食__Hotpot", "book": "第二辑 · 一饮一食", "title": "Hotpot · 火锅", "text": "AR INN GAON\nteac\nHotpot\nadageengapre!\n1. Have\nyou ever tried cooking your own meal at the dining\ntable as you eat it?\n2. If you offered an English person \"hotpot\" for dinner, what\nwould they imagine?\nedge\nea glansierat\n3. We all know plum sauce, chilli sauce, and tomato sauce,\nbut what is a \"dipping sauce\"?\n+ 0\n{\n\nHotpot\nTry to picture a busy dining scene with people eating, the aroma\nof spices and fresh ingredients filling the air. One very important\nChinese culinary tradition is the vibrant and communal experience\nof hotpot. Journey with us as we uncover the mystery behind this\npopular dish, a staple in Chinese dining culture. We will try to discover\nthe differences between the English and Chinese interpretations of\n\"hotpot,\" understand the versatility of this meal, and learn why it's\nnot just about the food, but also about the joy of sharing, cooking,\nand savouring together.\nMat\nOK, so today we're talking about hotpot. Now, this is\na bit confusing for a British person because when we hear the\nword \"hotpot,\" we think about a very traditional English type of\nfood. It's a dish from the northwest of England, actually. It's very\nfamous.\nI'll give you the Cambridge English Dictionary definition of\n\"hotpot.\" Hotpot, a mixture of meat and vegetables, usually with\nsliced potatoes on top, cooked slowly in a covered dish inside an\noven.\nSo, can you imagine that? It's meat with vegetables, and it's\nslow-cooked in a stone pot with potatoes on top, and it's cooked\ninside an oven for about one hour. So for me, that's \"hotpot!\" So\nyou can understand how I was confused when I came to China,\nand everyone said, \"Let's eat hotpot.\" I'm thinking about the\nslow-cooked meat stew with potatoes on top. So obviously, my\nfirst question is ... what is Chinese hotpot?\n\nJocelyn Well, the Chinese name for hotpot, huoguo, literally\nmeans \"fire pot.\" It's a shared, communal meal and there's\nusually a large pot in the middle of the table. And the pot is\nfilled with a special soup, and the soup is constantly heated\nunderneath. Then we take different kinds of raw food items like\nraw meat, raw fish, and raw vegetables, and we cook them in the\nsoup. Everyone joins in this cooking activity, and then you take\nout the cooked pieces of food one by one from the soup and use\nspecial dipping sauces for extra flavour. So sometimes the soup\nis made of vegetables, sometimes from meat, and sometimes it's\nreally spicy.\n\nmiX#t7 t\nMat\n- see, SO you cook the food yourself, and everyone\nshares the big pot of soup in the middle of the table. But you\nsaid\nthe soup is really spicy-what if I don't like spicy food? What\nhappens then? You said everyone is enjoying the spicy hotpot,\nspicy soup,\nbut if\ndon't like spicy food, do\nhave to\ngo hungry?\nDo I eat nothing?\nJocelyn Ah, that's where it gets interesting. Nowadays, many\npeople choose a twin or double hotpot, and the soup dish is\ndivided into two-and you can have one half spicy and the other\nhalf not spicy. And there's also another solution: you can even get\nindividual little hotpots, so each diner has their own little soup\npot in front of them, and everyone can choose what kind of\nsoup\nthey want- not spicy,\nlittle spicy, spicy, or really spicy. That\nway, everyone is happy.\nMat\nOK, I see, but I still don't really understand why this is\npopular. In my culture, when we go to a restaurant for dinner, we\ndon't want to cook for ourselves. We want someone to cook for\nus the cook, the chef. I want somebody else to do the cooking.\nJocelyn Well, that's the great thing everyone participates in\ncooking while enjoying the food at the same time. So it's an ideal\nparty meal it's a wonderful shared experience. That's the special\npart of hotpot sharing the cooking and sharing the eating.\nSo, hotpot restaurants can be found everywhere in China, and\nmost of them are quite cheap-so everyone can enjoy the\nexperience. But lots of Chinese families still enjoy having hotpot\n\nHotpot\nin their own homes. The feeling is the same we cook together at\na table, and we eat together.\nMat\nRight, I think I'm starting to understand. It's not just\nabout the food; it's also the act of sharing, cooking together, and\neating together like a friend activity-enjoying it together. So,\nI guess my next question is, and this is the big question: what\nthings do you\ncook in Chinese hotpot?\nJocelyn Well, one of the important things is the soup, or we call\nit broth the liquid in the pot. Hotpot in different regions uses\ndifferent soup or broth. Some are really simple, wit"}, {"id": "第二辑-一饮一食__Chinese_Wine", "book": "第二辑 · 一饮一食", "title": "Chinese Wine · 中国酒", "text": "Chinese Wine\n1. What does the expression \"empty cup\" mean in China?\n2. A famous poet wrote a poem about wine in the year\n743.\nWhat do\nyou\nthink he wrote about in his poem?\n3. For English speakers, the concept of \"Chinese wine\" can\nbe confusing. Can you guess why?\n\nChinese Winel\nJoin us today as we learn about \"Chinese wine.\" For many English\nspeakers, \"wine\" usually means 0 drink made from\ngrapes containing\nalcohol. But in China, \"wine\" can mean different things. We'll look into\nwhy the Chinese word jiu is often called \"wine\" in English and what it\nreally stands for. Discover the fascinating world of traditional Chinese\ndrinks, which are different from grape wine, and learn about the\ncustoms and tastes that make them special. Let's find out together\nwhat makes \"Chinese wine\" unique!\nMat\nIn this episode today, we are trying to understand\nsomething more about \"Chinese wine.\"\nNow, I'm a little bit confused about the name \"Chinese wine.\" Let\n\nFiX#7\nme explain. For most English-speaking people, when we\nsay \"wine,\"\nwe are talking about an alcoholic drink made from grapes-\nsometimes red, sometimes light yellow in colour or white,\nsometimes pink, and sometimes with bubbles. But\nthink this is\nhow most people in my\nculture would describe \"wine.\"\nNow, for me, \"wine\" is not beer. Beer is made from grains like\nwheat, rice, and things like that. Now, stay with me. In my\nunderstanding, \"Chinese wine\" is made from things like grains\nand rice, and these kinds of things; it's not made from grapes. So\nwhy is it called \"wine\"?\nJocelyn\nOK, that's a good place to start. The Chinese character\njiu is often translated into English as \"wine.\" But actually, this\nis not a good translation. In Chinese, we use the word jiu to\ndescribe many different types of alcoholic drinks, spirits, liquor,\nand almost any drink with alcohol in it. So, yeah, you're right-\n\"wine\" isn't really an accurate translation.\nMat\nOK, then, so\nif \"wine\" isn't really an accurate translation,\nit's not a good translation, then what word should I use instead if\nif\ndon't use the word \"wine\"?\nJocelyn Well, I think it's still OK to use the word \"wine,\" or people\nsometimes use \"alcohol.\" There are many famous old Chinese\npoems translated into English that use the word \"wine,\" but we\nneed to remember that when we are talking about traditional\nChinese culture, \"wine\" is not the same wine in European culture.\nActually, in Chinese, we call that putaojiu.\n\nMat\nOK, you just mentioned some famous old Chinese poems\ntranslated into English. I've never heard of these. Do you know any?\nCan you tell me one of these poems? I think I'd like to hear one.\nJocelyn Ah, let me see. I think one of the most famous wine\npoems is by Li Bai. And he wrote this around the year 743.\nAnd I'll read a few lines from a book. It's very famous. It's called\nAT}L (Drinking Alone by Moonlight).\nA pot of wine among the flowers, #biel-seps,\nDrinking alone with no one to love. JE EHEL.\nI raise my cup to toast the bright moon, #*HT1E 9AFT,\nThe moon, my shadow and I, the three of us. MABEX.\n\nmiX#t7 t\nMat\nWow, that's quite powerful. I really like that. So let me\nimagine the scene. It's a long time ago; it's the year 743, and the\npoet Li Bai. He is there. He is drinking his Chinese wine, toasting\nthe moon. What do we think he was drinking? I know it wasn't\ngrape\nwine. So what kind of wine do we think Li Bai was drinking\nall those years ago\nwhen he wrote that poem?\nJocelyn OK, so when we talk about Chinese wine, most of the\ntime we are talking about the grain spirit (baijiu). This has a very\ndistinct flavour, and it tastes strong and\nsavoury,\nnot sweet. The\nstrength, I mean, the percentage of alcohol, is very high-over\n50%-so you can taste the alcohol level. It gives you\nthat warm,\nalmost burning sensation in the mouth as you\nswallow.\nBut when we talk about \"Chinese wine,\" that can also be\nsomething called huangiiu, yellow wine. And this is a kind of wine\nmade from cereal things like rice, millet, or corn. And the alcohol\nlevel is much lower than baijiu, around 15%, and the flavour is\noften quite sweet.\nMat\nOK, SO . . . when I'm in a restaurant or something like that,\nwhen I ask for Chinese wine, I need to remember that baijiu is the\nstrong one with the savoury taste, and huangjiu is much lower\nin alcohol and tastes sweeter. OK, I think 1 like the sound of the\nsweet yellow wine (huangjiu).\nOK, then, so . . .\nIf I'm drinking Chinese wine with Chinese friends,\nare there\nany\ncultural rules or customs that I need to know?\n\nChin"}, {"id": "第二辑-一饮一食__Chinese_Pastries", "book": "第二辑 · 一饮一食", "title": "Chinese Pastries · 中式点心", "text": "Chinese Pastries\n1 . Do you think it's possible to make pastries from beans or\nlotus seed paste? What do you think they taste like?\n2. Why do you think English cakes are often heavy and rich,\nwhile Chinese pastries are light and delicate?\n3. Can you guess\nhow the climate and history of a country\nmight influence the types of cakes (for Western) and\npastries (for Chinese) they make and eat?\n\nChinese Pastries\nIt's time for some cake. Join us as we bite into the delicate flavours\nof Chinese mooncakes and the rich indulgence of English fruitcakes.\nDiscover how climate and history shaped each country's cake\ncreations, from light and subtle to dense and lasting. We'll sample\nbeloved recipes and flavours as we savour the stories and traditions\nbehind iconic Chinese and British cakes. Grab a fork and taste the\ndelicious diversity across two cake-loving cultures.\nMat\nHello, and welcome back to another episode. Today,\nwe are talking about one of life's sweetest pleasures cake!\nSo, Jocelyn, I'm sure you have something to say.\nWhat are\nyour\nthoughts on Chinese pastries?\nJocelyn Well, if I'm totally honest, I think Chinese pastries are\ndefinitely better than English cakes. They are often lighter, less\nsweet, and have more diverse flavours than English cakes. For\nexample, we have mooncakes, which are traditionally eaten\nduring the Mid-Autumn Festival; you must know them. And there\nare those round pastries with a pattern on top and have a thin,\nsoft crust with a sweet filling made of lotus seed paste or red\nbean paste. Actually, you can get all kinds of fillings.\nMat\nLet me stop you there for a moment\nMooncakes. I\ncan't really get my head around the idea of mooncakes. I don't\nreally understand the concept. I mean, beans\nbeans in a\npastry? I'm English, so putting beans in a pastry just doesn't\nseem right to me. When I think of cakes, I think of sweet,\nindulgent treats like chocolate cake or Victoria sponge lots of\n\nsugar, and butter, and cream-not something savoury like beans.\nBeans belong on a plate, at breakfast time, with eggs and bacon\nand things like that.\nJocelyn Well, I think I understand your point of view, but\nyou\nhave to try mooncakes to appreciate them. They are not just\npastries; they are actually\nsymbol of family reunion and good\nluck in Chinese culture. And the filling can be really delicious.\nIt's not always beans; you can have fillings like lotus seed paste,\nwhich is sweet and fragrant. You can get green tea fillings, and\nnowadays, you can even find mooncakes with chocolate fillings.\nSo, actually, mooncakes are more diverse than\nyou think. Plus, the\ncrust, the outer layer, is often made with butter, and sometimes\nit's sweet, so it's not always savoury like you\nthink.\n\nMat\nI see. Well, I'm still not sure about the beans in a cake,\nbut I'd love to try a chocolate mooncake. Now, there's another\ncake, one that is quite popular in England and in China. In China,\nyou\ncall it egg tart, but in England, we call it custard tart. Now,\nthese are almost the same thing. So, it seems that we have one\npastry in common. So, why are all our other cakes so different?\nmean, Chinese pastries are light and delicate, and English cakes\nare really heavy and kind of seriously indulgent, almost like a\ncomplete meal-really filling.\nJocelyn\nI think that Chinese pastries are often lighter and more\ndelicate because they tend to use less butter, sugar,\nand cream\nthan English cakes. Instead, they use ingredients like rice flour,\nsweet potato starch, and bean paste, which give the pastries a\n\nFiX#7\nmore subtle and nuanced, delicate flavour. Also, with Chinese\npastries, the focus is often on the subtle balance and harmony of\nthe softer flavours, rather than the overwhelming sweetness and\nrichness that\nyou get with many English cakes.\nMat\nYeah, I think you're right. I remember reading something\nelse too: the climate and the ingredients available in England\nhistorically meant that preserving cakes for long periods of time\nwas important, which led to the development of those really\nheavy fruitcakes and other cakes that could last for weeks or\nmonths. Some English fruitcakes are so rich and heavy that they\ncan last for up to a year. So, I guess that probably influences our\ntaste and the way that we expect a cake to taste.\n\nChinese Pastries\nJocelyn So, I know\nyou like cakes, Mat. So is there one Chinese\npastry that you've tried that has left an impression on you?\nMat\nI was waiting for this question. I remember many\nyears ago, I was in a restaurant in South "}, {"id": "第二辑-一饮一食__Summer_Ice_Treats", "book": "第二辑 · 一饮一食", "title": "Summer Ice Treats · 夏日冰品", "text": "Summer Ice Treats\n1. You probably know about \"culture shock,\" but have you\never experienced \"weather shock\"?\n2. How do people sleep comfortably in very hot summer\nweather?\n3. What do you think are some popular summer snacks in\nChina? How might they differ from winter snacks?\n\nmiX#t7 t\nWhen summer arrives, it brings with it scorching temperatures and\nstifling humidity. How do people in different parts of the world cope\nwith the summer heat? We're looking at the ways people adapt to\nthe summer season's demands. Whether it's sleeping tips, typical\nsummer foods, or delicious ice treats, we've got everything you\nneed\nto stay cool in the crazy heat of summer.\nMat\nHello, and welcome once again to another episode.\nToday, we are talking about summer\nor summer days. Now,\nof course, I'm English. I think that everyone knows that English\nsummers are, well, let's say \"fairly mild.\" It's quite common to\nhave cool, grey, and rainy days in the middle of summer. Now,\nI can remember many years ago, my first trip to China; it was\nin the month of August, and I arrived in Shanghai. One of the\nthings that shocked me most wasn't really \"culture shock\"-it\nwas weather shock. I couldn't believe how hot it was. So, Jocelyn,\nI know\nyou spent\nfew years in the UK studying and living. Did\nyou have the same feeling in your first English summer? Did you\nexperience weather shock?\nJocelyn Well, absolutely. can vividly remember my first summer\nin England. I remember thinking, when is summer going to arrive?\nI kept waiting for the hot, sunny weather, but it never came. You\nknow, I grew up in Wuhan, one of the hottest cities in summer in\nChina, so my idea of summer is, how can I say it ... quite \"extreme\"\nand my experience of summer in the UK was\nwell\nextremely\n\"mild\"!\n\nSummer Ice Treats\nMat\nSo, I think we've both experienced \"weather shock\"-\nbut in quite different ways. There's one thing I remember: after\narriving in Shanghai in August and then travelling to Wuhan in the\nsame month, I remember people seemed to be good at keeping\ncool in such hot temperatures.\nJocelyn Yes, that's true. Over the\nyears,\nChinese people have\ndeveloped many different ways to keep cool during hot summers.\nOne of the simplest ways is to wear light cotton clothes,\nsomething like pyjamas. You probably saw people sleeping on\nbamboo mats to keep cool during hot summer nights. And for\nsome people, especially in rural areas, sleeping outside is quite\ncommon.\n\nFiX#7\nMat\nSleeping outside? Do people really do that? In England,\nI can't imagine anyone ever sleeping outside. Even in summer, it\nwould be too cold.\nJocelyn Yeah, in China we did sometimes, especially in some\nparts of China where the nights can be really hot and humid. And\nsome people find it cooler and more comfortable to sleep outside,\nespecially if there is a cool breeze. In fact, when I was growing up\nin Wuhan, I remember seeing people sleeping outside during the\nsummer. They had a special bamboo bed that was set up under the\ntrees, and they would sleep there every night. Some people even\nslept on the Yangtze River bridges because they can get the cool\nbreeze from the river-it's like nature's air-conditioner-and it's free.\n\nSummer Ice Treats\nMat\nNow, there's something else I remember about my first\nsummer in Wuhan, and that's the special summer snack food.\nI remember certain food items that were popular in summer.\nThere was one that\nlove, still to this day: cold noodles. I love the\nflavours the sesame sauce, the vinegar, and the chilli flavour-\nit's amazing. But there's another one that\nreally don't like: cold\ngreen bean soup. Do people really like that?\nJocelyn\nGreen bean soup is actually a really popular summer\nfood in many regions of China. And\nyou have to understand that\nwe don't just have it because of the \"flavour\" it's got\nspecific\nfunction. It's believed to have cooling properties, which can\nhelp to reduce body heat and prevent heatstroke during the hot\nsummer months. In traditional Chinese medicine, green beans are\nconsidered to have a special \"cooling\" effect on the body and are\noften used in the treatment of fever, thirst, and other symptoms\nof heat-related illnesses. So we have this cold green bean soup\nas a remedy for the intense summer heat. I guess you don't need\nthings like that in England, where the weather is so mild.\nMat\nNo, we don't need any kind of remedy for summer\nweather because it's never really hot. I mean, we do like ice cream\nin summer-it's kind of a tradition for us. When it's\nsunny,\nwhich\nis not"}, {"id": "第二辑-一饮一食__Preserved_Fruits", "book": "第二辑 · 一饮一食", "title": "Preserved Fruits · 果脯", "text": "Preserved Fruits\n1. Have\nyou ever\ntried a sweet treat made from dried or\npreserved fruits?\n2. Why do you\nthink people in China enjoy preserved fruits\nas snacks, while in England they're mostly used in\nbaking?\n3. Can you guess why preserved fruits are often given as\ngifts during Chinese New Year?\n\nFiX#t7 t\nEveryone likes fruit. We are always being told that we should eat more\nfresh fruit because it's good for our health. But what about preserved\nfruits? Why is this unusual approach to fruit important in China? Is it\nunique to China? Join us on a sweet journey as we compare\nChinese\nand British snacks using dried fruits. We'll learn about the history of\nChinese preserved fruits and their importance as festive gifts, then\nsample the crunch and tang of something special: bingtanghulu.\nMat\nHello and welcome back to another episode. Today we're\ntalking about a sweet treat that's popular in China-preserved\nfruits. Now, preserved fruits are fruits that have been dried\nand preserved in sugar or syrup. So let's start. Jocelyn, tell me\nsomething about preserved fruits.\nJocelyn Of course. In China, preserved fruits have a long history,\ngoing back to the Tang Dynasty. The traditional method of\nmaking preserved fruits involves soaking fresh fruits in a sugar or\nhoney solution and then drying them in the sun. And this process\nnot only preserves\nthe fruits but also enhances their natural\nsweetness and flavour.\nMat\nNow, I think I may have had something similar to this. I\nremember I was in a park in Wuhan, and I saw an old man with a\nbicycle. On the back of his bicycle, there was a glass box. In this\nglass box, there were many of these sticks. And on the sticks, there\nwere all of these differently coloured things; they looked like little\nballs of things. I remember\nsaw one,\nand there were these red\nballs covered in like clear sugar. I'm sure you\nknow what I mean.\n\nJocelyn Ah yeah. I think you're talking about bingtanghulu,\nwhich is a traditional Chinese snack usually made with hawthorn\nberries that are coated in hard, clear sugar syrup. And the berries\nare typically skewered on a stick and then dipped into the syrup\nto create a crunchy, sweet outer layer. And bingtanghulu is often\nenjoyed during the winter months and is popular in the northern\npart of China. Sometimes, you can find it in shops in packaged\nform, or other versions including fruits such as strawberries\nor kiwis. But ask any Chinese person; they will tell you\nthat the\nstreet version is better. Did you try it?\nMat\nYes, I did. It was quite an experience. I remember those\nberries, the hawthorn berries they were like really sour, but that\nsugar coating made them taste sweet and crunchy. I had never\n\nPreserved Fruits\ntasted anything quite like that before. It's like that really unique\ntexture and flavour. The crunchy outer layer of the sugar that\nsugar coating breaks when you bite it, then you have that juicy,\nsour flesh inside -that hawthorn berry. I would say that of all the\nfoods and snacks I've tried in China, this was probably the most\nunique. There's nothing like that in England.\nJocelyn Really? So in England, don't you\nhave any preserved\nfruits?\nMat\nWell, in England, we also have a variety of preserved\nfruits, including like dried apricots, figs, and raisins. And we often\nuse them in baking, especially for cakes and puddings. So, we see\nthem more as ingredients for cooking. We seldom eat them as\nfoods on their own.\nJocelyn That's interesting. It's quite different in China, where we\nsee preserved fruits as a snack on their own, and they come in a\nwide range of flavours and textures. And some preserved fruits\nare soft and chewy, while others are hard and crunchy. There\nare so many fruits that are used for preserving, including plums,\ndates, peaches, and so on.\nMat\nWell, in England, as\nsaid before, we tend to think of\npreserved fruits as something to be used in cooking, in very small\namounts, rather than like\nstand-alone snack. For example, we\nmight use preserved lemons in a chicken dish, or we might add\ndried cranberries to bread, or even to a salad. So to eat preserved\nfruits on their own seems a bit weird to us.\n\nFiX#7 *\nJocelyn Oh, so I'm guessing you don't give preserved fruits as\ngifts in England. You know, in China, preserved fruits are often\ngiven as gifts, particularly during the Chinese New Year. It is a\nway of sharing good luck and prosperity with friends and family.\nAnd because preserved fruits have a long shelf life, they can be\nenjoyed for weeks and even month"}, {"id": "第二辑-一饮一食__Beijing_Duck", "book": "第二辑 · 一饮一食", "title": "Beijing Duck · 北京烤鸭", "text": "Beijing Duck\n1 . If you were asked to name the single most famous Chinese\ndish, what would it be?\n2. Why is Beijing Duck often called Peking Duck in other\ncountries?\n3. Why do you think certain food items, like Beijing Duck,\nbecome internationally famous and are associated with a\nparticular country?\n\nBeijing Duck\nBeijing Duck is an undoubted culinary treasure known and loved\nworldwide. It has a rich history, needs meticulous preparation,\nand has iconic cultural significance. Join us as we trace its origins\nfrom ancient Chinese dynasties to its status as a symbol of Chinese\nculinary excellence. We'll also discuss the unique dining experience it\noffers and why it's cherished by locals and tourists alike. Get ready to\ntantalise your taste buds and discover why Beijing Duck holds such a\nspecial place in Chinese cuisine.\nMat\nHello, and welcome to another exciting episode of China\nLifestyle Journeys! Today, we're talking about the delicious world\nof Beijing Duck, a food treasure that is famous all around the\nworld. In this tasty episode, we'll explore the history, preparation,\nand cultural significance of this iconic dish.\nJocelyn So, Mat, tell me first of all, what's your experience of\nBeijing Duck? From my experience, it seems to be popular in\nChinese restaurants overseas and a real favourite for overseas\ntourists when they visit China.\nMat\nWell, Jocelyn, you're absolutely right! Beijing Duck is\nnot only popular in China, but also overseas. I remember my\nfirst encounter with this mouthwatering dish was actually in\nLondon's Chinatown. Back when I was a kid, I remember going\nto a restaurant with my parents. I was amazed by the crispy skin,\ntender meat of the duck, and those warm pancakes. Something\nelse I remember was seeing the waiter prepare the duck on a little\ntrolley beside our table. I had never seen that before. But nothing\n\nmiX#t7 t\ncompares to the experience of enjoying it in its birthplace, Beijing.\nThere's something truly special about savouring authentic Beijing\nDuck in its birthplace Beijing. So, I think that's my first question:\nwhy is it called Beijing Duck? What's the story behind it?\nJocelyn Well, that's a good question to begin with, but it's not so\neasy to answer. Duck has been eaten for many centuries in China,\nacross many dynasties. In very old cookery and recipe books\ndating back to the Tang Dynasty (618-907 CE), we can find\nreferences to shao yazi (simply \"roast duck\"). The descriptions\ntell us that this fresh duck was grilled over a wood or charcoal\nfire. This same dish appears throughout the history of Chinese\ncuisine, with small adjustments and improvements by later\n\nBeijing Duck\ngenerations. Later, in the Ming Dynasty (around the 1300s), we\ncan find various references to a dish that the emperor liked very\nmuch. This was officially named \"roast duck\" (kaoya) by the\nimperial court. But it's important to note that at this time, Beijing\nwasn't the capital; Nanjing was.\nMat\nSo, was it called Nanjing Duck? How did the dish move to\nBeijing and get its name \"Beijing Duck\"?\nJocelyn In the Ming Dynasty, the imperial court moved to Beijing,\nbringing roast duck along with it. By then, Beijing Duck was an\nestablished staple of imperial menus. In the Qing Dynasty, Beijing\nDuck spread to the nobility, where the dish was often praised by\nscholars and poets.\n\nMat\nI have a question about the name. I've seen it called\nBeijing Duck and Peking Duck. Why does it have two names?\nJocelyn Ah, good question. The name Peking Duck comes from\nan older way of writing Chinese names in English. In the past,\nBeijing was spelled as Peking in English. So, when the duck dish\nfirst became famous in the West, it was referred to as Peking\nDuck, since that was how the city's name was commonly spelled\nin English back then.\nHowever, in the 1950s, a different writing system was created\nas the standard way for translating Chinese into English (this is\ncalled pinyin). And in pinyin, the city's name is spelled as \"Beijing.\"\n\nSo, in China, in Chinese, it only has one name. But sometimes\nyou'll still see the old name \"Peking Duck\" on menus, especially\nin Chinese restaurants overseas. \"Beijing Duck\" has become the\nmore modern and accurate English translation to align with the\npinyin spelling system. But both names refer to the exact same\nthing.\nMat\nGreat explanation. Now I have a difficult question for\nyou. Imagine if someone has never tried o
