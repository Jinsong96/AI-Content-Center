  toggleTopic(theme, d.subs[si], d.subsEn[si]);
}
function s3(){
  const cats = taxoCats();
  const sel = new Set(state.tagContent);
  const cands = new Set(state.tagFreeCands);
  const hitCats = new Set((state.tagAIContent || []).map(c => c.cat));
  const anyHit = hitCats.size > 0;
  const totalTags = cats.reduce((a, c) => a + (c.tags || []).length, 0);

  /* 第一层：6 类分区。AI 命中的类别展开，其余折叠；AI 还没跑过时全部展开以便人工选 */
  const layer1 = cats.length ? `<div class="tagsection">
    <div class="tagsec-h">${L("第一层 · 内容标签","Layer 1 · Content tags")}
      <span>${cats.length} ${L("类","categories")} · ${totalTags} ${L("个标签","tags")}</span>
      <button class="btn mini" onclick="toggleAllCats()">${cats.every(c => state.tagOpenCats[c.key] !== false) ? L("全部折叠","Collapse all") : L("全部展开","Expand all")}</button>
    </div>
    ${cats.map((c, ci) => {
      const isOpen = state.tagOpenCats[c.key] !== undefined ? state.tagOpenCats[c.key] : (anyHit ? hitCats.has(c.key) : true);
      const nSel = (c.tags || []).filter(t => sel.has(tagKeyOf(c.key, t.zh))).length;
      if(!isOpen){
        return `<div class="tagcat closed" onclick="toggleCatOpen('${escAttr(c.key)}')" style="animation-delay:${.04 * ci}s">
          <span class="tc-name">${esc(c.zh)}<small>${esc(c.en)}</small></span>
          <span class="tc-count">${(c.tags || []).length} ${L("个","tags")}${nSel ? ` · <b>${nSel} ${L("已选","selected")}</b>` : ""}</span>
          <span class="tc-arrow">▸</span></div>`;
      }
      return `<div class="tagcat" style="animation-delay:${.04 * ci}s">
        <div class="tc-head" onclick="toggleCatOpen('${escAttr(c.key)}')">
          <span class="tc-name">${esc(c.zh)}<small>${esc(c.en)}</small></span>
          <span class="tc-count">${nSel ? `<b>${nSel} ${L("已选","selected")}</b> · ` : ""}${(c.tags || []).length} ${L("个","tags")}</span>
          <span class="tc-arrow">▾</span>
        </div>
        <div class="tc-opts">${(c.tags || []).map(t => {
          const k = tagKeyOf(c.key, t.zh);
          const isSel = sel.has(k);
          const isRec = !isSel && cands.has(t.zh) === false && hitCats.has(c.key) && (state.tagAIContent || []).some(x => x.cat === c.key && x.tag === t.zh);
          return `<span class="chip ${isSel ? "sel" : (isRec ? "rec" : "")}" onclick="toggleContentTag('${escAttr(c.key)}','${escAttr(t.zh)}')">${L(t.zh, t.en)}</span>`;
        }).join("")}</div></div>`;
    }).join("")}
  </div>` : `<div class="degraded"><div class="dgb-h"> ${L("标签词表未加载，无法选择内容标签","Taxonomy not loaded — content tags unavailable")}</div></div>`;

  /* 第二层：自由标签（AI 候选 + 已选 + 手动添加） */
  const freeAll = [];
  (state.tagFreeCands || []).forEach(t => { if(freeAll.indexOf(t) < 0) freeAll.push(t); });
  (state.tagFree || []).forEach(t => { if(freeAll.indexOf(t) < 0) freeAll.push(t); });
  const layer2 = `<div class="tagsection">
    <div class="tagsec-h">${L("第二层 · 自由标签","Layer 2 · Free tags")}
      <span>${L("热门人物 / 话题事件，AI 提取后人工删减","Trending people & events — AI extracts, you prune")}</span></div>
    ${freeAll.length ? `<div class="tc-opts">${freeAll.map(t => {
      const on = state.tagFree.indexOf(t) >= 0;
      return `<span class="chip ${on ? "sel" : ""}" onclick="toggleFreeTag('${escAttr(t)}')">${on ? "✓ " : ""}${esc(t)}</span>`;
    }).join("")}</div>` : `<div class="tc-empty">${L("还没有自由标签。点上方「AI 提取标签」获取候选，或手动添加。","No free tags yet. Click \"AI extract\" above, or add manually.")}</div>`}
    <div class="tagadd">
      <input placeholder="${L("手动添加自由标签，回车确认","Add a free tag, press Enter")}"
             value="${escAttr(state.tagFreeInput || "")}"
             oninput="state.tagFreeInput=this.value"
             onkeydown="if(event.key==='Enter'){addFreeTag();}">
      <button class="btn mini" onclick="addFreeTag()">${L("添加","Add")}</button>
    </div>
  </div>`;

  /* 第三层：认知标签 */
  const layer3 = `<div class="tagsection">
    <div class="tagsec-h">${L("第三层 · 认知标签","Layer 3 · Cognitive tags")}
      <span>${L("AI 判断，可人工修改","AI judges, you can override")}</span></div>
    <div class="tc-opts">${taxoCognitive().map(c => {
      const on = state.tagCognitive === c.zh;
      return `<span class="chip ${on ? "sel" : ""}" onclick="setCognitive('${escAttr(c.zh)}')">${on ? "● " : "○ "}${L(c.zh, c.en)}</span>`;
    }).join("")}</div>
  </div>`;

  /* 已选汇总 */
  const selSummary = [];
  state.tagContent.forEach(k => {
    const p = k.split("|");
    const c = taxoCatOf(p[0]);
    selSummary.push({ cls: "c", txt: (c ? c.zh : p[0]) + " · " + p[1] });
  });
  (state.tagFree || []).forEach(t => selSummary.push({ cls: "f", txt: t }));
  if(state.tagCognitive) selSummary.push({ cls: "g", txt: state.tagCognitive });

  return head("04", L("选题标签","Topic Tagging"), "Content × free × cognitive") +
  matWorkflowBar() +
  `<p class="lede">${L("AI 先给出建议，你来确认与删减：<b>内容标签</b>多选，<b>自由标签</b>点选保留，<b>认知标签</b>单选。",
    "AI proposes, you confirm: <b>content tags</b> multi-select, <b>free tags</b> keep or drop, <b>cognitive tag</b> single choice.")}</p>
  ${materialCardHTML()}
  <div class="tagextract">
    <button class="btn" onclick="extractTagsAI()" ${state.tagExtracting ? "disabled" : ""}>${state.tagExtracting ? " " + L("提取中…","Extracting…") : " " + L("AI 提取标签","AI extract tags")}</button>
    ${state.tagMeta ? `<span class="te-meta">${esc(state.tagMeta.model || "")} · ${state.tagMeta.cached ? L("缓存","cached") : (state.tagMeta.elapsedMs || 0) + "ms"}</span>` : ""}
    ${state.tagAIReason ? `<span class="te-reason">${esc(state.tagAIReason)}</span>` : ""}
  </div>
  ${state.tagWarn ? `<div class="degraded"><div class="dgb-h"> ${esc(state.tagWarn)}</div></div>` : ""}
  ${state.tagTitleOnly ? `<div class="tagdropped">${L("该热点仅有标题、无正文：内容标签与自由标签均基于标题提取，自由标签可能偏少。建议优先使用带正文的素材，或在 05 步补充正文后重新提取。","This topic has only a title (no body): tags were derived from the title, so free tags may be sparse. Prefer sources with body text, or enrich the material at step 05 and re-extract.")}</div>` : ""}
  ${taxoError ? `<div class="degraded"><div class="dgb-h"> ${L("未能拉取标签词表，当前使用上次缓存","Could not fetch the taxonomy — using last cache")}</div><div class="dgb-row"><span class="dgb-msg">${esc(taxoError)}</span></div></div>` : ""}
  ${(state.tagMeta && state.tagMeta.dropped && state.tagMeta.dropped.length)
    ? `<div class="tagdropped">${L("已过滤：","Filtered out: ")}${esc(state.tagMeta.dropped.join("；"))}</div>` : ""}
  ${layer1}${layer2}${layer3}
  <div class="tagselbar"><span class="tsb-label">${L("已选","Selected")}</span>
    ${selSummary.length ? selSummary.map(s => `<span class="tsb-chip ${s.cls}">${esc(s.txt)}</span>`).join("")
                        : `<span class="tsb-empty">${L("尚未选择任何标签","No tags selected")}</span>`}
  </div>
  ${saveMaterialBankBar()}` + wfStrip();
}



/* ---------- Stage 5 ---------- */
function s4(){
  const text = curMaterialText();
  const facts = curFacts();
  const label = curMaterialLabel();
  const url = curMaterialUrl();
  const lf = liveFacts();
  const hasLive = !!(lf && lf.length);
  const running = state.live.status === "running";
  const ready = (hasLive || state.extracted) && !liveExcluded();
  const factCards = facts.map((f, i) => {
    const tcolor = {DATA:"danger",QUOTE:"warn",EVENT:"teal",BACKGROUND:"purple"}[f.type] || "teal";
    const conf = (f.conf==null ? 0.9 : f.conf);
    /* 生成后回填：该卡被哪些段落引用；绑定存在却未被引用 → 标黄提示 */
    const cb = hasLive ? factCitedBy(i+1) : "";
    const uncited = hasLive && !!liveFactMap() && !cb;
    return `<div class="fcard${uncited ? " uncited" : ""}">
      <div class="top"><span class="tint ${tcolor}">${f.type}</span><span class="fid">FC-${i+1}</span>${uncited?`<span class="tint warn">${L("未被引用","UNCITED")}</span>`:""}</div>
      <div class="stmt">${esc(f.stmt)}</div>
      ${f.zh ? `<div class="zh">${esc(f.zh)}</div>` : ""}
      <div class="meta"><span>${L("置信","confidence")}</span><div class="confbar ${conf<0.9?"low":""}"><i style="width:${(conf*100).toFixed(0)}%"></i></div><b>${conf.toFixed(2)}</b>
      <span class="tint ${f.rev==="auto"?"ok":"warn"}">${f.rev==="auto"?"AUTO":L("复核","REVIEW")}</span></div>
      <div class="senref"> ${esc(f.anchor)} · ${L("交叉验证","cross-check")}: ${esc(f.cross)}</div>
      ${cb ? `<div class="citedby"> ${L("被引用","cited in")} ${cb}</div>` : ""}
    </div>`;
  }).join("");
  /* 事实卡池区域按状态渲染：运行中 / 真实抽取 / 占位兜底 / 未运行 */
  let factBody;
  if(running){
    factBody = `<div id="s4live">${s6LiveInner(L("正在抽取事实卡 · 预计 5–10 秒，完成后自动刷新","Extracting fact cards · ~5–10s, auto-refreshes on completion"), "fact", true)}</div>`;
  } else if(hasLive){
    factBody = factCards;
  } else if(state.live.status === "error"){
    factBody = `<div class="note warn-note" style="margin-bottom:10px">${L("AI 抽取失败：","AI extraction failed: ")}${esc(state.live.err || L("未知错误","unknown error"))}</div>
      <div style="margin-bottom:10px"><button class="btn" onclick="extract()">${L("重试抽取","Retry extraction")}</button></div>` + factCards;
  } else if(liveExcluded()){
    /* 素材被敏感排查排除：Dify 只回 status / sensitive_level / sensitive_reason，不带 facts_json。
       必须如实说「被排除」，否则用户会以为只是没抽到卡而反复重试，永远走不下去。 */
    factBody = `<div class="note warn-note" style="margin-bottom:10px">${L("该素材已被 AI 敏感排查判定为<b>排除</b>，工作流在此终止，不会产出事实卡。","This material was <b>excluded</b> by the AI sensitivity screen — the workflow stops here and produces no fact cards.")}</div>
      <div style="margin-bottom:10px;font-size:12.5px;color:var(--sub)">${L("敏感等级","Sensitivity")}：<b>${esc(liveSensLevel() || "—")}</b> · ${L("判定理由","Reason")}：${esc(liveSensReason() || L("（工作流未返回理由）","(no reason returned)"))}</div>
      <div style="margin-bottom:10px"><a class="btn" href="#" onclick="go(0);return false;">${L("返回 01 更换素材","Back to step 01 · pick another material")}</a></div>`;
  } else if(state.extracted){
    /* 0 张卡有五种成因，按诊断结果给不同说明与出口；旧文案一律说「素材没有正文」会误导排查方向。 */
    const diag = liveFactDiag();
    const noText = !curMaterialText() || curMaterialText().trim().length < 40;
    let rZh = "", rEn = "";
    if(diag.k === "nojson"){
      rZh = "AI 工作流已成功返回，但输出中没有事实卡字段（facts_json 为空）——通常是素材过短或内容无法原子化。";
      rEn = "The workflow succeeded but returned no fact-card field (facts_json empty) — usually the material is too short or cannot be atomised.";
    } else if(diag.k === "parse"){
      rZh = "AI 返回的事实卡不是合法 JSON，前端无法解析。";
      rEn = "The AI returned fact cards that are not valid JSON and cannot be parsed.";
    } else if(diag.k === "empty"){
      rZh = "AI 返回了空的事实卡数组。";
      rEn = "The AI returned an empty fact-card array.";
    } else if(noText){
      rZh = "素材没有可用正文（只有一行标题），无事实可抽。";
      rEn = "The material has no usable body text (headline only) — nothing to extract.";
    } else {
      rZh = "AI 运行完成但未产出事实卡。";
      rEn = "The AI run finished but produced no fact cards.";
    }
    factBody = `<div class="note warn-note" style="margin-bottom:10px">${L("AI 已运行完成，但抽到 0 张事实卡。","The AI run finished but extracted 0 fact cards.")} ${L(rZh, rEn)}</div>
      ${diag.raw ? `<div style="margin-bottom:10px;font-size:11.5px;color:var(--muted);word-break:break-all;background:#F7F8FA;padding:8px 10px;border-radius:8px">${esc(diag.raw)}</div>` : ""}
      <div style="margin-bottom:10px;font-size:12.5px;color:var(--sub)">${noText
        ? L("建议：回到 01 素材选择页换一条「原文已完整」的热点，或手动粘贴素材原文后再运行抽取。","Tip: go back to step 01 and pick a trend marked \"Full text\", or paste the source text manually before extracting.")
        : L("建议：先点「重新抽取」重试一次；仍为空则回到 01 换一条原文完整的素材。","Tip: retry once; if still empty, go back to step 01 and pick a material with full text.")}</div>
      <div style="margin-bottom:10px"><button class="btn" onclick="extract()">${L("重新抽取","Retry extraction")}</button></div>` + factCards;
  } else {
    factBody = `<button class="btn" onclick="extract()">${L("运行抽取 Workflow","Run workflow")} · E1–E9</button>`;
  }
  return head("06", L("事实抽取","Fact Extraction"), "AI fact extraction") +
    artWorkflowBar() +
  `<p class="lede">${L("核心设计：<b>事实与语言分离</b>。AI 从原文抽取原子化事实卡，作为所有等级生成时唯一的事实来源——数字、人名、引语全部锚定原句，可回溯比对。每张事实卡为<b>英文事实 + 中文对照</b>，由 AI 真实工作流生成。",
    "Core design: <b>facts and language separated</b>. The AI extracts atomic fact cards — the single source of truth for every level. Each card shows <b>English fact + Chinese gloss</b>, generated for real by the AI workflow.")}</p>
  <div class="workbench">
    <div>
      <div class="pane-h"><span>${L("原文 · SOURCE TEXT","SOURCE TEXT")}</span><span style="font-weight:600;color:var(--muted);letter-spacing:0">${esc(label)}</span></div>
      <div class="article-mini" id="srcmini">${esc(text.slice(0, 2500))}</div>
      ${url ? `<div style="margin-top:8px;font-size:11.5px;color:var(--sub)"> ${L("原文链接","Source link")}：<a href="${esc(url)}" target="_blank" rel="noopener" style="color:var(--pri);font-weight:600;word-break:break-all;text-decoration:none">${esc(url)}</a></div>` : ""}
    </div>
    <div>
      <div class="pane-h" style="justify-content:space-between"><span>${L("事实卡池 · FACT CARDS","FACT CARDS")}</span>${ready?`<span class="tint ok">${facts.length} ${hasLive?L("张 · 由 AI 真实抽取","cards · extracted live by AI"):L("张 · 已抽取","cards · extracted")}</span>`:""}</div>
      <div class="factlist" id="factlist">${factBody}</div>
      ${ready?`<div class="note" style="margin-top:10px">${L("置信度 ≥0.85 自动通过 · 0.6–0.85 人工复核（黄）· 数据卡强制交叉验证；单一信源事实生成时须保留原文限定词（如 nearly / around）。","Confidence ≥0.85 auto-pass · 0.6–0.85 human review · DATA cards cross-checked. Single-source facts keep their qualifiers (e.g. nearly / around).")}</div>`:""}
    </div>
  </div>
  ${liveExcluded()
    ? `<div class="nextbar"><div class="ctx"> ${L("该素材已被 AI 判定为排除，流程终止，请返回 01 更换素材。","This material was excluded by the AI — workflow stopped. Go back to step 01 and pick another.")}</div><button class="btn" style="opacity:.45;cursor:not-allowed">${L("流程已终止","Workflow stopped")}</button></div>`
    : (ready ? nextBtn("查看分级标准","KB & specs") : waitBtn(running ? L("工作流运行中…","Workflow running…") : L("点击运行抽取","Run extraction")))}` + wfStrip();
}
function extract(){
  if(state.live.status === "running"){ toast(L("工作流运行中，请稍候…","Workflow running, please wait…")); return; }
  const material = state.live.material;
  if(!material || material.length < 40){ toast(L("请先在素材选择页选择一篇素材","Pick a material first")); return; }
  state.extracted = true; render();
  startLiveRun(material, state.live.label || "", state.live.book || "");
}

  return head("07", L("知识库与分级标准","KB & CEFR Specs"), "Seven libraries · versioned snapshots") +
    artWorkflowBar() +
  `<p class="lede">${L("教研知识库（KB1–KB7）是生成与审核的唯一标准来源，代码不硬编码任何教研标准；每篇文章固化引用知识库版本快照，可复现、可审计。",

    <div class="kbitem"><div class="n">KB3</div><h5>${L("文体结构模板","Genre templates")}</h5><p>${L("倒金字塔 / 故事 / 说明文","News · story · explainer")}</p></div>
    <div class="kbitem"><div class="n">KB4</div><h5>${L("中国文化术语库","CN-term glossary")}</h5><p>≥300 ${L("条标准译法","standard renderings")}</p></div>
    <div class="kbitem"><div class="n">KB5</div><h5>${L("敏感规范库","Sensitivity rules")}</h5><p>S0–S3</p></div>

/* ==================== 内容库（审核通过后归档） ==================== */
const BANK_KEY = "wb_content_bank_v1";
function loadBank(){
  try {
    const v = JSON.parse(localStorage.getItem(BANK_KEY) || "[]");
    return Array.isArray(v) ? v : [];
  } catch(e){
    // 解析失败不能静默当空库——否则用户会以为文章丢了，或反过来以为没存过
    toast(L("内容库读取失败：本地存储数据已损坏，请检查备份","Failed to read the library: local storage data is corrupted"));
    return [];
  }
}
function saveBank(list){
  try {
    localStorage.setItem(BANK_KEY, JSON.stringify(list));
    return true;
  } catch(e){
    // 原来这里静默吞掉：隐私模式/配额满时文章会无声丢失，用户还以为存好了
    toast(L("保存失败：本地存储不可写（隐私模式或空间已满），文章未入库",
            "Save failed: local storage unavailable (private mode or quota exceeded) — article NOT saved"));
    return false;
  }
}
/* 同步状态：pending / ok / failed，连同失败原因写回文章对象，界面可查可重试 */
function syncInfo(a){
  const s = a && a.sync;
  if(!s) return { cls:"none", text:L("未同步","Not synced"), tip:L("尚未尝试同步到后端","Not yet synced to backend") };
  if(s.status === "ok") return { cls:"ok", text:L("已同步","Synced"), tip:L("已写入后端内容库","Written to the backend library") };
  if(s.status === "pending") return { cls:"gen", text:L("同步中…","Syncing…"), tip:L("正在写入后端","Writing to backend") };
  return { cls:"fail", text:L("同步失败","Sync failed"), tip:(s.error || L("未知原因","Unknown")) };
}
function markSync(id, st){
  const list = loadBank();
  const a = list.find(x => x.id === id);
  if(!a) return;
  a.sync = st;
  saveBank(list);
  if(cur === 11) renderKeepOpen();   // 在内容库页时刷新，让用户看到状态变化
}
async function retrySync(id){
  const a = loadBank().find(x => x.id === id);
  if(!a) return;
  await syncArticleToLibrary(a);
  toast(L("已重新尝试同步","Retrying sync"));
}
/* 打通：文章入库时同步到桥接层 /api/library（→ 飞书内容库）。
   失败必须写回文章对象并在界面上标出「同步失败 + 原因 + 重试」，不能只在控制台打日志。 */
async function syncArticleToLibrary(art){
  markSync(art.id, { status:"pending", error:"", at: Date.now() });
  try {
    const r = await fetch(AGENT_REACH_API + "/api/library", {
      method: "POST", mode: "cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(art)
    });
    let why = "HTTP " + r.status;
    let j = null;
    try { j = await r.json(); } catch(e){}
    if(r.ok && j && j.ok){
      markSync(art.id, { status:"ok", error:"", at: Date.now() });
      return true;
    }
    if(j && j.error) why = j.error;
    markSync(art.id, { status:"failed", error: why, at: Date.now() });
    return false;
  } catch(e){
    markSync(art.id, {
      status: "failed",
      error: L("桥接层不可达（" + AGENT_REACH_API + "）", "bridge unreachable (" + AGENT_REACH_API + ")"),
      at: Date.now()
    });
    return false;
  }
}
function addToBank(art){
  const list = loadBank();
  const i = list.findIndex(a => a.id === art.id);
  if(i >= 0) list[i] = art; else list.unshift(art);
  if(!saveBank(list)) return false;   // 保存失败就明确失败，绝不假装入库成功
  syncArticleToLibrary(art);
  return true;
}

/* 相对路径补全为可访问绝对地址（音频文件由桥接层 127.0.0.1:8787 托管） */
function audioFullUrl(rel){
  if(!rel) return "";
  if(/^https?:\/\//i.test(rel)) return rel;
  return AGENT_REACH_API + (rel.charAt(0) === "/" ? rel : "/" + rel);
}
function escAttr(s){ return esc(s).replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
/* 统计一篇文章已生成的音频文件数（最多 3 档 × 2 口音 = 6） */
function bankAudioCount(a){
  let n = 0;
  ["A2","B1","B2"].forEach(function(k){
    const v = (a && a.audio && a.audio[k]) || {};
    if(v.us) n++;
    if(v.uk) n++;
  });
  return n;
}
function audioRegenLabel(a){

  if(n > 0) return L("补齐音频","Fill audio");

}
/* 内容库共用的隐藏播放器（不随 render 重建，避免折叠展开态丢失） */
function bankAudioEl(){
  let el = document.getElementById("bankAudioEl");
  if(!el){
    el = document.createElement("audio");
    el.id = "bankAudioEl";
    el.style.display = "none";
    el.addEventListener("pause", function(){ bankResetPlayBtns(null); });
    el.addEventListener("ended", function(){ bankResetPlayBtns(null); });
    document.body.appendChild(el);
  }
  return el;
}
function bankResetPlayBtns(except){
  var all = document.querySelectorAll("[data-baplay]");
  for(var i = 0; i < all.length; i++){
    if(all[i] !== except) all[i].textContent = all[i].getAttribute("data-label");
  }
}
function bankPlayAudio(id, lvl, accent){
  const a = loadBank().find(x => x.id === id);
  const rel = a && a.audio && a.audio[lvl] && a.audio[lvl][accent];
  if(!rel){ toast(L("该档位暂无此口音音频","No audio for this level/accent")); return; }
  const btn = document.querySelector('[data-baplay="' + id + "|" + lvl + "|" + accent + '"]');
  const el = bankAudioEl();
  if(el.getAttribute("data-rel") === rel && !el.paused){
    el.pause();
    bankResetPlayBtns(null);
    return;
  }
  bankResetPlayBtns(btn);
  el.setAttribute("data-rel", rel);
  el.src = audioFullUrl(rel);
  if(btn) btn.textContent = " " + L("暂停","Pause");
  const p = el.play();
  if(p && p.catch) p.catch(function(){
    bankResetPlayBtns(null);
    toast(L("播放失败，请确认桥接层已启动（127.0.0.1:8787）","Playback failed — is the bridge running on 127.0.0.1:8787?"));
  });
}
function bankCopyAudio(url){
  const done = function(){ toast(L("音频链接已复制","Audio link copied")); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(done, function(){ bankCopyFallback(url, done); });
  } else {
    bankCopyFallback(url, done);
  }
}
function bankCopyFallback(url, done){
  try {
    const ta = document.createElement("textarea");
    ta.value = url;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    done();
  } catch(e) {
    toast(L("复制失败，请手动复制链接","Copy failed — please copy the link manually"));
  }
}
/* 单个档位的音频区块：英音/美音各一行（播放 + 可见链接 + 复制 + 下载） */

/* 音频迟到时回填：按 contentId 找到已入库的那篇，把音频补写进去（入库是快照，否则永远补不上） */
function backfillBankAudio(){
  if(!state.audio || !Object.keys(state.audio).length) return 0;
  let cid = "";
  try { cid = (identityRecord() || {}).contentId || ""; } catch(e){ return 0; }
  if(!cid) return 0;
  const list = loadBank();
  const a = list.find(x => x.id === cid);
  if(!a) return 0;
  if(a.audio && Object.keys(a.audio).length) return 0;
  a.audio = JSON.parse(JSON.stringify(state.audio));
  saveBank(list);
  syncArticleToLibrary(a);
  return 1;
}
let bankAudioBusy = null;
/* 内容库内补生成音频：直接用入库时存的正文打 TTS，不用重跑整条流水线 */
async function bankRegenAudio(id){
  if(bankAudioBusy) return;
  const list = loadBank();
  const a = list.find(x => x.id === id);

const MATERIAL_BANK_KEY = "wb_material_bank_v1";
/* 素材 ID：MAT-YYYYMMDD-NNN，序号 = 同日已有 ID 最大值 +1（避免删除后撞号） */
function nextMaterialId(list){
  const prefix = "MAT-" + new Date().toISOString().slice(0,10).replace(/-/g,"") + "-";
  let max = 0;
  (list||[]).forEach(m => {
    const id = String((m && m.id) || "");
    if(id.indexOf(prefix) === 0){
      const n = parseInt(id.slice(prefix.length), 10);
      if(!isNaN(n) && n > max) max = n;
    }
  });
  return prefix + String(max + 1).padStart(3, "0");
}
function loadMaterialBank(){
  let list = [];
  try{ list = JSON.parse(localStorage.getItem(MATERIAL_BANK_KEY)||"[]"); }catch(e){ list = []; }
  if(!Array.isArray(list)) list = [];
  /* 老数据 / 批量入库漏号 → 补齐唯一 ID；同时把对象型 collectedBy 归正（旧版存了整个 user 对象） */
  let dirty = false;
  list.forEach(m => {
    if(!m || typeof m !== "object") return;
    if(!m.id){ m.id = nextMaterialId(list); dirty = true; }
    if(m.collectedBy && typeof m.collectedBy === "object"){
      m.collectedBy = m.collectedBy.name || "system"; dirty = true;
    }
  });
  if(dirty) saveMaterialBank(list);
  return list;
}
function saveMaterialBank(list){ try{ localStorage.setItem(MATERIAL_BANK_KEY, JSON.stringify(list)); return true; }catch(e){ return false; } }
function addMaterialToBank(m){
  const list = loadMaterialBank();

  const i = list.findIndex(x=>x.uuid===m.uuid);
  if(!m.id) m.id = (i>=0 && list[i].id) ? list[i].id : nextMaterialId(list);
  if(i>=0) list[i]=m; else list.unshift(m);
  return saveMaterialBank(list);
}

const TOPIC_CATS = [
  {key:"world", zh:"世界", en:"World", color:"#2969F9"},
  {key:"science", zh:"科学", en:"Science", color:"#12B76A"},
  {key:"culture", zh:"文化", en:"Culture", color:"#8B5CF6"},
  {key:"business", zh:"商业", en:"Business", color:"#F79009"},
  {key:"growth", zh:"成长", en:"Growth", color:"#D85A30"},
  {key:"story", zh:"故事", en:"Story", color:"#1D9E75"},
];
/* 从文章对象取「结构化三层标签」：兼容新格式(curTags 对象)与旧格式(identityRecord 展示行数组) */
function artTags(a){
  const t = a && a.identity && a.identity.tags;
  if(!t) return { content: [], free: [] };
  if(!Array.isArray(t)){
    return { content: Array.isArray(t.content) ? t.content : [], free: Array.isArray(t.free) ? t.free : [] };
  }
  /* 旧格式：行数组 [{k:{zh},v:{zh}}]，从「内容标签」行回解析 "一级主题 · 标签"（可含 、 多标签） */
  const content = [];
  const row = t.find(r => r && r.k && r.k.zh === "内容标签");
  if(row && row.v && row.v.zh){
    String(row.v.zh).split(/[、,，]/).forEach(seg => {
      const m = String(seg).split(" · ");
      if(m.length >= 2){
        const zh = m[0], tag = m.slice(1).join(" · ");
        const c = TOPIC_CATS.find(x => x.zh === zh);
        if(c) content.push({ cat: c.key, catZh: c.zh, catEn: c.en, tag: tag, tagEn: tag });
      }
    });
  }
  const fr = t.find(r => r && r.k && r.k.zh === "自由标签");
  let free = [];
  if(fr && fr.v && fr.v.zh && fr.v.zh !== "无" && fr.v.zh !== "none") free = String(fr.v.zh).split(/[、,，]/);
  return { content: content, free: free };
}
function articlePrimaryCat(a){
  const c0 = artTags(a).content[0];
  return (c0 && c0.cat) ? c0.cat : "other";
}
function topicLabelOf(a){
  const c = TOPIC_CATS.find(x=>x.key===articlePrimaryCat(a));
  return c ? L(c.zh, c.en) : L("未分类","Other");
}

      ((a.material&&a.material.source)||"").toLowerCase().includes(kw) ||

  }

      const actBtn = canReview
        ? `<button class="btn tiny" onclick="reviewDraftFromBank('${escAttr(a.id)}')">${L("人工审核","Manual review")}</button>`

  if(!paged.length){

  /* 分页 */
  html += `<div class="mat-pagination">

    <button class="btn sec tiny" onclick="pageArt(${totalPages-1})" ${artPage>=totalPages-1?"disabled":""}>${L("末页","Last")}</button>
  </div>`;

  html += wfStrip();
  return html;

function artParasOf(a, k){
  const p = (a && a.paras && a.paras[k]) || [];
  if(p && p.length) return p;
  const t = (a && a.articles && a.articles[k]) || "";
  if(!t) return [];
  return t.split(/\n{2,}/).map(x => x.trim()).filter(Boolean);
}
function srcParaCard(k, text, i){

  const dot = `<span style="width:9px;height:9px;border-radius:50%;background:${m.color};display:inline-block;flex-shrink:0"></span>`;
  if(!text) return `<div class="pcard svempty"><div class="svempty-t">${L("暂无 " + k + " 档内容","No " + k + " version")}</div></div>`;
  return `<div class="pcard">
      <div class="ph">${dot}<b>${k}</b><span style="margin-left:auto;font-size:10.5px;color:var(--muted)">#${i+1}</span></div>
      <div style="padding:11px 13px;font-size:12.5px;line-height:1.85;color:#344054;white-space:pre-wrap">${esc(text)}</div>
    </div>`;
}
function bankAlignedHTML(a){
  const lvls = ["A2","B1","B2"];
  const cols = {};
  let maxP = 0;
  lvls.forEach(k => { cols[k] = artParasOf(a, k); if(cols[k].length > maxP) maxP = cols[k].length; });
  if(!maxP) return "";
  let h = '<div class="plvlbar">' + lvls.map(k => {
    const m = LVL_META[k] || { color:"#98A2B3" };
    return `<div class="plvl-pill"><span class="dot" style="background:${m.color}"></span><b>${k}</b><span>${cols[k].length} ${L("段","paras")}</span></div>`;
  }).join("") + '</div>';
  h += '<div class="aligngrid">';
  for(let i = 0; i < maxP; i++){
    h += `<div class="alignrow"><div class="arow-no">#${i+1}</div>` + lvls.map(k => srcParaCard(k, cols[k][i], i)).join("") + '</div>';
  }
  h += '</div>';
  return h;
}

/* ---------- 辅助函数 ---------- */
/* 按一级主题统计已审核文章 */
function bankByTopic(){
  const bank = loadBank().filter(a => !!a.reviewedBy);
  const groups = {};
  TOPIC_CATS.forEach(c=>groups[c.key]=[]);
  groups.other = [];
  bank.forEach(a=>{ const cat = articlePrimaryCat(a); (groups[cat] || groups.other).push(a); });
  return { bank, groups };
}
function bankTagCount(){
  const bank = loadBank().filter(a => !!a.reviewedBy);
  const tagc = {};
  bank.forEach(a=>{
    const t = artTags(a);
    (t.content||[]).forEach(c=>{ const tag=c&&c.tag; if(tag) tagc[tag]=(tagc[tag]||0)+1; });
    (t.free||[]).forEach(f=>{ if(f) tagc[f]=(tagc[f]||0)+1; });
  });
  return Object.entries(tagc).sort((a,b)=>b[1]-a[1]);
}
function bankLevelStats(){
  const bank = loadBank().filter(a => !!a.reviewedBy);
  const lv = {};
  bank.forEach(a=>{ const l = a.level || "—"; lv[l]=(lv[l]||0)+1; });
  return Object.entries(lv).sort((a,b)=>b[1]-a[1]);
}
function bankRecentTrend(){
  const bank = loadBank().filter(a => !!a.reviewedBy);
  const days = {};
  const now = Date.now();
  for(let i=6;i>=0;i--){
    const d = new Date(now - i*864e5);
    days[d.toISOString().slice(0,10)] = 0;
  }
  bank.forEach(a=>{
    if(a.createdAt){
      const k = String(a.createdAt).slice(0,10);
      if(days[k]!==undefined) days[k]++;
    }
  });
  return Object.entries(days);
}
/* 库存格子水位状态 */
function invLevel(arr){ return arr.length >= 10 ? "ok" : (arr.length >= 3 ? "warn" : "danger"); }
function invLabel(arr){
  if(arr.length >= 10) return L("充足","Sufficient");
  if(arr.length >= 3) return L("偏低","Low");
  return L("告急","Critical");
}

/* ---------- 12 · 运营看板 ---------- */
function sOps(){
  const { bank, groups } = bankByTopic();
  const covered = TOPIC_CATS.filter(c => (groups[c.key]||[]).length).length + ((groups.other||[]).length?1:0);
  const levels = bankLevelStats();
  const trend = bankRecentTrend();
  const maxTrend = Math.max(...trend.map(([,v])=>v),1);
  const colorLvl = {A2:"#2969F9",B1:"#12B76A",B2:"#8B5CF6"};

  let html = head("", L("运营看板","Ops Dashboard"), "Key metrics · content stats");
  html += `<p class="lede">${L("运营看板展示已审核文章的关键指标与多维统计：文章产出趋势、档位分布、主题覆盖情况。所有数据均来自内容库中已审核的文章，真实反映内容运营状态。","The ops dashboard shows key metrics and multi-dimensional stats for reviewed articles: production trends, level distribution, and topic coverage. All data comes from reviewed articles in the content library.")}</p>`;

  /* KPI 卡片 */
  const pendingPub = bank.filter(a => !a.published).length;
  html += `<div class="dash-grid">
    <div class="dash-card"><div class="dash-num">${bank.length}</div><div class="dash-lbl">${L("已审核文章总量","Reviewed articles")}</div><div class="dash-sub">${L("全部已通过审核","All approved")}</div></div>
    <div class="dash-card"><div class="dash-num">${bank.length-pendingPub}</div><div class="dash-lbl">${L("已发布数量","Published")}</div><div class="dash-sub">${L("含多渠道","All channels")}</div></div>
    <div class="dash-card"><div class="dash-num">${pendingPub}</div><div class="dash-lbl">${L("待发布","Pending publish")}</div><div class="dash-sub">${L("已审核未发布","Reviewed, unpublished")}</div></div>
    <div class="dash-card"><div class="dash-num">${covered}</div><div class="dash-lbl">${L("覆盖主题数","Topics covered")}</div><div class="dash-sub">${L("共 6 个一级主题","Out of 6 primary topics")}</div></div>
  </div>`;

  /* 库存水位 SVG 条形图 */
  html += `<div class="dash-section"><h4> ${L("库存水位","Stock water level")}</h4><svg viewBox="0 0 600 220" style="width:100%;max-width:600px;height:auto">`;
  const barW = 60, gap = 24, startX = 30;
  const maxInv = Math.max(...TOPIC_CATS.map(c => (groups[c.key]||[]).length), 1);
  TOPIC_CATS.forEach((c,i) => {
    const arr = groups[c.key] || [];
    const h = Math.max(10, Math.round(arr.length / maxInv * 150));
    const x = startX + i*(barW+gap);
    const y = 190 - h;
    const col = arr.length >= 10 ? "#12B76A" : (arr.length >= 3 ? "#F79009" : "#F04438");
    html += `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" fill="${col}" opacity="0.85"/>
      <text x="${x+barW/2}" y="${y-6}" text-anchor="middle" font-size="11" fill="#666">${arr.length}</text>
      <text x="${x+barW/2}" y="208" text-anchor="middle" font-size="11" fill="#888">${L(c.zh.slice(0,2),c.en.split(" ")[0])}</text>`;
  });
  html += `</svg></div>`;

  /* 档位分布 SVG 饼图 */
  html += `<div class="dash-section"><h4> ${L("档位分布","Level distribution")}</h4><svg viewBox="0 0 280 200" style="width:100%;max-width:280px;height:auto">`;
  const total = levels.reduce((s,[,c])=>s+c, 0) || 1;
  let angle = 0;
  const cx=140, cy=100, r=70;
  levels.forEach(([l,c]) => {
    const pct = c/total;
    const a = pct * 360;
    if(a < 1) return;
    const sr = (angle-90)*Math.PI/180;
    const er = (angle+a-90)*Math.PI/180;
    const x1 = cx + r*Math.cos(sr), y1 = cy + r*Math.sin(sr);
    const x2 = cx + r*Math.cos(er), y2 = cy + r*Math.sin(er);
    const la = a > 180 ? 1 : 0;
    html += `<path d="M${cx} ${cy} L${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${la} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z" fill="${colorLvl[l]||'#999'}" opacity="0.85"/>`;
    const ma = (angle + a/2 - 90)*Math.PI/180;
    const lx = cx + (r+20)*Math.cos(ma), ly = cy + (r+20)*Math.sin(ma);
    html += `<text x="${lx}" y="${ly}" text-anchor="middle" font-size="11" fill="#666">${l} ${c}${L("篇","")}</text>`;
    angle += a;
  });
  html += `</svg></div>`;

  /* 产出趋势 SVG 折线图 */
  html += `<div class="dash-section"><h4> ${L("产出趋势（近 7 天）","Production trend (last 7 days)")}</h4><svg viewBox="0 0 600 200" style="width:100%;max-width:600px;height:auto">`;
  const pts = trend.map(([d,c],i) => {
    const x = 40 + i * 75;
    const y = 170 - Math.round(c/maxTrend*140);
    return {x,y,label:d.slice(5),val:c};
  });
  if(pts.length > 1){
    let d = `M${pts[0].x} ${pts[0].y}`;
    for(let i=1;i<pts.length;i++) d += ` L${pts[i].x} ${pts[i].y}`;
    html += `<path d="${d}" fill="none" stroke="#E65425" stroke-width="2.5"/>`;
    pts.forEach(p => {
      html += `<circle cx="${p.x}" cy="${p.y}" r="4" fill="#E65425"/>
        <text x="${p.x}" y="${p.y-10}" text-anchor="middle" font-size="10" fill="#666">${p.val}</text>
        <text x="${p.x}" y="192" text-anchor="middle" font-size="10" fill="#888">${p.label}</text>`;
    });
  } else {
    html += `<text x="300" y="100" text-anchor="middle" font-size="13" fill="#999">${L("暂无趋势数据","No trend data yet")}</text>`;
  }
  html += `</svg></div>`;

  html += wfStrip();
  return html;
}

/* ---------- 13 · 发布管理 ---------- */
const PUB_KEY = "wb_publish_history_v1";
function loadPublishHistory(){
  try { return JSON.parse(localStorage.getItem(PUB_KEY) || "[]"); }
  catch(e){ return []; }
}
function savePublishHistory(list){
  try { localStorage.setItem(PUB_KEY, JSON.stringify(list)); return true; }
  catch(e){ return false; }
}
function doPublish(aid){
  if(!aid){ toast(L("请选择要发布的文章","Please select an article to publish")); return; }
  const bank = loadBank();
  const art = bank.find(a => a.id === aid);
  if(!art){ toast(L("文章未找到","Article not found")); return; }
  const history = loadPublishHistory();
  history.unshift({
    id: "pub_"+Date.now()+"_"+Math.random().toString(36).slice(2,6),
    articleId: aid,
    title: art.title,
    level: art.level || "—",
    topic: topicLabelOf(art),
    publishedAt: new Date().toISOString(),
    status: "done",
  });
  savePublishHistory(history);
  art.published = true;
  saveBank(bank);
  toast(L("已发布 · 记录已保存到发布历史","Published · saved to publish history"));
  render();
}
function sPublish(){
  const bank = loadBank().filter(a => !!a.reviewedBy);
  const published = bank.filter(a => a.published);
  const pending = bank.filter(a => !a.published);
  const history = loadPublishHistory();
  let html = head("", L("发布管理","Publish Management"), "Instant publish · history");
  html += `<p class="lede">${L("从已审核文章中快速发布单篇文章，无需选择渠道或排期。发布后自动记录到发布历史，并标记为已发布状态。","Quickly publish individual reviewed articles without selecting channels or schedules. Published articles are automatically recorded in publish history and marked as published.")}</p>`;

  /* 发布统计卡片 */
  html += `<div class="pub-stats">
    <div class="pub-stat-card"><div class="pub-stat-num">${bank.length}</div><div class="pub-stat-lbl">${L("可发布总量","Available")}</div></div>
    <div class="pub-stat-card"><div class="pub-stat-num">${published.length}</div><div class="pub-stat-lbl">${L("已发布","Published")}</div></div>
    <div class="pub-stat-card"><div class="pub-stat-num">${pending.length}</div><div class="pub-stat-lbl">${L("待发布","Pending")}</div></div>
    <div class="pub-stat-card"><div class="pub-stat-num">${history.length}</div><div class="pub-stat-lbl">${L("历史记录","History")}</div></div>
  </div>`;

  /* 两列布局 */
  html += `<div class="pub-layout">`;

  /* 左栏：待发布文章（按主题分组） */
  html += `<div class="pub-panel"><h4> ${L("待发布文章","Pending articles")}</h4>`;
  if(!pending.length){
    html += `<div class="empty">${L("全部已发布","All published")}</div>`;
  } else {
    const pGrp = {};
    pending.forEach(a => {
      const catKey = articlePrimaryCat(a);
      if(!pGrp[catKey]) pGrp[catKey] = [];
      pGrp[catKey].push(a);
    });
    Object.entries(pGrp).forEach(([catKey, arts]) => {
      const cat = TOPIC_CATS.find(c => c.key === catKey);
      html += `<div class="pub-topic"><span class="pub-topic-dot" style="background:${cat?cat.color:"#999"}"></span><b>${cat?L(cat.zh,cat.en):L("未分类","Other")}</b><span class="pub-topic-count">${arts.length}</span></div>`;
      arts.forEach(a => {
        html += `<div class="pub-item">
          <b>${esc(a.title)}</b>
          <span class="pub-item-lvl ${a.level||""}">${a.level||"—"}</span>
          <span class="pub-item-date">${fmtDate(a.createdAt)}</span>
          <button class="pub-item-btn" onclick="doPublish('${a.id}')">${L("发布","Publish")}</button>
        </div>`;
      });
    });
  }
  html += `</div>`;

  /* 右栏：发布历史 */
  html += `<div class="pub-panel"><h4> ${L("发布历史","Publish history")} <span style="font-size:11px;color:var(--muted);font-weight:400">(${history.length})</span></h4><div class="pub-history">`;
  if(!history.length){
    html += `<div class="empty">${L("暂无发布记录","No publish history yet")}</div>`;
  } else {
    history.forEach(h => {
      html += `<div class="pub-entry">
        <span class="pub-status done"></span>
        <b>${esc(h.title)}</b>
        <span class="pub-meta">${h.level} · ${h.topic}</span>
        <span class="pub-time">${fmtDate(h.publishedAt)}</span>
      </div>`;
    });
  }
  html += `</div></div></div>`;
  html += wfStrip();
  return html;
}

      "business": 1890, "growth": 1560, "story": 1320,
      "other": 980
    },
    tagClicks: {
      "旅行": 892, "美食": 764, "运动": 651, "历史": 598,
      "科技": 523, "音乐": 487, "电影": 432, "艺术": 398
    },
    likedArticles: [
      { title:"A Day in London", likes:342 },
      { title:"The Story of Coffee", likes:287 },

}
function clearFeedbackData(){
  localStorage.removeItem(FB_KEY);
  initFeedbackData();
  render();
}
function sFeedback(){
  const fd = initFeedbackData();
  /* 每日随机波动（±5%） */
  const jitter = () => Math.round((0.95 + Math.random()*0.1) * 100) / 100;
  const jTopic = Object.fromEntries(Object.entries(fd.topicReads).map(([k,v]) => [k, Math.round(v*jitter())]));
  const jTag = Object.fromEntries(Object.entries(fd.tagClicks).map(([k,v]) => [k, Math.round(v*jitter())]));
  const jLiked = fd.likedArticles.map(a => ({ ...a, likes: Math.round(a.likes*jitter()) }));
  const totalReads = Object.values(jTopic).reduce((s,v) => s+v, 0);
  const totalClicks = Object.values(jTag).reduce((s,v) => s+v, 0);

  let html = head("", L("用户反馈","User Feedback"), "Topic reads · tag clicks · liked articles");
  html += `<p class="lede">${L("用户反馈面板展示模拟的用户互动数据：各主题阅读量、标签点击偏好、用户点赞文章排名。数据预填充并每日随机波动 ±5%，点击重置按钮可恢复初始值。","The user feedback panel displays simulated user engagement data: topic reads, tag click preferences, and liked article rankings. Data is pre-populated with daily random fluctuations of ±5%. Click reset to restore initial values.")}</p>`;

  /* 控制按钮 */
  html += `<div class="fdb-controls">
    <button class="fdb-reset-btn" onclick="clearFeedbackData()"> ${L("重置数据","Reset data")}</button>
  </div>`;

  /* KPI 卡片 */
  html += `<div class="fdb-grid">
    <div class="fdb-card"><div class="fdb-num">${totalReads.toLocaleString()}</div><div class="fdb-lbl">${L("总阅读量","Total reads")}</div><div class="fdb-sub">${L("模拟数据","Simulated")}</div></div>
    <div class="fdb-card"><div class="fdb-num">${totalClicks.toLocaleString()}</div><div class="fdb-lbl">${L("标签点击量","Tag clicks")}</div><div class="fdb-sub">${L("模拟数据","Simulated")}</div></div>
    <div class="fdb-card"><div class="fdb-num">${jLiked.length}</div><div class="fdb-lbl">${L("热门文章","Popular articles")}</div><div class="fdb-sub">${L("用户点赞排名","User likes ranking")}</div></div>
    <div class="fdb-card"><div class="fdb-num">${fd.totalFeedback||0}</div><div class="fdb-lbl">${L("反馈条数","Feedback count")}</div><div class="fdb-sub">${L("用户主动反馈","User submitted")}</div></div>
  </div>`;

  /* 主题阅读量条形图 */
  html += `<div class="fdb-chart-container"><h4> ${L("主题阅读量","Topic reads")}</h4><div class="fdb-chart">`;
  const maxRead = Math.max(...Object.values(jTopic), 1);
  Object.entries(jTopic).forEach(([k,v]) => {
    const cat = TOPIC_CATS.find(c => c.key === k);
    const lbl = cat ? L(cat.zh,cat.en) : L("其他","Other");
    const pct = Math.round(v/maxRead*100);
    html += `<div class="fdb-chart-row"><span class="fdb-chart-lbl">${lbl}</span><div class="fdb-chart-track"><div class="fdb-chart-fill" style="width:${pct}%;background:${cat?cat.color:"#999"}">${v.toLocaleString()}</div></div><span class="fdb-chart-val">${v.toLocaleString()}</span></div>`;
  });
  html += `</div></div>`;

  /* 标签点击偏好条形图 */
  html += `<div class="fdb-chart-container"><h4> ${L("标签点击偏好","Tag click preferences")}</h4><div class="fdb-chart">`;
  const maxTag = Math.max(...Object.values(jTag), 1);
  Object.entries(jTag).forEach(([k,v]) => {
    const pct = Math.round(v/maxTag*100);
    html += `<div class="fdb-chart-row"><span class="fdb-chart-lbl">${esc(k)}</span><div class="fdb-chart-track"><div class="fdb-chart-fill" style="width:${pct}%;background:var(--teal)">${v.toLocaleString()}</div></div><span class="fdb-chart-val">${v.toLocaleString()}</span></div>`;
  });
  html += `</div></div>`;

  /* 热门文章排名 */
  html += `<div class="fdb-chart-container"><h4> ${L("热门文章排名","Popular article ranking")}</h4><div class="fdb-rank-list">`;
  jLiked.forEach((a,i) => {
    const cls = i===0?"gold":(i===1?"silver":(i===2?"bronze":"normal"));
    html += `<div class="fdb-rank-item"><span class="fdb-rank-num ${cls}">#${i+1}</span><b>${esc(a.title)}</b><span class="fdb-rank-likes"> ${a.likes.toLocaleString()}</span></div>`;
  });
  html += `</div></div>`;

  html += wfStrip();
  return html;
}

/* ---------- router ---------- */
function render(){
  /* 「查看原文」独立视图：不占 step 编号（避免六处同步），优先渲染；
     返回或切换侧边栏步骤时 state.view 会被清掉，不会串台 */
  if(state.view === "srcview"){
    stage.innerHTML=`<div class="wrap">${sArticleSource()}</div>`;
    renderPasteModal();
    return;
  }
  const fns=[s0,s1,s2,s3,sMaterialBank,s4,s5,s6,s7,s9,s12,sArticleBank,sInventory,sPublish,sOps,sFeedback];
  const ro = state.user && !canOperate(cur);
  const roBanner = ro ? `<div class="ro-banner">${L("只读查看 · 本步骤由「"+ownerLabel(cur)+"」职能操作","Read-only · this step is operated by "+ownerLabel(cur))}</div>` : "";
  stage.innerHTML=`<div class="wrap${ro?" ro":""}">${roBanner}${fns[cur]()}</div>`;
  renderPasteModal();   /* 无原文热点的「粘贴原文」弹窗（state.pendingHot 为空时自动移除） */
  if(cur===0) renderBank();
  if(cur===1) renderHots();
  if(cur===7) typewriter();
  if(cur===8&&state.validated){
    VALS.forEach((v,i)=>{
      const cols=[$("#vcol"),$("#vcol2")];
      const d=document.createElement("div"); d.className="vcheck on "+v[2];
      d.innerHTML=`<div class="tickbox">${v[2]==="pass"?"✓":"!"}</div><div class="vid">${v[0]}</div><div class="vname">${L(v[1].zh,v[1].en)}</div><div class="state">${v[2]==="pass"?"PASS ":"WARN "}${v[3]}</div>`;
      cols[i%2].appendChild(d);
    });
    showVSum(); showIdentity();
  }
}
function showReadingPreviewFull(){
  const g=GEN[state.lvl]; if(!g||!g.paras) return alert("No content");
  let cp=0,cl=state.lvl||"B1"; const lv=["A2","B1","B2"];
  function r(){
    const P=GEN[cl]&&GEN[cl].paras?GEN[cl].paras:[]; const p=P[cp]||{en:"",zh:""};
    const m=document.getElementById("main"),total=P.length;
    m.innerHTML='<div style="max-width:720px;margin:auto;padding:20px">'+
      '<h2>'+L("阅读预览","Reading Preview")+'</h2>'+
      '<div style="display:flex;gap:8px;margin:12px 0">'+lv.map(function(x){return '<button onclick="switchLvl(\''+x+'\')" style="padding:6px 16px;border-radius:6px;cursor:pointer;background:'+(cl===x?"#E65425":"#eee")+';color:'+(cl===x?"#fff":"#333")+'">'+x+'</button>';}).join("")+'</div>'+
      '<div style="background:#f8f9fa;padding:20px;border-radius:10px;min-height:200px"><p style="font-size:18px;line-height:1.8">'+p.en+'</p></div>' + navBtns(cp,total) + '</div>';
  }
  r();
  window.switchLvl=function(x){ cl=x; cp=0; r(); };
  window.prevPara=function(){ if(cp>0){ cp--; r(); } };
  window.nextPara=function(){ if(cp<GEN[cl].paras.length-1){ cp++; r(); } };
}
function navBtns(cp,total){ return '<div style="display:flex;justify-content:space-between;margin:16px 0"><button id="prevBtn" '+(cp===0?"disabled":"")+' onclick="prevPara()" style="padding:8px 20px;border-radius:6px;cursor:pointer">'+L("上一段","Prev")+'</button><span style="padding:8px">'+(cp+1)+"/"+total+'</span><button id="nextBtn" '+(cp===total-1?"disabled":"")+' onclick="nextPara()" style="padding:8px 20px;border-radius:6px;cursor:pointer">'+L("下一段","Next")+'</button></div>'; }
renderKpis();
renderLogin();
checkBridge();
loadTaxonomy().then(() => { state.taxoLoaded = true; if(cur === 3 || cur === 1) render(); });
</script>
