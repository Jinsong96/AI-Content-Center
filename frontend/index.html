const HOTS = [
  {"rank": 1, "topic": "Chinese Valentine's Day is rooted in legend and tradition, not just romance", "cn": "七夕：根植于传说与传统的中国情人节", "heat": 94, "srcs": 18, "source": "AP News", "date": "2026-08-20", "url": "https://apnews.com/article/qixi-festival-china-valentines-day-af53f01f7a524d026792c54e1ad612e0", "summary": "BEIJING (AP) — Chinese Valentine’s Day is not all about flowers and chocolates. Beyond the romance embraced by some contemporary couples, Qixi is an ancient tradition rooted in legend, prayer and cultural activities that survive to this day. The festival is ob", "fulltext": "BEIJING (AP) — Chinese Valentine’s Day is not all about flowers and chocolates. Beyond the romance embraced by some contemporary couples, Qixi is an ancient tradition rooted in legend, prayer and cultural activities that survive to this day. The festival is observed on the seventh day of the seventh month of the Chinese calendar, which fell on Aug. 19 in 2026. Celebrations are also held in Singapore, Vietnam and other Asian countries. “We especially hope that young audiences can understand the meaning of our traditional festivals through interactive and engaging experiences,” said Jia Juan, who works in the museum’s Public Education Department. The museum, housed in Beijing’s Dongyue Taoist Temple, has been hosting Qixi-related activities for the last 14 years, drawing about 500 people each time. Wednesday’s program began with a performance of Chinese classical music, followed by hands-on activities for families inspired by traditional Qixi customs. One involved dyeing fingernails with garden balsam, a natural pigment traditionally associated with beauty and blessings. Another featured Song brocade bead painting, combining a precious Chinese silk fabric with pearls that symbolize completeness and good fortune. Participants were encouraged to create their own sachet-shaped Song brocade pearl painting. Their work was meant to embody “qiqiao,” a concept centered on the pursuit of skill and dexterity. Wang Xuejie attended with her 7-year-old daughter and they created “qiaoguo,” a pastry made by pressing dough into decorative molds. “We were able to get a general understanding of how, during the Qixi Festival in ancient times, girls and women expressed their aspirations and hopes for their own growth,” Wang said. Jia said that Chinese girls started practicing qiqiao during the Tang and Song dynasties, which spanned the seventh through the 13th centuries. “The history of the Qixi Festival can be traced back to ancient people’s worship and study of the stars,” she added. Qixi has historically centered on two main elements. One is related to a legend — its romantic component — and the other to qiqiao. In Chinese mythology, Zhinü, a weaver girl represented by the Vega star, falls in love with Niulang, a cowherd embodied by the Altair star. Their forbidden love leads the Jade Emperor to decree their separation on opposite sides of the Milky Way. They reunite once a year — on the seventh day of the seventh lunar month — on a bridge formed by magpies. Jia said records of the Cowherd and Weaver Girl date back to the pre-Qin period, before 221 B.C. Then, during the Han Dynasty, customs related to qiqiao began to develop. Researcher Lynn Wong is eager to revive the festival in Singapore through an initiative called Qixi Fest, a multiday event launched in 2023. This year’s edition will run through Aug. 23. “We’re trying to create the childhood memories of this new generation of Singaporeans so that they grow up with the stories that our forefathers grew up with,” Wong said. She recalls that one day, while talking to a friend about Chinese festivals, she realized she had never heard of Qixi. She then started interviewing elders who shared their memories of the festival. That research is documented in a book. Qixi came to Singapore around the 1930s with Chinese women migrants. Large numbers of men had previously settled there in search of work, but migration patterns shifted. With the women — particularly those from China’s Guangdong region — came customs and beliefs, some of which faded over time. “I feel that in my generation, we lost quite a lot of our roots,” Wong said. “I grew up with things like the Tooth Fairy, ‘Hansel and Gretel’ and ‘Three Little Pigs,’ but what about the stories that our foremothers grew up listening to?” Hor Xin Hao, of Cantonese descent, is among a handful of people who preserve a traditional observance of Qixi in Singapore. Late at night on the sixth day of the seventh lunar month, his family sets up a prayer table facing the night sky in front of his house. They pray past midnight and make offerings to the Seven Maidens, celestial sisters including the Weaver Girl. Ritual gifts include incense, flowers, perfume, cosmetics and soap, which Hor said are believed to bring beauty and charm after being blessed by the cowherd and seven maidens. “I personally feel that the idea of a Valentine’s Day actually reduces the original idea behind the festival into something narrower,” said Hor, who sees Qixi as a celebration of traditional values and ancestral legacy. “It contains the way we look at life from the interaction between us and the universe,” he said."},
  {"rank": 2, "topic": "Shoton Festival opens in Lhasa with giant thangka unveiling", "cn": "拉萨雪顿节开幕 巨幅唐卡亮相", "heat": 92, "srcs": 17, "source": "China Daily", "date": "2026-08-14", "url": "https://www.chinadaily.com.cn/a/202608/14/WS6a7ecd41a31073853ec535b4.html", "summary": "The Shoton Festival, one of the most well-known traditional festivals in the Xizang autonomous region, commenced in Lhasa on Wednesday, attracting tourists from around the globe eager to experience the region's cultural heritage. The festival's opening ceremon", "fulltext": "The Shoton Festival, one of the most well-known traditional festivals in the Xizang autonomous region, commenced in Lhasa on Wednesday, attracting tourists from around the globe eager to experience the region's cultural heritage. The festival's opening ceremony at Lhasa's Drepung Monastery featured the unveiling of a giant thangka embroidery depicting the Buddha. Shoton, meaning \"yogurt banquet\" in Tibetan, began as a religious tradition where locals offered yogurt to monks after their summer retreat. Over time, it has evolved into a celebration featuring Tibetan opera, cultural performances, and various festivities."},
  {"rank": 3, "topic": "100,000 gather in Xichang for Torch Festival of Yi ethnic group", "cn": "十万群众齐聚西昌 欢度彝族火把节", "heat": 90, "srcs": 16, "source": "CGTN", "date": "2026-08-10", "url": "https://news.cgtn.com/news/2026-08-10/100-000-gather-in-Xichang-for-Torch-Festival-of-Yi-ethnic-group-1Pusqvwf3Ak/p.html", "summary": "The Torch Festival, a grand traditional folk celebration of the Yi ethnic group, reached its peak on August 8 in Xichang, the capital of Liangshan Yi Autonomous Prefecture in southwest China's Sichuan Province. 0 seconds of 1 minute, 56 seconds Volume 90% The ", "fulltext": "The Torch Festival, a grand traditional folk celebration of the Yi ethnic group, reached its peak on August 8 in Xichang, the capital of Liangshan Yi Autonomous Prefecture in southwest China's Sichuan Province. 0 seconds of 1 minute, 56 seconds Volume 90% The annual festival, which kicked off on July 19 and runs through mid-August, has featured a host of signature events across the prefecture. But the highlight came on August 8, when 86 bonfires were lit at the carnival venue, sending flames soaring several meters into the night sky. Local residents and visitors lit their own torches one after another and joined hands to dance to traditional Yi rhythms along a 3.2‑kilometer street brimming with festivity. According to organizers, approximately 100,000 people participated in the celebration. Rooted in age‑old local customs, the Torch Festival originated from folk rituals of warding off pests and praying for bumper harvests. Over time, it has evolved into a grand gathering for people to offer blessings and celebrate together, embodying the Yi people's reverence for fire and nature. While preserving these folk traditions, this year's Xichang Torch Festival has been upgraded to appeal to a broader audience. A major highlight is the integration of a music festival with the traditional torch celebration, adding a contemporary touch to the ancient event."},
  {"rank": 4, "topic": "Young people build careers by reviving Li brocade", "cn": "年轻人以复兴黎锦为事业", "heat": 88, "srcs": 15, "source": "People's Daily", "date": "2026-08-20", "url": "https://en.people.cn/n3/2026/0820/c90000-20490420.html", "summary": "Visitors to a Li brocade workshop in Wuzhishan city, south China's Hainan Province, are greeted by adorable dolls, stylish and practical bags, jewelry, scarves and other creative cultural products lining the shelves. Patterns once embroidered only on tradition", "fulltext": "Visitors to a Li brocade workshop in Wuzhishan city, south China's Hainan Province, are greeted by adorable dolls, stylish and practical bags, jewelry, scarves and other creative cultural products lining the shelves. Patterns once embroidered only on traditional garments are now being incorporated into all aspects of everyday life, thanks to the ingenuity of young inheritors and entrepreneurs. _Photo shows Li brocade featuring rich patterns and vibrant color combinations. (CNR.cn/Cai Wenjuan)_ Li brocade has evolved from a museum artifact into something young people are willing to buy, use and even build a career around. The traditional spinning, dyeing, weaving and embroidering techniques of the Li ethnic group are used by Li women in Hainan to make clothing and other everyday items from natural fibers such as cotton. Their representative product, known as Li brocade, has a history of more than 3,000 years and is hailed as a \"living fossil\" of China's textile history. The techniques were officially inscribed on the UNESCO Representative List of the Intangible Cultural Heritage of Humanity on Dec. 5, 2024. However, Li brocade was once held back by three major constraints. Its use was limited, typically to festive attire. Its high price put it beyond the reach of ordinary consumers. And it was usually taught within families, with the craft passed down from mother to daughter. As the older generation of weavers grew smaller, few young people were willing to take it up. _Chen Mengli incorporates Li brocade patterns into modern clothing design. (CNR.cn/Cai Wenjuan)_ Bringing this millennia-old tradition out of exhibition halls and into everyday life became a shared challenge for its inheritors. \"Plant dyes and totemic patterns are the foundation and soul of Li brocade,\" said Chen Mengli, a Li woman born in the 1990s and a municipal-level representative inheritor of Li ethnic clothing, a national intangible cultural heritage item. \"We cannot abandon tradition, but if we want it to become part of people's everyday lives, we have to combine it with modern design, making it affordable and something people want to use.\" Young inheritors therefore began with design. They deconstructed and reworked the complete patterns traditionally featured on large garments, extracting distinctive motifs with clear meanings and adapting them for everyday products such as necklaces, canvas bags, notebook covers, phone cases and travel souvenirs. Huang Yangwei, a municipal-level representative inheritor of the techniques, has challenged the long-held belief that brocade weaving is women's work. Moving beyond the traditional black-and-red color scheme, he has developed products such as men's vests, briefcases and bicycle helmets, tapping into a male consumer market that had long been overlooked. Today, Li brocade has expanded beyond clothing into more than 100 types of creative cultural products. Rooted in tradition while reflecting modern aesthetics, these products have quickly won over young consumers, helping Li brocade become part of contemporary life. _Huang Yangwei introduces Li brocade patterns to young people. (Photo courtesy of the interviewee/CNR.cn)_ \"Some customers send us their needs and ideas and ask for customized products,\" Chen said. \"Others have suggested turning pieces of Li brocade fabric into luggage tags. That would make them 'walking postcards' of Li culture.\" As the range of products has expanded, Li brocade has gradually reached a wider market. Rising orders have enabled Li women skilled in traditional weaving to work from home and earn a steady income. In recent years, Wuzhishan has placed greater emphasis on training intangible cultural heritage practitioners. The city has established 22 training and practice centers and seven intangible cultural heritage workshops. It has also created a development pathway covering early education for children, dedicated training for young people and master-apprentice programs. So far, more than 5,400 people in the city have acquired Li brocade weaving skills. More than 20 leading practitioners have emerged, with over 100 master-apprentice pairings established. A tiered pool of practitioners spanning older, middle-aged and younger generations is gradually taking shape, with more young people taking up the craft. _Li brocade makes an appearance at Paris Fashion Week. (Photo courtesy of the interviewee/CNR.cn)_ Since 2021, Li brocade has appeared on the runways of fashion weeks in China and abroad, where young inheritors have showcased their creations and drawn attention from the international fashion industry. Wuzhishan partnered with Italian fashion and design school Istituto Marangoni in August 2023 to launch an international training program for Li brocade practitioners, selecting skilled weavers for further study."},
  {"rank": 5, "topic": "Centuries-old ethnic musical instrument finds new guardians in rural southwest China", "cn": "苗族芦笙乐器迎来新传承人", "heat": 86, "srcs": 14, "source": "Xinhua", "date": "2026-08-08", "url": "https://english.news.cn/20260808/91043b425f2b4c759e6687a9d55f871a/c.html", "summary": "GUIYANG, Aug. 8 (Xinhua) -- As a teenager, Luo Tingkai would hoist his father's handcrafted Lusheng onto his back and trek three hours from his home in Pilin Village to sell the instruments at the bustling township market. Gaopo Township in Guiyang, capital of", "fulltext": "GUIYANG, Aug. 8 (Xinhua) -- As a teenager, Luo Tingkai would hoist his father's handcrafted Lusheng onto his back and trek three hours from his home in Pilin Village to sell the instruments at the bustling township market. Gaopo Township in Guiyang, capital of southwest China's Guizhou Province, is a Miao ethnic community nestled in the mountains, where Pilin Village is located. The craft of making the Miao Lusheng, an ancient instrument of six bamboo pipes, has been passed down here for over two centuries. Its music weaves through every stage of Miao life, from birth and marriage to farewell, marking each passage with its timeless sound. Now 62, Luo is a devoted guardian of this time-honored sound. He began learning to play the Lusheng at just 12 years old, and after junior high, he apprenticed under his father to master the craft. Over the decades, Luo has dedicated his life to preserving and passing on the rich culture of the Lusheng. Luo Tingkai, an inheritor of the craft of making the Miao Lusheng, introduces Lusheng at a workshop in Gaopo Township of Guiyang, southwest China's Guizhou Province, July 11, 2026. (Xinhua) \"The Lusheng is a symbol of our Miao people and a lifelong companion,\" Luo said. \"Wherever we go, we can never be without it.\" In 2006, the craft of Miao Lusheng-making was inscribed on China's first national list of intangible cultural heritage items. Passed down orally from master to apprentice, with no written manuals, the tradition demands at least five years of study before an apprentice can craft a Lusheng independently. Keeping this \"sound of an ethnic people\" alive, however, has not been easy. For a long time, fewer and fewer young people were willing to invest the time to learn the craft. Luo admitted that for the young, working away from home means \"easy money,\" while making Lusheng yields \"just one pair a week.\" In 2020, Luo was honored as a provincial-level inheritor of intangible cultural heritage. His greatest hope is to see more people embrace the craft. These days, his city-dwelling son returns home on weekends and holidays to learn it from him. Thanks to Lusheng courses widely offered in local primary and secondary schools, many Miao children still learn to play the instrument from an early age. Wang Tingliang and Wang Pinggui, both in their 30s, started learning in their early teens. Wang Pinggui (L) and Wang Tingliang craft Lusheng at a workshop in Gaopo Township of Guiyang, southwest China's Guizhou Province, July 11, 2026. (Xinhua) They have played the Lusheng at countless festivals, and gradually came to realize that if no one carried on the craft, the sound would one day fall silent. So, three years ago, they sought out Luo and became his apprentices. \"Our ethnic heritage has to be passed on,\" Wang Pinggui said. \"We've always loved playing the Lusheng, and now it's our generation's turn to carry it forward.\" The process of crafting a Lusheng, from selecting the bamboo and shaping the wind chest to forging the reeds and tuning, tests the artisan's patience and precision. Carving the wind chest is a delicate, high-stakes task; the slightest misstep can undo days of painstaking work. As the bamboo pipes are sanded again and again, the constant friction of bamboo dust against the palms leaves hands covered in thick calluses. \"We were so engrossed in the craft when we first started that we often stayed up until the early hours,\" Wang Pinggui recalled. \"There is no room for fear in craftsmanship,\" Luo added. \"Those who truly want to learn will never flinch from the hard work, and those who can't stand the heat are better off not starting.\" During festivals, Luo organizes Lusheng performances and sets up educational display boards to raise villagers' awareness of preserving the tradition. Whenever the sound of the Lusheng fills the air, local Han and Buyi residents gather to watch, and people from neighboring villages and beyond frequently make the trip to seek his guidance. \"Everyone is welcome to learn,\" he said. \"I don't charge a penny. My only wish is to pass this craft on to the next generation.\" Luo has also brought his self-made compact three-pipe Lusheng into local primary and secondary schools. By using modern numbered musical notation to transcribe traditional melodies, he helps children pick up the playing techniques more quickly. In addition, he has shared the Lusheng-making process on short-video platforms. His clips, which show everything from teaching children to play the instrument to fine-tuning its pitch, have each garnered over 10,000 views online. \"This is the pride of our ethnic group, and it means a lot to me,\" one netizen commented. There was a time when it was Lusheng-making that put food on the table for Luo's family. Today, thanks to online exposure, the traditional art has gradually reached beyond Gaopo, and brought in a growing number of orders. \"Our Lusheng sell very well,\" he said. \"Every one we make finds a buyer.\" Luo Tingkai, an inheritor of the craft of making the Miao Lusheng, introduces Lusheng at a workshop in Gaopo Township of Guiyang, southwest China's Guizhou Province, July 11, 2026. (Xinhua) But in Luo's view, the wider the reach, the more crucial it is to keep standards high. \"The tone, the appearance, the craftsmanship -- everything has to be up to standard,\" he said. \"If the quality isn't there, customers won't come back.\" To promote the deep integration of intangible cultural heritage preservation with rural revitalization, a Lusheng workshop was established in Gaopo in August 2025. Integrating Lusheng-making, skills training, cultural exhibitions and hands-on learning experiences, the workshop invited Luo to serve as its technical director. Visitors can observe the entire Lusheng-making process up close and even try their hand at tuning reeds and assembling bamboo pipes. The workshop has introduced modern tools such as polishers, sanders and drilling equipment, which, while preserving traditional craftsmanship, have improved production efficiency and the finished products' visual quality. Last year, Gaopo also hosted its first Lusheng competition, drawing 49 teams from southwest China's provinces of Guizhou and Yunnan and beyond. During the event, more than 100,000 people tuned in either online or in person, giving a significant boost to local catering and accommodation businesses. \"The Lusheng is the soul of Gaopo. We want its voice to reach even farther,\" said Tang Jialin, director of the township's industrial development service center.■"},
  {"rank": 6, "topic": "Xixia porcelain-making aims to woo new audiences", "cn": "西夏陶瓷技艺吸引年轻受众", "heat": 84, "srcs": 13, "source": "China Daily", "date": "2026-08-18", "url": "https://www.chinadaily.com.cn/a/202608/18/WS6a83b181a3106bc57421c011.html", "summary": "YINCHUAN — Along the banks of the Yellow River in Zhongwei, Ningxia Hui autonomous region, an earthen-colored ceramics studio blends into the surrounding landscape. Around a row of pottery wheels, visitors work their fingers into coarse clay, shaping vessels t", "fulltext": "YINCHUAN — Along the banks of the Yellow River in Zhongwei, Ningxia Hui autonomous region, an earthen-colored ceramics studio blends into the surrounding landscape. Around a row of pottery wheels, visitors work their fingers into coarse clay, shaping vessels that will eventually become Xixia porcelain, a craft with centuries-old roots in the region. Among them is Chang Jiamei, a studio intern in her early 20s. \"I'm a native of Zhongwei, but I knew little about Xixia porcelain before taking up the job,\" she said. Her experience highlights a challenge faced by many traditional crafts — even when recognized as intangible cultural heritage, they aren't always known or valued by younger generations. Xixia porcelain dates back to the Xixia civilization, which flourished in Northwest China between the 11th and 13th centuries. Unlike the delicate, intricately decorated porcelain often linked with Chinese ceramics, Xixia porcelain has a more rugged look, with contrasting colors and textures that give each piece a raw, handmade feel. The Xixia porcelain-making craft was added to Ningxia's list of representative regional intangible cultural heritage projects in 2019. Yang An, a fifth-generation inheritor of the craft and owner of the studio, believes the key to keeping the craft alive is to bring it closer to contemporary life. \"Xixia porcelain uses a coarse clay body, and patterns are carved directly into the surface with a knife, without preliminary sketches,\" said Yang, 39. \"That relaxed, unrestrained quality resonates with the lifestyle many young people embrace today.\" As desert tourism took off in Zhongwei, bringing more visitors to the city, Yang saw an opportunity to connect the old craft with a new audience. In 2021, he opened the studio in a tourist area between the Yellow River and the desert, offering visitors the chance to experience every aspect of the craft, from throwing and carving to firing. A teenage tourist from Beijing, who discovered the studio while staying at a nearby homestay, spent two half-days making a traditional flat flask. \"I'd like to take home what I've learned about Xixia porcelain and show my friends the piece I made,\" she said. For Yang, experience is only one way to bring the craft into modern life. He has also developed everyday products such as coffee drippers, tableware and refrigerator magnets — small, affordable items that visitors can easily take home as souvenirs. \"Today, Xixia porcelain is often made mainly for decoration or collection, but I want to develop products that people can use in their everyday lives,\" he said. Yang has established sales partnerships with more than 40 shops across Ningxia and uses social media to document the production process and promote new designs. Interest in Xixia porcelain has also grown since the Xixia Imperial Tombs were inscribed on the UNESCO World Heritage List in 2025. Chang said many tourists now learn about the craft online before visiting specifically to try making it themselves. Her summer job has also changed her own plans. \"I'm now considering pursuing a career related to Xixia porcelain,\" she said. Across Ningxia, other local traditional crafts are undergoing similar changes. Straw weaving, once largely associated with bulky farm implements, has been adapted into small storage baskets and decorative ornaments, while paper-cutting artists are turning traditional designs into creative products such as bookmarks and bag charms. That reflects a wider market for intangible cultural heritage across China. Between 2021 and 2025, more than 12,900 intangible cultural heritage workshops were established nationwide, as hands-on heritage experiences emerged as a new draw for travelers seeking closer engagement with local traditions. An industry report said transactions involving intangible cultural heritage handicrafts on leading e-commerce platform Tmall had exceeded 100 billion yuan ($14.8 billion) in 2025. Xixia porcelain is reaching beyond China, with Yang's team showcasing the craft at overseas exhibitions and exploring opportunities in international markets. At the same time, more young people born in the 2000s are joining the team, bringing fresh ideas to the craft. \"Traditional crafts have to be practiced, not just displayed,\" Yang said. \"People need to know them, like them and pass them on.\""},
  {"rank": 7, "topic": "A Tibetan cooperative keeps a centuries-old weaving tradition alive", "cn": "西藏合作社传承千年织造技艺", "heat": 82, "srcs": 12, "source": "AP News", "date": "2026-08-09", "url": "https://apnews.com/article/china-tibet-weaving-pulu-woolen-fabric-b6caa4a220db4b9699e9427bf95a1aa5", "summary": "SHANNAN, Tibet (AP) — More than a dozen men and women sit at wooden looms, sliding shuttles through rows of wool yarn before pulling each thread tight. They repeat it again and again as they weave Pulu, the traditional woolen fabric that has clothed people on ", "fulltext": "SHANNAN, Tibet (AP) — More than a dozen men and women sit at wooden looms, sliding shuttles through rows of wool yarn before pulling each thread tight. They repeat it again and again as they weave Pulu, the traditional woolen fabric that has clothed people on the Tibetan plateau for centuries. They work at the Ethnic Huaji Handwoven Cooperative in Shannan, where artisans are trying to preserve one of Tibet’s oldest weaving traditions while creating jobs for local residents. Founded in 2008 by Tibetan artisan Pasang, the cooperative employs more than 100 local residents, including some people with disabilities, while teaching younger Tibetans a craft that he feared was disappearing. Add AP News on Google Add AP News as your preferred source to see more of our stories on Google. Share The cooperative specializes in Zeter, a finer variety of Pulu made from especially soft wool from the necks and backs of sheep. He said the finer wool makes the yarn more difficult to spin than that used for ordinary Pulu. Pasang said that because Zeter is lighter, softer and more delicate than ordinary Pulu, it was presented as a tribute from Tibet to the Chinese imperial court during the Ming dynasty. Pasang said he learned the craft from his parents at a time when fewer than 10 people still knew how to weave Zeter. He added that the craft has been recognized as part of China’s national intangible cultural heritage, and that he hopes younger generations will continue practicing it. Add AP News on Google Add AP News as your preferred source to see more of our stories on Google. Share The wool comes from sheep raised around Shannan, about 3,700 meters (12,100 feet) above sea level. Statues of Tibet’s 7th century King Songtsen Gampo and his Chinese bride, Princess Wencheng, stand at the center of the workshop, surrounded by wooden looms. According to local tradition, the weaving craft dates to when Princess Wencheng introduced weaving techniques to Tibet after marrying the king. In Chinese official history, their marriage symbolizes the historical ties between Tibet and China. “It integrated Tibetan and Chinese cultures,” Pasang said about the fabric’s history. The Associated Press joined a government-organized trip to Lhasa and Shannan last month, which included visits to the cooperative, palaces, Buddhist temples, tourist sites, an eldercare center and local businesses. Next to the workshop, a small showroom displays scarves, shawls, jackets, bags and other products made from Pulu and Zeter. Pasang said most sales are in Tibet, although customers also come from elsewhere in China. **Sign up for Morning Wire:** Our flagship newsletter breaks down the biggest headlines of the day. - [x] By checking this box, you agree to AP's Terms of Use and acknowledge that AP may collect and use your data pursuant to our Privacy Policy. Add AP News on Google Add AP News as your preferred source to see more of our stories on Google. Share Add AP News on Google Add AP News as your preferred source to see more of our stories on Google. Share Tsering Yangchen has been working for seven years in the cooperative. The 80-year-old woman moved from another county and said she struggled to find work before joining the workshop, where instructors taught her and others how to weave. She said Pulu is more than just a product she weaves. “We usually wear them,” she added. “They are made from pure wool.”"},
  {"rank": 8, "topic": "Yuxian, a living legacy of ancient architecture and paper-cutting", "cn": "蔚县：古建与剪纸的活态遗产", "heat": 80, "srcs": 11, "source": "CGTN", "date": "2026-08-14", "url": "https://news.cgtn.com/news/2026-08-14/Yuxian-a-living-legacy-of-ancient-architecture-and-paper-cutting-1PBfwEGwtQk/p.html", "summary": "Yuxian County in Zhangjiakou, north China's Hebei Province is home to numerous national-level cultural heritage sites. The Yuhuang Pavilion, constructed in the Ming Dynasty (1368-1644), once served as a frontier defense structure and later served as an archite", "fulltext": "Yuxian County in Zhangjiakou, north China's Hebei Province is home to numerous national-level cultural heritage sites. The Yuhuang Pavilion, constructed in the Ming Dynasty (1368-1644), once served as a frontier defense structure and later served as an architectural reference for the hit game _Black Myth: Wukong_. Meanwhile, Yuxian paper-cutting, which originated as window decorations for rural homes, has evolved for over a century into a distinctive form of cultural expression that has reached audiences around the world. CGTN host Julian Waghann and Mexican traveler Juan Carlos Cheang Guzman toured Yuxian, discovering the stories behind its ancient architecture and learning the art of paper-cutting. As local craftspeople and communities keep these traditions alive, Yuxian shows how ancient culture can continue to evolve, connect with new generations and reach the world in new ways."},
  {"rank": 9, "topic": "Ancient crafts find new vitality", "cn": "古老技艺焕发新生", "heat": 78, "srcs": 10, "source": "People's Daily", "date": "2026-08-25", "url": "http://en.people.cn/n3/2026/0825/c90000-20492131.html", "summary": "In Shuanghe village, Silong town, Baiyin district of Baiyin city, northwest China's Gansu Province, 52-year-old Liu Kekun grew up to the sound of Yellow River battle drums. \"I learned to play the drums from my uncle when I was young. The adults in the village ", "fulltext": "In Shuanghe village, Silong town, Baiyin district of Baiyin city, northwest China's Gansu Province, 52-year-old Liu Kekun grew up to the sound of Yellow River battle drums. \"I learned to play the drums from my uncle when I was young. The adults in the village would get together and play whenever they had free time. I practically grew up surrounded by the sound of drums,\" Liu Kekun said. The drum scores were never written down, with the rhythms passed down entirely by word of mouth and hands-on instruction. _Liu Kekun and his drum troupe perform Yellow River battle drums during the 7th Yellow River Culture and Tourism Festival in Baiyin city, northwest China's Gansu Province. (People's Daily Online/Mi Yuan)_ In 2025, Liu Kekun was named a municipal-level representative inheritor of the Yellow River battle drums, a provincial-level intangible cultural heritage (ICH) item. His uncle, Liu Nianzu, is a provincial-level representative inheritor, and the two often perform together with their drum troupe. As the sound of the drums reaches more people, Liu Kekun has been thinking about how to help children learn, understand and appreciate the tradition so that the craft can be passed down to future generations. Through an initiative to promote ICH in schools, Yellow River battle drums have been introduced into classrooms at several schools. Liu Kekun and Liu Nianzu teach the students how to play the drums, first explaining the tradition's history before demonstrating various drumming techniques. In Qiangwan township, Baiyin district, another form of heritage is preserved in the heat of brick kilns. Forty-two-year-old Qiang Anxing is an inheritor of the traditional craft of firing gray bricks. His grandfather made a living producing gray bricks, while his father, Qiang Shengwei, later expanded the family craft to include brick carvings and clay sculptures for traditional-style architecture. In the 1990s, their products were being sold across the five provinces of northwest China (Shaanxi, Gansu, Ningxia, Qinghai, and Xinjiang). In 2004, Qiang Anxing started a blog, posting photos of the gray brick production process online. \"I wanted to start an online business, but I didn't know what to do. Since I had watched my father fire and carve bricks ever since I was a child, I decided to write about it,\" he said. To his surprise, the posts eventually brought in an order. _Photo shows finished gray bricks and exquisite brick carvings. (People's Daily Online/Mi Yuan)_ After samples from several brick factories were compared, their products had the highest qualification rate, and the factory won the order, ultimately supplying about 100,000 bricks. In 2024, the craftsmanship of making gray bricks and tiles was included in the fifth batch of provincial-level ICH items in Gansu. To make the traditional craft more accessible, Qiang Anxing has developed more than 30 creative cultural products, including absorbent tea trays and carved bricks. At a copper art workshop in Baiyin district, Ma Yinlan bends over to arrange a row of copper artworks. Her father, Ma Xianzhong, was among the first group of workers who came to support Baiyin's development. The older generation of craftsmen helped build the city while passing down the craft of copper forging. Ma Yinlan later passed the craft on to her daughter, Ma Yanping. Ma Yinlan founded the copper art workshop in 1997. The business struggled in its early years. It was not until she received an order for a batch of decorative handicrafts that she began to see a way forward. _Photo shows exquisite copper artworks. (People's Daily Online/Mi Yuan)_ After taking over the business, Ma Yanping began using copper as a medium to tell stories rooted in local culture. Drawing inspiration from Dunhuang murals and traditional bronzeware, she refined traditional patterns and color schemes, combining them with copper forging techniques to create distinctive works with a rich texture. In 2024, Baiyin copper forging techniques were included in the fifth batch of provincial-level ICH items in Gansu."},
  {"rank": 10, "topic": "Jingdezhen handmade porcelain heritage exhibition opens in Beijing", "cn": "景德镇手工瓷业非遗展在京开幕", "heat": 76, "srcs": 9, "source": "China Daily", "date": "2026-08-07", "url": "https://www.chinadaily.com.cn/a/202608/07/WS6a754a77a310986e2b4698ea.html", "summary": "An exhibition titled \"Why Jingdezhen: The World Heritage Value and Contemporary Inheritance of Jingdezhen's Handmade Porcelain Industry Heritage\" opened in Beijing on August 1. Co-hosted by the China National Arts and Crafts Museum (China Intangible Cultural H", "fulltext": "An exhibition titled \"Why Jingdezhen: The World Heritage Value and Contemporary Inheritance of Jingdezhen's Handmade Porcelain Industry Heritage\" opened in Beijing on August 1. Co-hosted by the China National Arts and Crafts Museum (China Intangible Cultural Heritage Museum), the Department of Culture and Tourism of Jiangxi Province, and the Jingdezhen Municipal People's Government, the exhibition runs through August 31. Structured around the UNESCO framework of Outstanding Universal Value, the exhibition traces the historical continuity, technological innovation, cross-cultural exchange, and contemporary legacy of the handmade porcelain industry. It is organized into four thematic sections: \"A Millennium of Kilns\", \"Technical Excellence\", \"Exchanges and Mutual Learning\", and \"City-Porcelain Symbiosis\". Notable exhibits include a Ming-dynasty doucai celestial-vase jar with melon-vine and dragon pattern (marked with the character tian), a Qing-dynasty green-ground pastel double-handled vase with intertwined lotus and dragon motifs, the ceramic sculpture \"Dancing Peacock\", a thin-walled bowl with lotus-leaf rim and butterfly-and-hundred-flower pattern, as well as a fine piece from the museum's own collection — the high-temperature color-changed powder-enamel porcelain vase \"Journey to Chang'an\" painted with ink-wash style."},
  {"rank": 11, "topic": "Mogao Grottoes embrace AI to preserve, share millennia-old heritage", "cn": "莫高窟拥抱 AI 守护千年遗产", "heat": 74, "srcs": 8, "source": "Xinhua", "date": "2026-08-25", "url": "https://english.news.cn/20260825/9357de7cbc73495a993d1f5ce7740d31/c.html", "summary": "LANZHOU, Aug. 25 (Xinhua) -- With a single tap on a smartphone screen, celestial maidens holding lotuses, painted 1,400 years ago, spring to life and glide toward viewers from the ancient murals. At the millennia-old Mogao Grottoes in Dunhuang, northwest China", "fulltext": "LANZHOU, Aug. 25 (Xinhua) -- With a single tap on a smartphone screen, celestial maidens holding lotuses, painted 1,400 years ago, spring to life and glide toward viewers from the ancient murals. At the millennia-old Mogao Grottoes in Dunhuang, northwest China's Gansu Province, cutting-edge digital immersion is doing more than offering global audiences an unprecedented journey back in time. It is also helping ensure these fragile Silk Road masterpieces survive for generations to come. Carved into desert cliffs from 366 AD onward, the Mogao Grottoes comprise 735 caves, including 492 sanctuaries featuring Buddhist murals and painted sculptures. Inscribed as a UNESCO World Heritage site in 1987, the site is recognized as the world's largest, longest continuously constructed, and most richly endowed Buddhist art repository. Today, local conservators are employing artificial intelligence (AI) and advanced digital tools not only to preserve these delicate relics but also to transform how the world experiences them. Through the \"Discover Dunhuang\" VR exhibition, visitors can enter a high-fidelity 3D reconstruction of Cave 285, where they can view ancient murals up close, explore the space in 360 degrees, and even soar above the ceiling to appreciate the early classic grotto renowned for its Sino-Western fusion and iconic flying apsaras. Lei Zhengguang, a cultural official at the Dunhuang Academy, said the team achieved a 1:1 high-definition restoration of the caves through digital scanning and 3D reconstruction. Combined with interactive design, the project has greatly enriched the visitor experience. Behind the scenes, digitalization is quietly revolutionizing heritage conservation. In Cave 44, where complex wall curvatures pose significant challenges, teams now use automated rail systems to capture images. Ding Xiaosheng, a senior researcher in digital preservation at the Dunhuang Academy, noted that specialized software for error-free stitching of billion-pixel images and multi-source 3D reconstruction has greatly improved processing efficiency and quality. More notably, AI models trained on tens of thousands of high-resolution images are achieving \"pixel-level\" disease detection. Wang Wanfu, an official at the Academy, said AI can identify early-stage damage thinner than a human hair. Through spectral analysis, the system can even give early warnings for tiny hollows in the plaster base that are completely invisible to the naked eye. The digital renaissance is now bringing Dunhuang to the world through the \"Digital Library Cave\" platform, launched globally by the Dunhuang Academy in 2025. To date, the platform has released digital resources of 11,090 manuscripts and artifacts, along with 72,810 images, attracting more than 250,000 visits from 33 countries and regions. Dunhuang's pioneering efforts reflect a broader national push in China to safeguard cultural heritage through technology. China has updated its heritage law to encourage digital collection and utilization, while top-level guidelines and comprehensive technical standards further steer digital preservation efforts. Across the country, institutions are racing to leverage digitalization to strengthen heritage conservation. The Palace Museum has assigned \"digital IDs\" to over one million artifacts, offering free public access to 150,000 items via its digital relic library. Meanwhile, the National Museum of China has completed 2D imaging for 720,000 relics and 3D modeling for over 7,700, achieving replication-grade precision. \"Next, we will deepen the integration of Dunhuang studies and digital intelligence, build a digital-intelligence research platform for Dunhuangology, and ensure that cultural relics 'remain forever young,'\" said Yu Tianxiu, vice president of the Dunhuang Academy.■"},
  {"rank": 12, "topic": "Huangmei Opera shines in Edinburgh with tale of courage and identity", "cn": "黄梅戏在爱丁堡闪耀 演绎勇气与认同", "heat": 72, "srcs": 7, "source": "China Daily", "date": "2026-08-20", "url": "https://global.chinadaily.com.cn/a/202608/20/WS6a864908a3106bc57421c719.html", "summary": "EDINBURGH — Minutes before going on stage in Edinburgh, Han Zaifen sat before a dressing-room mirror, humming softly to herself as the final touches were put on her makeup. Beneath a black embroidered scholar's cap was the face of Feng Suzhen, a young woman wh", "fulltext": "EDINBURGH — Minutes before going on stage in Edinburgh, Han Zaifen sat before a dressing-room mirror, humming softly to herself as the final touches were put on her makeup. Beneath a black embroidered scholar's cap was the face of Feng Suzhen, a young woman whom Han has portrayed for more than four decades. Soon afterward, Han, a winner of the Plum Blossom Award, the highest award for Chinese theatrical art, stepped onto the stage at Queen's Hall in a bright red robe, bringing one of China's best-known traditional opera heroines to an Edinburgh audience. On the evening of Aug 12, the Anhui Zaifen Huangmei Xiqu Art Theatre, led by its director Han, performed _The Lady Prince Consort_ at the Edinburgh Festival Fringe, marking the first appearance of Huangmei _xiqu_, or Huangmei Opera, at the event. \"If Huangmei _xiqu_ were an Eastern woman, she would be lively and quick-witted, pure and down-to-earth,\" Han said before the performance. Unlike the stately elegance often associated with Kunqu Opera, she said, Huangmei _xiqu_ has a particular warmth and innocence, as well as a mixture of softness and strength. \"Its melodies come from people's lives and their sense of happiness,\" she says. Huangmei _xiqu_ is a major form of traditional Chinese opera, known for its tuneful singing and lively storytelling. Now, Anqing, a city in East China's Anhui province, serves as an important center for its performance and development. _The Lady Prince Consort_ tells the story of Feng Suzhen, who disguises herself as a man and enters the imperial examination to save the man she loves. She unexpectedly finishes first and is chosen by the emperor as husband for his daughter, setting off a series of twists before her true identity is revealed. The work was adapted from the traditional play _Double Rescue_ and was first staged in 1958. A film version followed in 1959, helping to turn the story into one of the most familiar works in Huangmei _xiqu_. Feng's disguise mirrors other well-known women in Chinese storytelling, including Hua Mulan, the legendary female warrior who disguises herself as a man, and Zhu Yingtai of The _Butterfly Lovers_. But Han sees something distinctive in Feng. \"She does not spend her time anxiously searching for an identity,\" Han says. \"Through what she does, she keeps redefining who she is. She takes charge of her own fate.\" Saving her husband is the direct reason for Feng's adventure, but the journey also reveals her confidence in her ability and worth, Han says. Han adds that young women today no longer need to disguise themselves as men to pursue their ambitions, but the courage behind Feng's choice remains relevant. \"Whether you are a young woman or a young man, you need the courage not to retreat when you face difficulty and to fight for the life you want,\" she says. That message resonated with Monika Owczarek, a Polish resident of Edinburgh, who says she often watches Chinese opera during the Fringe. She says she enjoys the melodies of Huangmei _xiqu_, while Feng's story reminds her of Mulan. \"Both women disguise themselves as men and emerge as strong female protagonists who refuse to accept the limits placed on them,\" she says. American audience member Joe Goldblatt described it as the best Chinese opera performance he had seen, adding that he hopes \"more productions like it could help bring people from different countries closer together\". Han says the theater made no deliberate attempt to speed up the performance or simplify its style for a Western audience. The troupe has previously taken Huangmei _xiqu_ to countries including France, the United States, Canada, and Russia. \"Good cultural exchange does not mean changing yourself just so you can be understood,\" Han says. \"For any art form, there is something that cannot be translated because it comes from the culture itself,\" she says. \"It is a people's temperament, even a people's way of breathing.\" Han's Edinburgh visit also brought recognition away from the stage. Earlier this week, she received the 2026 Asian Art Ambassador honor at the Asian Art Awards, organized by Asian Art Fund Scotland, a Scottish charity supporting Asian arts. \"Seeing overseas audiences laugh along with the story was deeply moving,\" says Wu Meilian, a Plum Blossom Award-winning actress who also played Feng Suzhen in the first half of the show. \"We did not share a language, but the humor and emotions still connected us. It made me feel that Huangmei _xiqu_ can touch audiences anywhere.\""},
  {"rank": 13, "topic": "China launches Shenzhou-23 spaceship, for new in-orbit stay record, cutting-edge space science", "cn": "神舟二十三号发射 挑战在轨新纪录与前沿空间科学", "heat": 72, "srcs": 9, "source": "Xinhua", "date": "2026-05-25", "url": "https://english.news.cn/20260525/e71e193dd1d14e1193edc9173f3f0477/c.html", "summary": "JIUQUAN, May 24 (Xinhua) -- China on Sunday successfully launched the Shenzhou-23 crewed spaceship, which will send three astronauts to its orbiting Tiangong space station for new tests on long-duration stay and frontier scientific experiments. The spaceship, ", "fulltext": "JIUQUAN, May 24 (Xinhua) -- China on Sunday successfully launched the Shenzhou-23 crewed spaceship, which will send three astronauts to its orbiting Tiangong space station for new tests on long-duration stay and frontier scientific experiments. The spaceship, atop a Long March-2F carrier rocket, blasted off at 11:08 p.m. (Beijing Time) from the Jiuquan Satellite Launch Center in northwest China, according to the China Manned Space Agency (CMSA). About 10 minutes after the launch, the spaceship separated from the rocket and entered its designated orbit, the CMSA said, adding that the astronauts are in good condition. The CMSA announced that the launch of the Shenzhou-23 crewed spaceship was \"a complete success.\" The spaceship will then perform a fast, automated rendezvous and docking with the space station complex, and the Shenzhou-23 crew will conduct an in-orbit handover with the Shenzhou-21 crew aboard Tiangong. The Tiangong space station has entered the docking orbit, with good working conditions for docking and astronaut entry, the CMSA said. So far, China has sent 30 astronauts into space. Sunday's mission marks the 644th flight of the Long March carrier rocket series. The Shenzhou-23 crew consists of mission commander Zhu Yangzhu, Zhang Zhiyuan, and Li Jiaying (Lai Ka-ying in Cantonese). The three astronauts are, respectively, a flight engineer, a spacecraft pilot, and a payload specialist. Zhu once participated in the Shenzhou-16 space mission. Zhang and Li come from the third and fourth batches of astronauts, respectively, and this is their first spaceflight mission. Before being selected, Zhang was an air force pilot while Li worked in the Hong Kong Police Force. Li has made history as the first astronaut from China's Hong Kong Special Administrative Region to travel to space. She is also the country's fourth female astronaut to reach space, following Liu Yang, Wang Yaping and Wang Haoze. Lin Xinying, a student from Pui Kiu Middle School in Hong Kong who watched the send-off ceremony and launch on site, said that in the past, her understanding of aerospace technology had been limited to what she saw in science fiction movies. \"However, the opportunity to witness the launch of Shenzhou-23 has provided me with a valuable chance to truly learn about our country's space program,\" she said. Another student, Lee Cheuk Hei Trevis, said that the event serves as tremendous encouragement to both Hong Kong society and its young people. \"Being able to witness history in person has ignited my imagination about space exploration.\" The Shenzhou-23 crewed spaceship, atop a Long March-2F carrier rocket, blasts off from the Jiuquan Satellite Launch Center in northwest China, May 24, 2026. China launched the Shenzhou-23 crewed spaceship on Sunday, which will send three astronauts to its orbiting Tiangong space station. (Xinhua/Lian Zhen) The astronauts from the Shenzhou-23 crew are set to carry out a one-year in-orbit stay experiment, according to CMSA spokesperson Zhang Jingbo. According to Zhang, the longest single mission duration by a Chinese astronaut crew so far will be held by the Shenzhou-21 crew, now awaiting rotation. They have already spent 204 days in orbit by Sunday. \"Assigning an astronaut to a one-year in-orbit stay is not simply doubling the duration of two six-month missions,\" Zhang said. The mission places significantly higher demands on the astronauts' physical and mental well-being, among other aspects, according to Bian Qiang, an expert at the Astronaut Center of China. \"To meet these challenges, we have reinforced the astronauts' physical fitness and reserves of various physiological functions, while intensifying training in psychological resilience and crew compatibility,\" Bian said. During the year-long residency, China will implement its first space-based human-body research program to collect crucial data on astronauts exposed to long-duration spaceflight, Zhang noted. The extended mission will explore human adaptability and performance limits, aiming to establish a multi-system, multi-omics atlas of the human body in space. The mission will also test health support capabilities for astronauts on long-duration missions and upgrade in-orbit medical and protective systems, Zhang said. It will also provide opportunities for long-term continuous research on scientific projects and related technology verification. The Shenzhou-23 crewed spaceship, atop a Long March-2F carrier rocket, blasts off from the Jiuquan Satellite Launch Center in northwest China, May 24, 2026. China launched the Shenzhou-23 crewed spaceship on Sunday, which will send three astronauts to its orbiting Tiangong space station. (Xinhua/Cai Yang) The Shenzhou-23 crew will conduct more than 100 new science and application projects, focusing on frontier fields such as space life science, materials science, microgravity fluid physics, aerospace medicine, and new space technologies, Zhang of CMSA said. In the field of space life sciences, the mission will use zebrafish and mouse embryos, as well as stem cell-derived \"artificial embryos,\" to establish a space embryonic research system spanning lower vertebrates to higher mammals, he said. Rice seeds that have never been sent in space will be cultivated aboard the space station to produce offspring in orbit, said Cang Huaixing, a researcher at the Technology and Engineering Center for Space Utilization under the Chinese Academy of Sciences. \"For the first time, two consecutive generations of rice will be grown in orbit, aiming to clarify how long-term space microgravity affects the genetic stability of rice,\" Cang said. Experiments will also be conducted to examine how biological phase separation influences lipid metabolism under microgravity conditions, seeking to understand the molecular mechanisms by which microgravity affects hepatocyte lipid metabolism. This could offer potential targets for early intervention and prevention of related fatty liver diseases during long-duration space missions. Meanwhile, three types of experimental samples -- nanozymes, actinomycetes, and plant seeds -- will be installed on an extravehicular exposure device for a five-month in-orbit radiation biology experiment, Cang said. \"These samples will be used to study life-origin catalysts, microbial adaptive evolution, and higher plant genetic variations, systematically revealing the deep-layer effects of space radiation on biological samples,\" he said. In space material science, their research will focus on producing advanced materials, including high-performance rare-earth permanent magnets and lightweight high-entropy alloys, and studying how to regulate their performance, according to Zhang. Dynamic in-orbit experiments on perovskite solar cells will be conducted for the first time aboard China's space station to obtain data on conversion-efficiency degradation under real-world extreme space conditions, Cang said. These experiments will help investigate the evolution of performance and failure mechanisms of perovskite materials and devices under extreme environments. The research will provide key technological reserves for future low-orbit satellites, deep-space exploration, lunar bases, and energy systems for in situ space manufacturing, Cang said. The crew will also conduct extravehicular activities (EVAs), handle cargo transfers, and install and retrieve external facilities. Aside from operational tasks, they will also engage in science education. ■ (Video reporters: Li Guoli, Yu Jia, Yang Zhigang, Wang Hongliu, Ruan Shuai, Jiang Sai, Xie Wentao, Peng Yuan, Da Rihan; video editors: Hong Ling, Liang Wanshan, Zhao Xiaoqing, Shi Peng)"},
  {"rank": 14, "topic": "Program puts China's culinary culture on a global trajectory", "cn": "中国烹饪文化走向全球", "heat": 68, "srcs": 5, "source": "China Daily", "date": "2026-04-11", "url": "https://www.chinadaily.com.cn/a/202604/11/WS69d9ece9a310d6866eb42ddf.html", "summary": "A five-day international culinary exchange program, Flavors of the Silk Road, was recently held in the capital, bringing together leading chefs, food writers and industry figures from around the world. Through immersive visits, hands-on workshops and high-leve", "fulltext": "A five-day international culinary exchange program, Flavors of the Silk Road, was recently held in the capital, bringing together leading chefs, food writers and industry figures from around the world. Through immersive visits, hands-on workshops and high-level discussions, the event created a meaningful dialogue between Eastern and Western culinary traditions, offering new perspectives on the global future of Chinese cuisine. Liu Yaning, director of the Gastronomic Culture Committee of the China Tourism Association, says Chinese cuisine is entering a new phase — shifting from technical confidence to cultural consciousness. \"With advancements in supply chains, professional training, culinary heritage preservation, and innovation, the industry now possesses the structural maturity needed for global expression,\" he says. Participants explored key elements of Chinese culinary heritage throughout the program. Visits to Jinxing duck farm and Da Dong's roast duck workshop offered insights into the craftsmanship behind Beijing's iconic dish."},
  {"rank": 15, "topic": "Running at 350 km/h: How intelligent systems keep high-speed rail safe, precise and smooth", "cn": "时速350公里：智能系统守护高铁安全精准运行", "heat": 66, "srcs": 4, "source": "CGTN", "date": "2026-06-23", "url": "https://news.cgtn.com/news/2026-06-23/How-intelligent-systems-keep-high-speed-rail-safe-precise-and-smooth-1OcYVMNTapO/p.html", "summary": "On December 30, 2019, the Beijing-Zhangjiakou high-speed railway officially began operation, becoming the world's first intelligent high-speed railway running at 350 km/h with driver-attended automated driving. In parallel, intelligent driving in road transpor", "fulltext": "On December 30, 2019, the Beijing-Zhangjiakou high-speed railway officially began operation, becoming the world's first intelligent high-speed railway running at 350 km/h with driver-attended automated driving. In parallel, intelligent driving in road transportation is also accelerating rapidly in China. According to Wang Shuiyin, vice president of the Research Institute of Highway under the Ministry of Transport, the country's penetration rate of intelligent driving passenger vehicles has exceeded 68%, and the total length of open testing roads for autonomous driving has surpassed 28,000 kilometers. A Beijing-Zhangjiakou high-speed train passes through the Juyongguan section of the Great Wall, January 7, 2022. /VCG A Beijing-Zhangjiakou high-speed train passes through the Juyongguan section of the Great Wall, January 7, 2022. /VCG However, despite both belonging to intelligent driving, rail and road systems differ fundamentally in complexity and operating environments. \"The gap between automotive and rail automation is significant,\" Wang Xiaoliang, vice president and chief engineer of Beijing Hollysys Co., Ltd. under the Hollysys Group, told CGTN. \"One of the core challenges is precise stopping,\" Wang said. \"Due to environmental variations, parameter deviations and massive real-time data transmission requirement, achieving this in high-speed rail is extremely difficult.\" A Fuxing Electric Multiple Unit (EMU) runs along the Beijing-Shanghai high-speed railway, Changzhou, Jiangsu Province, January 15, 2025. /VCG A Fuxing Electric Multiple Unit (EMU) runs along the Beijing-Shanghai high-speed railway, Changzhou, Jiangsu Province, January 15, 2025. /VCG Unlike road vehicles, high-speed trains operate under tightly controlled conditions at extreme speeds, where even minor deviations can have amplified consequences. Wang explained that the Beijing-Zhangjiakou high-speed railway is equipped with the Chinese Train Control System Level 3 (CTCS-3), along with three Radio Block Centers (RBCs) and multiple Automatic Train Protection (ATP) systems provided by Hollysys, enabling precise and safe operation. RBC and ATP are core safety equipment of high-speed rail train control system, which continuously communicate with onboard and offboard equipment, enabling real-time information exchange between train and ground. They function like a \"central nervous system\" for safe and coordinated train operation. **Ensuring both punctuality and safety** Foreign representatives attending the 12th World Congress on High-Speed Rail travel on the Beijing–Zhangjiakou high-speed railway from Beijing North Railway Station to Taizicheng, a venue for the Beijing 2022 Winter Olympics, July 11, 2025. /VCG Foreign representatives attending the 12th World Congress on High-Speed Rail travel on the Beijing–Zhangjiakou high-speed railway from Beijing North Railway Station to Taizicheng, a venue for the Beijing 2022 Winter Olympics, July 11, 2025. /VCG \"Behind the punctuality of high-speed rail is truly the train control system,\" He Chunming, vice president of Hollysys Group, told CGTN. The system consists of both onboard and ground-based equipment, responsible for managing train spacing and speed. As train speeds increase, manual control by drivers becomes increasingly difficult. \"Braking distance is directly related to speed,\" said He. \"When a high-speed train is running at 350 km/h, the braking distance needs to be about 20 kilometers.\" To ensure safety, the system must continuously calculate safe operating speeds based on information far ahead of the train. \"To determine a safe speed, we need to obtain all data within about 20 kilometers ahead. Now, data from up to 32 kilometers ahead is already available.\" said He. \"Only with this level of information can the system calculate safe speed for each segment.\" Speed control is not only about distance. Conditions such as gradients, curves, and switches will all have an impact. \"For example, an uphill or downhill slope will have significantly different effects on deceleration,\" said He, \"and if a train enters a curve or switch at excessive speed, it could derail. \"Therefore, all information within 20 or 30 kilometers ahead must be integrated to generate a unified safe speed.\" High-speed rail systems are built on very strict safety principles. He noted that if communication is interrupted, the train must stop. \"Because once we cannot confirm whether the information is up to date or accurate, we must follow the fail-safe principle.\" In railway signaling design, any fault must lead to a safe outcome – the fail-safe principle. If communication is lost beyond certain duration, the system discards all data and triggers an emergency brake. Although highly automated, high-speed rail does not eliminate human oversight. \"The automated driving system reduces the driver's workload, and about 90% of operations can be automated, but some key points still require human confirmation,\" said He. Developing such systems is a long process. A railway control system takes 5 to 8 years from development to deployment. **More comfort through intelligent speed control** High-speed EMU trains at Wuhan Railway Station, February 2, 2026. /VCG High-speed EMU trains at Wuhan Railway Station, February 2, 2026. /VCG Human driving can be inconsistent, and frequent acceleration and braking reduce comfort and efficiency. Intelligent systems incorporate experienced drivers' strategies into their control algorithms, automatically generating optimal speed curves that balance punctuality, comfort and energy efficiency, enabling the train to run more smoothly and efficiently. In the future, travel could be more seamless with the advancement of \"four-network integration,\" referring to the deep integration of mainline railways, intercity railways, suburban railways and urban rail transit systems. In this framework, rail services would function as a unified mobility network rather than separate systems. Different control systems developed by Hollysys Group. /CGTN Different control systems developed by Hollysys Group. /CGTN He noted that this technology is still under development. As a global provider of rail transit control systems and services, Hollysys Group has deployed train control systems on more than 80 main railway lines across China, covering over 16,000 kilometers in total. It is leveraging its accumulated technological strengths to turn this vision into reality."},
  {"rank": 16, "topic": "China's Fuzhou blends tea culture with tourism to boost consumption", "cn": "福州融合茶文化与旅游促消费", "heat": 64, "srcs": 4, "source": "Xinhua", "date": "2026-08-18", "url": "https://english.news.cn/20260818/678300d993af479497ea4b34b53feba0/c.html", "summary": "Jasmine tea is tea scented with the aroma of jasmine blossoms and typically has green tea as its base. The Jasmine tea scenting techniques of Fuzhou have been enlisted as a state-level intangible cultural heritage in China. In recent years, businesses in Fuzho", "fulltext": "Jasmine tea is tea scented with the aroma of jasmine blossoms and typically has green tea as its base. The Jasmine tea scenting techniques of Fuzhou have been enlisted as a state-level intangible cultural heritage in China. In recent years, businesses in Fuzhou have built on the traditional tea culture while developing innovative jasmine tea inspired product categories such as beverages, desserts and daily-use items. Meanwhile, the city has rolled out measures to promote jasmine tea brands and the integration of tea culture and tourism, aiming to stimulate cultural and tourism consumption. (Xinhua/Du Xiaoyi) Children taste jasmine tea at the Shangxiahang historical and cultural block in Fuzhou, southeast China's Fujian Province, Aug. 17, 2026. Jasmine tea is tea scented with the aroma of jasmine blossoms and typically has green tea as its base. The Jasmine tea scenting techniques of Fuzhou have been enlisted as a state-level intangible cultural heritage in China. In recent years, businesses in Fuzhou have built on the traditional tea culture while developing innovative jasmine tea inspired product categories such as beverages, desserts and daily-use items. Meanwhile, the city has rolled out measures to promote jasmine tea brands and the integration of tea culture and tourism, aiming to stimulate cultural and tourism consumption. (Xinhua/Du Xiaoyi) Tourists walk out of a store after buying jasmine tea-flavored gelato at the e while developing innovative jasmine tea inspired product categories such as beverages, desserts and daily-use items. Meanwhile, the city has rolled out measures to promote jasmine tea brands and the integration of tea culture and tourism, aiming to stimulate cultural and tourism consumption. (Xinhua/Du Xiaoyi) A child experiences jasmine tea scenting under the guidance of an artisan at the Shangxiahang historical and cultural block in Fuzhou, southeast China's Fujian Province, Aug. 17, 2026. Jasmine tea is tea scented with the aroma of jasmine blossoms and typically has green tea as its base. The Jasmine tea scenting techniques of Fuzhou have been enlisted as a state-level intangible cultural heritage in China. In recent years, businesses in Fuzhou have built on the traditional tea culture while developing innovative jasmine tea inspired product categories such as beverages, desserts and daily-use items. Meanwhile, the city has rolled out measures to promote jasmine tea brands and the integration of tea culture and tourism, aiming to stimulate cultural and tourism consumption. (Xinhua/Du Xiaoyi)"},
  {"rank": 17, "topic": "How traditional Chinese medicine is winning global hearts", "cn": "中医药如何赢得全球青睐", "heat": 62, "srcs": 6, "source": "Xinhua", "date": "2026-01-16", "url": "https://english.news.cn/20260116/57d232c6c6b145c5947077b96e050788/c.html", "summary": "BEIJING, Jan. 16 (Xinhua) -- In the heart of Germany, a traditional Chinese herbal product has secured a lasting place on the shelves of the renowned Bahnhof-Apotheke pharmacy chain for over six years, with nearly 200,000 bottles of Shufeng Jiedu granules sold", "fulltext": "BEIJING, Jan. 16 (Xinhua) -- In the heart of Germany, a traditional Chinese herbal product has secured a lasting place on the shelves of the renowned Bahnhof-Apotheke pharmacy chain for over six years, with nearly 200,000 bottles of Shufeng Jiedu granules sold to date. Priced at 39.9 euros per bottle, this respiratory relief formula is among more than a dozen products from Anhui Jiren Pharmaceutical Co., Ltd. in eastern China, exemplifying the global journey of Traditional Chinese Medicine (TCM). This journey is no longer limited to classic remedies stored behind pharmacy counters. Since last year, a \"Four Seasons Tea\" based on TCM principles has been offered not only in German pharmacies but also on the menu of a tea house in Hamburg, serving as a daily wellness supplement. \"From treatment to wellness, we seek to integrate TCM's health-preserving culture into the daily lives of Europeans,\" said Zhu Qiang, deputy general manager of Anhui Jiren Pharmaceutical. Once regarded as an exotic alternative, TCM is now expanding its global presence and joining the worldwide conversation on health and lifestyle. To progress from cultural curiosity to global acceptance, TCM first had to tackle a fundamental challenge: making the \"inexplicable\" explicable. The empirical nature of TCM, coupled with the complexity of herbal formulas, has long puzzled international regulators and scientists. For instance, the same herb may either promote or stanch blood flow, depending on its combination with other ingredients. The response has been a systematic drive toward standardization. China has facilitated the establishment of a technical committee under the International Organization for Standardization, which has so far issued over 100 international standards for TCM. Pioneering institutions have also played a key role. For example, Tianjin University of Traditional Chinese Medicine has led the creation of the world's first international educational standard for TCM undergraduate programs. On the corporate front, major Chinese pharmaceutical companies have diligently pursued international certifications. Tianjin Pharmaceutical Da Ren Tang Group Co., Ltd. has obtained certifications recognized in Australia and Japan. As early as 1997, its product Suxiao Jiuxin Pills, a compound emergency medicine for heart attacks, was successfully registered as a prescription drug in Russia. Anhui Jiren Pharmaceutical entered the European market in 2018, and 193 of its TCM granule varieties have passed official German quality inspections and are available in the EU market. \"We are exploring new approaches to bring more products to the global market, including strengthening ties with overseas research institutions to prove TCM's efficacy with scientific evidence,\" Zhu Qiang said. Data from China's National Administration of Traditional Chinese Medicine showed that TCM is now practiced in 196 countries and regions. China has also signed TCM cooperation agreements with over 40 foreign governments and international organizations. Beyond documentation, transformation is underway on factory floors and in research labs, where intelligent technology is decoding herbal wisdom and demonstrating its mechanisms through data. At the digitalized workshop in a Tianjin Pharmaceutical Da Ren Tang plant, Suxiao Jiuxin Pills roll off automated production lines. Each bottle carries a QR code that allows consumers to trace the medicine's journey -- from the specific herb plantation to every step of processing, storage and quality control. \"We use digital control to tackle the pain point of batch-to-batch variation in herbal products, ensuring both efficacy and stability,\" explained Li Hongjiang, the plant's production deputy general manager. The upcoming new generation intelligent workshop, with an investment exceeding 300 million yuan (about 43 million U.S. dollars), will use near-infrared spectroscopy and visual inspection systems to further enhance precision, Li added. Artificial intelligence (AI) is also scaling up TCM production. In 2024, Tianjin-headquartered Tasly Pharma, in collaboration with Huawei Cloud, launched a TCM large language model. Trained on a massive corpus of classical texts and clinical data, it assists in formula optimization, mechanism explanation and the discovery of new clinical applications. Similarly, a large model was jointly developed last year by organizations including the National SuperComputer Center in Tianjin and Tianjin University of Traditional Chinese Medicine, encompassing knowledge from over 20 TCM clinical disciplines. \"AI can synthesize the vast empirical knowledge recorded in ancient TCM texts, thereby supporting the standardization of TCM practice,\" said Guo Yi, vice president of Tianjin University of Traditional Chinese Medicine. The ultimate test of TCM's global integration lies not only in clinics but also in its seamless adoption into daily life. This is evident in the growing trend among young Chinese who are embracing TCM-inspired beverages, foods and physical exercises. Meanwhile, Chinese companies are also actively introducing TCM as a modern lifestyle choice worldwide. Anhui Jiren Pharmaceutical's Four Seasons Tea in Germany is a prime example. Each product in the series adapts its herbal composition to a specific season. Marketed as a food supplement, it lets consumers embrace TCM's concept of seasonal wellness through a simple and enjoyable daily ritual. Another company, Anhui Bafang Health Industry Development Group Co., Ltd., has opened eight online stores in Malaysia, offering over 30 types of herbal teas, traditional medicinal soup packs and other food-therapy products within just two years. Educational and experiential platforms amplify this soft power. Tianjin University of Traditional Chinese Medicine has been promoting TCM culture overseas through platforms such as Confucius Institutes. Meanwhile, Beijing Tong Ren Tang Chinese Medicine Co., Ltd. operates museums both in China and abroad to showcase the history, culture, products and services of TCM. TCM is also merging with tourism to boost its global appeal. In the southern island province of Hainan, the Sanya Hospital of Traditional Chinese Medicine has designed customized treatment plans for foreign clients, offering services such as acupuncture, massage, herbal baths, medicinal cuisine and weight management services. Konstantin, a Russian engineer, brought his parents to the hospital for therapies such as moxibustion and acupuncture. \"TCM is miraculous! The techniques combined with Sanya's warm climate greatly alleviate neck and lumbar pain,\" he said. Some community-based institutions in Hainan have also created one-stop \"wellness communities\" for international tourists by integrating residential environments, health services and healing therapies. \"With a history spanning thousands of years, TCM embodies profound wisdom and unique insights,\" said Zhang Boli, an academician with the Chinese Academy of Engineering and an expert in TCM. \"As TCM continues to evolve and innovate while actively engaging with the global community, its value will be recognized by more people worldwide, contributing Chinese wisdom to the advancement of human health.\""},

function matchTopics(text){
  if(!text) return [];
  const t = String(text);
  const scoreMap = {};
  const order = [];
  for(const [re, theme, sub, subEn, weight] of TOPIC_RULES){
    if(re.test(t)){
      const key = theme + "|" + sub;
      if(scoreMap[key] === undefined){ scoreMap[key] = {theme, sub, subEn, score:0}; order.push(key); }
      scoreMap[key].score += weight;
    }
  }
  return order.map(k => scoreMap[k]).sort((a,b) => b.score - a.score);
}

/* 用 LLM 把「标题 + 摘要」转成英文视觉描述词，相关性显著强于关键词拼接。
   失败自动回退 buildCoverPrompt()，不会让封面链路挂掉。 */
async function buildCoverPromptLLM(){
  const o = liveOut();
  const g = GEN[state.lvl];
  const title = (g && g.title) || (o && o.title) || curMaterialLabel() || "";
  const summary = (o && o.summary) || curMaterialLabel() || "";
  if(!title) return buildCoverPrompt();
  /* 重试 2 次：第一次失败后用更激进的 system 再试一次，避免被质量不稳的输出打到 fallback */
  for(let attempt = 0; attempt < 2; attempt++){
    try {
      if(!SF_LLM.apiKey) return buildCoverPrompt();   /* 无密钥直接走本地兜底，不浪费重试 */
        const resp = await fetch(SF_LLM.apiBase + "/chat/completions", {
        method: "POST",
        headers: { "Authorization": "Bearer " + SF_LLM.apiKey, "Content-Type": "application/json" },
        body: JSON.stringify({
          model: SF_LLM.model,
          messages: [
            { role: "system", content: attempt === 0 ? COVER_SYS : COVER_SYS_RETRY },
            { role: "user", content: "Title: " + title + "\nSummary: " + String(summary).slice(0, 200) }
          ],
          max_tokens: 45, temperature: 0.4
        })
      });
      const d = await resp.json();
      let txt = d && d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
      txt = String(txt || "").replace(/<\/?think>/g, "").trim();
      /* 关键清洗：剔除一切非 ASCII 可打印字符（中文、繁体、日文、emoji 等）。
         Kolors 见到这些要么抛错要么画歪，而 Qwen2.5 偶尔会吐中文混入。 */
      txt = txt.replace(/[^\x20-\x7E]/g, " ").replace(/\s+/g, " ").trim();
      /* 防御 Qwen2.5 偶发的「重复词死循环」（如 palette palette…）。
         同词连续 2 次就折叠为 1 次（实战中正常 prompt 不会重复同一词两次以上）。 */
      txt = txt.replace(/(\b\w+\b)(?:\s+\1\b){1,}/gi, "$1").trim();
      /* 硬截断到 200 字符（避开失控长尾）。Kolors prompt 50-120 词足够画图。 */
      if(txt.length > 200) txt = txt.slice(0, 200).trim();
      /* 自动补关键收尾字段：Kolors 没有 "modern flat illustration / no text" 收尾容易跑偏 */
      if(!/flat illustration/i.test(txt)) txt += ", modern flat illustration";
      if(!/no text/i.test(txt)) txt += ", no text";
      /* 有效英文判定：至少含 4 个英文单词、长度 20-260，否则视为无效 */
      const words = txt.match(/\b[a-z]{3,}\b/gi) || [];
      /* 阈值收紧到 ≥6 个有意义英文词（排除 no/in/at 等虚词），且 ≥12 字符；
         避免补字段后凑成 4 词通过、实际原 prompt 仅 1 词的「假通过」 */
      if(words.length >= 6 && txt.length >= 12 && txt.length <= 200) return txt.slice(0, 300);
    } catch(e){ /* 重试 */ }
  }
  return buildCoverPrompt();
}

async function genLiveCover(){
  if(!FEATURES.cover) return;   /* 封面图已暂停（硅基流动文生图） */
  if(state.live.coverDataUrl || state.live.coverBusy) return;
  state.live.coverBusy = true;
  try {
    const prompt = await buildCoverPromptLLM();
    state.live.coverPrompt = prompt;
    if(!SILICONFLOW_IMG.apiKey) throw new Error(L(
      "封面图未运行：服务端未配置 SF_API_KEY 密钥。请在部署平台（Railway → Variables）填入后重新部署。",
      "Cover not running: SF_API_KEY missing on server. Add it in Railway → Variables and redeploy."));
    const resp = await fetch(SILICONFLOW_IMG.apiBase + "/images/generations", {
      method: "POST",
      headers: { "Authorization": "Bearer " + SILICONFLOW_IMG.apiKey, "Content-Type": "application/json" },
      body: JSON.stringify({ model: SILICONFLOW_IMG.model, prompt: prompt, image_size: SILICONFLOW_IMG.size, batch_size: 1 })
    });
    const data = await resp.json();
    const url = data && data.images && data.images[0] && data.images[0].url;
    if(url){
      state.live.coverImageUrl = url;
      const b64 = await urlToDataURL(url);

          toast(L("存储空间不足，已清理最早的封面","Storage full — oldest cover removed"));
        }
        state.live.coverDataUrl = b64;
      }
